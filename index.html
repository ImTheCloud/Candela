 coborât la Ghilgal.\"","Samuel s-a dus la Saul, și Saul i-a zis: „Fii binecuvântat de Domnul! Am păzit Cuvântul Domnului.\"","Samuel a zis: „Ce înseamnă behăitul acesta de oi care ajunge la urechile mele și mugetul acesta de boi pe care-l aud?\"","Saul a răspuns: „Le-au adus de la amaleciți, pentru că poporul a cruțat oile cele mai bune și boii cei mai buni, ca să-i jertfească Domnului Dumnezeului tău, iar pe celelalte, le-am nimicit cu desăvârșire.\"","Samuel a zis lui Saul: „Stai și-ți voi spune ce mi-a zis Domnul astă-noapte.\" Și Saul i-a zis: „Vorbește.\"","Samuel a zis: „Când erai mic în ochii tăi, n-ai ajuns tu căpetenia semințiilor lui Israel și nu te-a uns Domnul ca să fii împărat peste Israel?","Domnul te trimisese zicând: ‘Du-te și nimicește cu desăvârșire pe păcătoșii aceia, pe amaleciți; războiește-te cu ei până îi vei nimici.’","Pentru ce n-ai ascultat glasul Domnului? Pentru ce te-ai aruncat asupra prăzii și ai făcut ce este rău înaintea Domnului?\"","Saul a răspuns lui Samuel: „Am ascultat glasul Domnului și m-am dus în calea pe care mă trimitea Domnul. Am adus pe Agag, împăratul lui Amalec, și am nimicit cu desăvârșire pe amaleciți,","dar poporul a luat din pradă oi și boi, ca pârgă din ceea ce trebuia nimicit cu desăvârșire, ca să le jertfească Domnului Dumnezeului tău la Ghilgal.\"","Samuel a zis: „Îi plac Domnului mai mult arderile-de-tot și jertfele decât ascultarea de glasul Domnului? Ascultarea face mai mult decât jertfele și păzirea cuvântului Său face mai mult decât grăsimea berbecilor.","Căci neascultarea este tot atât de vinovată ca ghicirea, și împotrivirea nu este mai puțin vinovată decât închinarea la idoli și terafimii. Fiindcă ai lepădat Cuvântul Domnului, te leapădă și El ca împărat.\"","Atunci, Saul a zis lui Samuel: „Am păcătuit, căci am călcat porunca Domnului și n-am ascultat cuvintele tale; mă temeam de popor și i-am ascultat glasul.","Acum, te rog, iartă-mi păcatul, întoarce-te cu mine, ca să mă închin până la pământ înaintea Domnului.\"","Samuel a zis lui Saul: „Nu mă voi întoarce cu tine. Fiindcă ai lepădat Cuvântul Domnului, și Domnul te leapădă, ca să nu mai fii împărat peste Israel.\"","Și, pe când se întorcea Samuel să plece, Saul l-a apucat de pulpana hainei, și s-a rupt.","Samuel i-a zis: „Domnul rupe astăzi domnia lui Israel de asupra ta și o dă altuia mai bun decât tine.","Cel ce este tăria lui Israel nu minte și nu Se căiește, căci nu este un om ca să-I pară rău.\"","Saul a zis iarăși: „Am păcătuit! Acum, te rog, cinstește-mă în fața bătrânilor poporului meu și în fața lui Israel; întoarce-te cu mine, ca să mă închin înaintea Domnului Dumnezeului tău.\"","Samuel s-a întors și a mers după Saul, și Saul s-a închinat înaintea Domnului.","Apoi Samuel a zis: „Adu-mi pe Agag, împăratul lui Amalec.\" Și Agag a înaintat vesel spre el, căci zicea: „Negreșit, a trecut amărăciunea morții!\"","Samuel a zis: „După cum sabia ta a lăsat femei fără copii, tot așa și mama ta va fi lăsată fără copii între femei.\" Și Samuel a tăiat pe Agag în bucăți înaintea Domnului, la Ghilgal.","Samuel a plecat la Rama, și Saul s-a suit acasă, la Ghibea lui Saul.","Samuel nu s-a mai dus să vadă pe Saul până în ziua morții sale. Dar Samuel plângea pe Saul, pentru că Domnul Se căise că pusese pe Saul împărat peste Israel."],"16":["Domnul a zis lui Samuel: „Când vei înceta să plângi pe Saul, pentru că l-am lepădat ca să nu mai domnească peste Israel? Umple-ți cornul cu untdelemn și du-te; te voi trimite la Isai, Betleemitul, căci pe unul din fiii lui Mi l-am ales ca împărat.\"","Samuel a zis: „Cum să mă duc? Saul are să afle și mă va ucide.\" Și Domnul a zis: „Să iei cu tine un vițel și să zici: ‘Vin să aduc o jertfă Domnului.’","Să poftești pe Isai la jertfă; Eu îți voi arăta ce trebuie să faci și Îmi vei unge pe acela pe care-ți voi spune să-l ungi.\"","Samuel a făcut ce zisese Domnul și s-a dus la Betleem. Bătrânii cetății au alergat înspăimântați înaintea lui și au zis: „Ce vestește venirea ta: ceva bun?\"","El a răspuns: „Da, vin să aduc o jertfă Domnului. Sfințiți-vă și veniți cu mine la jertfă.\" A sfințit și pe Isai cu fiii lui și i-a poftit la jertfă.","Când au intrat ei, Samuel, văzând pe Eliab, și-a zis: „Negreșit, unsul Domnului este aici, înaintea Lui.\"","Și Domnul a zis lui Samuel: „Nu te uita la înfățișarea și înălțimea staturii lui, căci l-am lepădat. Domnul nu Se uită la ce se uită omul; omul se uită la ceea ce izbește ochii, dar Domnul Se uită la inimă.\"","Isai a chemat pe Abinadab și l-a trecut pe dinaintea lui Samuel, și Samuel a zis: „Nici pe acesta nu l-a ales Domnul.\"","Isai a trecut pe Șama, și Samuel a zis: „Nici pe acesta nu l-a ales Domnul.\"","Și așa a trecut Isai pe cei șapte fii ai lui pe dinaintea lui Samuel, și Samuel a zis lui Isai: „Domnul n-a ales pe niciunul din ei.\"","Apoi Samuel a zis lui Isai: „Aceștia sunt toți fiii tăi?\" Și el a răspuns: „A mai rămas cel mai tânăr, dar paște oile.\" Atunci, Samuel a zis lui Isai: „Trimite să-l aducă, fiindcă nu vom ședea la masă până nu va veni aici.\"","Isai a trimis să-l aducă. Și el era cu păr bălai, cu ochi frumoși și față frumoasă. Domnul a zis lui Samuel: „Scoală-te și unge-l, căci el este!\"","Samuel a luat cornul cu untdelemn și l-a uns în mijlocul fraților lui. Duhul Domnului a venit peste David începând din ziua aceea și în cele următoare. Samuel s-a sculat și s-a dus la Rama.","Duhul Domnului S-a depărtat de la Saul; și a fost muncit de un duh rău, care venea de la Domnul.","Slujitorii lui Saul i-au zis: „Iată că un duh rău de la Dumnezeu te muncește.","Poruncească numai domnul nostru! Robii tăi sunt înaintea ta. Ei vor căuta un om care să știe să cânte cu harpa și, când duhul rău trimis de Dumnezeu va fi peste tine, el va cânta cu mâna și vei fi ușurat.\"","Saul a răspuns slujitorilor săi: „Găsiți-mi dar un om care să cânte bine și aduceți-l la mine.\"","Unul din slujitori a luat cuvântul și a zis: „Iată, am văzut pe un fiu al lui Isai, Betleemitul, care știe să cânte; el este și un om tare și voinic, un războinic, vorbește bine, este frumos la chip și Domnul este cu el.\"","Saul a trimis niște oameni la Isai să-i spună: „Trimite-mi pe fiul tău David, care este cu oile.\"","Isai a luat un măgar, l-a încărcat cu pâine, cu un burduf cu vin și cu un ied și a trimis lui Saul aceste lucruri, prin fiul său David.","David a ajuns la Saul și s-a înfățișat înaintea lui; i-a plăcut mult lui Saul și a fost pus să-i poarte armele.","Saul a trimis vorbă lui Isai, zicând: „Te rog să lași pe David în slujba mea, căci a căpătat trecere înaintea mea.\"","Și, când duhul trimis de Dumnezeu venea peste Saul, David lua harpa și cânta cu mâna lui; Saul răsufla atunci mai ușor, se simțea ușurat și duhul cel rău pleca de la el."],"17":["Filistenii și-au strâns oștile ca să facă război și s-au adunat la Soco, o cetate a lui Iuda; au tăbărât între Soco și Azeca, la Efes-Damim.","Saul și bărbații lui Israel s-au strâns și ei; au tăbărât în Valea Terebinților și s-au așezat în linie de bătaie împotriva filistenilor.","Filistenii se așezaseră pe un munte deoparte, și Israel, pe un munte de cealaltă parte: doar valea îi despărțea.","Atunci a ieșit un om din tabăra filistenilor și a înaintat între cele două oștiri. El se numea Goliat, era din Gat și avea o înălțime de șase coți și o palmă.","Pe cap avea un coif de aramă și purta niște zale de solzi în greutate de cinci mii de sicli de aramă.","Avea niște tureci de aramă peste fluierele picioarelor și o pavăză de aramă între umeri.","Coada suliței lui era ca un sul de țesut și fierul suliței cântărea șase sute de sicli de fier. Cel ce-i purta scutul mergea înaintea lui.","Filisteanul s-a oprit și, vorbind oștilor lui Israel așezate în șiruri de bătaie, le-a strigat: „Pentru ce ieșiți să vă așezați în șiruri de bătaie? Nu sunt eu filistean și nu sunteți voi slujitorii lui Saul? Alegeți un om care să se coboare împotriva mea!","Dacă va putea să se bată cu mine și să mă omoare, noi vom fi robii voștri, dar, dacă-l voi birui și-l voi omorî eu, voi ne veți fi robi nouă și ne veți sluji.\"","Filisteanul a mai zis: „Arunc astăzi o ocară asupra oștirii lui Israel! Dați-mi un om ca să mă lupt cu el.\"","Saul și tot Israelul au auzit aceste cuvinte ale filisteanului și s-au înspăimântat, și au fost cuprinși de o mare frică.","Și David era fiul efratitului aceluia din Betleemul lui Iuda numit Isai, care avea opt fii. Pe vremea lui Saul, el era bătrân, înaintat în vârstă.","Cei trei fii mai mari ai lui Isai urmaseră pe Saul la război; întâiul născut din cei trei fii ai lui care porniseră la război se numea Eliab, al doilea Abinadab și al treilea Șama.","David era cel mai tânăr. Și, când cei trei mai mari au urmat pe Saul,","David a plecat de la Saul și s-a întors la Betleem ca să pască oile tatălui său.","Filisteanul înainta dimineața și seara și s-a înfățișat astfel timp de patruzeci de zile.","Isai a zis fiului său David: „Ia pentru frații tăi efa aceasta de grâu prăjit și aceste zece pâini și aleargă în tabără, la frații tăi;","du și aceste zece cașuri de brânză căpeteniei care este peste mia lor. Să vezi dacă frații tăi sunt bine și să-mi aduci vești temeinice.","Ei sunt cu Saul și cu toți bărbații lui Israel în Valea Terebinților, în război cu filistenii.\"","David s-a sculat dis-de-dimineață. A lăsat oile în seama unui paznic, și-a luat lucrurile și a plecat, cum îi poruncise Isai. Când a ajuns în tabără, oștirea pornise să se așeze în șiruri de bătaie și scotea strigăte de război.","Israel și filistenii s-au așezat în șiruri de bătaie, oștire către oștire.","David a dat lucrurile pe care le avea în mâinile celui ce păzea calabalâcurile și a alergat la șirurile de bătaie. Cum a ajuns, a întrebat pe frații săi de sănătate.","Pe când vorbea cu ei, iată că filisteanul din Gat, numit Goliat, a înaintat între cele două oștiri, ieșind afară din șirurile filistenilor. A rostit aceleași cuvinte ca mai înainte, și David le-a auzit.","La vederea acestui om, toți cei din Israel au fugit dinaintea lui și i-a apucat o mare frică.","Fiecare zicea: „Ați văzut pe omul acesta înaintând? A înaintat ca să arunce ocara asupra lui Israel! Dacă-l va omorî cineva, împăratul îl va umple de bogății, îi va da de nevastă pe fiică-sa și va scuti de dări casa tatălui său în Israel.\"","David a zis oamenilor de lângă el: „Ce se va face aceluia care va omorî pe filisteanul acesta și va lua ocara de asupra lui Israel? Cine este filisteanul acesta, acest netăiat împrejur, ca să ocărască oștirea Dumnezeului celui viu?\"","Poporul, spunând din nou aceleași lucruri, i-a zis: „Așa și așa se va face aceluia care-l va omorî.\"","Eliab, fratele lui cel mai mare, care-l auzise vorbind cu oamenii aceștia, s-a aprins de mânie împotriva lui David. Și a zis: „Pentru ce te-ai coborât tu și cui ai lăsat acele puține oi în pustie? Îți cunosc eu mândria și răutatea inimii. Te-ai coborât ca să vezi lupta.\"","David a răspuns: „Ce-am făcut oare? Nu pot să vorbesc astfel?\"","Și s-a întors de la el ca să vorbească cu altul și i-a pus aceleași întrebări. Poporul i-a răspuns ca și întâiași dată.","Când s-au auzit cuvintele rostite de David, au fost spuse înaintea lui Saul, care a trimis să-l caute.","David a zis lui Saul: „Nimeni să nu-și piardă nădejdea din pricina filisteanului acestuia! Robul tău va merge să se bată cu el.\"","Saul a zis lui David: „Nu poți să te duci să te bați cu filisteanul acesta, căci tu ești un copil, și el este un om războinic din tinerețea lui.\"","David a zis lui Saul: „Robul tău păștea oile tatălui său. Și, când un leu sau un urs venea să-mi ia o oaie din turmă,","alergam după el, îl loveam și-i smulgeam oaia din gură. Dacă se ridica împotriva mea, îl apucam de falcă, îl loveam și-l omoram.","Așa a doborât robul tău leul și ursul, și cu filisteanul acesta, cu acest netăiat împrejur, va fi ca și cu unul din ei, căci a ocărât oștirea Dumnezeului celui viu.\"","David a mai zis: „Domnul, care m-a izbăvit din gheara leului și din laba ursului, mă va izbăvi și din mâna acestui filistean.\" Și Saul a zis lui David: „Du-te și Domnul să fie cu tine!\"","Saul a îmbrăcat pe David cu hainele lui, i-a pus pe cap un coif de aramă și l-a îmbrăcat cu o platoșă.","David a încins sabia lui Saul peste hainele lui și a vrut să meargă, căci nu încercase încă să meargă cu ele. Apoi a zis lui Saul: „Nu pot să merg cu armătura aceasta, căci nu sunt obișnuit cu ea.\" Și s-a dezbrăcat de ea.","Și-a luat toiagul în mână, și-a ales din pârâu cinci pietre netede și le-a pus în traista lui de păstor și în buzunarul hainei. Apoi, cu praștia în mână, a înaintat împotriva filisteanului.","Filisteanul s-a apropiat puțin câte puțin de David și omul care-i ducea scutul mergea înaintea lui.","Filisteanul s-a uitat și, când a zărit pe David, a râs de el, căci nu vedea în el decât un copil cu păr bălai și cu fața frumoasă.","Filisteanul a zis lui David: „Ce, sunt câine, de vii la mine cu toiege?\" Și, după ce l-a blestemat pe dumnezeii lui,","a adăugat: „Vino la mine și voi da carnea ta păsărilor cerului și fiarelor câmpului.\"","David a zis filisteanului: „Tu vii împotriva mea cu sabie, cu suliță și cu pavăză, iar eu vin împotriva ta în Numele Domnului oștirilor, în Numele Dumnezeului oștirii lui Israel, pe care ai ocărât-o.","Astăzi, Domnul te va da în mâinile mele, te voi doborî și-ți voi tăia capul; astăzi voi da stârvurile taberei filistenilor păsărilor cerului și fiarelor pământului. Și tot pământul va ști că Israel are un Dumnezeu.","Și toată mulțimea aceasta va ști că Domnul nu mântuiește nici prin sabie, nici prin suliță. Căci biruința este a Domnului. Și El vă dă în mâinile noastre.\"","Îndată ce filisteanul a pornit să meargă înaintea lui David, David a alergat pe câmpul de bătaie înaintea filisteanului.","Și-a vârât mâna în traistă, a luat o piatră și a aruncat-o cu praștia; a lovit pe filistean în frunte și piatra a intrat în fruntea filisteanului, care a căzut cu fața la pământ.","Astfel, cu o praștie și cu o piatră, David a fost mai tare decât filisteanul; l-a trântit la pământ și l-a omorât, fără să aibă sabie în mână.","A alergat, s-a oprit lângă filistean, i-a luat sabia, pe care i-a scos-o din teacă, l-a omorât și i-a tăiat capul. Filistenii, când au văzut că uriașul lor a murit, au luat-o la fugă.","Și bărbații lui Israel și Iuda au dat chiote și au pornit în urmărirea filistenilor până în vale și până la porțile Ecronului. Filistenii, răniți de moarte, au căzut pe drumul care duce la Șaaraim, până la Gat și până la Ecron.","Și copiii lui Israel s-au întors de la urmărirea filistenilor și le-au jefuit tabăra.","David a luat capul filisteanului și l-a dus la Ierusalim și a pus armele filisteanului în cortul său.","Când a văzut Saul pe David mergând împotriva filisteanului, a zis lui Abner, căpetenia oștirii: „Al cui fiu este tânărul acesta, Abner?\" Abner a răspuns: „Pe sufletul tău, împărate, că nu știu.\"","„Întreabă dar al cui fiu este tânărul acesta\", a zis împăratul.","Și, când s-a întors David după ce omorâse pe filistean, Abner l-a luat și l-a adus înaintea lui Saul. David avea în mână capul filisteanului.","Saul i-a zis: „Al cui fiu ești, tinere?\" Și David a răspuns: „Sunt fiul robului tău Isai, Betleemitul.\""],"18":["David sfârșise de vorbit cu Saul. Și, de atunci, sufletul lui Ionatan s-a alipit de sufletul lui David și Ionatan l-a iubit ca pe sufletul din el.","În aceeași zi, Saul a oprit pe David și nu l-a lăsat să se întoarcă în casa tatălui său.","Ionatan a făcut legământ cu David, pentru că-l iubea ca pe sufletul lui.","A scos mantaua pe care o purta, ca s-o dea lui David, și i-a dat hainele sale, chiar sabia, arcul și cingătoarea lui.","David se ducea și izbutea oriunde îl trimitea Saul; a fost pus de Saul în fruntea oamenilor de război și era plăcut întregului popor, chiar și slujitorilor lui Saul.","Pe când veneau ei, la întoarcerea lui David de la omorârea filisteanului, femeile au ieșit din toate cetățile lui Israel înaintea împăratului Saul, cântând și jucând, în sunetul timpanelor și alăutelor, și scoțând strigăte de bucurie.","Femeile care cântau își răspundeau unele altora și ziceau: „Saul a bătut miile lui, iar David, zecile lui de mii.\"","Saul s-a mâniat foarte tare și nu i-a plăcut vorba aceasta. El a zis: „Lui David îi dau zeci de mii și mie-mi dau mii! Nu-i mai lipsește decât împărăția.\"","Și, din ziua aceea, Saul a privit cu ochi răi pe David.","A doua zi, duhul cel rău, trimis de Dumnezeu, a apucat pe Saul, care s-a înfuriat în mijlocul casei. David cânta, ca și în celelalte zile, și Saul era cu sulița în mână.","Saul a ridicat sulița, zicându-și în sine: „Voi pironi pe David de perete.\" Dar David s-a ferit de el de două ori.","Saul se temea de David, pentru că Domnul era cu David și Se depărtase de la el.","L-a îndepărtat de lângă el și l-a pus mai-mare peste o mie de oameni. David ieșea și intra în fruntea poporului;","izbutea în tot ce făcea și Domnul era cu el.","Saul, văzând că izbutea totdeauna, se temea de el,","dar tot Israelul și Iuda iubeau pe David, pentru că ieșea și intra în fruntea lor.","Saul a zis lui David: „Iată, îți voi da de nevastă pe fiică-mea cea mai mare, Merab, numai să-mi slujești cu vitejie și să porți războaiele Domnului.\" Dar Saul își zicea: „Nu vreau să-mi pun mâna mea pe el, ci mâna filistenilor să fie asupra lui.\"","David a răspuns lui Saul: „Cine sunt eu și ce este viața mea, ce este familia tatălui meu în Israel, ca să fiu ginerele împăratului?\"","Venind vremea când Merab, fata lui Saul, avea să fie dată lui David, ea a fost dată de nevastă lui Adriel din Mehola.","Mical, fata lui Saul, iubea pe David. Au spus lui Saul, și lucrul i-a plăcut.","El își zicea: „I-o voi da ca să-i fie o cursă și să cadă sub mâna filistenilor.\" Și Saul a zis lui David pentru a doua oară: „Astăzi îmi vei fi ginere.\"","Saul a dat slujitorilor săi următoarea poruncă: „Vorbiți în taină lui David și spuneți-i: ‘Iată că împăratul e binevoitor față de tine și toți slujitorii lui te iubesc; fii acum ginerele împăratului.’\"","Slujitorii lui Saul au spus aceste lucruri la urechile lui David. Și David a răspuns: „Credeți că este ușor să fii ginerele împăratului? Eu sunt un om sărac și de puțină însemnătate.\"","Slujitorii lui Saul i-au spus ce răspunsese David.","Saul a zis: „Așa să vorbiți lui David: ‘Împăratul nu cere nicio zestre; ci dorește o sută de prepuțuri de ale filistenilor, ca să-și răzbune pe vrăjmașii lui.’\" Saul avea de gând să facă pe David să cadă în mâinile filistenilor.","Slujitorii lui Saul au spus aceste cuvinte lui David, și David a primit ce i se ceruse ca să fie ginerele împăratului. Înainte de vremea hotărâtă,","David s-a sculat, a plecat cu oamenii lui și a ucis două sute de oameni dintre filisteni; le-a adus prepuțurile și a dat împăratului numărul întreg, ca să fie ginerele împăratului. Atunci, Saul i-a dat de nevastă pe fiică-sa Mical.","Saul a văzut și a înțeles că Domnul era cu David; și fiică-sa Mical iubea pe David.","Saul s-a temut din ce în ce mai mult de David și toată viața i-a fost vrăjmaș.","Domnitorii filistenilor ieșeau la luptă și, ori de câte ori ieșeau, David avea mai multă izbândă decât toți slujitorii lui Saul și numele lui a ajuns foarte vestit."],"19":["Saul a vorbit fiului său Ionatan și tuturor slujitorilor lui să omoare pe David.","Dar Ionatan, fiul lui Saul, care iubea mult pe David, i-a dat de știre și i-a zis: „Tatăl meu, Saul, caută să te omoare. Păzește-te dar mâine dimineață, stai într-un loc tăinuit și ascunde-te.","Eu voi ieși și voi sta lângă tatăl meu în câmpul în care vei fi; voi vorbi tatălui meu despre tine, voi vedea ce va zice și-ți voi spune.\"","Ionatan a vorbit bine de David tatălui său Saul: „Să nu facă împăratul\", a zis el, „un păcat față de robul său David, căci el n-a făcut niciun păcat față de tine. Dimpotrivă, a lucrat pentru binele tău;","și-a pus în joc viața, a ucis pe filistean și Domnul a dat o mare izbăvire pentru tot Israelul. Tu ai văzut și te-ai bucurat. Pentru ce să păcătuiești împotriva unui sânge nevinovat și să omori fără pricină pe David?\"","Saul a ascultat glasul lui Ionatan și a jurat zicând: „Viu este Domnul că David nu va muri!\"","Ionatan a chemat pe David și i-a spus toate cuvintele acestea, apoi l-a adus la Saul; și David a fost înaintea lui ca mai înainte.","Războiul urma înainte. David a mers împotriva filistenilor și s-a bătut cu ei, le-a pricinuit o mare înfrângere și au fugit dinaintea lui.","Atunci, duhul cel rău, trimis de Domnul, a venit peste Saul, care ședea în casă cu sulița în mână. David cânta,","și Saul a vrut să-l pironească cu sulița de perete. Dar David s-a ferit de el, și Saul a lovit cu sulița în perete. David a fugit și a scăpat noaptea.","Saul a trimis niște oameni acasă la David ca să-l pândească și să-l omoare dimineața. Dar Mical, nevasta lui David, i-a dat de știre și i-a zis: „Dacă nu fugi în noaptea aceasta, mâine vei fi omorât.\"","Ea l-a coborât pe fereastră și David a plecat și a fugit. Așa a scăpat.","În urmă, Mical a luat terafimul și l-a pus în pat; i-a pus o piele de capră în jurul capului și l-a învelit cu o haină.","Când a trimis Saul oamenii să ia pe David, ea a zis: „Este bolnav.\"","Saul i-a trimis înapoi să-l vadă și a zis: „Aduceți-l la mine, în patul lui, ca să-l omor.\"","Oamenii aceia s-au întors și iată că terafimul era în pat și în jurul capului era o piele de capră.","Saul a zis către Mical: „Pentru ce m-ai înșelat în felul acesta și ai dat drumul vrăjmașului meu și a scăpat?\" Mical a răspuns lui Saul: „El mi-a zis: ‘Lasă-mă să plec ori te omor!’\"","Așa a fugit și a scăpat David. El s-a dus la Samuel, la Rama, și i-a istorisit tot ce-i făcuse Saul. Apoi s-a dus cu Samuel și a locuit în Naiot.","Au spus lucrul acesta lui Saul și au zis: „Iată că David este în Naiot, lângă Rama.\"","Saul a trimis niște oameni să ia pe David. Ei au văzut o adunare de proroci, care proroceau cu Samuel în frunte. Duhul lui Dumnezeu a venit peste trimișii lui Saul și au început și ei să prorocească.","Au spus lui Saul lucrul acesta; el a trimis alți oameni și au prorocit și ei. A mai trimis alții a treia oară și au prorocit și ei.","Atunci, Saul s-a dus el însuși la Rama. Ajungând la fântâna cea mare fără apă, care este la Secu, a întrebat: „Unde sunt Samuel și David?\" I s-a răspuns: „Sunt în Naiot, lângă Rama.\"","Și s-a îndreptat spre Naiot, lângă Rama. Duhul lui Dumnezeu a venit și peste el și Saul și-a văzut de drum, prorocind până la sosirea lui în Naiot, lângă Rama.","S-a dezbrăcat de haine și a prorocit și el înaintea lui Samuel și s-a aruncat dezbrăcat la pământ toată ziua aceea și toată noaptea. De aceea se zice: „Oare și Saul este între proroci?\""],"20":["David a fugit din Naiot, de lângă Rama. S-a dus la Ionatan și a zis: „Ce-am făcut eu? Care este nelegiuirea mea, care este păcatul meu înaintea tatălui tău, de vrea să-mi ia viața?\"","Ionatan i-a răspuns: „Ferească Dumnezeu! Nu vei muri. Tatăl meu nu face niciun lucru, fie mare, fie mic, fără să-mi dea de știre. Pentru ce mi-ar ascunde el lucrul acesta? Nu este nimic.\"","David a zis iarăși, jurând: „Tatăl tău știe bine că am căpătat trecere înaintea ta și va fi zis: ‘Să nu știe Ionatan, căci s-ar întrista.’ Dar viu este Domnul și viu este sufletul tău că nu este decât un pas între mine și moarte.\"","Ionatan a zis lui David: „Pentru tine voi face tot ce vei vrea.\"","Și David i-a răspuns: „Iată că mâine este lună nouă și ar trebui să șed să mănânc cu împăratul; lasă-mă să mă duc și să mă ascund în câmpii până în seara zilei a treia.","Dacă tatăl tău va băga de seamă lipsa mea, să-i spui: ‘David m-a rugat să-l las să se ducă până la Betleem, în cetatea lui, pentru că acolo se aduce pentru toată familia o jertfă de peste an.’","Și dacă va zice: ‘Bine!’ atunci robul tău n-are nimic de temut, dar, dacă-l va apuca mânia, să știi că pieirea mea este lucru hotărât din partea lui.","Arată-ți dar dragostea pentru robul tău, căci ai făcut cu robul tău un legământ înaintea Domnului. Și dacă este vreo nelegiuire în mine, ia-mi tu viața. De ce să mă mai duci până la tatăl tău?\"","Ionatan i-a zis: „Departe de tine gândul să nu-ți dau de știre dacă voi afla că pieirea ta este lucru hotărât din partea tatălui meu și amenință să te ajungă!\"","David a zis lui Ionatan: „Cine-mi va da de știre dacă tatăl tău ți-ar răspunde cu asprime?\"","Și Ionatan a zis lui David: „Vino, să ieșim pe câmp.\" Și au ieșit amândoi pe câmp.","Ionatan a zis lui David: „Iau martor pe Domnul Dumnezeul lui Israel că voi cerceta de aproape pe tatăl meu mâine sau poimâine și, de va gândi bine de David,","Domnul să Se poarte cu Ionatan cu toată asprimea, dacă nu voi trimite pe nimeni să-ți dea de știre! Dacă tatăl meu va găsi cu cale să-ți facă rău, iarăși îți voi da de știre și te voi lăsa să pleci, ca să te duci în pace, și Domnul să fie cu tine cum a fost cu tatăl meu!","Dacă voi mai trăi, să te porți față de mine cu o bunătate ca a Domnului și, dacă voi muri,","să nu îți îndepărtezi niciodată bunătatea față de casa mea, nici chiar când Domnul va nimici pe fiecare din vrăjmașii lui David de pe fața pământului.","Căci Ionatan a făcut legământ cu casa lui David! Domnul să Se răzbune pe vrăjmașii lui David!\"","Ionatan a întărit și mai mult față de David dragostea pe care o avea pentru el, căci îl iubea ca pe sufletul lui.","Ionatan i-a zis: „Mâine este lună nouă; se va băga de seamă lipsa ta, căci locul tău va fi gol.","Să te cobori a treia zi până în fundul locului în care te ascunseseși în ziua când cu întâmplarea aceea și să rămâi lângă piatra Ezel.","Eu voi trage trei săgeți înspre piatra aceasta, ca și când aș lovi la țintă.","Și voi trimite un tânăr și-i voi zice: ‘Du-te de găsește săgețile!’ Dacă-i voi zice: ‘Iată că săgețile sunt dincoace de tine, ia-le!’, atunci să vii, căci este pace pentru tine și n-ai să te temi de nimic, viu este Domnul!","Dar, dacă voi zice tânărului: ‘Iată că săgețile sunt dincolo de tine’, atunci să pleci, căci Domnul te trimite.","Domnul este martor pe vecie pentru cuvântul pe care ni l-am dat unul altuia.\"","David s-a ascuns în câmp. A venit luna nouă și împăratul a luat loc la ospăț ca să mănânce.","Împăratul a șezut ca de obicei pe scaunul lui, lângă perete. Ionatan s-a sculat și Abner a șezut lângă Saul, dar locul lui David a rămas gol.","Saul n-a zis nimic în ziua aceea, „căci\", zicea el, „s-a întâmplat: el nu este curat, negreșit nu este curat\".","A doua zi, ziua a doua a lunii noi, locul lui David era tot gol. Și Saul a zis fiului său Ionatan: „Pentru ce n-a venit fiul lui Isai la masă nici ieri, nici azi?\"","Ionatan a răspuns lui Saul: „David mi-a cerut voie să se ducă la Betleem.","El a zis: ‘Dă-mi drumul, te rog, căci avem în cetate o jertfă de familie, și frate-meu mi-a spus lucrul acesta, deci, dacă am căpătat trecere înaintea ta, dă-mi voie să mă duc în grabă să-mi văd frații.’ Pentru aceea n-a venit la masa împăratului.\"","Atunci, Saul s-a aprins de mânie împotriva lui Ionatan și i-a zis: „Fiu rău și neascultător, nu știu eu că ți-ai luat ca prieten pe fiul lui Isai, spre rușinea ta și spre rușinea mamei tale?","Căci, câtă vreme va trăi fiul lui Isai pe pământ, nu va fi liniște nici pentru tine, nici pentru împărăția ta. Și acum trimite să-l caute și să mi-l aducă, fiindcă este vrednic de moarte.\"","Ionatan a răspuns tatălui său, Saul, și i-a zis: „Pentru ce să fie omorât? Ce a făcut?\"","Și Saul și-a îndreptat sulița spre el, ca să-l lovească. Ionatan a înțeles că era lucru hotărât din partea tatălui său să omoare pe David.","S-a sculat de la masă într-o mânie aprinsă și n-a luat deloc parte la masă în ziua a doua a lunii noi, căci era mâhnit din pricina lui David, pentru că tatăl său îl ocărâse.","A doua zi de dimineață, Ionatan s-a dus pe câmp în locul în care se învoise cu David și era însoțit de un băiețaș.","El i-a zis: „Dă fuga și găsește săgețile pe care le voi trage.\" Băiatul a alergat, și Ionatan a tras o săgeată care a trecut dincolo de el.","Când a ajuns băiatul la locul unde era săgeata pe care o trăsese Ionatan, Ionatan a strigat după el: „Iată că săgeata este dincolo de tine.\"","I-a strigat iarăși: „Iute, grăbește-te, nu te opri!\" Și băiatul lui Ionatan a strâns săgețile și s-a întors la stăpânul lui.","Băiatul nu știa nimic: numai Ionatan și David înțelegeau lucrul acesta.","Ionatan a dat băiatului armele și i-a zis: „Du-te și du-le în cetate.\"","După plecarea băiatului, David s-a sculat din partea de miazăzi, apoi s-a aruncat cu fața la pământ și s-a închinat de trei ori. Cei doi prieteni s-au îmbrățișat și au plâns împreună. David mai ales se prăpădea plângând.","Și Ionatan a zis lui David: „Du-te în pace, acum când am jurat amândoi în Numele Domnului, zicând: ‘Domnul să fie pe vecie între mine și tine, între sămânța mea și sămânța ta!’\" David s-a sculat și a plecat, iar Ionatan s-a întors în cetate."],"21":["David s-a dus la Nob, la preotul Ahimelec, care a alergat speriat înaintea lui și i-a zis: „Pentru ce ești singur și nu este nimeni cu tine?\"","David a răspuns preotului Ahimelec: „Împăratul mi-a dat o poruncă și mi-a zis: ‘Nimeni să nu știe nimic de pricina pentru care te trimit și de porunca pe care ți-am dat-o.’ Am hotărât un loc de întâlnire cu oamenii mei.","Acum ce ai la îndemână? Dă-mi cinci pâini sau ce se va găsi.\"","Preotul a răspuns lui David: „N-am pâine obișnuită la îndemână, ci numai pâine sfințită; doar dacă oamenii tăi s-au ferit de împreunarea cu femei!\"","David a răspuns preotului: „Ne-am ferit de împreunarea cu femei de trei zile de când am plecat și toți oamenii mei sunt curați; de altfel, dacă aceasta este o faptă necurată, va fi sfințită negreșit azi de acela care o va face.\"","Atunci, preotul i-a dat pâinea sfințită, căci nu era acolo altă pâine decât pâinea pentru punerea înainte, care fusese luată dinaintea Domnului ca să fie înlocuită cu pâine caldă în clipa când luaseră pe cealaltă.","Chiar în ziua aceea se afla acolo închis înaintea Domnului un om dintre slujitorii lui Saul; era un edomit, numit Doeg, căpetenia păstorilor lui Saul.","David a zis lui Ahimelec: „N-ai la îndemână o suliță sau o sabie? Căci nu mi-am luat cu mine nici sabia, nici armele, pentru că porunca împăratului era grabnică.\"","Preotul a răspuns: „Iată sabia lui Goliat, Filisteanul, pe care l-ai omorât în Valea Terebinților; este învelită într-un covor, în dosul efodului. Dacă vrei s-o iei, ia-o, căci nu este alta aici.\" Și David a zis: „Nu-i alta ca ea; dă-mi-o.\"","David s-a sculat și a fugit chiar în ziua aceea de Saul. A ajuns la Achiș, împăratul Gatului.","Slujitorii lui Achiș i-au zis: „Nu este acesta David, împăratul țării? Nu este el acela pentru care se cânta jucând: ‘Saul și-a bătut miile lui, Iar David, zecile lui de mii’?\"","David a pus la inimă aceste cuvinte și a avut o mare frică de Achiș, împăratul Gatului.","A făcut pe nebunul înaintea lor; făcea năzdrăvănii înaintea lor, făcea zgârieturi pe ușile porților și lăsa să-i curgă balele pe barbă.","Achiș a zis slujitorilor săi: „Vedeți bine că omul acesta și-a pierdut mințile. Pentru ce mi-l aduceți?","Oare duc lipsă de nebuni, de-mi aduceți pe acesta și mă faceți martor la năzdrăvăniile lui? Să intre el în casa mea?\""],"22":["David a plecat de acolo și a scăpat în peștera Adulam. Frații lui și toată casa tatălui său au aflat și s-au coborât la el.","Toți cei ce se aflau în nevoie, care aveau datorii sau care erau nemulțumiți s-au strâns la el și el a ajuns căpetenia lor. Astfel, s-au unit cu el aproape patru sute de oameni.","De acolo, David s-a dus la Mițpe, în țara Moabului. El a zis împăratului Moabului: „Dă voie, te rog, tatălui meu și mamei mele să vină la voi până voi ști ce va face Dumnezeu cu mine.\"","Și i-a adus înaintea împăratului Moabului și au locuit cu el în tot timpul cât a stat David în cetățuie.","Prorocul Gad a zis lui David: „Nu ședea în cetățuie, ci du-te și intră în țara lui Iuda.\" Și David a plecat și a ajuns la pădurea Heret.","Saul a aflat că David și oamenii lui au fost descoperiți. Saul ședea sub tamarisc, la Ghibea, pe înălțime; avea sulița în mână și toți slujitorii lui stăteau lângă el.","Și Saul a zis slujitorilor săi de lângă el: „Ascultați, beniamiți! Vă va da fiul lui Isai la toți ogoare și vii? Va face el din voi toți căpetenii peste o mie și căpetenii peste o sută?","Dacă nu, de ce v-ați unit toți împotriva mea și nimeni nu mi-a dat de știre despre legământul fiului meu cu fiul lui Isai? Pentru ce n-a fost nimeni dintre voi pe care să-l doară inima pentru mine și să mă înștiințeze că fiul meu a răsculat pe robul meu împotriva mea, ca să-mi întindă curse, cum face astăzi?\"","Doeg, Edomitul, care era și el printre slujitorii lui Saul, a răspuns: „Eu am văzut pe fiul lui Isai venind la Nob, la Ahimelec, fiul lui Ahitub.","Ahimelec a întrebat pe Domnul pentru el, i-a dat merinde și i-a dat sabia lui Goliat, Filisteanul.\"","Împăratul a trimis după Ahimelec, fiul lui Ahitub, preotul, și după toată casa tatălui său, după preoții care erau la Nob. Ei au venit toți la împărat.","Saul a zis: „Ascultă, fiul lui Ahitub!\" El a răspuns: „Iată-mă, domnul meu!\"","Saul i-a zis: „Pentru ce v-ați unit împotriva mea tu și fiul lui Isai? Pentru ce i-ai dat pâine și o sabie și ai întrebat pe Dumnezeu pentru el, ca să se ridice împotriva mea și să-mi întindă curse, cum face astăzi?\"","Ahimelec a răspuns împăratului: „Care dintre slujitorii tăi poate fi pus alături cu credinciosul David, ginerele împăratului, gata la poruncile lui și înconjurat cu cinste în casa ta?","Oare de astăzi am început eu să întreb pe Dumnezeu pentru el? Departe de mine așa ceva! Să nu arunce împăratul nicio vină asupra robului său, nici asupra nimănui din casa tatălui meu, căci robul tău nu știe nimic din toate acestea, nici lucru mic, nici lucru mare.\"","Împăratul a zis: „Trebuie să mori, Ahimelec, tu și toată casa tatălui tău.\"","Și împăratul a zis alergătorilor care stăteau lângă el: „Întoarceți-vă și omorâți pe preoții Domnului, căci s-au învoit cu David: au știut bine că fuge, și nu mi-au dat de veste.\" Dar slujitorii împăratului n-au voit să întindă mâna ca să lovească pe preoții Domnului.","Atunci, împăratul a zis lui Doeg: „Întoarce-te și lovește pe preoți.\" Și Doeg, Edomitul, s-a întors și a lovit pe preoți; a omorât în ziua aceea optzeci și cinci de oameni care purtau efodul de in.","Saul a mai trecut prin ascuțișul sabiei cetatea preoțească Nob; bărbați și femei, copii și prunci, boi, măgari și oi: toți au căzut sub ascuțișul sabiei.","Un fiu al lui Ahimelec, fiul lui Ahitub, a scăpat. Numele lui era Abiatar. A fugit la David","și i-a spus că Saul a ucis pe preoții Domnului.","David a zis lui Abiatar: „M-am gândit chiar în ziua aceea că Doeg, Edomitul, fiind acolo, nu se putea să nu spună lui Saul. Eu sunt pricina morții tuturor sufletelor din casa tatălui tău.","Rămâi cu mine, nu te teme de nimic, căci cel ce caută să ia viața mea caută s-o ia și pe a ta; lângă mine vei fi bine păzit.\""],"23":["Au venit și au spus lui David: „Iată că filistenii au început lupta împotriva Cheilei și au jefuit ariile.\"","David a întrebat pe Domnul și a zis: „Să mă duc și să bat pe filistenii aceștia?\" Și Domnul i-a răspuns: „Du-te, bate pe filisteni și izbăvește Cheila.\"","Dar oamenii lui David i-au zis: „Iată că noi ne temem chiar aici, în Iuda. Ce va fi când vom merge la Cheila, împotriva oștilor filistenilor?\"","David a întrebat iarăși pe Domnul. Și Domnul i-a răspuns: „Scoală-te și coboară-te la Cheila, căci dau pe filisteni în mâinile tale.\"","David s-a dus dar cu oamenii lui la Cheila și s-a bătut împotriva filistenilor; le-a luat vitele și le-a pricinuit o mare înfrângere. Astfel a izbăvit David pe locuitorii din Cheila.","Când a fugit Abiatar, fiul lui Ahimelec, la David, în Cheila, s-a coborât cu efodul în mână.","Saul a fost înștiințat de sosirea lui David la Cheila și a zis: „Dumnezeu îl dă în mâinile mele, căci a venit și s-a închis într-o cetate cu porți și zăvoare.\"","Și Saul a chemat tot poporul la război ca să se coboare la Cheila și să împresoare pe David și pe oamenii lui.","David, luând cunoștință de acest plan rău pe care-l punea la cale Saul împotriva lui, a zis preotului Abiatar: „Adu efodul!\"","Și David a zis: „Doamne, Dumnezeul lui Israel, robul Tău a aflat că Saul vrea să vină la Cheila ca să nimicească cetatea din pricina mea.","Mă vor da în mâinile lui locuitorii din Cheila? Se va coborî Saul aici, cum a aflat robul Tău? Doamne, Dumnezeul lui Israel, binevoiește și descoperă lucrul acesta robului Tău!\" Și Domnul a răspuns: „Se va coborî.\"","David a mai zis: „Mă vor da locuitorii din Cheila pe mine și pe oamenii mei în mâinile lui Saul?\" Și Domnul a răspuns: „Te vor da.\"","Atunci, David s-a sculat cu oamenii lui, în număr de aproape șase sute de inși, au ieșit din Cheila și s-au dus unde au putut. Saul, aflând că David a scăpat din Cheila, s-a oprit din mers.","David a locuit în pustie, în locuri întărite, și a rămas pe muntele din pustia Zif. Saul îl căuta mereu, dar Dumnezeu nu l-a dat în mâinile lui.","David, văzând că Saul a pornit să-i ia viața, a stat în pustia Zif, în pădure.","Atunci, Ionatan, fiul lui Saul, s-a sculat și s-a dus la David în pădure. El i-a întărit încrederea în Dumnezeu","și i-a zis: „Nu te teme de nimic, căci mâna tatălui meu Saul nu te va atinge. Tu vei domni peste Israel și eu voi fi al doilea după tine; tatăl meu Saul știe și el bine lucrul acesta.\"","Au făcut iarăși amândoi legământ înaintea Domnului și David a rămas în pădure, iar Ionatan s-a dus acasă.","Zifiții s-au suit la Saul, la Ghibea, și au zis: „Nu-i David ascuns între noi în locuri întărite, în pădure, pe dealul Hachila, care este la miazăzi de pustie?","Coboară-te dar, împărate, fiindcă aceasta este toată dorința sufletului tău; lasă pe noi dacă e vorba să-l dăm în mâinile împăratului.\"","Saul a zis: „Domnul să vă binecuvânteze că aveți milă de mine!","Duceți-vă, vă rog, de mai cercetați, ca să știți și să descoperiți în ce loc și-a îndreptat pașii și cine l-a văzut, căci mi s-a spus că este foarte șiret.","Cercetați și vedeți toate locurile unde se ascunde, veniți apoi la mine cu ceva temeinic și voi porni cu voi. Dacă este în țară, îl voi căuta printre toate miile lui Iuda.\"","S-au sculat dar și s-au dus la Zif înaintea lui Saul. David și oamenii lui erau în pustia Maon, și anume în câmpia dinspre miazăzi de pustie.","Saul a plecat cu oamenii săi în căutarea lui David. Despre lucrul acesta s-a dat de veste lui David, care s-a coborât la stâncă și a rămas în pustia Maon. Saul, când a auzit, a urmărit pe David în pustia Maon.","Saul mergea pe o parte a muntelui, și David cu oamenii lui, pe cealaltă parte a muntelui. David fugea repede, ca să scape de Saul. Dar Saul și oamenii lui chiar înconjuraseră pe David și pe ai lui, ca să pună mâna pe ei,","când un sol a venit și a spus lui Saul: „Grăbește-te să vii, căci au năvălit filistenii în țară.\"","Saul a încetat să urmărească pe David și s-a întors să iasă înaintea filistenilor. De aceea, locul acela s-a numit Sela-Hamahlecot (Stânca împărțirii).","De acolo, David s-a suit spre locurile întărite din En-Ghedi și a locuit acolo."],"24":["Când s-a întors Saul de la urmărirea filistenilor, au venit și i-au spus: „Iată că David este în pustia En-Ghedi.\"","Saul a luat trei mii de oameni aleși din tot Israelul și s-a dus să caute pe David și pe oamenii lui până pe stâncile țapilor sălbatici.","A ajuns la niște stâne de oi, care erau lângă drum, și acolo era o peșteră în care a intrat să doarmă. David și oamenii lui erau în fundul peșterii.","Oamenii lui David i-au zis: „Iată ziua în care Domnul îți zice: ‘Dau pe vrăjmașul tău în mâinile tale; fă-i ce-ți va plăcea.’\" David s-a sculat și a tăiat încet colțul hainei lui Saul.","După aceea, inima îi bătea, pentru că tăiase colțul hainei lui Saul.","Și a zis oamenilor săi: „Să mă ferească Domnul să fac împotriva domnului meu, care este unsul Domnului, o așa faptă ca să pun mâna pe el! Căci el este unsul Domnului.\"","Cu aceste cuvinte, David a oprit pe oamenii săi și i-a împiedicat să se arunce asupra lui Saul. Apoi Saul s-a sculat să iasă din peșteră și și-a văzut înainte de drum.","După aceea, David s-a sculat și a ieșit din peșteră. El a început să strige atunci după Saul: „Împărate, domnul meu!\" Saul s-a uitat înapoi, și David s-a plecat cu fața la pământ și s-a închinat.","David a zis lui Saul: „De ce asculți tu de vorbele oamenilor care zic: ‘David îți vrea răul’?","Vezi acum cu ochii tăi că Domnul te dăduse astăzi în mâinile mele în peșteră. Oamenii mei mă îndemnau să te omor, dar te-am cruțat și am zis: ‘Nu voi pune mâna pe domnul meu, căci este unsul Domnului.’","Uite, părintele meu, uite colțul hainei tale în mâna mea. Fiindcă ți-am tăiat colțul hainei și nu te-am ucis, să știi și să vezi că în purtarea mea nu este nici răutate, nici răzvrătire și că n-am păcătuit împotriva ta. Totuși tu îmi întinzi curse, ca să-mi iei viața.","Judece Domnul între mine și tine și Domnul să mă răzbune pe tine, dar eu nu voi pune mâna pe tine.","‘Răul de la cei răi vine’, zice vechea zicală. De aceea eu nu voi pune mâna pe tine.","Împotriva cui a pornit împăratul lui Israel? Pe cine urmărești tu? Un câine mort, un purice.","Domnul va judeca și va hotărî între mine și tine, El va vedea, El îmi va apăra pricina și El îmi va face dreptate, izbăvindu-mă din mâna ta.\"","Când a sfârșit David de spus aceste vorbe lui Saul, Saul a zis: „Glasul tău este, fiule David?\" Și Saul a ridicat glasul și a plâns.","Și a zis lui David: „Tu ești mai bun decât mine, căci tu mi-ai făcut bine, iar eu ți-am făcut rău.","Tu îți arăți azi bunătatea cu care te porți față de mine, căci Domnul mă dăduse în mâinile tale, și nu m-ai omorât.","Dacă întâlnește cineva pe vrăjmașul lui, îl lasă oare să-și urmeze drumul în liniște? Domnul să-ți răsplătească pentru ce mi-ai făcut în ziua aceasta!","Acum, iată, știu că tu vei domni și că împărăția lui Israel va rămâne în mâinile tale.","Jură-mi dar pe Domnul că nu-mi vei nimici sămânța mea după mine și că nu-mi vei șterge numele din casa tatălui meu.\"","David a jurat lui Saul. Apoi Saul a plecat acasă, iar David și oamenii lui s-au suit în locul întărit."],"25":["Samuel a murit. Tot Israelul s-a adunat și l-a plâns și l-au îngropat în locuința lui, la Rama. Atunci, David s-a sculat și s-a coborât în pustia Paran.","În Maon era un om foarte bogat, a cărui avere era în Carmel; avea trei mii de oi și o mie de capre și se afla la Carmel pentru tunderea oilor lui.","Numele acestui om era Nabal și nevasta lui se chema Abigail; era o femeie cu judecată și frumoasă la chip, dar bărbatul ei era aspru și rău în faptele lui. El se trăgea din Caleb.","David a aflat în pustie că Nabal își tunde oile.","A trimis la el zece tineri, cărora le-a zis: „Suiți-vă la Carmel și duceți-vă la Nabal. Întrebați-l de sănătate în numele meu","și să-i vorbiți așa: ‘Să trăiești în pace și pacea să fie cu casa ta și cu tot ce este al tău.","Și acum, am auzit că tunzi oile. Păstorii tăi au fost cu noi; nu i-am ocărât și nu li s-a luat nimic în tot timpul cât au fost la Carmel.","Întreabă pe slujitorii tăi, și-ți vor spune. Să capete trecere dar tinerii aceștia înaintea ta, fiindcă venim într-o zi de bucurie. Dă dar, te rog, robilor tăi și fiului tău David ce te lasă inima.’\"","Când au ajuns, oamenii lui David au spus lui Nabal toate aceste cuvinte în numele lui David. Apoi au tăcut.","Nabal a răspuns slujitorilor lui David: „Cine este David și cine este fiul lui Isai? Astăzi sunt mulți slujitori care fug de la stăpâni.","Și să-mi iau eu pâinea, apa și vitele mele, pe care le-am tăiat pentru tunzătorii mei, și să le dau unor oameni care sunt de nu știu unde?\"","Oamenii lui David și-au luat drumul înapoi; s-au întors și au spus, la sosirea lor, toate aceste cuvinte lui David.","Atunci, David a zis oamenilor săi: „Fiecare din voi să-și încingă sabia!\" Și fiecare și-a încins sabia. David și-a încins și el sabia și aproape patru sute de inși s-au suit după el. Au mai rămas doar două sute la calabalâcuri.","Unul din slujitorii lui Nabal a venit și a zis către Abigail, nevasta lui Nabal: „Iată că David a trimis din pustie niște soli să întrebe de sănătate pe stăpânul nostru, și el s-a purtat rău cu ei.","Și totuși oamenii aceștia au fost foarte buni cu noi; nu ne-au ocărât și nu ni s-a luat nimic în tot timpul cât am fost cu ei în câmp.","Ne-au fost zid și zi, și noapte, în tot timpul cât am fost cu ei la păscutul turmelor.","Să știi acum și vezi ce ai de făcut, căci pierderea stăpânului nostru și a întregii lui case este hotărâtă și el este așa de rău încât nimeni nu îndrăznește să-i vorbească.\"","Abigail a luat îndată două sute de pâini, două burdufuri cu vin, cinci oi pregătite, cinci măsuri de grâu prăjit, o sută de turte de stafide și două sute de legături de smochine. Le-a pus pe măgari","și a zis slujitorilor săi: „Luați-o înaintea mea și eu voi veni după voi.\" N-a spus nimic bărbatului ei Nabal.","Ea a încălecat pe un măgar, a coborât muntele pe un drum tufos și iată că David și oamenii lui se coborau în fața ei, așa că i-a întâlnit.","David zisese: „În zadar am păzit tot ce are omul acesta în pustie de nu s-a luat nimic din tot ce are, căci mi-a întors rău pentru bine.","Dumnezeu să pedepsească pe robul său David cu toată asprimea dacă voi mai lăsa să rămână până la lumina zilei pe cineva de parte bărbătească din tot ce este al lui Nabal!\"","Când a zărit Abigail pe David, s-a dat jos repede de pe măgar, a căzut cu fața la pământ înaintea lui David și s-a închinat până la pământ.","Apoi, aruncându-se la picioarele lui, a zis: „Eu sunt de vină, domnul meu! Îngăduie roabei tale să-ți vorbească la urechi și ascultă cuvintele roabei tale.","Să nu-și pună domnul meu mintea cu omul acela rău, cu Nabal, căci, cum îi este numele, așa este și el; Nabal (Nebun) îi este numele, și este plin de nebunie. Și eu, roaba ta, n-am văzut pe oamenii trimiși de domnul meu.","Acum, domnul meu, viu este Domnul și viu este sufletul tău, că Domnul te-a oprit să verși sânge și să te ajuți cu mâna ta. Vrăjmașii tăi, cei ce vor răul domnului meu, să fie ca Nabal!","Primește darul acesta pe care-l aduce roaba ta domnului meu și să se împartă oamenilor care merg după domnul meu.","Iartă, te rog, vina roabei tale, căci Domnul va face domnului meu o casă trainică; iartă, căci domnul meu poartă războaiele Domnului și niciodată nu va fi răutate în tine.","Dacă se va ridica cineva care să te urmărească și să vrea să-ți ia viața, sufletul domnului meu va fi legat în mănunchiul celor vii la Domnul Dumnezeul tău și să arunce cu praștia sufletul vrăjmașilor tăi.","Când va face Domnul domnului meu tot binele pe care ți l-a făgăduit și te va pune mai-mare peste Israel,","atunci nu va avea domnul meu nici mustrări de cuget și nici nu-l va durea inima că a vărsat sânge degeaba și că s-a răzbunat singur. Și când va face Domnul bine domnului meu, adu-ți aminte de roaba ta.\"","David a zis Abigailei: „Binecuvântat să fie Domnul Dumnezeul lui Israel, care te-a trimis astăzi înaintea mea!","Binecuvântată să fie judecata ta și binecuvântată să fii tu, că m-ai oprit în ziua aceasta să vărs sânge și mi-ai oprit mâna!","Dar viu este Domnul Dumnezeul lui Israel, care m-a oprit să-ți fac rău, că, dacă nu te-ai fi grăbit să vii înaintea mea, n-ar mai fi rămas nimic din ce este al lui Nabal până la lumina zilei de mâine.\"","Și David a luat din mâna Abigailei ce-i adusese și i-a zis: „Suie-te în pace acasă; vezi că ți-am ascultat glasul și te-am primit bine.\"","Abigail a ajuns la Nabal. Și tocmai el dădea în casa lui un ospăț ca un ospăț împărătesc; inima îi era veselă și era beat mort. Ea nu i-a spus nimic, nimic, până la lumina zilei.","Dar dimineața, după ce trecuse beția lui Nabal, nevastă-sa i-a istorisit ce se întâmplase. Inima lui Nabal a primit o lovitură de moarte și s-a făcut ca o piatră.","Cam după zece zile, Domnul a lovit pe Nabal și a murit.","David a aflat că murise Nabal și a zis: „Binecuvântat să fie Domnul că mi-a apărat pricina în ocara pe care mi-a făcut-o Nabal și a împiedicat pe robul Său să facă rău! Domnul a făcut ca răutatea lui Nabal să cadă asupra capului lui.\" David a trimis vorbă Abigailei că vrea s-o ia de nevastă.","Slujitorii lui David au ajuns la Abigail, la Carmel, și i-au vorbit așa: „David ne-a trimis la tine, ca să te ia de nevastă.\"","Ea s-a sculat, s-a aruncat cu fața la pământ și a zis: „Iată, roaba ta se socotește ca o roabă, gata să spele picioarele slujitorilor domnului meu.\"","Și îndată, Abigail a plecat, călare pe un măgar și însoțită de cinci fete; a mers după solii lui David și i-a fost nevastă.","David luase și pe Ahinoam din Izreel și amândouă au fost nevestele lui.","Și Saul dăduse pe fiică-sa Mical, nevasta lui David, lui Palti din Galim, fiul lui Laiș."],"26":["Zifiții s-au dus la Saul la Ghibea și au zis: „Iată că David este ascuns pe dealul Hachila, în fața pustiei.\"","Saul s-a sculat și s-a coborât în pustia Zif, cu trei mii de oameni aleși din Israel, ca să caute pe David în pustia Zif.","A tăbărât pe dealul Hachila, în fața pustiei, lângă drum. David era în pustie și, înțelegând că Saul merge în urmărirea lui în pustie,","a trimis niște iscoade și a aflat că, în adevăr, Saul venise.","Atunci, David s-a sculat și a venit la locul unde tăbărâse Saul și a văzut locul unde era culcat Saul, cu Abner, fiul lui Ner, căpetenia oștirii lui. Saul era culcat în cort în mijlocul taberei și poporul era tăbărât în jurul lui.","David a luat cuvântul și, vorbind lui Ahimelec, Hetitul, și lui Abișai, fiul Țeruiei și fratele lui Ioab, a zis: „Cine vrea să se coboare cu mine în tabără la Saul?\" Și Abișai a răspuns: „Eu mă voi coborî cu tine.\"","David și Abișai s-au dus noaptea la popor. Și iată că Saul era culcat și dormea în cort, în mijlocul taberei, și sulița lui era înfiptă în pământ, la capul lui. Abner și poporul lui erau culcați în jurul lui.","Abișai a zis lui David: „Dumnezeu dă astăzi pe vrăjmașul tău în mâinile tale; lasă-mă, te rog, să-l lovesc cu sulița mea și să-l pironesc dintr-o lovitură în pământ, ca să n-am nevoie să-i mai dau alta.\"","Dar David a zis lui Abișai: „Nu-l omorî! Căci cine ar putea pune mâna pe unsul Domnului și să rămână nepedepsit?\"","Și David a zis: „Viu este Domnul că numai Domnul îl poate lovi; fie că-i va veni ziua să moară, fie că se va coborî într-un câmp de bătaie și va pieri.","Să mă ferească Domnul să pun mâna pe unsul Domnului! Ia numai sulița de la căpătâiul lui, urciorul cu apă și să plecăm.\"","David a luat dar sulița și urciorul cu apă de la căpătâiul lui Saul și au plecat. Nimeni nu i-a văzut, nici n-a băgat de seamă nimic și nimeni nu s-a deșteptat, căci Domnul îi cufundase pe toți într-un somn adânc.","David a trecut de cealaltă parte și a ajuns departe pe vârful muntelui, la o mare depărtare de tabără.","Și a strigat poporului și lui Abner, fiul lui Ner: „N-auzi tu, Abner?\" Abner a răspuns: „Cine ești tu, care strigi către împăratul?\"","Și David a zis lui Abner: „Oare nu ești tu bărbat? Și cine este ca tine în Israel? Pentru ce atunci n-ai păzit pe împărat, stăpânul tău? Căci cineva din popor a venit să omoare pe împăratul, stăpânul tău.","Ce ai făcut tu nu este bine. Viu este Domnul că sunteți vrednici de moarte, căci n-ați vegheat asupra stăpânului vostru, asupra unsului Domnului. Uită-te acum unde este sulița împăratului și urciorul de apă, care erau la căpătâiul lui.\"","Saul a cunoscut glasul lui David și a zis: „Glasul tău este, fiul meu David?\" Și David a răspuns: „Glasul meu, împărate, domnul meu!\"","Și a zis: „Pentru ce urmărește domnul meu pe robul său? Ce-am făcut și cu ce sunt vinovat?","Să binevoiască acum împăratul, domnul meu, să asculte cuvintele robului său. Dacă Domnul este Cel ce te ațâță împotriva mea, să primească mirosul unui dar de mâncare de la noi, dar dacă oamenii te ațâță, blestemați să fie înaintea Domnului, fiindcă ei mă izgonesc azi ca să mă dezlipească de moștenirea Domnului, zicându-mi: ‘Du-te de slujește unor dumnezei străini!’","O, să nu-mi cadă sângele pe pământ departe de Fața Domnului! Căci împăratul lui Israel a pornit să mă caute ca pe un purice, cum ar urmări o potârniche în munți.\"","Saul a zis: „Am păcătuit; întoarce-te, fiul meu David, căci nu-ți voi mai face rău, fiindcă în ziua aceasta viața mea a fost scumpă înaintea ta. Am lucrat ca un nebun și am făcut o mare greșeală.\"","David a răspuns: „Iată sulița împăratului; să vină unul din oamenii tăi s-o ia.","Domnul va răsplăti fiecăruia după dreptatea lui și după credincioșia lui, căci Domnul te dăduse azi în mâinile mele, și eu n-am vrut să pun mâna pe unsul Domnului.","Și după cum azi viața ta a avut un mare preț înaintea mea, tot așa și viața mea va avea un mare preț înaintea Domnului și El mă va izbăvi din orice necaz.\"","Saul a zis lui David: „Fii binecuvântat, fiul meu David! Tu vei face lucruri mari și vei birui.\" David și-a văzut de drum, și Saul s-a întors acasă."],"27":["David și-a zis în sine: „Voi pieri într-o zi ucis de mâna lui Saul; nu este nimic mai bine pentru mine decât să fug în țara filistenilor, pentru ca Saul să înceteze să mă mai caute în tot ținutul lui Israel; așa voi scăpa de mâna lui.\"","Și David s-a sculat, el și cei șase sute de oameni care erau împreună cu el, și au trecut la Achiș, fiul lui Maoc, împăratul Gatului.","David și oamenii lui au rămas în Gat, la Achiș; își avea fiecare familia lui și David își avea cele două neveste: Ahinoam din Izreel și Abigail din Carmel, nevasta lui Nabal.","Saul, când a aflat că David fugise la Gat, a încetat să-l mai caute.","David a zis lui Achiș: „Dacă am căpătat trecere înaintea ta, rogu-te să mi se dea într-una din cetățile țării un loc unde să pot locui, căci pentru ce să locuiască robul tău cu tine în cetatea împărătească?\"","Și chiar în ziua aceea, Achiș i-a dat Țiclagul. De aceea, Țiclagul a fost al împăraților lui Iuda până în ziua de azi.","Timpul cât a locuit David în țara filistenilor a fost de un an și patru luni.","David și oamenii lui se suiau și năvăleau asupra gheșuriților, ghirziților și amaleciților, căci neamurile acestea locuiau din vremuri vechi în ținutul acela până la Șur și până în țara Egiptului.","David pustia ținutul acesta; nu lăsa cu viață nici bărbat, nici femeie, le lua oile, boii, măgarii, cămilele, hainele și apoi se întorcea și se ducea la Achiș.","Achiș zicea: „Unde ați năvălit azi?\" Și David răspundea: „Spre miazăzi de Iuda, spre miazăzi de ierahmeeliți și spre miazăzi de cheniți.\"","David nu lăsa cu viață nici bărbat, nici femeie ca să vină la Gat, „căci\", se gândea el, „ei ar putea să vorbească împotriva noastră și să zică: ‘Așa a făcut David’\". Și acesta a fost felul lui de purtare în tot timpul cât a locuit în țara filistenilor.","Achiș se încredea în David și zicea: „S-a făcut urât poporului său Israel și va rămâne în slujba mea pe vecie.\""],"28":["Pe vremea aceea, filistenii și-au strâns taberele și au făcut o oștire ca să pornească război împotriva lui Israel. Achiș a zis lui David: „Să știi că vei veni cu mine la oștire, tu și oamenii tăi.\"","David a răspuns lui Achiș: „Ei bine, vei vedea ce va face robul tău.\" Și Achiș a zis lui David: „De aceea te voi pune păzitorul capului meu în tot timpul.\"","Samuel murise. Tot Israelul îl plânsese și-l îngropase la Rama, în cetatea lui. Saul îndepărtase din țară pe cei ce chemau morții și pe cei ce ghiceau.","Filistenii s-au strâns și au venit de au tăbărât la Sunem. Saul a strâns pe tot Israelul și au tăbărât la Ghilboa.","La vederea taberei filistenilor, Saul a fost cuprins de frică și un tremur puternic i-a apucat inima.","Saul a întrebat pe Domnul, și Domnul nu i-a răspuns nici prin vise, nici prin Urim, nici prin proroci.","Atunci, Saul a zis slujitorilor lui: „Căutați-mi o femeie care să cheme morții, ca să mă duc s-o întreb.\" Slujitorii lui i-au zis: „Iată că în En-Dor este o femeie care cheamă morții.\"","Atunci, Saul s-a schimbat, a luat alte haine și a plecat cu doi oameni. Au ajuns la femeia aceea noaptea. Saul i-a zis: „Spune-mi viitorul chemând un mort și scoală-mi pe cine-ți voi spune.\"","Femeia i-a răspuns: „Știi ce a făcut Saul, cum a nimicit din țară pe cei ce cheamă morții și pe cei ce ghicesc viitorul, pentru ce dar întinzi o cursă vieții mele, ca să mă omori?\"","Saul i-a jurat pe Domnul și a zis: „Viu este Domnul că nu ți se va întâmpla niciun rău pentru aceasta.\"","Femeia a zis: „Pe cine vrei să-ți scol?\" Și el a răspuns: „Scoală-mi pe Samuel.\"","Când a văzut femeia pe Samuel, a scos un țipăt mare și a zis lui Saul: „Pentru ce m-ai înșelat? Tu ești Saul!\"","Împăratul i-a zis: „Nu te teme de nimic. Dar ce vezi?\" Femeia a zis lui Saul: „Văd o ființă dumnezeiască sculându-se din pământ.\"","El i-a zis: „Cum e la chip?\" Și ea a răspuns: „Este un bătrân care se scoală și este învelit cu o mantie.\" Saul a înțeles că era Samuel și s-a plecat cu fața la pământ și s-a închinat.","Samuel a zis lui Saul: „Pentru ce m-ai tulburat chemându-mă?\" Saul a răspuns: „Sunt într-o mare strâmtorare: filistenii îmi fac război, și Dumnezeu S-a depărtat de la mine; nu mi-a răspuns nici prin proroci, nici prin vise. Și te-am chemat să-mi arăți ce să fac.\"","Samuel a zis: „Pentru ce mă întrebi pe mine, când Domnul S-a depărtat de tine și S-a făcut vrăjmașul tău?","Domnul îți face așa cum îți vestisem din partea Lui; Domnul a rupt împărăția din mâinile tale și a dat-o altuia, lui David.","N-ai ascultat de glasul Domnului și n-ai făcut pe Amalec să simtă aprinderea mâniei Lui, de aceea îți face Domnul așa astăzi.","Și chiar Domnul va da pe Israel împreună cu tine în mâinile filistenilor. Mâine, tu și fiii tăi veți fi împreună cu mine și Domnul va da tabăra lui Israel în mâinile filistenilor.\"","Îndată, Saul a căzut la pământ cât era de lung, și cuvintele lui Samuel l-au umplut de groază; nu mai avea nicio putere, căci nu mâncase toată ziua și toată noaptea.","Femeia a venit la Saul și, văzându-l foarte înspăimântat, i-a zis: „Iată că roaba ta ți-a ascultat glasul; mi-am pus viața în primejdie ascultând de cuvintele pe care mi le-ai spus.","Ascultă acum și tu glasul roabei tale și lasă-mă să-ți dau o bucată de pâine, ca să mănânci și să prinzi putere ca să pornești la drum.\"","Dar el n-a vrut și a zis: „Nu mănânc nimic!\" Slujitorii lui și femeia au stăruit de el până i-a ascultat. S-a sculat de la pământ și a șezut pe pat.","Femeia avea la ea un vițel gras, pe care l-a tăiat în grabă; a luat făină, a frământat-o și a copt azimi.","Le-a pus înaintea lui Saul și înaintea slujitorilor lui și au mâncat. Apoi s-au sculat și au plecat chiar în noaptea aceea."],"29":["Filistenii își strânseseră toate oștile la Afec, și Israel tăbărâse la fântâna lui Izreel.","Domnii filistenilor au înaintat cu sutele și miile lor, și David și oamenii lui mergeau mai la coadă, cu Achiș.","Domnii filistenilor au zis: „Ce caută evreii aceștia aici?\" Și Achiș a răspuns domnitorilor filistenilor: „Acesta este David, slujitorul lui Saul, împăratul lui Israel. De mult este cu mine și n-am găsit nici cel mai mic lucru de care să-l învinuiesc, de la venirea lui și până în ziua de azi.\"","Dar domnitorii filistenilor s-au mâniat pe Achiș și i-au zis: „Trimite înapoi pe omul acesta, ca să se întoarcă în locul unde l-ai așezat, să nu se coboare cu noi pe câmpul de bătaie, ca să nu ne fie vrăjmaș în timpul luptei. Și cum ar putea să se facă omul acesta plăcut stăpânului său decât cu capetele oamenilor noștri?","Nu este acesta David pentru care cântau jucând: ‘Saul și-a bătut miile lui, Iar David, zecile lui de mii’?\"","Achiș a chemat pe David și i-a zis: „Viu este Domnul că ești un om curat la suflet și-mi place să te văd mergând și venind cu mine în tabără, căci n-am găsit nimic rău în tine, de la venirea ta la mine până în ziua de azi, dar nu ești pe placul domnitorilor.","Întoarce-te dar și mergi în pace, ca să nu faci nimic neplăcut înaintea domnitorilor filistenilor.\"","David a zis lui Achiș: „Dar ce am făcut și ce ai găsit în robul tău, de când sunt la tine până în ziua de azi, ca să nu merg să lupt împotriva vrăjmașilor domnului meu, împăratul?\"","Achiș a răspuns lui David: „Știu că ești plăcut înaintea mea ca un înger al lui Dumnezeu, dar domnitorii filistenilor au zis: ‘Să nu se suie cu noi la luptă.’","Astfel, scoală-te dis-de-dimineață, tu și slujitorii stăpânului tău care au venit cu tine; sculați-vă dis-de-dimineață și plecați de îndată ce se va lumina.\"","David și oamenii lui s-au sculat din noapte de tot, ca să plece dimineața și să se întoarcă în țara filistenilor. Și filistenii s-au suit la Izreel."],"30":["Când a ajuns David cu oamenii lui a treia zi la Țiclag, amaleciții năvăliseră în partea de miazăzi și în Țiclag. Ei nimiciseră și arseseră Țiclagul","după ce luaseră prinși pe femei și pe toți cei ce se aflau acolo, mici și mari. Nu omorâseră pe nimeni, dar luaseră totul și plecaseră.","David și oamenii lui au ajuns în cetate și iată că era arsă; și nevestele, fiii și fiicele lor fuseseră luați prinși.","Atunci, David și poporul care era cu el au ridicat glasul și au plâns până n-au mai putut plânge.","Cele două neveste ale lui David: Ahinoam din Izreel și Abigail din Carmel, nevasta lui Nabal, fuseseră luate și ele.","David a fost în mare strâmtorare, căci poporul vorbea să-l ucidă cu pietre, pentru că toți erau amărâți în suflet, fiecare din pricina fiilor și fetelor lui. Dar David s-a îmbărbătat, sprijinindu-se pe Domnul Dumnezeul lui.","El a zis preotului Abiatar, fiul lui Ahimelec: „Adu-mi efodul!\" Abiatar a adus efodul la David.","Și David a întrebat pe Domnul: „Să urmăresc oastea aceasta? O voi ajunge?\" Domnul i-a răspuns: „Urmărește-o, căci o vei ajunge și vei izbăvi totul.\"","Și David a pornit, el și cei șase sute de oameni care erau cu el. Au ajuns la pârâul Besor, unde s-au oprit cei ce rămâneau la coadă.","David i-a urmărit mai departe, cu patru sute de oameni, dar două sute de oameni s-au oprit, fiind prea obosiți ca să mai treacă pârâul Besor.","Pe câmp, au dat peste un om egiptean, pe care l-au adus la David. I-au dat să mănânce pâine și să bea apă","și i-au mai dat și o legătură de smochine și două legături de stafide. După ce a mâncat, i-au venit iarăși puterile, căci nu mâncase și nu băuse apă de trei zile și trei nopți.","David i-a zis: „Al cui ești și de unde ești?\" El a răspuns: „Sunt un băiat egiptean în slujba unui amalecit și de trei zile stăpânul meu m-a părăsit pentru că eram bolnav.","Am năvălit în partea de miazăzi a cheretiților, pe ținutul lui Iuda și la miazăzi de Caleb, și am ars Țiclagul.\"","David i-a zis: „Vrei să mă duci la oastea aceasta?\" Și el a zis: „Jură-mi pe Numele lui Dumnezeu că nu mă vei omorî și nu mă vei da pe mâna stăpânului meu, și te voi coborî la oastea aceasta.\"","El i-a slujit astfel de călăuză. Și amaleciții erau risipiți pe tot ținutul, mâncând, bând și jucând de bucuria prăzii celei mari pe care o luaseră din țara filistenilor și din țara lui Iuda.","David i-a bătut din zorii zilei până a doua zi seara și n-a scăpat niciunul din ei, afară de patru sute de tineri, care au încălecat pe cămile și au fugit.","David a scăpat astfel tot ce luaseră amaleciții și a scăpat și pe cele două neveste ale lui.","Nu le-a lipsit nimeni, de la mic până la mare, nici fiu, nici fiică, nici un lucru din pradă, nimic din ce li se luase; David a adus înapoi totul.","Și David a luat toate oile și toți boii, și cei ce mânau turma aceasta și mergeau în fruntea ei ziceau: „Aceasta este prada lui David!\"","David a ajuns la cei două sute de oameni care fuseseră prea obosiți ca să mai meargă după el și pe care-i lăsase la pârâul Besor. Ei au ieșit înaintea lui David și înaintea poporului care era cu el. David s-a apropiat de ei și i-a întrebat de sănătate.","Toți oamenii răi și de nimic dintre cei ce merseseră cu David au luat cuvântul și au zis: „Fiindcă n-au venit cu noi, să nu le dăm nimic din prada pe care am scăpat-o, ci doar să-și ia fiecare nevasta și copiii și să plece.\"","Dar David a zis: „Să nu faceți așa, fraților, cu ce ne-a dat Domnul, căci El ne-a păzit și a dat în mâinile noastre ceata care venise împotriva document.addEventListener("focusin", e => {
  const inp = e.target;
  if (inp && (inp.tagName === "INPUT" || inp.tagName === "TEXTAREA")) {
    const container = inp.closest(".sheet, .modal");
    if (container) {
      window.scrollTo(0, 0);
      setTimeout(() => {
        window.scrollTo(0, 0);
        const cRect = container.getBoundingClientRect();
        const iRect = inp.getBoundingClientRect();
        const kbdH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--kbd-h")) || 0;
        const visibleBottom = cRect.bottom - kbdH;
        if (iRect.bottom > visibleBottom) {
          container.scrollBy({ top: iRect.bottom - visibleBottom + 24, behavior: "smooth" });
        } else if (iRect.top < cRect.top + 20) {
          container.scrollBy({ top: iRect.top - cRect.top - 20, behavior: "smooth" });
        }
      }, 150);
    }
  }
});
document.addEventListener("focusout", e => {

function closeModal(bg, onDone){
  if (!bg || bg._closing) return;
  bg._closing = true;
  bg.classList.add("closing");
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    const cb = onDone;
    bg.remove();
    if (cb) cb();
  };
  const content = bg.querySelector(".modal, .sheet");
  if (content && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    content.addEventListener("animationend", finish, { once: true });
    setTimeout(finish, 260);
  } else {
    finish();
  }
}
function verseHTML(ref){
  const m = /^(\d+):(\d+)(?:-(\d+))?$/.exec(ref); if (!m) return "";
  const c = +m[1], a = +m[2], b = +(m[3]||m[2]); const vs = TEXT[c] || [];
  const one = v => `<sup>${v}</sup>${esc(vs[v-1])} `;
  let out = ""; const end = Math.min(b, vs.length);
  if (end - a < 4){ for (let v=a; v<=end; v++) out += one(v); return out.trim(); }
  for (let v=a; v<a+2; v++) out += one(v);
  let rest = ""; for (let v=a+2; v<=end; v++) rest += one(v);
  return `${out}<details class="more"><summary>Citește versetele ${a+2}–${end}</summary>${rest.trim()}</details>`;
}

function chaptersLabel(chs){
  if (chs.length === 31) return "Toate capitolele";
  const s = chs.slice().sort((a,b)=>a-b), parts = []; let i = 0;
  while (i < s.length){
    let j = i;
    while (j+1 < s.length && s[j+1] === s[j]+1) j++;
    if (j > i + 1) parts.push(`${s[i]}–${s[j]}`);
    else if (j === i + 1) { parts.push(`${s[i]}`); parts.push(`${s[j]}`); }
    else parts.push(`${s[i]}`);
    i = j+1;
  }
  let str = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " și " + parts[parts.length - 1];
  return (s.length === 1 ? "Capitolul " : "Capitolele ") + str;
}

const store = {

    p.ok = [...new Set([...p.ok, ...x.ok])];

    const { error } = await sb().rpc("save_play", { p_player: x.player || this.uid, p_at: new Date(x.at).toISOString(), p_chs: x.chs, p_mode: x.mode, p_score: x.score, p_total: x.total, p_pct: x.pct, p_secs: x.secs, p_chap: x.chap, p_ok: x.ok, ...(x.seen ? { p_seen: x.seen } : {}) });

  local(uid){ return lsGet("candela:p:" + uid, null); },
  /* saves one finished test; returns whether it reached the server */
  async save(p, x){
    this.applyEntry(p, x);
    if (p.guest){ lsSet("candela:guest", p); lsSet("candela:guestEntries", [...lsGet("candela:guestEntries", []), x]); return {guest:true}; }
    x.player = this.pid || this.uid;
    lsSet("candela:p:" + x.player, p);
    try { await this.send(x); return {saved:true}; }
    catch (e) {
      if (isNetErr(e)){ lsSet("candela:pending:" + this.uid, [...this.pending(), x]); }
      return {saved:false};
    }
  },
  async board(){
    if (!sb()) return null;
    try {
      const { data, error } = await sb().rpc("board2", { p_player: S.player && !S.player.guest ? this.pid : null });
      if (error) return null;
      const total = totalCount("both");
      return data.map(x => ({ id: x.id, name: x.name, ok: x.ok, seen: Math.max(x.seen ?? 0, x.ok), tests: x.tests, me: !!x.me, mastery: Math.round(x.ok / total * 1000) / 10 }));
    } catch { return null; }
  },
  /* returns {ok, data} or {ok:false, error} */
  async rpc(fn, args){
    if (!sb()) return {ok:false, error:"network"};
    try { const { data, error } = await sb().rpc(fn, args); return error ? {ok:false, error: isNetErr(error) ? "network" : String(error.message || "server")} : {ok:true, data}; }
    catch (e) { return {ok:false, error: isNetErr(e) ? "network" : "server"}; }
  },
  async token(){ try { return (await sb().auth.getSession()).data.session?.access_token || null; } catch { return null; } },
  async logout(){ try { await sb()?.auth.signOut(); } catch {} this.uid = this.pid = null; this.email = ""; this.isParent = false; this.family = []; }
};

/* ---------- quiz engine ---------- */
function buildPool(chs, mode){
  const out = [];
  for (const c of chs){
    const d = QUIZ[c]; if (!d) continue;
    for (const m of (mode==="both" ? ["easy","hard"] : [mode]))
      (d[m]||[]).forEach((q,i) => out.push({...q, ch:c, mode:m, id:`${c}${m[0]}${i}`}));
  }
  return out;
}
function prepare(q){
  const x = {...q};
  if (q.t === "one"){ const idx = shuffle(q.opts.map((_,i)=>i)); x.opts = idx.map(i=>q.opts[i]); x.a = idx.indexOf(q.a); }
  if (q.t === "multi"){ const idx = shuffle(q.opts.map((_,i)=>i)); x.opts = idx.map(i=>q.opts[i]); x.a = q.a.map(a=>idx.indexOf(a)).sort((a,b)=>a-b); }
  if (q.t === "match"){ x.right = shuffle(q.pairs.map((p,i)=>i)); }
  return x;
}
/* rough time to answer, by question type and level (seconds), including reading the correction; only an estimate shown before starting, there is no timer */
const SECS = { tf:[9,13], one:[13,19], multi:[20,28], fill:[17,25], match:[30,42] };
// once enough tests exist, the real average time per question (by level) replaces the guess, within ×0.5–×2 of it
let PACE = lsGet("candela:pace", null);
function estSecs(list){
  const by = {easy:[0,0], hard:[0,0]};
  for (const q of list){ const b = by[q.mode] || by.easy; b[0] += (SECS[q.t]||[18,24])[q.mode==="hard"?1:0]; b[1]++; }
  return Object.entries(by).reduce((s, [m, [guess, n]]) => s + (PACE?.[m] && n ? Math.min(guess*2, Math.max(guess/2, PACE[m]*n)) : guess), 0);
}
async function loadPace(){
  const r = await store.rpc("pace"); if (!r.ok || !r.data) return;
  PACE = {}; for (const x of r.data) if (x.n >= 15 && x.mode !== "both") PACE[x.mode] = +x.secs;
  lsSet("candela:pace", PACE);
}
function durLabel(secs){
  const m = secs / 60;
  if (m < 1.5) return "cam 1 min";
  if (m < 20) return `cam ${Math.round(m)} min`;
  if (m < 60) return `cam ${Math.round(m/5)*5} min`;
  const h = Math.floor(m/60), r = Math.round((m - h*60)/10)*10;
  return r === 60 ? `cam ${h+1} h` : `cam ${h} h${r ? ` ${r} min` : ""}`;
}

// a level is done when every chosen chapter already had 100% at it

const RO_NUM_MAP = new Map();
function buildRoNums() {
  const units = ["zero", "unu", "doi", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const femUnits = ["zero", "una", "două", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const oUnits = ["zero", "o", "două", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const teens = ["zece", "unsprezece", "doisprezece", "treisprezece", "paisprezece", "cincisprezece", "șaisprezece", "șaptesprezece", "optsprezece", "nouăsprezece"];
  const femTeens = [...teens]; femTeens[2] = "douăsprezece";
  const tens = ["", "", "douăzeci", "treizeci", "patruzeci", "cincizeci", "șaizeci", "șaptezeci", "optzeci", "nouăzeci"];
  const add = (n, words) => {
    if (!RO_NUM_MAP.has(n)) RO_NUM_MAP.set(n, new Set());
    words.forEach(w => RO_NUM_MAP.get(n).add(fold(w).replace(/[\s\-]/g, '')));
  };
  for (let i=0; i<10; i++) add(i, [units[i], femUnits[i], oUnits[i]]);
  for (let i=10; i<20; i++) add(i, [teens[i-10], femTeens[i-10]]);
  for (let i=20; i<100; i++) {
    const t = Math.floor(i/10), u = i%10;
    if (u === 0) add(i, [tens[t]]);
    else add(i, [tens[t] + " și " + units[u], tens[t] + " și " + femUnits[u], tens[t] + " și " + oUnits[u]]);
  }
  add(100, ["sută", "o sută"]);
  add(1000, ["mie", "o mie"]);
}
buildRoNums();

function tolerantMatch(ans, exp) {
  const clean = s => fold(s).replace(/[.,;:'"!?()\[\]{}„”«»]/g, '');
  const cA = clean(ans), cE = clean(exp);
  if (cA === cE) return true;
  const sA = cA.replace(/[\s\-]/g, ''), sE = cE.replace(/[\s\-]/g, '');
  if (sA === sE) return true;
  const numA = parseInt(sA, 10), numE = parseInt(sE, 10);
  if (!isNaN(numA) && numA.toString() === sA && RO_NUM_MAP.has(numA) && RO_NUM_MAP.get(numA).has(sE)) return true;
  if (!isNaN(numE) && numE.toString() === sE && RO_NUM_MAP.has(numE) && RO_NUM_MAP.get(numE).has(sA)) return true;
  const lDist = (a, b) => {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    const m = Array.from({length: b.length + 1}, (_, i) => [i]);
    for (let j = 0; j <= a.length; j++) m[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        m[i][j] = b[i - 1] === a[j - 1] ? m[i - 1][j - 1] : Math.min(m[i - 1][j - 1], m[i][j - 1], m[i - 1][j]) + 1;
      }
    }
    return m[b.length][a.length];
  };
  const tol = sE.length >= 8 ? 2 : (sE.length >= 4 ? 1 : 0);
  if (tol > 0) {
    if (lDist(cA, cE) <= tol) return true;
    if (lDist(sA, sE) <= tol) return true;
  }
  return false;
}

function check(skipped=false){

async function finish(again){
  document.body.classList.remove("quiz-fixed");

  const Z = S.quiz, n = Z.qs.length; S.lastReport = Z;
  const score = Z.answers.reduce((s,a)=>s+(a?a.pts:0),0);
  const sc = Math.round(score*10)/10, P = pct(score, n);
  const secs = Math.round((Date.now()-Z.start)/1000);
  // per chapter & per type
  const byCh = {}, byType = {};
  Z.qs.forEach((q,i) => { const a = Z.answers[i]||{pts:0};
    (byCh[q.ch] ??= {s:0,n:0}); byCh[q.ch].s += a.pts; byCh[q.ch].n++;
    const key = q.ch + q.mode[0]; ((byCh._m ??= {})[key] ??= {s:0,n:0}); byCh._m[key].s += a.pts; byCh._m[key].n++;
    (byType[q.t] ??= {s:0,n:0}); byType[q.t].s += a.pts; byType[q.t].n++; });
  // save
  const p = S.player;
  if (!Z.retry && !again) dropQuiz();
  let saving = Promise.resolve(null);
  const at = Z.at || (Z.at = Date.now());
  if (!Z.retry && !again){
    const chap = {}; for (const key in byCh._m){ const v = byCh._m[key]; chap[key] = pct(v.s, v.n); }
    const ok = Z.qs.filter((q,i) => (Z.answers[i]||{}).pts >= 1).map(q => q.id);
    const seen = Z.qs.filter((q,i) => Z.answers[i] && !Z.answers[i].skipped).map(q => q.id);
    const wrongIds = Z.qs.map((q,i) => ({q, a: Z.answers[i]})).filter(x => !x.a || x.a.pts < 1).map(packWrong);
    saving = store.save(p, { at, chs: Z.chs, mode: Z.mode, score: sc, total: n, pct: P, secs, chap, ok, seen, wrong: wrongIds });
  }
  S.board = null;
  const wrong = Z.qs.map((q,i)=>({q, a: Z.answers[i]})).filter(x => !x.a || x.a.pts < 1);
  const rep = { at, chs: Z.chs, mode: Z.mode, retry: !!Z.retry, n, sc, P, wrong, secs,

  if (!Z.retry && !again) keepReport(rep);

}
/* a mistake kept with the account: the question id and the answer given, in the question's own option order */

function mistakeHTML({q, a}){

  if (q.t==="multi"){ yours = skipped ? "—" : (a.given.length ? a.given.map(i=>esc(q.opts[i])).join("; ") : "niciuna"); correct = q.a.length ? q.a.map(i=>esc(q.opts[i])).join("; ") : "niciuna"; }
  if (q.t==="fill"){ yours = skipped ? "—" : a.given.map(esc).join(", "); correct = q.a.map(esc).join(", "); }
  if (q.t==="match"){
    yours = skipped ? "—" : q.pairs.map((p,i)=> a.given[i]===i ? null : `${esc(p[0])} → ${a.given[i]!=null ? esc(q.pairs[a.given[i]][1]) : "—"}`).filter(Boolean).join("<br>");

  }

  return `<article class="mistake"><div class="qmeta"><span class="qtype">${TYPE_LABEL[q.t]}</span><span class="ref">${refLabel(q.ref)}</span></div>
