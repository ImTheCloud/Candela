<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#F8F1E6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#F8F1E6" media="(prefers-color-scheme: dark)"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2c2 3 4 5 4 8a4 4 0 0 1-8 0c0-2 1.5-3.5 2-5 .5 1.5 1.2 2.2 2 2.5C11.6 5.5 12 4 12 2z' fill='%23B87A0B'/%3E%3Cpath d='M3 16c3 0 6-1.5 9-1.5s5 .8 9 0c-.7 3-4 5.5-9 5.5-3.5 0-7-1.5-9-4z' fill='%231E261D'/%3E%3C/svg%3E"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Candela"><meta property="og:type" content="website"><meta property="og:site_name" content="Candela"><meta property="og:url" content="https://candela-biblia.vercel.app/"><meta property="og:image" content="https://candela-biblia.vercel.app/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Candela: „Candela lui Dumnezeu nu se stinsese încă.” 1 Samuel 3:3"><meta name="twitter:card" content="summary_large_image"><meta property="og:title" content="Candela · Test biblic 1 Samuel"><meta property="og:description" content="923 de întrebări din 1 Samuel (Cornilescu), nivel ușor și greu."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head><body><title>Candela 1 Samuel</title>
<meta name="description" content="Pregătire pentru testul biblic din 1 Samuel, după traducerea Cornilescu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column (max 640px) like a pocket study book; a lamp flame is the recurring mark of progress. */
:root{
  --bg:#F8F1E6;          /* warm cream */
  --surface:#FFFBF4;
  --surface-2:#F1E6D5;
  --ink:#3A271B;         /* dark brown */
  --ink-2:#7B6450;
  --line:#E7D8C2;
  --oil:#D97B26;         /* lamp oil / flame orange */
  --oil-soft:#FBE5CC;
  --oil-ink:#8A4510;
  --cedar:#8A5A36;       /* warm brown (easy level, avatars) */
  --cedar-soft:#F2E3D2;
  --ok:#5E8A3A; --ok-soft:#E8F0DA;
  --warn:#D99C26; --warn-soft:#FCF0D2;
  --bad:#B23A2E; --bad-soft:#FBE4DF;
  --p1:#D97B26; --p2:#8A5A36; --p3:#B0644A; --p4:#5E8A3A; --p5:#B4534A;
  --shadow:0 1px 2px rgb(58 39 27 / .05), 0 10px 30px -18px rgb(58 39 27 / .28);
  --f-display:"Gloock", "Georgia", "Times New Roman", serif;
  --f-bible:"Source Serif 4", "Georgia", "Times New Roman", serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oil);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px calc(48px + env(safe-area-inset-bottom,0px))}
.view{max-width:640px;margin:0 auto}
.view:has(.home), .view:has(.entry){max-width:1180px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--oil-ink);background:var(--oil-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.muted{color:var(--ink-2)}
.view{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:16px;transition:transform .15s ease, background .2s, box-shadow .2s;min-height:50px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{box-shadow:0 6px 18px -8px var(--ink)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-oil{background:var(--oil);color:#2a1505}
.btn-block{width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--ink-2);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* Entry */
.entry{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.entry[data-step="form"]{padding-top:6vh}
.entry-head{display:grid;justify-items:center;gap:4px;flex:none}
.entry .back{align-self:center}
.verse-quote{font-family:var(--f-display);font-size:17px;line-height:1.35;text-align:center;max-width:30ch;margin:6px auto 0;color:var(--ink-2)}
.verse-quote .ref{margin-left:6px;vertical-align:2px}
.seg.two{grid-template-columns:1fr 1fr}
.name-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.remember{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none}
.remember input{width:20px;height:20px;accent-color:var(--cedar);margin:0}
.board.scroll{position:relative;align-content:start}
.entry .board.scroll{flex:1;min-height:0}
.lamp-wrap{display:flex;justify-content:center;position:relative}
.lamp-glow{position:absolute;inset:-40px 0 auto;height:220px;background:radial-gradient(closest-side,color-mix(in oklab,var(--oil) 40%,transparent),transparent);filter:blur(6px);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
.flame{transform-origin:50% 90%;animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scaleY(1) skewX(0)}25%{transform:scaleY(1.06) skewX(-2deg)}50%{transform:scaleY(.96) skewX(1.5deg)}75%{transform:scaleY(1.04) skewX(-1deg)}}
.entry h1{font-size:clamp(40px,11vw,56px);line-height:.95;text-align:center}
.entry h1 span{display:block;font-size:.4em;letter-spacing:.02em;color:var(--ink-2);margin-top:8px}
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.field{display:grid;gap:8px}
.field label{font-weight:600}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:18px;transition:border-color .2s, background .2s}
.input:focus{outline:none;border-color:var(--oil);background:var(--surface)}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;transition:all .15s}
.chip:hover{border-color:var(--oil);color:var(--oil-ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:not-allowed;border-style:dashed}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:30px;line-height:1;border:0;background:transparent;padding:0;color:inherit;cursor:pointer;text-align:left}
.brand.static{cursor:default}
.brand svg{margin:-10px -6px -4px -12px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-width:0;border:0;background:transparent;padding:4px;border-radius:999px}
.prof{justify-items:center;text-align:center;position:relative;padding-top:28px}
.prof .prof-x{position:absolute;top:14px;right:14px}
.prof h3{font-size:28px}
.avatar.lg{width:72px;height:72px;font-size:30px}
.badge-rank{font-size:13px;font-weight:600;color:var(--oil-ink);background:var(--oil-soft);padding:4px 12px;border-radius:999px}
.prof .kv{width:100%}
.prof-mail{color:var(--ink-2);font-size:14px;margin-top:-10px;word-break:break-all}
.prof-mail.warn{color:var(--oil-ink);word-break:normal;max-width:32ch}
.prof-btns{width:100%;display:grid;gap:8px}
.prof{max-height:min(94dvh,calc(100dvh - env(safe-area-inset-top,0px) - 16px));overflow-y:auto}
.pf-head{display:grid;justify-items:center;gap:10px}
.pf-head .prof-mail{margin:0}
.pf-card{width:100%;background:var(--surface);border-radius:16px;padding:16px 18px;display:grid;gap:12px;box-shadow:var(--shadow);text-align:left}
.pf-rules{margin-top:4px;padding-top:14px;border-top:1px solid var(--border);display:grid;gap:8px}
.pf-rule{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.pf-rule .r-icon{color:var(--oil);font-weight:600;width:14px;text-align:center;font-size:14px}
.pf-rule b{color:var(--ink);font-weight:600}
.pf-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--ink-2)}
.pf-row b{color:var(--ink);font-weight:600;text-align:right}
#pubBody{display:grid;gap:12px;width:100%;justify-self:stretch}
.pf-bar{display:grid;gap:6px}
.pf-bar-h{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.pf-bar-h b{color:var(--ink);font-weight:600;font-family:var(--f-mono);font-size:13px}
.pf-bar-h span:first-child{color:var(--ink);font-weight:600}
.bar.two{position:relative;height:8px}
.bar.two i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar.two i.seen{opacity:.3}
.pf-bar-f{margin:0;font-size:13.5px;color:var(--ink-2)}
.pf-bar-f b{color:var(--ink)}

.btn-danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in oklab,var(--bad) 35%,transparent)}
.prof .kv{margin:0}
.prof-form{width:100%;display:grid;gap:14px;text-align:left}
.resume{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:14px 14px 14px 18px;margin-bottom:22px;border:1.5px solid var(--oil-soft)}
.resume b{display:block;font-weight:600}.resume small{color:var(--ink-2);font-size:13px}
.resume .btn{padding-inline:18px}
.h-verse{display:none}
.keys{display:none;font-size:12.5px;color:var(--ink-2);font-family:var(--f-mono);margin:-4px 0 0}
.who b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--cedar);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.top .avatar{width:40px;height:40px;font-size:16px}

/* Dashboard */
.hello{display:grid;gap:6px;margin-bottom:20px}
.hello h2{font-size:clamp(30px,8vw,40px);line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--ink-2)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-h h3{font-size:22px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px 6px;font-weight:600;font-size:15px;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.more summary{font-family:var(--f-body);font-size:13.5px;font-weight:600;color:var(--oil-ink);cursor:pointer;margin-top:6px}
.more[open] summary{margin-bottom:6px}
.seg-note{font-size:13px;color:var(--ink-2)}
.who.acct{border:0;padding:4px}
.who.acct .avatar{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.guest-line{font-size:14px;color:var(--ink-2);margin-top:6px}
.guest-line .link{padding:0;color:var(--ink);font-size:inherit}
.guest-cta{display:grid;gap:8px;border-color:var(--oil-soft);background:linear-gradient(180deg,var(--surface),var(--bg))}
.guest-cta b{font-size:17px}
.guest-cta p{color:var(--ink);font-size:15px;font-weight:500;margin:0}
.guest-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.guest-btns .btn{white-space:nowrap;padding-inline:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;display:grid;place-items:center;padding:0;transition:transform .15s, border-color .2s, background .2s}
.tile:active{transform:scale(.94)}
.tile svg{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px)}
.tile-sc{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11.5px;font-weight:600;color:var(--oil-ink);font-family:var(--f-mono);letter-spacing:0.02em}
.tile-sc.full{color:var(--ok)}
.tile .n{font-family:var(--f-display);font-size:22px;line-height:1;position:relative}
.tile:has(.tile-sc) .n{transform:translateY(-6px)}
.tile.t-full{background:var(--ok-soft)}
.tile.t-half{background:var(--warn-soft)}
.tile.t-low{background:var(--bad-soft)}
.tile[aria-pressed="true"]{background:var(--oil-soft);border-color:var(--oil);color:var(--oil-ink);box-shadow:0 0 0 3px color-mix(in oklab,var(--oil) 18%,transparent)}
.tile[aria-pressed="true"] .trk{stroke:color-mix(in oklab,var(--oil) 20%,transparent)}
#start,#rGo,#shGo{display:grid;gap:2px;justify-items:center;padding-block:12px;min-height:60px;line-height:1.2}
#start .st-main,#rGo .st-main,#shGo .st-main{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#start .st-sub,#rGo .st-sub,#shGo .st-sub{font-size:13px;font-weight:500;opacity:.78;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{stroke:var(--surface-2)}
.opts-row{display:grid;gap:4px;background:var(--surface);border-radius:20px;padding:6px 18px;box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--ink-2);font-size:13px}
.counts{display:flex;gap:6px;flex-wrap:wrap}
html.scroll-locked,body.scroll-locked{overflow:hidden!important;overscroll-behavior:none!important}
html:has(.sheet-bg),html:has(.modal-bg),body:has(.sheet-bg),body:has(.modal-bg){overflow:hidden}
.sheet,.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgb(58 39 27 / .45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:modalBgIn .28s cubic-bezier(.16,1,.3,1) both;touch-action:none;overscroll-behavior:contain;box-sizing:border-box}
.sheet-bg.closing{animation:modalBgOut .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.sheet{position:relative;width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px) + var(--kbd-h,0px));display:grid;gap:16px;animation:sheetUp .32s cubic-bezier(.16,1,.3,1) both;will-change:transform,opacity;touch-action:pan-y;overscroll-behavior:contain;max-height:min(94dvh,calc(100dvh - env(safe-area-inset-top,0px) - 16px));overflow-y:auto;box-sizing:border-box}
.sheet-bg.closing .sheet{animation:sheetDown .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h3{font-size:24px}
.dur{font-size:13px;color:var(--ink-2);margin-top:-6px}
.cnt-h{display:flex;justify-content:space-between;align-items:baseline}
.cnt-h b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.cnt-h span small{color:var(--ink-2);font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .icon-btn{font-size:20px;line-height:1;color:var(--ink)}
.stepper .input{width:84px;text-align:center;padding:8px 6px;font-family:var(--f-display);font-size:24px;-moz-appearance:textfield}
.stepper .input::-webkit-outer-spin-button,.stepper .input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@keyframes fadeIn{from{opacity:0}}
@keyframes modalBgIn{from{opacity:0}to{opacity:1}}
@keyframes modalBgOut{from{opacity:1}to{opacity:0}}
@keyframes modalUp{from{opacity:0;transform:translateY(60px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes modalDown{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(60px) scale(.95)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(100%)}}
@media (min-width:960px){.sheet-bg{align-items:center}.sheet{border-radius:24px;padding:24px;animation:modalUp .32s cubic-bezier(.16,1,.3,1) both}.sheet-bg.closing .sheet{animation:modalDown .22s cubic-bezier(.4,0,1,1) forwards}}
@media (prefers-reduced-motion:reduce){.modal-bg,.sheet-bg,.modal-bg.closing,.sheet-bg.closing,.modal,.sheet,.modal-bg.closing .modal,.sheet-bg.closing .sheet{animation:none!important;transform:none!important}}
.startbar{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:18px;z-index:5}
.history{display:grid;gap:6px}
.hrow{width:100%;border:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:9px 12px}
.hrow .chev,.brow-l .chev{color:var(--ink-2);opacity:.6}
.hist-page{display:grid;gap:18px}
.hgroup{display:grid;gap:8px}
.hg-h{display:grid;gap:1px}
.hg-h b{font-size:15px;font-weight:600;line-height:1.3}
.hg-h .muted{font-size:12.5px}
.sh-hist{max-height:172px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-hist .hrow{background:var(--surface-2)}
.hrow .pct{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.hrow .hrow-info{display:grid;gap:1px;min-width:0}
.hrow .hrow-info b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hrow-info small{display:block;color:var(--ink-2);font-size:11.5px;white-space:nowrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.badge.easy{background:var(--cedar-soft);color:var(--cedar)}
.badge.hard{background:var(--oil-soft);color:var(--oil-ink)}
.badge.both{background:var(--surface-2);color:var(--ink-2)}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink-2);font-size:14px;text-align:center}

/* Quiz */
.view:has(.qtop){display:flex;flex-direction:column;min-height:calc(100dvh - 36px);min-height:calc(var(--vvh,100dvh) - 36px);max-width:640px;margin:0 auto}
.qtop{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}

.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.mx{display:grid;gap:8px}
.mrow{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;overflow:hidden;transition:border-color .15s,background .15s}

.mrow.ok{background:var(--ok-soft);border-color:transparent}
.mrow.no{background:var(--bad-soft);border-color:transparent}
.mrow.ok .mv,.mrow.no .mv{border-left:0;padding-left:0}
.mrow .mfix{padding:0 14px 11px 52px;margin-top:-4px}
.mfix{display:block;font-size:12.5px;color:var(--ok);margin-top:4px;font-weight:600}
.fill{font-family:var(--f-display);font-size:21px;line-height:1.75}

.qactions{display:flex;gap:10px;margin-top:16px}

","opts":["Au atacat tabăra filistenilor","Au luat trupurile de pe zid","Au dus trupurile la David"],"a":[1]},{"t":"tf","ref":"31:12","q":"Vitejii din Iabes au luat de pe zid numai trupul lui Saul, lăsând acolo trupurile fiilor lui.","a":false},{"t":"match","ref":"31:10-13","q":"Asociază fiecare etapă cu ce s-a întâmplat cu trupul lui Saul.","pairs":[["Mai întâi","a fost atârnat pe zidurile Bet-Șanului"],["Apoi","a fost ars la Iabes"],["La urmă","oasele au fost îngropate sub stejar"]]},{"t":"multi","ref":"31:3-13","q":"Care dintre următoarele s-au întâmplat DUPĂ moartea lui Saul?","opts":["Filistenii i-au tăiat capul","Arcașii l-au rănit greu","Locuitorii Iabesului au postit"],"a":[0,2]}],"hard":[{"t":"multi","ref":"31:2","q":"Care dintre următorii sunt numiți printre fiii lui Saul uciși alături de Ionatan?","opts":["Eliab","Ioab","Abinadab"],"a":[2]},{"t":"fill","ref":"31:3","q":"Saul a fost prins în ___ luptei; arcașii l-au ajuns și l-au rănit greu.","a":["toiul"]},{"t":"one","ref":"31:3","q":"Cine l-a ajuns pe Saul și l-a rănit greu?","opts":["Un amalecit","Prăștierii","Arcașii"],"a":2},{"t":"fill","ref":"31:4","q":"Saul a zis atunci celui ce-i ducea armele: „Scoate-ți sabia și străpunge-mă, ca nu cumva acești ___ împrejur să vină să mă străpungă și să-și bată joc de mine.\" Cel ce-i ducea armele n-a voit, căci îi era teamă. Și Saul și-a luat sabia și s-a aruncat în ea.","a":["netăiați"]},{"t":"one","ref":"31:6","q":"Câți fii ai lui Saul au pierit în aceeași zi cu el?","opts":["Doi","Trei","Patru"],"a":1},{"t":"fill","ref":"31:7","q":"Cei din Israel care erau dincolo de ___ și dincolo de ___, văzând că oamenii lui Israel fugeau și că Saul și fiii lui muriseră, și-au părăsit cetățile și au luat-o și ei la fugă. Și filistenii au venit și s-au așezat în ele.","a":["vale","Iordan"]},{"t":"tf","ref":"31:7","q":"Israeliții de dincolo de Iordan au fugit înainte să afle de moartea lui Saul.","a":false},{"t":"one","ref":"31:8","q":"Când au găsit filistenii trupurile lui Saul și ale fiilor lui?","opts":["După trei zile","A doua zi","În aceeași seară"],"a":1},{"t":"multi","ref":"31:9","q":"Unde au trimis filistenii să dea de veste?","opts":["În popor","Prin toată țara filistenilor","În casele idolilor lor"],"a":[0,1,2]},{"t":"fill","ref":"31:9","q":"Au tăiat ___ lui Saul și i-au luat ___. Apoi au trimis să dea de veste prin toată țara filistenilor, în casele idolilor lor și în popor.","a":["capul","armele"]},{"t":"tf","ref":"31:10","q":"Armele lui Saul au fost puse în casa astarteelor.","a":true},{"t":"tf","ref":"31:8","q":"Filistenii i-au găsit pe Saul și pe fiii lui căzuți pe muntele Carmel.","a":false},{"t":"match","ref":"31:1-13","q":"Asociază fiecare loc cu ce se spune despre el.","pairs":[["Muntele Ghilboa","Acolo au căzut uciși bărbații lui Israel"],["Bet-Șan","Pe zidurile lui a fost atârnat trupul lui Saul"],["Iabes","Acolo au fost îngropate oasele sub un stejar"]]},{"t":"tf","ref":"31:12","q":"Vitejii din Iabes au mers toată noaptea.","a":true},{"t":"fill","ref":"31:13","q":"le-au luat oasele și le-au îngropat sub ___ din Iabes. Și au postit ___ zile.","a":["stejarul","șapte"]},{"t":"multi","ref":"31:1-13","q":"Care dintre următoarele locuri sunt menționate în capitolul 31?","opts":["Ghilboa","Afec","Iabes"],"a":[0,2]},{"t":"multi","ref":"31:9-10","q":"Ce au făcut filistenii cu trupul lui Saul, potrivit 31:9-10?","opts":["I-au ars trupul","L-au dus în Gat","I-au dat trupul lui David"],"a":[]}]}};
const TEXT = {"1":["Era un om din Ramataim-Țofim, din muntele lui Efraim, numit Elcana, fiul lui Ieroham, fiul lui Elihu, fiul lui Tohu, fiul lui Țuf, efratit.","El avea două neveste: una se numea Ana, iar cealaltă, Penina. Penina avea copii, dar Ana n-avea.","Omul acesta se suia în fiecare an din cetatea sa la Silo, ca să se închine înaintea Domnului oștirilor și să-I aducă jertfe. Acolo se aflau cei doi fii ai lui Eli, Hofni și Fineas, preoți ai Domnului.","În ziua când își aducea Elcana jertfa, dădea părți nevestei sale Penina, tuturor fiilor și tuturor fiicelor pe care le avea de la ea.","Dar Anei îi dădea o parte îndoită, căci iubea pe Ana. Dar Domnul o făcuse stearpă.","Potrivnica ei o înțepa deseori, ca s-o facă să se mânie, pentru că Domnul o făcuse stearpă.","Și în toți anii era așa. Ori de câte ori se suia Ana la Casa Domnului, Penina o înțepa la fel. Atunci, ea plângea și nu mânca.","Elcana, bărbatul ei, îi zicea: „Ana, pentru ce plângi și nu mănânci? Pentru ce ți-este întristată inima? Oare nu prețuiesc eu pentru tine mai mult decât zece fii?\"","Ana s-a sculat, după ce au mâncat și au băut ei la Silo. Preotul Eli ședea pe un scaun, lângă unul din ușorii Templului Domnului.","Și Ana se ruga Domnului cu sufletul amărât și plângea.","Ea a făcut o juruință și a zis: „Doamne, Dumnezeul oștirilor! Dacă vei binevoi să cauți spre întristarea roabei Tale, dacă-Ți vei aduce aminte de mine și nu vei uita pe roaba Ta și dacă vei da roabei Tale un copil de parte bărbătească, îl voi închina Domnului pentru toate zilele vieții lui și brici nu va trece peste capul lui.\"","Fiindcă ea stătea multă vreme în rugăciune înaintea Domnului, Eli se uita cu băgare de seamă la gura ei.","Ana vorbea în inima ei și numai buzele și le mișca, dar nu i se auzea glasul. Eli credea că este beată","și i-a zis: „Până când vei fi beată? Du-te de te trezește.\"","Ana a răspuns: „Nu, domnul meu, eu sunt o femeie care suferă în inima ei și n-am băut nici vin, nici băutură amețitoare, ci îmi vărsam sufletul înaintea Domnului.","Să nu iei pe roaba ta drept o femeie stricată, căci numai prea multa mea durere și supărarea m-au făcut să vorbesc până acum.\"","Eli a luat din nou cuvântul și a zis: „Du-te în pace, și Dumnezeul lui Israel să asculte rugăciunea pe care I-ai făcut-o!\"","Ea a zis: „Să capete roaba ta trecere înaintea ta!\" Și femeia a plecat. A mâncat și fața ei n-a mai fost aceeași.","S-au sculat dis-de-dimineață și, după ce s-au închinat până la pământ înaintea Domnului, s-au întors și au venit acasă, la Rama. Elcana s-a culcat cu nevastă-sa Ana, și Domnul Și-a adus aminte de ea.","Când i s-au împlinit zilele, Ana a rămas însărcinată și a născut un fiu, căruia i-a pus numele Samuel (Dumnezeu a ascultat), „căci\", a zis ea, „de la Domnul l-am cerut\".","Bărbatul său, Elcana, s-a suit apoi cu toată casa lui să aducă Domnului jertfa de peste an și să-și împlinească juruința.","Dar Ana nu s-a suit și a zis bărbatului ei: „Când voi înțărca copilul, îl voi duce ca să fie pus înaintea Domnului și să rămână acolo pentru totdeauna.\"","Elcana, bărbatul ei, i-a zis: „Fă ce vei crede, așteaptă până-l vei înțărca. Numai împlinească-Și Domnul cuvântul Lui!\" Și femeia a rămas acasă și a dat țâță fiului ei până l-a înțărcat.","Când l-a înțărcat, l-a suit cu ea și a luat trei tauri, o efă de făină și un burduf cu vin. L-a dus în Casa Domnului, la Silo; copilul era încă mic de tot.","Au înjunghiat taurii și au dus copilul la Eli.","Ana a zis: „Domnul meu, iartă-mă! Cât este de adevărat că sufletul tău trăiește, domnul meu, atât este de adevărat că eu sunt femeia aceea care stăteam aici lângă tine și mă rugam Domnului!","Pentru copilul acesta mă rugam, și Domnul a ascultat rugăciunea pe care I-o făceam.","De aceea vreau să-l dau Domnului: toată viața lui să fie dat Domnului.\" Și s-au închinat acolo înaintea Domnului."],"2":["Ana s-a rugat și a zis: „Mi se bucură inima în Domnul, Puterea mea a fost înălțată de Domnul; Mi s-a deschis larg gura împotriva vrăjmașilor mei, Căci mă bucur de ajutorul Tău.","Nimeni nu este sfânt ca Domnul; Nu este alt Dumnezeu decât Tine; Nu este stâncă așa ca Dumnezeul nostru.","Nu mai vorbiți cu atâta îngâmfare, Să nu vă mai iasă din gură cuvinte de mândrie, Căci Domnul este un Dumnezeu care știe totul, Și toate faptele sunt cântărite de El.","Arcul celor puternici s-a sfărâmat, Și cei slabi sunt încinși cu putere.","Cei ce erau sătui se închiriază pentru pâine, Și cei ce erau flămânzi se odihnesc; Chiar cea stearpă naște de șapte ori, Și cea care avea mulți copii stă lâncezită.","Domnul omoară și înviază, El coboară în Locuința morților și El scoate de acolo.","Domnul sărăcește și El îmbogățește, El smerește și El înalță,","El ridică din pulbere pe cel sărac, Ridică din gunoi pe cel lipsit, Ca să-i pună să șadă alături cu cei mari. Și le dă de moștenire un scaun de domnie îmbrăcat cu slavă, Căci ai Domnului sunt stâlpii pământului Și pe ei a așezat El lumea.","El va păzi pașii preaiubiților Lui, Dar cei răi vor fi nimiciți în întuneric, Căci omul nu va birui prin putere.","Vrăjmașii Domnului vor tremura, Din înălțimea cerului, El Își va arunca tunetul asupra lor; Domnul va judeca marginile pământului. El va da Împăratului Său putere Și El va înălța tăria Unsului Lui.\"","Elcana s-a dus acasă, la Rama, și copilul a rămas în slujba Domnului, înaintea preotului Eli.","Fiii lui Eli erau niște oameni răi. Nu cunoșteau pe Domnul.","Și iată care era felul de purtare al acestor preoți față de popor. Când aducea cineva o jertfă, venea sluga preotului în clipa când se fierbea carnea. Ținând în mână o furculiță cu trei coarne,","o vâra în cazan, în căldare, în tigaie sau în oală, și tot ce apuca cu furculița lua preotul pentru el. Așa făceau ei tuturor acelora din Israel care veneau la Silo.","Chiar înainte de a arde grăsimea, venea sluga preotului și zicea celui ce aducea jertfa: „Dă pentru preot carnea de fript; el nu va lua de la tine carne fiartă, ci vrea carne crudă.\"","Și dacă omul zicea: „După ce se va arde grăsimea, vei lua ce-ți va plăcea\", sluga răspundea: „Nu! Dă-mi acum, căci altfel iau cu sila.\"","Tinerii aceștia se făceau vinovați înaintea Domnului de un foarte mare păcat, pentru că nesocoteau darurile Domnului.","Samuel făcea slujba înaintea Domnului și copilul acesta era îmbrăcat cu un efod de in.","Mama sa îi făcea pe fiecare an o mantie mică și i-o aducea când se suia cu bărbatul ei ca să aducă jertfa din fiecare an.","Eli a binecuvântat pe Elcana și pe nevastă-sa și a zis: „Să dea Domnul să ai copii din femeia aceasta, care să înlocuiască pe acela pe care l-a împrumutat ea Domnului!\" Și s-au întors acasă.","Când a cercetat Domnul pe Ana, ea a rămas însărcinată și a născut trei fii și două fiice. Și tânărul Samuel creștea înaintea Domnului.","Eli era foarte bătrân și a aflat cum se purtau fiii lui cu tot Israelul; a aflat și că se culcau cu femeile care slujeau afară, la ușa cortului întâlnirii.","El le-a zis: „Pentru ce faceți astfel de lucruri? Căci aflu de la tot poporul despre faptele voastre rele.","Nu, copii, ce aud spunându-se despre voi nu este bine; voi faceți pe poporul Domnului să păcătuiască.","Dacă un om păcătuiește împotriva altui om, îl va judeca Dumnezeu, dar dacă păcătuiește împotriva Domnului, cine se va ruga pentru el?\" Totuși ei n-au ascultat de glasul tatălui lor, căci Domnul voia să-i omoare.","Tânărul Samuel creștea mereu și era plăcut Domnului și oamenilor.","Un om al lui Dumnezeu a venit la Eli și i-a zis: „Așa vorbește Domnul: ‘Nu M-am descoperit Eu casei tatălui tău când erau în Egipt, în casa lui Faraon?","Eu l-am ales dintre toate semințiile lui Israel, ca să fie în slujba Mea, în preoție, ca să se suie la altarul Meu, să ardă tămâia și să poarte efodul înaintea Mea și am dat casei tatălui tău toate jertfele mistuite de foc și aduse de copiii lui Israel.","Pentru ce călcați voi în picioare jertfele Mele și darurile Mele, care am poruncit să se facă în Locașul Meu? Și cum se face că tu cinstești pe fiii tăi mai mult decât pe Mine, ca să vă îngrășați din cele dintâi roade luate din toate darurile poporului Meu Israel?’","De aceea, iată ce zice Domnul Dumnezeul lui Israel: ‘Spusesem că și casa ta și casa tatălui tău au să umble totdeauna înaintea Mea. Și acum’, zice Domnul, ‘departe de Mine lucrul acesta! Căci voi cinsti pe cine Mă cinstește, dar cei ce Mă disprețuiesc vor fi disprețuiți.","Iată că vine vremea când voi tăia brațul tău și brațul casei tatălui tău, așa încât nu va mai fi niciun bătrân în casa ta.","Vei vedea un potrivnic al tău în locașul Meu, în timp ce Israel va fi copleșit de bunătăți de Domnul și nu va mai fi niciodată niciun bătrân în casa ta.","Voi lăsa să rămână la altarul Meu numai unul dintr-ai tăi, ca să ți se topească ochii de durere și să ți se întristeze sufletul, dar toți ceilalți din casa ta vor muri în floarea vârstei.","Și iată semnul celor ce se vor întâmpla celor doi fii ai tăi, Hofni și Fineas: amândoi vor muri într-o zi.","Eu Îmi voi pune un preot credincios, care va lucra după inima Mea și după sufletul Meu; îi voi zidi o casă stătătoare și va umbla totdeauna înaintea Unsului Meu.","Și oricine va mai rămâne din casa ta va veni să se arunce cu fața la pământ înaintea lui pentru un ban de argint și pentru o bucată de pâine și va zice: «Pune-mă, te rog, în una din slujbele preoției, ca să am o bucată de pâine să mănânc.»’\""],"3":["Tânărul Samuel slujea Domnului înaintea lui Eli. Cuvântul Domnului era rar în vremea aceea și vedeniile nu erau dese.","Tot pe vremea aceea, Eli începea să aibă ochii tulburi și nu mai putea să vadă. El stătea culcat la locul lui,","iar candela lui Dumnezeu nu se stinsese încă și Samuel era culcat în Templul Domnului, unde era chivotul lui Dumnezeu.","Atunci, Domnul a chemat pe Samuel. El a răspuns: „Iată-mă!\"","Și a alergat la Eli și a zis: „Iată-mă, căci m-ai chemat.\" Eli a răspuns: „Nu te-am chemat; întoarce-te și te culcă.\" Și s-a dus și s-a culcat.","Domnul a chemat din nou pe Samuel. Și Samuel s-a sculat, s-a dus la Eli și a zis: „Iată-mă, căci m-ai chemat.\" Eli a răspuns: „Nu te-am chemat, fiule, întoarce-te și te culcă.\"","Samuel nu cunoștea încă pe Domnul și Cuvântul Domnului nu-i fusese încă descoperit.","Domnul a chemat din nou pe Samuel, pentru a treia oară. Și Samuel s-a sculat, s-a dus la Eli și a zis: „Iată-mă, căci m-ai chemat.\" Eli a înțeles că Domnul cheamă pe copil","și a zis lui Samuel: „Du-te de te culcă și, dacă vei mai fi chemat, să spui: ‘Vorbește, Doamne, căci robul Tău ascultă.’\" Și Samuel s-a dus să se culce la locul lui.","Domnul a venit, S-a înfățișat și l-a chemat ca și în celelalte dăți: „Samuele, Samuele!\" Și Samuel a răspuns: „Vorbește, căci robul Tău ascultă.\"","Atunci, Domnul a zis lui Samuel: „Iată că voi face în Israel un lucru care va asurzi urechile oricui îl va auzi.","În ziua aceea voi împlini asupra lui Eli tot ce am rostit împotriva casei lui; voi începe și voi isprăvi.","I-am spus că vreau să pedepsesc casa lui pentru totdeauna, din pricina fărădelegii de care are cunoștință și prin care fiii lui s-au făcut vrednici de lepădat, fără ca el să-i fi oprit.","De aceea, jur casei lui Eli că niciodată fărădelegea casei lui Eli nu va fi ispășită, nici prin jertfe, nici prin daruri de mâncare.\"","Samuel a rămas culcat până dimineața, apoi a deschis ușile Casei Domnului. Samuel s-a temut să istorisească lui Eli vedenia aceea.","Dar Eli a chemat pe Samuel și a zis: „Samuele, fiule!\" El a răspuns: „Iată-mă!\"","Și Eli a zis: „Care este cuvântul pe care ți l-a vorbit Domnul? Nu-mi ascunde nimic. Dumnezeu să Se poarte cu tine cu toată asprimea dacă-mi ascunzi ceva din tot ce ți-a spus!\"","Samuel i-a istorisit tot, fără să-i ascundă nimic. Și Eli a zis: „Domnul este Acesta, să facă ce va crede!\"","Samuel creștea, Domnul era cu el și n-a lăsat să cadă la pământ niciunul din cuvintele sale.","Tot Israelul, de la Dan până la Beer-Șeba, a cunoscut că Domnul pusese pe Samuel proroc al Domnului.","Domnul nu înceta să Se arate în Silo, căci Domnul Se descoperea lui Samuel, în Silo, prin Cuvântul Domnului."],"4":["Chemarea lui Samuel a ajuns la cunoștința întregului Israel. Israel a ieșit înaintea filistenilor ca să lupte împotriva lor. Au tăbărât lângă Eben-Ezer, și filistenii tăbărâseră la Afec.","Filistenii s-au așezat în linie de bătaie împotriva lui Israel și lupta a început. Israel a fost bătut de filisteni, care au omorât pe câmpul de bătaie aproape patru mii de oameni.","Poporul s-a întors în tabără și bătrânii lui Israel au zis: „Pentru ce ne-a lăsat Domnul să fim bătuți astăzi de filisteni? Haidem să luăm de la Silo chivotul legământului Domnului, ca să vină în mijlocul nostru și să ne izbăvească din mâna vrăjmașilor noștri.\"","Poporul a trimis la Silo, de unde au adus chivotul legământului Domnului oștirilor, care șade între heruvimi. Cei doi fii ai lui Eli, Hofni și Fineas, erau acolo, împreună cu chivotul legământului lui Dumnezeu.","Când a intrat chivotul legământului Domnului în tabără, tot Israelul a scos strigăte de bucurie de s-a cutremurat pământul.","Răsunetul acestor strigăte a fost auzit de filisteni și au zis: „Ce înseamnă strigătele acestea care răsună în tabăra evreilor?\" Și au auzit că sosise chivotul Domnului în tabără.","Filistenii s-au temut, pentru că au crezut că Dumnezeu venise în tabără. „Vai de noi, au zis ei, căci n-a fost așa ceva până acum!","Vai de noi! Cine ne va izbăvi din mâna acestor dumnezei puternici? Dumnezeii aceștia au lovit pe egipteni cu tot felul de urgii în pustie.","Întăriți-vă și fiți oameni, filistenilor, ca nu cumva să fiți robi evreilor, cum v-au fost ei robi vouă: fiți oameni și luptați!\"","Filistenii au început lupta, și Israel a fost bătut. Fiecare a fugit în cortul lui. Înfrângerea a fost foarte mare, și din Israel au căzut treizeci de mii de oameni pedeștri.","Chivotul lui Dumnezeu a fost luat, și cei doi fii ai lui Eli, Hofni și Fineas, au murit.","Un om din Beniamin a alergat din tabăra de bătaie și a venit la Silo în aceeași zi, cu hainele sfâșiate și cu capul acoperit cu țărână.","Când a ajuns, Eli aștepta stând pe un scaun lângă drum, căci inima îi era neliniștită pentru chivotul lui Dumnezeu. La intrarea lui în cetate, omul acesta a dat de veste, și toată cetatea a strigat.","Eli, auzind aceste strigăte, a zis: „Ce înseamnă zarva aceasta?\" Și îndată omul a venit și a adus lui Eli vestea aceasta.","Și Eli era în vârstă de nouăzeci și opt de ani, avea ochii întunecați și nu mai putea să vadă.","Omul a zis lui Eli: „Vin de pe câmpul de bătaie și din câmpul de bătaie am fugit astăzi.\" Eli a zis: „Ce s-a întâmplat, fiule?\"","Cel ce aducea vestea aceasta, ca răspuns, a zis: „Israel a fugit dinaintea filistenilor și poporul a suferit o mare înfrângere, și chiar cei doi fii ai tăi, Hofni și Fineas, au murit și chivotul Domnului a fost luat.\"","Abia a pomenit de chivotul lui Dumnezeu, și Eli a căzut de pe scaun pe spate, lângă poartă; și-a rupt ceafa și a murit, căci era om bătrân și greu. El fusese judecător în Israel patruzeci de ani.","Noră-sa, nevasta lui Fineas, era însărcinată și stătea să nască. Când a auzit vestea despre luarea chivotului lui Dumnezeu, despre moartea socrului ei și despre moartea bărbatului ei, s-a încovoiat și a născut, căci au apucat-o durerile nașterii.","Când trăgea să moară, femeile care erau lângă ea i-au zis: „Nu te teme, căci ai născut un fiu!\" Dar ea n-a răspuns și n-a luat seama la ce i se spunea.","A pus copilului numele I-Cabod (Nu mai e slavă), zicând: „S-a dus slava din Israel!\" Spunea lucrul acesta din pricina luării chivotului lui Dumnezeu și din pricina socrului și bărbatului ei.","Ea a zis: „S-a dus slava din Israel, căci chivotul lui Dumnezeu este luat.\""],"5":["Filistenii au luat chivotul lui Dumnezeu și l-au dus din Eben-Ezer la Asdod.","După ce au pus mâna pe chivotul lui Dumnezeu, filistenii l-au dus în casa lui Dagon (Zeul pește) și l-au așezat lângă Dagon.","A doua zi, asdodenii, care se sculaseră dis-de-dimineață, au găsit pe Dagon întins cu fața la pământ înaintea chivotului Domnului. Au luat pe Dagon și l-au pus înapoi la locul lui.","Și a doua zi, sculându-se dis-de-dimineață, au găsit pe Dagon întins cu fața la pământ înaintea chivotului Domnului; capul lui Dagon și cele două mâini ale lui erau tăiate pe prag și nu-i rămăsese decât trunchiul.","De aceea, până în ziua de azi, preoții lui Dagon și toți cei ce intră în casa lui Dagon, la Asdod, nu calcă pe prag.","Mâna Domnului a apăsat asupra celor din Asdod și i-a pustiit; i-a lovit cu bube la șezut, atât în Asdod, cât și în ținutul lui.","Când au văzut că așa stau lucrurile, oamenii din Asdod au zis: „Chivotul Dumnezeului lui Israel să nu rămână la noi, căci mâna Lui apasă asupra noastră și asupra lui Dagon, dumnezeul nostru.\"","Și au trimis și au adunat la ei pe toți domnitorii filistenilor și au zis: „Ce să facem cu chivotul Dumnezeului lui Israel?\" Domnitorii au răspuns: „Să se ducă la Gat chivotul Dumnezeului lui Israel.\" Și au adus acolo chivotul Dumnezeului lui Israel.","Dar, după ce a fost dus acolo, mâna Domnului a apăsat asupra cetății și a fost o mare groază; a lovit pe oamenii cetății de la mic până la mare și au avut o spuzeală de bube la șezut.","Atunci au trimis chivotul lui Dumnezeu la Ecron. Când a intrat chivotul lui Dumnezeu în Ecron, ecroniții au strigat: „Au adus la noi chivotul Dumnezeului lui Israel ca să ne omoare, pe noi și poporul nostru.\"","Și au trimis și au strâns pe toți domnitorii filistenilor și au zis: „Trimiteți înapoi chivotul Dumnezeului lui Israel; să se întoarcă la locul lui, ca să nu ne omoare, pe noi și poporul nostru.\" Căci în toată cetatea era o groază de moarte, și mâna lui Dumnezeu apăsa cu putere.","Oamenii care nu mureau erau loviți cu bube la șezut, și țipetele cetății se înălțau până la cer."],"6":["Chivotul Domnului a fost șapte luni în țara filistenilor.","Și filistenii au chemat pe preoți și pe ghicitori și au zis: „Ce să facem cu chivotul Domnului? Arătați-ne cum trebuie să-l trimitem înapoi la locul lui.\"","Ei au răspuns: „Dacă trimiteți înapoi chivotul Dumnezeului lui Israel, să nu-l trimiteți cu mâna goală, ci aduceți lui Dumnezeu o jertfă pentru vină; atunci vă veți vindeca și veți ști pentru ce nu s-a îndepărtat mâna Lui de peste voi.\"","Filistenii au zis: „Ce jertfă pentru vină să-I aducem?\" Ei au răspuns: „Cinci umflături de aur și cinci șoareci de aur, după numărul domnitorilor filistenilor, căci aceeași urgie a fost peste voi toți și peste domnitorii voștri.","Faceți niște chipuri după umflăturile voastre și niște chipuri după șoarecii voștri care pustiesc țara și dați slavă Dumnezeului lui Israel: poate că va înceta să-Și apese mâna peste voi, peste dumnezeii voștri și peste țara voastră.","Pentru ce să vă împietriți inima, cum și-au împietrit inima egiptenii și Faraon? Nu i-a pedepsit El și n-au lăsat ei atunci pe copiii lui Israel să plece?","Acum, faceți un car nou de tot și luați două vaci tinere, care dau țâță și care n-au tras la jug; înjugați vacile la car și mânați înapoi acasă vițeii lor care se țin după ele.","Să luați chivotul Domnului și să-l puneți în car; să puneți alături de el, într-o ladă, lucrurile de aur pe care le dați Domnului ca dar pentru vină, apoi să-l trimiteți, și va pleca.","Să-l urmăriți cu privirea și, dacă se va sui pe drumul hotarului său spre Bet-Șemeș, Domnul ne-a făcut acest mare rău; dacă nu, vom ști că nu mâna Lui ne-a lovit, ci lucrul acesta a venit peste noi din întâmplare.\"","Oamenii au făcut așa. Au luat două vaci care alăptau, le-au înjugat la car și le-au închis vițeii acasă.","Au pus în car chivotul Domnului și lada cu șoarecii de aur și chipurile umflăturilor lor.","Vacile au apucat drept pe drumul spre Bet-Șemeș; au ținut mereu același drum, mugind, și nu s-au abătut nici la dreapta, nici la stânga. Domnitorii filistenilor au mers după ele până la hotarul Bet-Șemeșului.","Locuitorii din Bet-Șemeș secerau grânele în vale: au ridicat ochii, au zărit chivotul și s-au bucurat când l-au văzut.","Carul a ajuns în câmpul lui Iosua din Bet-Șemeș și s-a oprit acolo. Acolo era o piatră mare. Au despicat lemnele carului, și vacile le-au adus ca ardere-de-tot Domnului.","Leviții au coborât chivotul Domnului și lada de lângă el, în care se aflau lucrurile de aur, și le-au pus pe toate pe piatra cea mare. Oamenii din Bet-Șemeș au adus Domnului în ziua aceea arderi-de-tot și jertfe.","Cei cinci domnitori ai filistenilor, după ce au văzut lucrul acesta, s-au întors la Ecron în aceeași zi.","Iată umflăturile de aur pe care le-au dat Domnului filistenii ca dar pentru vină: una pentru Asdod, una pentru Gaza, una pentru Ascalon, una pentru Gat, una pentru Ecron.","Erau și niște șoareci de aur, după numărul tuturor cetăților filistenilor, care erau ale celor cinci căpetenii, atât cetăți întărite, cât și cetăți fără ziduri. Lucrul acesta îl adeverește piatra cea mare pe care au pus chivotul Domnului și care este și astăzi în câmpul lui Iosua din Bet-Șemeș.","Domnul a lovit pe oamenii din Bet-Șemeș când s-au uitat în chivotul Domnului; a lovit (cincizeci de mii) șaptezeci de oameni din popor. Și poporul a plâns, pentru că Domnul îl lovise cu o mare urgie.","Oamenii din Bet-Șemeș au zis: „Cine poate sta înaintea Domnului, înaintea acestui Dumnezeu sfânt? Și la cine trebuie să se suie chivotul, dacă se depărtează de la noi?\"","Au trimis soli la locuitorii din Chiriat-Iearim ca să le spună: „Filistenii au adus înapoi chivotul Domnului; coborâți-vă și suiți-l la voi.\""],"7":["Locuitorii din Chiriat-Iearim au venit și au suit chivotul Domnului; l-au dus în casa lui Abinadab, pe deal, și au sfințit pe fiul său Eleazar ca să păzească chivotul Domnului.","Trecuse destulă vreme din ziua când fusese pus chivotul în Chiriat-Iearim. Trecuseră douăzeci de ani. Atunci, toată casa lui Israel a plâns după Domnul.","Samuel a zis întregii case a lui Israel: „Dacă din toată inima voastră vă întoarceți la Domnul, scoateți din mijlocul vostru dumnezeii străini și astarteele, îndreptați-vă inima spre Domnul și slujiți-I numai Lui, și El vă va izbăvi din mâna filistenilor.\"","Și copiii lui Israel au scos din mijlocul lor baalii și astarteele și au slujit numai Domnului.","Samuel a zis: „Strângeți pe tot Israelul la Mițpa, și eu mă voi ruga Domnului pentru voi.\"","Și s-au strâns la Mițpa. Au scos apă și au vărsat-o înaintea Domnului și au postit în ziua aceea, zicând: „Am păcătuit împotriva Domnului!\" Samuel judeca pe copiii lui Israel la Mițpa.","Filistenii au aflat că fiii lui Israel se adunaseră la Mițpa, și domnitorii filistenilor s-au suit împotriva lui Israel. La vestea aceasta, copiii lui Israel s-au temut de filisteni","și au zis lui Samuel: „Nu înceta să strigi pentru noi către Domnul Dumnezeul nostru, ca să ne scape din mâna filistenilor.\"","Samuel a luat un miel sugar și l-a adus întreg ca ardere-de-tot Domnului. A strigat către Domnul pentru Israel, și Domnul l-a ascultat.","Pe când aducea Samuel arderea-de-tot, filistenii s-au apropiat ca să bată pe Israel. Domnul a tunat în ziua aceea cu mare vuiet împotriva filistenilor și i-a pus pe fugă. Au fost bătuți dinaintea lui Israel.","Bărbații lui Israel au ieșit din Mițpa, au urmărit pe filisteni și i-au bătut până sub Bet-Car.","Samuel a luat o piatră pe care a pus-o între Mițpa și Șen și i-a pus numele Eben-Ezer (Piatră de ajutor), zicând: „Până aici Domnul ne-a ajutat.\"","Astfel au fost smeriți filistenii și n-au mai venit pe ținutul lui Israel. Mâna Domnului a fost împotriva filistenilor în tot timpul vieții lui Samuel.","Cetățile pe care le luaseră filistenii de la Israel s-au întors la Israel, de la Ecron până la Gat, cu ținutul lor; Israel le-a smuls din mâna filistenilor. Și a fost pace între Israel și amoriți.","Samuel a fost judecător în Israel în tot timpul vieții lui.","El se ducea în fiecare an de făcea înconjurul Betelului, Ghilgalului și Mițpei și judeca pe Israel în toate locurile acestea.","Apoi se întorcea la Rama, unde era casa lui, și acolo judeca pe Israel. Și a zidit acolo un altar Domnului."],"8":["Când a îmbătrânit, Samuel a pus pe fiii săi judecători peste Israel.","Fiul său întâi născut se numea Ioel și al doilea, Abia; ei erau judecători la Beer-Șeba.","Fiii lui Samuel n-au călcat pe urmele lui, ci se dădeau la lăcomie, luau mită și călcau dreptatea.","Toți bătrânii lui Israel s-au strâns și au venit la Samuel, la Rama.","Ei au zis: „Iată că tu ești bătrân și copiii tăi nu calcă pe urmele tale; acum pune un împărat peste noi să ne judece, cum au toate neamurile.\"","Samuel n-a văzut cu plăcere faptul că ziceau: „Dă-ne un împărat ca să ne judece.\" Și Samuel s-a rugat Domnului.","Domnul a zis lui Samuel: „Ascultă glasul poporului în tot ce-ți va spune, căci nu pe tine te leapădă, ci pe Mine mă leapădă, ca să nu mai domnesc peste ei.","Ei se poartă cu tine cum s-au purtat totdeauna, de când i-am scos din Egipt până în ziua de astăzi; M-au părăsit și au slujit altor dumnezei.","Ascultă-le glasul deci, dar înștiințează-i și fă-le cunoscut dreptul împăratului care va domni peste ei.\"","Samuel a spus toate cuvintele Domnului poporului care-i cerea un împărat.","El a zis: „Iată care va fi dreptul împăratului care va domni peste voi. El va lua pe fiii voștri, îi va pune la carele sale și între călăreții lui, ca să alerge înaintea carului lui;","îi va pune căpetenii peste o mie și căpetenii peste cincizeci și-i va întrebuința la aratul pământurilor lui, la seceratul bucatelor lui, la facerea armelor lui de război și a uneltelor carelor lui.","Va lua pe fetele voastre să-i facă miresme, de mâncare și pâine.","Va lua cea mai bună parte din câmpiile voastre, din viile voastre și din măslinii voștri și o va da slujitorilor lui.","Va lua zeciuială din rodul semințelor și viilor voastre și o va da famenilor și slujitorilor lui.","Va lua pe robii și roabele voastre, cei mai buni boi și măgari ai voștri și-i va întrebuința la lucrările lui.","Va lua zeciuială din oile voastre și voi înșivă veți fi slugile lui.","Și atunci veți striga împotriva împăratului vostru pe care-l veți alege, dar Domnul nu vă va asculta.\"","Poporul n-a vrut să asculte glasul lui Samuel. „Nu, au zis ei, ci să fie un împărat peste noi,","ca să fim și noi ca toate neamurile; împăratul nostru ne va judeca, va merge în fruntea noastră și ne va cârmui în războaiele noastre.\"","Samuel, după ce a auzit toate cuvintele poporului, le-a spus în auzul Domnului.","Și Domnul a zis lui Samuel: „Ascultă-le glasul și pune un împărat peste ei.\" Și Samuel a zis bărbaților lui Israel: „Duceți-vă fiecare în cetatea lui.\""],"9":["Era un om din Beniamin, numit Chis, fiul lui Abiel, fiul lui Țeror, fiul lui Becorat, fiul lui Afiah, fiul unui beniamit, un om tare și voinic.","El avea un fiu cu numele Saul, tânăr și frumos, mai frumos decât oricare din copiii lui Israel. Și-i întrecea pe toți în înălțime de la umăr în sus.","Măgărițele lui Chis, tatăl lui Saul, s-au rătăcit, și Chis a zis fiului său Saul: „Ia cu tine o slugă, scoală-te și du-te de caută măgărițele.\"","Saul a trecut prin muntele lui Efraim și a străbătut țara Șalișa fără să le găsească; au trecut prin țara Șaalim, și nu erau acolo; au străbătut țara lui Beniamin, și nu le-au găsit.","Ajunseseră în țara Țuf, când Saul a zis slugii care îl însoțea: „Haide să ne întoarcem, ca nu cumva tatăl meu, lăsând măgărițele, să fie îngrijorat de noi.\"","Sluga i-a zis: „Iată că în cetatea aceasta este un om al lui Dumnezeu, un om cu vază; tot ce spune el nu se poate să nu se întâmple. Haidem la el dar; poate că ne va arăta drumul pe care trebuie să apucăm.\"","Saul a zis slugii sale: „Dar dacă mergem acolo, ce să aducem omului lui Dumnezeu? Căci nu mai avem merinde în saci și n-avem niciun dar de adus omului lui Dumnezeu. Ce avem?\"","Sluga a luat din nou cuvântul și a zis lui Saul: „Uite, eu am la mine un sfert de siclu de argint; îl voi da omului lui Dumnezeu și ne va arăta drumul.\"","Odinioară, în Israel, când se ducea cineva să întrebe pe Dumnezeu, zicea: „Haidem să mergem la văzător!\" Căci acela care se numește azi proroc se numea odinioară văzător.","Saul a zis slugii: „Ai dreptate; haidem să mergem!\" Și s-au dus în cetatea unde era omul lui Dumnezeu.","Pe când se suiau ei spre cetate, au întâlnit niște fete care ieșiseră să scoată apă și le-au zis: „Aici este văzătorul?\"","Ele le-au răspuns: „Da, iată-l înaintea ta; dar du-te repede, astăzi a venit în cetate, pentru că poporul aduce jertfă pe înălțime.","Când veți intra în cetate, îl veți găsi înainte ca să se suie la locul înalt să mănânce, căci poporul nu mănâncă până nu vine el, fiindcă el trebuie să binecuvânteze jertfa; după aceea, mănâncă și cei poftiți. Suiți-vă dar, căci acum îl veți găsi.\"","Și s-au suit în cetate. Tocmai când intrau pe poarta cetății, au fost întâlniți de Samuel, care ieșea să se suie pe înălțime.","Dar, cu o zi mai înainte de venirea lui Saul, Domnul înștiințase pe Samuel și-i zisese:","„Mâine, la ceasul acesta, îți voi trimite un om din țara lui Beniamin și să-l ungi drept căpetenie a poporului Meu Israel. El va scăpa poporul Meu din mâna filistenilor, căci am căutat cu îndurare spre poporul Meu, pentru că strigătul lui a ajuns până la Mine.\"","Când a zărit Samuel pe Saul, Domnul i-a zis: „Iată omul despre care ți-am vorbit; el va domni peste poporul Meu.\"","Saul s-a apropiat de Samuel la mijlocul porții și a zis: „Arată-mi, te rog, unde este casa văzătorului.\"","Samuel a răspuns lui Saul: „Eu sunt văzătorul. Suie-te înaintea mea pe înălțime, și veți mânca astăzi cu mine. Mâine te voi lăsa să pleci și-ți voi spune tot ce se petrece în inima ta.","Nu te neliniști de măgărițele pe care le-ai pierdut acum trei zile, căci s-au găsit. Și pentru cine este păstrat tot ce este mai de preț în Israel? Oare nu pentru tine și pentru toată casa tatălui tău?\"","Saul a răspuns: „Oare nu sunt eu beniamit, din una din cele mai mici seminții ale lui Israel? Și familia mea nu este cea mai mică dintre toate familiile din seminția lui Beniamin? Pentru ce dar îmi vorbești astfel?\"","Samuel a luat pe Saul și pe sluga lui, i-a vârât în odaia de mâncare, le-a dat locul cel dintâi între cei poftiți, care erau aproape treizeci de inși.","Samuel a zis bucătarului: „Adu porția pe care ți-am dat-o când ți-am zis: ‘Pune-o deoparte.’\"","Bucătarul a dat spata și ce era pe ea și a pus-o înaintea lui Saul. Și Samuel a zis: „Iată ce a fost păstrat, pune-o înainte și mănâncă, fiindcă pentru tine s-a păstrat când am poftit poporul.\" Astfel, Saul a mâncat cu Samuel în ziua aceea.","S-au coborât apoi de pe înălțime în cetate, și Samuel a stat de vorbă cu Saul pe acoperișul casei.","Apoi s-au sculat dis-de-dimineață, și, în revărsatul zorilor, Samuel a chemat pe Saul de pe acoperiș și a zis: „Scoală-te, și te voi însoți.\" Saul s-a sculat și au ieșit amândoi, el și Samuel.","Când s-au coborât la marginea cetății, Samuel a zis lui Saul: „Spune slugii tale să treacă înaintea noastră.\" Și sluga a trecut înainte. „Oprește-te acum\", a zis iarăși Samuel, „și-ți voi face cunoscut cuvântul lui Dumnezeu.\""],"10":["Samuel a luat sticluța cu untdelemn și a turnat-o pe capul lui Saul. Apoi l-a sărutat și a zis: „Nu te-a uns Domnul ca să fii căpetenia moștenirii Lui?","Astăzi, după ce mă vei părăsi, vei găsi doi oameni la mormântul Rahelei, în hotarul lui Beniamin, la Țelțah. Ei îți vor zice: ‘Măgărițele pe care te-ai dus să le cauți s-au găsit, și iată că tatăl tău nu se mai gândește la măgărițe, ci este îngrijorat de voi și zice: «Ce să fac pentru fiul meu?»’","De acolo vei merge mai departe și vei ajunge la stejarul din Tabor, unde vei fi întâmpinat de trei oameni suindu-se la Dumnezeu, în Betel, și ducând unul trei iezi, altul trei turte de pâine, iar altul un burduf cu vin.","Ei te vor întreba de sănătate și-ți vor da două pâini, pe care le vei lua din mâna lor.","După aceea, vei ajunge la Ghibea Elohim, unde se află garnizoana filistenilor. Când vei intra în cetate, vei întâlni o ceată de proroci coborându-se de pe înălțimea pentru jertfă, cu lăute, timpane, fluiere și cobze înainte, și prorocind.","Duhul Domnului va veni peste tine, vei proroci cu ei și vei fi prefăcut într-alt om.","Când ți se vor împlini semnele acestea, fă ce vei găsi de făcut, căci Dumnezeu este cu tine.","Apoi să te cobori înaintea mea la Ghilgal, și eu mă voi coborî la tine ca să aduc arderi-de-tot și jertfe de mulțumire. Să mă aștepți șapte zile acolo, până voi ajunge eu la tine și-ți voi spune ce ai să faci.\"","De îndată ce Saul a întors spatele ca să se despartă de Samuel, Dumnezeu i-a dat o altă inimă, și toate semnele acestea s-au împlinit în aceeași zi.","Când au ajuns la Ghibea, iată că i-a ieșit înainte o ceată de proroci. Duhul lui Dumnezeu a venit peste el și el a prorocit în mijlocul lor.","Toți cei ce-l cunoscuseră mai înainte au văzut că prorocea împreună cu prorocii și își ziceau unul altuia în popor: „Ce s-a întâmplat cu fiul lui Chis? Oare și Saul este între proroci?\"","Cineva din Ghibea a răspuns: „Și cine este tatăl lor?\" De acolo zicala: „Oare și Saul este între proroci?\"","Când a sfârșit de prorocit, s-a dus pe înălțime.","Unchiul lui Saul a zis lui Saul și slugii lui: „Unde v-ați dus?\" Saul a răspuns: „Să căutăm măgărițele, dar, când am văzut că nu le găsim, ne-am dus la Samuel.\"","Unchiul lui Saul a zis din nou: „Istorisește-mi dar ce v-a spus Samuel.\"","Și Saul a răspuns unchiului său: „Ne-a spus că măgărițele s-au găsit.\" Și nu i-a spus nimic despre împărăția despre care vorbise Samuel.","Samuel a chemat poporul înaintea Domnului la Mițpa","și a zis copiilor lui Israel: „Așa vorbește Domnul Dumnezeul lui Israel: ‘Eu am scos din Egipt pe Israel și v-am izbăvit din mâna egiptenilor și din mâna tuturor împărățiilor care vă apăsau.","Și astăzi, voi lepădați pe Dumnezeul vostru, care v-a izbăvit din toate relele și din toate suferințele voastre, și-I ziceți: «Pune un împărat peste noi!» Înfățișați-vă acum înaintea Domnului, după semințiile voastre și după miile voastre.’\"","Samuel a apropiat toate semințiile lui Israel și a ieșit la sorți seminția lui Beniamin.","A apropiat seminția lui Beniamin pe familii și a ieșit la sorți familia lui Matri. Apoi a ieșit la sorți Saul, fiul lui Chis. L-au căutat, dar nu l-au găsit.","Au întrebat din nou pe Domnul: „A venit oare omul acesta aici?\" Și Domnul a zis: „Iată că este ascuns între vase.\"","Au alergat și l-au scos de acolo, și el s-a înfățișat în mijlocul poporului. Îi întrecea pe toți în înălțime, de la umăr în sus.","Samuel a zis întregului popor: „Vedeți pe cel pe care l-a ales Domnul? Nu este nimeni în tot poporul care să fie ca el.\" Și tot poporul a strigat: „Trăiască împăratul!\"","Samuel a făcut cunoscut poporului dreptul împărăției și l-a scris într-o carte, pe care a pus-o înaintea Domnului. Apoi a dat drumul întregului popor, trimițând pe fiecare acasă.","Și Saul s-a dus acasă, în Ghibea, însoțit de o parte din ostași, a căror inimă o mișcase Dumnezeu.","S-au găsit însă și oameni răi, care ziceau: „Ce ne poate ajuta acesta?\" Și l-au disprețuit și nu i-au adus niciun dar. Dar Saul s-a făcut că nu-i aude."],"11":["Nahaș, Amonitul, a venit și a împresurat Iabesul din Galaad. Toți locuitorii din Iabes au zis lui Nahaș: „Fă legământ cu noi, și-ți vom fi supuși.\"","Dar Nahaș, Amonitul, le-a răspuns: „Voi face legământ cu voi dacă mă lăsați să vă scot la toți ochiul drept și să arunc astfel o ocară asupra întregului Israel.\"","Bătrânii din Iabes i-au zis: „Dă-ne un răgaz de șapte zile ca să trimitem soli în tot ținutul lui Israel; și dacă nu va fi nimeni să ne ajute, ne vom supune ție.\"","Solii au ajuns la Ghibea, cetatea lui Saul, și au spus aceste lucruri în auzul poporului. Și tot poporul a ridicat glasul și a plâns.","Saul tocmai se întorcea de la câmp, în urma boilor, și a întrebat: „Ce are poporul de plânge?\" I-au istorisit ce spuseseră cei din Iabes.","Cum a auzit Saul aceste lucruri, Duhul lui Dumnezeu a venit peste el și s-a mâniat foarte tare.","A luat o pereche de boi, i-a tăiat în bucăți și le-a trimis prin soli în tot ținutul lui Israel, zicând: „Oricine nu va merge după Saul și Samuel își va vedea boii tăiați la fel.\" Groaza Domnului a apucat pe popor, care a pornit ca un singur om.","Saul le-a făcut numărătoarea la Bezec; copiii lui Israel erau trei sute de mii și bărbații lui Iuda, treizeci de mii.","Ei au zis solilor care veniseră: „Așa să vorbiți locuitorilor Iabesului din Galaad: ‘Mâine, când va dogori soarele, veți avea ajutor.’\" Solii au dus vestea aceasta celor din Iabes, care s-au umplut de bucurie","și au zis amoniților: „Mâine ne vom supune vouă și ne veți face ce vă va plăcea.\"","A doua zi, Saul a împărțit poporul în trei cete. Au pătruns în tabăra amoniților în straja dimineții și i-au bătut până la căldura zilei. Cei ce au scăpat au fost risipiți și n-au mai rămas doi laolaltă dintre ei.","Poporul a zis lui Samuel: „Cine zicea: ‘Saul să domnească peste noi?’ Dați încoace pe oamenii aceia, ca să-i omorâm.\"","Dar Saul a zis: „Nimeni nu va fi omorât în ziua aceasta, căci astăzi Domnul a dat o izbăvire lui Israel.\"","Și Samuel a zis poporului: „Veniți și să mergem la Ghilgal, ca să întărim acolo împărăția.\"","Tot poporul s-a dus la Ghilgal și au pus pe Saul împărat, înaintea Domnului, la Ghilgal. Acolo, au adus jertfe de mulțumire înaintea Domnului și Saul și toți oamenii lui Israel s-au veselit foarte mult acolo."],"12":["Samuel a zis întregului Israel: „Iată că v-am ascultat glasul în tot ce mi-ați zis și am pus un împărat peste voi.","De acum, iată împăratul care va merge înaintea voastră. Cât despre mine, eu sunt bătrân, am albit, așa că fiii mei sunt cu voi; am umblat înaintea voastră din tinerețe până în ziua de azi.","Iată-mă! Mărturisiți împotriva mea în fața Domnului și în fața unsului Lui: Cui i-am luat boul sau cui i-am luat măgarul? Pe cine am apăsat și pe cine am năpăstuit? De la cine am luat mită ca să închid ochii asupra lui? Mărturisiți, și vă voi da înapoi.\"","Ei au răspuns: „Nu ne-ai apăsat, nu ne-ai năpăstuit și nici n-ai primit nimic din mâna nimănui.\"","El le-a mai zis: „Domnul este martor împotriva voastră și unsul Lui este martor în ziua aceasta că n-ați găsit nimic în mâinile mele.\" Și ei au răspuns: „Sunt martori!\"","Atunci, Samuel a zis poporului: „Domnul a pus pe Moise și pe Aaron și a scos pe părinții voștri din Egipt.","Acum, înfățișați-vă ca să vă judec înaintea Domnului pentru toate binefacerile pe care vi le-a făcut Domnul, vouă și părinților voștri.","După ce a venit Iacov în Egipt, părinții voștri au strigat către Domnul, și Domnul a trimis pe Moise și pe Aaron, care au scos pe părinții voștri din Egipt și i-au adus să locuiască în locul acesta.","Dar ei au uitat pe Domnul Dumnezeul lor, și El i-a vândut în mâinile lui Sisera, căpetenia oștirii Hațorului, în mâinile filistenilor și în mâinile împăratului Moabului, care au început lupta împotriva lor.","Au strigat iarăși către Domnul și au zis: ‘Am păcătuit, căci am părăsit pe Domnul și am slujit baalilor și astarteelor; izbăvește-ne acum din mâna vrăjmașilor noștri și-Ți vom sluji.’","Și Domnul a trimis pe Ierubaal și pe Barac, și pe Iefta, și pe Samuel și v-a izbăvit din mâna vrăjmașilor voștri care vă înconjurau și ați locuit în liniște.","Apoi, când ați văzut că Nahaș, împăratul fiilor lui Amon, mergea împotriva voastră, mi-ați zis: ‘Nu, ci un împărat să domnească peste noi.’ Și totuși Domnul Dumnezeul vostru era Împăratul vostru.","Iată dar împăratul pe care l-ați ales și pe care l-ați cerut; iată că Domnul a pus un împărat peste voi.","Dacă vă veți teme de Domnul, dacă-I veți sluji, dacă veți asculta de glasul Lui și dacă nu vă veți împotrivi Cuvântului Domnului, vă veți alipi de Domnul Dumnezeul vostru atât voi, cât și împăratul care domnește peste voi.","Dar, dacă nu veți asculta de glasul Domnului și vă veți împotrivi Cuvântului Domnului, mâna Domnului va fi împotriva voastră, cum a fost împotriva părinților voștri.","Acum mai așteptați aici, ca să vedeți minunea pe care o va face Domnul sub ochii voștri.","Nu suntem noi la seceratul grânelor? Voi striga către Domnul și va trimite tunete și ploaie. Să știți atunci și să vedeți cât de rău ați făcut înaintea Domnului când ați cerut un împărat pentru voi.\"","Samuel a strigat către Domnul, și Domnul a trimis chiar în ziua aceea tunete și ploaie. Tot poporul a avut o mare frică de Domnul și de Samuel.","Și tot poporul a zis lui Samuel: „Roagă-te Domnului Dumnezeului tău pentru robii tăi, ca să nu murim, căci, la toate păcatele noastre, am mai adăugat și pe acela de a cere un împărat pentru noi.\"","Samuel a zis poporului: „Nu vă temeți! Ați făcut tot răul acesta, dar nu vă abateți de la Domnul și slujiți Domnului din toată inima voastră.","Nu vă abateți de la El, altfel ați merge după lucruri de nimic, care n-aduc nici folos, nici izbăvire, pentru că sunt lucruri de nimic.","Domnul nu va părăsi pe poporul Lui din pricina Numelui Lui celui mare, căci Domnul a hotărât să facă din voi poporul Lui.","Departe iarăși de mine să păcătuiesc împotriva Domnului încetând să mă rog pentru voi! Vă voi învăța calea cea bună și cea dreaptă.","Temeți-vă numai de Domnul și slujiți-I cu credincioșie, din toată inima voastră, căci vedeți ce putere desfășoară El printre voi.","Dar, dacă veți face răul, veți pieri, voi și împăratul vostru.\""],"13":["Saul era în vârstă de treizeci de ani când a ajuns împărat și a domnit doi ani peste Israel.","Saul și-a ales trei mii de bărbați din Israel: două mii erau cu el la Micmaș și pe muntele Betel, iar o mie erau cu Ionatan la Ghibea lui Beniamin. Pe ceilalți din popor i-a trimis pe fiecare la cortul lui.","Ionatan a bătut tabăra filistenilor care era la Gheba, și filistenii au auzit lucrul acesta. Saul a pus să sune cu trâmbița prin toată țara, zicând: „Să audă evreii lucrul acesta!\"","Tot Israelul a auzit zicându-se: „Saul a bătut tabăra filistenilor și Israel s-a făcut urât filistenilor.\" Și poporul a fost adunat la Saul, în Ghilgal.","Filistenii s-au strâns să lupte cu Israel. Aveau o mie de care și șase mii de călăreți; și poporul acesta era fără număr: ca nisipul de pe țărmul mării. Au venit și au tăbărât la Micmaș, la răsărit de Bet-Aven.","Bărbații lui Israel s-au văzut la strâmtoare, căci erau strânși de aproape, și s-au ascuns în peșteri, în tufișuri, în stânci, în turnuri și în gropile pentru apă.","Unii evrei au trecut Iordanul, ca să se ducă în țara lui Gad și Galaad. Saul era tot la Ghilgal, și tot poporul de lângă el tremura.","A așteptat șapte zile, după timpul hotărât de Samuel. Dar Samuel nu venea la Ghilgal, și poporul se împrăștia de lângă Saul.","Atunci, Saul a zis: „Aduceți-mi arderea-de-tot și jertfele de mulțumire.\" Și a jertfit arderea-de-tot.","Pe când sfârșea de adus arderea-de-tot, a venit Samuel, și Saul i-a ieșit înainte să-i ureze de bine.","Samuel a zis: „Ce-ai făcut?\" Saul a răspuns: „Când am văzut că poporul se împrăștie de lângă mine, că nu vii la timpul hotărât și că filistenii sunt strânși la Micmaș,","mi-am zis: ‘Filistenii se vor coborî împotriva mea la Ghilgal, și eu nu m-am rugat Domnului!’ Atunci am îndrăznit și am adus arderea-de-tot.\"","Samuel a zis lui Saul: „Ai lucrat ca un nebun și n-ai păzit porunca pe care ți-o dăduse Domnul Dumnezeul tău. Domnul ar fi întărit pe vecie domnia ta peste Israel;","dar, acum, domnia ta nu va dăinui. Domnul Și-a ales un om după inima Lui și Domnul l-a rânduit să fie căpetenia poporului Său, pentru că n-ai păzit ce-ți poruncise Domnul.\"","Apoi, Samuel s-a sculat și s-a suit din Ghilgal la Ghibea lui Beniamin. Saul a făcut numărătoarea poporului care se afla cu el: erau aproape șase sute de oameni.","Saul, fiul său Ionatan și poporul care se afla cu ei se așezaseră la Gheba lui Beniamin, și filistenii tăbărau la Micmaș.","Din tabăra filistenilor au ieșit trei cete ca să pustiască: una a luat drumul spre Ofra, spre țara Șual,","alta a luat drumul spre Bet-Horon și a treia a luat drumul spre hotarul care caută spre valea Țeboim, înspre pustie.","În toată țara lui Israel nu se găsea niciun fierar, căci filistenii ziseseră: „Să împiedicăm pe evrei să-și facă săbii sau sulițe.\"","Și fiecare om din Israel se cobora la filisteni ca să-și ascută fierul plugului, coasa, securea și sapa,","când se toceau sapa, coasa, furca cu trei coarne și securea, și ca să facă vârf țepușului cu care mâna boii.","Și așa s-a întâmplat că, în ziua luptei, nu era nici sabie, nici suliță în mâinile întregului popor care era cu Saul și Ionatan: nu aveau decât Saul și fiul său Ionatan.","O ceată de filisteni a venit și s-a așezat la trecătoarea Micmașului."],"14":["Într-o zi, Ionatan, fiul lui Saul, a zis tânărului care-i purta armele: „Vino și să pătrundem până la straja filistenilor, care este dincolo de locul acesta.\" Și n-a spus nimic tatălui său.","Saul stătea la marginea cetății Ghibea, sub rodiul din Migron, și poporul care era cu el era aproape șase sute de oameni.","Ahia, fiul lui Ahitub, fratele lui I-Cabod, fiul lui Fineas, fiul lui Eli, preotul Domnului la Silo, purta efodul. Poporul nu știa că Ionatan s-a dus.","Între trecătorile prin care căuta Ionatan să ajungă la straja filistenilor, era un pisc de stâncă de o parte și un pisc de stâncă de cealaltă parte; unul purta numele Boțeț și celălalt, Sene.","Unul din aceste piscuri este la miazănoapte, față în față cu Micmaș, și celălalt la miazăzi, față în față cu Gheba.","Ionatan a zis tânărului care-i purta armele: „Vino și să pătrundem până la straja acestor netăiați împrejur. Poate că Domnul va lucra pentru noi, căci nimic nu împiedică pe Domnul să dea izbăvire printr-un mic număr ca și printr-un mare număr.\"","Cel ce-i ducea armele i-a răspuns: „Fă tot ce ai în inimă, n-asculta decât de simțământul tău și iată-mă cu tine, gata să te urmez oriunde.\"","„Ei bine, a zis Ionatan, haidem la oamenii aceștia și să ne arătăm lor!","Dacă ne vor zice: ‘Opriți-vă până vom veni noi la voi!’, vom rămâne pe loc și nu ne vom sui la ei.","Dar, dacă vor zice: ‘Suiți-vă la noi!’, ne vom sui, căci Domnul îi dă în mâinile noastre. Acesta să ne fie semnul.\"","S-au arătat amândoi străjii filistenilor, și filistenii au zis: „Iată că evreii ies din găurile în care s-au ascuns.\"","Și oamenii care erau de strajă au vorbit astfel lui Ionatan și celui ce-i ducea armele: „Suiți-vă la noi, ca să vă arătăm ceva.\" Ionatan a zis celui ce-i ducea armele: „Suie-te după mine, căci Domnul îi dă în mâinile lui Israel.\"","Și Ionatan s-a suit ajutându-se cu mâinile și picioarele, și cel ce-i ducea armele a mers după el. Filistenii au căzut înaintea lui Ionatan, și cel ce-i ducea armele arunca moartea în urma lui.","În această primă înfrângere, Ionatan și cel ce-i ducea armele au ucis douăzeci de oameni, pe întindere de aproape o jumătate de pogon de pământ.","A intrat groaza în tabără, în țară și în tot poporul; straja și chiar și prădătorii s-au înspăimântat; țara s-a îngrozit. Era groaza lui Dumnezeu.","Străjerii lui Saul, care erau la Ghibea lui Beniamin, au văzut că mulțimea se împrăștie și fuge în toate părțile.","Atunci, Saul a zis poporului care era cu el: „Numărați, vă rog, și vedeți cine a plecat din mijlocul nostru.\" Au numărat, și iată că lipseau Ionatan și cel ce-i purta armele.","Și Saul a zis lui Ahia: „Adu încoace chivotul lui Dumnezeu!\" (Căci pe vremea aceea chivotul lui Dumnezeu era cu copiii lui Israel.)","Pe când vorbea Saul cu preotul, zarva în tabăra filistenilor se făcea tot mai mare, și Saul a zis preotului: „Trage-ți mâna!\"","Apoi Saul și tot poporul care era cu el s-au strâns și au înaintat până la locul luptei, și filistenii au întors sabia unii împotriva altora și învălmășeala era nespus de mare.","Evreii care erau mai dinainte la filisteni și care se suiseră cu ei în tabără de pe unde erau împrăștiați s-au unit cu israeliții care erau cu Saul și Ionatan.","Toți bărbații lui Israel care se ascunseseră în muntele lui Efraim, aflând că filistenii fugeau, au început să-i urmărească și ei în bătaie.","Domnul a izbăvit pe Israel în ziua aceea, și lupta s-a întins până dincolo de Bet-Aven.","Ziua aceea a fost obositoare pentru bărbații lui Israel. Saul pusese pe popor să jure zicând: „Blestemat să fie omul care va mânca pâine până seara, până mă voi răzbuna pe vrăjmașii mei!\" Și nimeni nu mâncase.","Tot poporul ajunsese într-o pădure, unde se găsea miere pe fața pământului.","Când a intrat poporul în pădure, a văzut mierea curgând, dar niciunul n-a dus miere la gură, căci poporul ținea jurământul.","Ionatan nu știa de jurământul pe care pusese tatăl său pe popor să-l facă; a întins vârful toiagului pe care-l avea în mână, l-a vârât într-un fagure de miere și a dus mâna la gură, și ochii i s-au luminat.","Atunci, cineva din popor, vorbindu-i, i-a zis: „Tatăl tău a pus pe popor să jure zicând: ‘Blestemat să fie omul care va mânca astăzi!’\" Și poporul era sleit de puteri.","Și Ionatan a zis: „Tatăl meu tulbură poporul; vedeți dar cum mi s-au luminat ochii pentru că am gustat puțin din mierea aceasta!","Negreșit, dacă poporul ar fi mâncat azi din prada pe care a găsit-o la vrăjmașii lui, n-ar fi fost înfrângerea filistenilor mai mare?\"","În ziua aceea au bătut pe filisteni de la Micmaș până la Aialon. Poporul era foarte obosit","și s-a aruncat asupra prăzii. A luat oi, boi și viței, i-a înjunghiat pe pământ și i-a mâncat cu sânge cu tot.","Au spus lucrul acesta lui Saul și i-au zis: „Iată că poporul păcătuiește împotriva Domnului, mâncând cu sânge.\" Saul a zis: „Voi faceți o nelegiuire. Rostogoliți îndată o piatră mare încoace.\"","Apoi a adăugat: „Împrăștiați-vă printre popor și spuneți fiecăruia să-și aducă boul sau oaia și să-l înjunghie aici. Apoi să mâncați și nu păcătuiți împotriva Domnului, mâncând cu sânge.\" Și peste noapte, fiecare din popor și-a adus boul cu mâna, ca să-l înjunghie pe piatră.","Saul a zidit un altar Domnului: acesta a fost cel dintâi altar pe care l-a zidit Domnului.","Saul a zis: „Să ne coborâm în noaptea aceasta după filisteni, să-i jefuim până la lumina zilei și să nu lăsăm să rămână unul măcar.\" Ei au zis: „Fă tot ce vei crede.\" Atunci, preotul a zis: „Să ne apropiem aici de Dumnezeu.\"","Și Saul a întrebat pe Dumnezeu: „Să mă cobor după filisteni? Îi vei da în mâinile lui Israel?\" Dar în clipa aceea nu i-a dat niciun răspuns.","Saul a zis: „Apropiați-vă aici toate căpeteniile poporului; căutați și vedeți de cine și cum a fost săvârșit păcatul acesta astăzi.","Căci, viu este Domnul, Izbăvitorul lui Israel, chiar dacă l-ar fi săvârșit fiul meu Ionatan, va muri.\" Și nimeni din tot poporul nu i-a răspuns.","Atunci a zis întregului Israel: „Așezați-vă voi deoparte, și eu și fiul meu Ionatan vom sta de cealaltă.\" Și poporul a zis lui Saul: „Fă ce vei crede.\"","Saul a zis Domnului: „Dumnezeul lui Israel, arată adevărul!\" Sorțul a căzut pe Ionatan și pe Saul, și poporul a scăpat.","Saul a zis: „Aruncați sorțul între mine și fiul meu Ionatan.\" Și sorțul a căzut pe Ionatan.","Saul a zis lui Ionatan: „Spune-mi ce-ai făcut.\" Ionatan i-a spus și a zis: „Am gustat puțină miere cu vârful toiagului pe care-l aveam în mână: iată-mă, voi muri.\"","Și Saul a zis: „Dumnezeu să Se poarte cu toată asprimea față de mine dacă nu vei muri, Ionatane!\"","Poporul a zis lui Saul: „Ce! Să moară Ionatan, el care a făcut această mare izbăvire în Israel? Niciodată! Viu este Domnul că un păr din capul lui nu va cădea la pământ, căci cu Dumnezeu a lucrat el în ziua aceasta.\" Astfel, poporul a scăpat pe Ionatan de la moarte.","Saul a încetat să mai urmărească pe filisteni, și filistenii s-au dus acasă.","După ce a luat Saul domnia peste Israel, a făcut război în toate părțile cu toți vrăjmașii lui: cu Moab, cu copiii lui Amon, cu Edom, cu împărații din Țoba și cu filistenii și, oriîncotro se întorcea, era biruitor.","S-a arătat viteaz, a bătut pe Amalec și a scăpat pe Israel din mâna celor ce-l jefuiau.","Fiii lui Saul au fost: Ionatan, Ișvi și Malchișua. Cele două fete ale lui se numeau: cea mai mare Merab, iar cea mai mică Mical.","Numele nevestei lui Saul era Ahinoam, fata lui Ahimaaț. Numele căpeteniei oștirii lui era Abner, fiul lui Ner, unchiul lui Saul.","Chis, tatăl lui Saul, și Ner, tatăl lui Abner, erau fiii lui Abiel.","În tot timpul vieții lui Saul a fost un război înverșunat împotriva filistenilor, și, de îndată ce Saul zărea vreun om tare și voinic, îl lua cu el."],"15":["Samuel a zis lui Saul: „Pe mine m-a trimis Domnul să te ung împărat peste poporul Lui, peste Israel. Ascultă dar ce zice Domnul.","Așa vorbește Domnul oștirilor: ‘Mi-aduc aminte de ceea ce a făcut Amalec lui Israel, când i-a astupat drumul la ieșirea lui din Egipt.","Du-te acum, bate pe Amalec și nimicește cu desăvârșire tot ce-i al lui; să nu-i cruți și să omori bărbații și femeile, copiii și pruncii, cămilele și măgarii, boii și oile.’\"","Saul a adunat poporul și l-a numărat la Telaim: erau două sute de mii de oameni pedeștri și zece mii de oameni din Iuda.","Saul a mers până la cetatea lui Amalec și a pus niște oameni la pândă în vale.","Și a zis cheniților: „Duceți-vă, plecați și ieșiți din mijlocul lui Amalec, ca să nu vă prăpădesc împreună cu el, căci voi v-ați purtat cu bunăvoință față de copiii lui Israel când s-au suit din Egipt.\" Și cheniții au plecat din mijlocul lui Amalec.","Saul a bătut pe Amalec de la Havila până la Șur, care este în fața Egiptului.","A prins viu pe Agag, împăratul lui Amalec, și a nimicit cu desăvârșire tot poporul, trecându-l prin ascuțișul sabiei.","Dar Saul și poporul au cruțat pe Agag și oile cele mai bune, boii cei mai buni, vitele grase, mieii grași și tot ce era mai bun; n-a vrut să le nimicească cu desăvârșire și au nimicit numai tot ce era prost și nebăgat în seamă.","Domnul a vorbit lui Samuel și i-a zis:","„Îmi pare rău că am pus pe Saul împărat, căci se abate de la Mine și nu păzește cuvintele Mele.\" Samuel s-a mâhnit și toată noaptea a strigat către Domnul.","S-a sculat dis-de-dimineață ca să se ducă înaintea lui Saul. Și au venit și i-au spus: „Saul s-a dus la Carmel și iată că și-a înălțat un semn de biruință, apoi s-a întors și, trecând mai departe, s-a
