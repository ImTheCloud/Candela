ă Israelul. Saul învinge pe amoniți, nu lasă să fie omorât nimeni dintre cei care îl disprețuiseră, iar la Ghilgal poporul îl întărește împărat.","v":"11:1-2, 11:6-8, 11:11-15","p":"Nahaș, bătrânii Iabesului, Saul, Samuel","l":"Iabes din Galaad, Ghibea, Bezec, Ghilgal","k":["Saul îi scapă pe cei din Iabes.","Duhul lui Dumnezeu face din Saul un conducător.","Saul iartă pe cei care îl disprețuiseră.","Victoria este atribuită Domnului."]},"12":{"s":"Samuel își ia rămas bun de la popor ca judecător și îi cere să mărturisească dacă a nedreptățit pe cineva. Le amintește cum a lucrat Domnul în istorie și că cererea lor de împărat a fost un păcat. Domnul trimite tunete și ploaie la seceriș, iar Samuel îi îndeamnă să slujească Domnului cu credincioșie.","v":"12:3-5, 12:12-15, 12:17-19, 12:20-24","p":"Samuel, poporul, Saul","l":"Ghilgal","k":["Samuel are conștiința curată înaintea poporului.","Poporul și împăratul trebuie să asculte de Domnul.","Tunetul și ploaia la seceriș sunt un semn.","Samuel nu încetează să se roage pentru popor.","Nu vă temeți: slujiți Domnului din toată inima."]},"13":{"s":"Saul își alege trei mii de bărbați, iar Ionatan bate tabăra filistenilor de la Gheba. Filistenii se adună cu mii de care și călăreți, iar poporul se sperie. Saul nu așteaptă pe Samuel și aduce el însuși jertfa la Ghilgal, iar Samuel îi spune că domnia lui nu va dăinui.","v":"13:2-5, 13:8-14, 13:19-22","p":"Saul, Ionatan, Samuel, filistenii","l":"Micmaș, Gheba, Ghilgal, Ghibea","k":["Saul nu așteaptă pe Samuel și aduce el jertfa.","Neascultarea îl costă pe Saul domnia.","Domnul Și-a ales un om după inima Lui.","Israelul nu avea fierari, nici arme."]},"14":{"s":"Ionatan și purtătorul armelor lui urcă pe stâncă la straja filistenilor și o înving, iar în tabără se stârnește groaza. Saul pune poporul să jure să nu mănânce până seara, dar Ionatan gustă miere fără să știe. Sorțul cade pe Ionatan, dar poporul îl scapă de la moarte.","v":"14:6-14, 14:23-27, 14:41-45, 14:47-48","p":"Ionatan, purtătorul armelor, Saul, Ahia, poporul","l":"Micmaș, Ghibea, Aialon, Bet-Aven","k":["Credința lui Ionatan: Domnul poate izbăvi cu mulți sau cu puțini.","Jurământul lui Saul a împovărat poporul.","Ionatan mănâncă miere fără să știe de jurământ.","Poporul scapă pe Ionatan de la moarte."]},"15":{"s":"Samuel trimite pe Saul să nimicească Amalec și să nu cruțe nimic. Saul bate pe Amalec, dar cruță pe Agag și ce era mai bun din pradă. Samuel îi spune că ascultarea face mai mult decât jertfa, iar Domnul îl leapădă ca împărat; Samuel ucide pe Agag.","v":"15:2-3, 15:9-11, 15:20-23, 15:28, 15:32-33","p":"Samuel, Saul, Agag, amaleciții, cheniții","l":"Telaim, Carmel, Ghilgal, Rama, Ghibea","k":["Saul păstrează pradă împotriva poruncii Domnului.","Ascultarea este mai bună decât jertfa.","Saul dă vina pe popor.","Domnul îi ia domnia lui Saul.","Samuel plânge pe Saul."]},"16":{"s":"Domnul trimite pe Samuel la Betleem, la Isai, să ungă un nou împărat. Samuel crede că este Eliab, dar Domnul se uită la inimă, nu la înfățișare. David, cel mai mic, este adus de la oi și uns, iar Duhul Domnului vine peste el, în timp ce Saul este muncit de un duh rău și David îi cântă la harpă.","v":"16:1, 16:6-7, 16:11-13, 16:14, 16:21-23","p":"Samuel, Isai, Eliab, David, Saul","l":"Betleem, Rama","k":["Domnul se uită la inimă, nu la înfățișare.","David este uns împărat în mijlocul fraților.","Duhul Domnului se depărtează de Saul.","David cântă la harpă înaintea lui Saul."]},"17":{"s":"Goliat, un uriaș din Gat, provoacă timp de patruzeci de zile oastea lui Israel. David, trimis de Isai cu merinde pentru frații lui, aude și se oferă să lupte. Cu o praștie și o piatră, în Numele Domnului, David îl doboară pe Goliat, iar filistenii fug.","v":"17:4, 17:16, 17:26, 17:34-37, 17:45-47, 17:49-51","p":"Goliat, Saul, David, Isai, Eliab, Abner","l":"Soco, Valea Terebinților, Betleem, Gat, Ecron","k":["Goliat înalt de șase coți și o palmă insultă pe Israel.","David se încrede în Domnul, nu în arme.","Lupta este a Domnului.","David îl doboară pe Goliat cu o piatră."]},"18":{"s":"Ionatan iubește pe David ca pe sufletul lui și face legământ cu el. Femeile cântă că Saul a bătut miile, iar David zecile de mii, și Saul începe să-l privească cu ură. Saul încearcă să-l ucidă cu sulița, apoi i-o dă de nevastă pe Mical, cerând o sută de prepuțuri ale filistenilor, dar David reușește și Saul se teme tot mai mult.","v":"18:1-4, 18:7-12, 18:20-21, 18:25-29","p":"Ionatan, David, Saul, Merab, Mical","l":"Cetățile lui Israel","k":["Legământul de prietenie între Ionatan și David.","Gelozia lui Saul față de David.","Domnul este cu David și izbutește în tot ce face.","Mical iubește pe David.","Saul se teme de David și îi este vrăjmaș."]},"19":{"s":"Saul spune să fie omorât David, dar Ionatan îl apără și Saul jură că nu-l va ucide. Duhul rău vine iar peste Saul, care aruncă sulița, iar David fuge. Mical îl coboară pe fereastră și Saul, urmărindu-l până la Naiot, prorocește și el.","v":"19:1-7, 19:9-12, 19:18-24","p":"Saul, Ionatan, David, Mical, Samuel","l":"Rama, Naiot, Secu","k":["Ionatan vorbește bine de David înaintea lui Saul.","Saul se apropie și se îndepărtează de David.","Mical scapă pe David cu viclenie.","David fuge la Samuel, la Rama."]},"20":{"s":"David întreabă pe Ionatan ce a greșit și cer să afle gândul lui Saul. Ionatan face din nou legământ cu David și stabilesc un semn cu trei săgeți. Saul se mânie pe Ionatan, aruncă sulița spre el, iar Ionatan trimite semnul și cei doi prieteni se despart plângând.","v":"20:3-8, 20:16-23, 20:30-34, 20:35-42","p":"David, Ionatan, Saul, Abner, băiatul lui Ionatan","l":"Naiot, Betleem, piatra Ezel","k":["Legământul dintre David și Ionatan este între familiile lor.","Semnul celor trei săgeți.","Ionatan își apără prietenul, chiar dacă Saul se mânie.","Despărțirea celor doi prieteni."]},"21":{"s":"David fuge la Nob, la preotul Ahimelec, și primește pâinile sfințite și sabia lui Goliat. Doeg, Edomitul, vede lucrul acesta. David ajunge apoi la Achiș, împăratul Gatului, unde se face nebun ca să scape.","v":"21:1-6, 21:8-9, 21:10-15","p":"David, Ahimelec, Doeg, Achiș","l":"Nob, Gat","k":["Ahimelec dă pâinea sfințită unui om flămând.","David primește sabia lui Goliat.","Doeg Edomitul vede și își amintește.","David se preface nebun la Gat."]},"22":{"s":"David se retrage în peștera Adulam, unde se strâng în jurul lui aproape patru sute de oameni în nevoie. Doeg spune lui Saul că Ahimelec a ajutat pe David, iar Saul poruncește să fie uciși preoții din Nob. Doar Abiatar scapă și fuge la David.","v":"22:1-2, 22:9-10, 22:17-23","p":"David, Saul, Doeg, Ahimelec, Abiatar, Gad","l":"Adulam, Mițpe, Moab, Nob","k":["Cei în nevoie, cu datorii și nemulțumiți se strâng în jurul lui David.","Saul poruncește uciderea preoților Domnului.","Doeg Edomitul face lucrarea.","Abiatar scapă și rămâne cu David."]},"23":{"s":"David scapă Cheila de filisteni, după ce întreabă pe Domnul. Saul vrea să-l prindă, dar David pleacă din Cheila, iar Ionatan vine să-l întărească în Domnul. Zifiții spun lui Saul unde este David, dar Saul trebuie să plece din cauza filistenilor.","v":"23:1-5, 23:13-18, 23:19-24, 23:26-29","p":"David, Saul, Abiatar, Ionatan, zifiții","l":"Cheila, pustia Zif, Maon, En-Ghedi","k":["David întreabă pe Domnul înainte să lupte.","Ionatan întărește mâna lui David în Dumnezeu.","Saul nu poate prinde pe David.","Locul se numește Sela-Hamahlecot (Stânca împărțirii)."]},"24":{"s":"Saul urmărește pe David cu trei mii de oameni, iar în peștera din En-Ghedi David îi taie doar colțul hainei, fără să-i facă rău. Chiar și pentru acest gest îl bate inima, pentru că Saul este unsul Domnului. Saul plânge, recunoaște că David va domni și îi cere să-i cruțe familia.","v":"24:2-7, 24:8-12, 24:16-22","p":"Saul, David, oamenii lui David","l":"pustia En-Ghedi, peștera","k":["David nu ridică mâna asupra unsului Domnului.","Taie doar colțul hainei lui Saul.","Saul recunoaște că David este mai bun.","Saul știe că David va fi împărat."]},"25":{"s":"Samuel moare și este plâns de tot Israelul. Nabal, un om bogat din Maon, refuză să dea ceva lui David, care pornește să se răzbune. Abigail, nevasta lui Nabal, iese înainte cu daruri și îl oprește. Domnul lovește pe Nabal, care moare, și David o ia pe Abigail de nevastă.","v":"25:1, 25:10-13, 25:18-19, 25:32-35, 25:38-43","p":"Samuel, David, Nabal, Abigail, Ahinoam","l":"Rama, pustia Paran, Maon, Carmel","k":["Moare Samuel și Israelul îl plânge.","Nabal este nebun și zgârcit.","Abigail este înțeleaptă și oprește sângele vărsat.","Domnul face dreptate prin moartea lui Nabal.","David binecuvântează pe Abigail."]},"26":{"s":"Zifiții spun din nou lui Saul unde este David, iar Saul coboară cu trei mii de oameni. David și Abișai intră noaptea în tabără, unde toți dorm adânc. Abișai vrea să-l omoare, dar David îi ia numai sulița și urciorul cu apă și le arată lui Saul de departe.","v":"26:1-5, 26:7-12, 26:21-25","p":"Saul, David, Abișai, Abner","l":"pustia Zif, dealul Hachila","k":["David nu ridică mâna asupra unsului Domnului.","Domnul cufundă pe toți într-un somn adânc.","David ia sulița și urciorul cu apă.","Saul recunoaște că a greșit."]},"27":{"s":"David se gândește că Saul îl va ajunge până la urmă și trece la filisteni, la Achiș, împăratul Gatului. Achiș îi dă Țiclagul ca să locuiască acolo. David prădează popoarele din jur, dar îl face pe Achiș să creadă că atacă Iuda.","v":"27:1-7, 27:8-12","p":"David, Achiș, cei șase sute de oameni ai lui David","l":"Gat, Țiclag","k":["David pleacă în țara filistenilor.","Țiclagul devine cetatea lui David.","David locuiește un an și patru luni la filisteni.","David nu mai este căutat de Saul."]},"28":{"s":"Filistenii se adună împotriva lui Israel, iar Saul se teme, dar Domnul nu-i mai răspunde. Saul merge noaptea la o femeie din En-Dor, care cheamă pe Samuel. Samuel îi spune că Domnul s-a depărtat de el și că a doua zi Saul și fiii lui vor fi cu el.","v":"28:3-7, 28:11-19, 28:20","p":"Saul, femeia din En-Dor, Samuel","l":"Sunem, Ghilboa, En-Dor","k":["Domnul nu mai răspunde lui Saul.","Saul merge la o femeie care cheamă morții.","Samuel anunță moartea lui Saul și a fiilor.","Saul cade la pământ plin de frică."]},"29":{"s":"Filistenii se adună la Afec, iar David și oamenii lui merg cu Achiș. Domnitorii filistenilor nu vor pe David lângă ei, de teamă că se va întoarce împotriva lor. Achiș îl trimite înapoi, iar David se întoarce spre Țiclag.","v":"29:1-5, 29:6-11","p":"Achiș, domnitorii filistenilor, David","l":"Afec, Izreel, Țiclag","k":["Domnitorii filistenilor nu au încredere în David.","Achiș îl socotește pe David plăcut ca un înger.","David este scutit să lupte împotriva Israelului.","David pleacă în pace spre Țiclag."]},"30":{"s":"Amaleciții au ars Țiclagul și au luat femeile și copiii, iar oamenii plâng și vor să-l ucidă pe David. David se întărește în Domnul, întreabă pe Domnul și urmărește pe amaleciți. Un rob egiptean îi arată drumul, David scapă totul și împarte prada deopotrivă.","v":"30:1-6, 30:7-8, 30:11-15, 30:17-20, 30:21-25","p":"David, Abiatar, robul egiptean, amaleciții","l":"Țiclag, pârâul Besor","k":["David se întărește în Domnul.","David întreabă pe Domnul înainte de urmărire.","David scapă tot ce a fost luat.","Prada se împarte deopotrivă."]},"31":{"s":"Filistenii bat pe Israel la muntele Ghilboa, iar fiii lui Saul, printre care Ionatan, sunt uciși. Saul este rănit grav și se aruncă în sabia lui când purtătorul de arme refuză să-l ucidă. Filistenii pun armele lui în templul Astarteei, iar vitejii din Iabes ard trupurile și îngroapă oasele.","v":"31:1-7, 31:8-10, 31:11-13","p":"Saul, Ionatan, Abinadab, Malchișua, purtătorul armelor","l":"Muntele Ghilboa, Bet-Șan, Iabes","k":["Sfârșitul lui Saul și al fiilor lui.","Ionatan moare împreună cu tatăl lui.","Vitejii din Iabes cinstesc trupul lui Saul.","Israelul rămâne fără împărat."]}};

ivot.","c":"6","lat":31.7504,"lng":34.9822},{"n":"Chiriat-Iearim","d":"Aici stă chivotul douăzeci de ani, în casa lui Abinadab.","c":"6–7","lat":31.8065,"lng":35.1088},{"n":"Mițpa","d":"Aici se roagă și postește Israelul și aici este ales Saul prin sorți.","c":"7, 10","lat":31.8956,"lng":35.2114},{"n":"Betel","d":"Loc din ținutul lui Efraim; Samuel judecă aici în fiecare an.","c":"7, 10","lat":31.9317,"lng":35.2271},{"n":"Ghilgal","d":"Aici este întărit Saul împărat și tot aici jertfește el fără Samuel.","c":"7, 10–15","lat":31.8667,"lng":35.45},{"n":"Ghibea","d":"Cetatea lui Saul, în Beniamin.","c":"10–11, 13–15, 22–23","lat":31.826,"lng":35.229},{"n":"Micmaș","d":"Aici bate Ionatan straja filistenilor.","c":"13–14","lat":31.9028,"lng":35.285},{"n":"Iabes","d":"Cetate din Galaad, salvată de Saul; locuitorii îngroapă trupul lui Saul.","c":"11, 31","lat":32.32,"lng":35.6},{"n":"Nob","d":"Cetatea preoților; David primește pâinea sfințită, apoi Doeg o nimicește.","c":"21–22","lat":31.795,"lng":35.243},{"n":"Betleem","d":"Cetatea lui Isai și a lui David; aici este uns David.","c":"16–17, 20","lat":31.7054,"lng":35.2024},{"n":"Soco","d":"Aici își strâng filistenii oștile în lupta cu Goliat.","c":"17","lat":31.6894,"lng":34.9988},{"n":"Adulam","d":"Peștera în care se strâng în jurul lui David oamenii în nevoie.","c":"22","lat":31.6475,"lng":34.9972},{"n":"Cheila","d":"Cetate salvată de David de filisteni.","c":"23","lat":31.595,"lng":35.035},{"n":"Zif","d":"Pustie unde se ascunde David; zifiții îl dau de două ori pe mâna lui Saul.","c":"23, 26","lat":31.483,"lng":35.15},{"n":"Maon","d":"Cetate de lângă Carmel, unde locuiește Nabal.","c":"23, 25","lat":31.417,"lng":35.117},{"n":"En-Ghedi","d":"Pustie unde David îl cruță pe Saul în peșteră.","c":"23–24","lat":31.46,"lng":35.39},{"n":"Țiclag","d":"Cetatea dată lui David de Achiș; amaleciții o ard.","c":"27, 29–30","lat":31.279,"lng":34.934},{"n":"En-Dor","d":"Aici merge Saul la femeia care cheamă pe Samuel.","c":"28","lat":32.643,"lng":35.396},{"n":"Ghilboa","d":"Muntele unde mor Saul și fiii lui.","c":"28, 31","lat":32.4833,"lng":35.4},{"n":"Bet-Șan","d":"Filistenii atârnă pe zidurile lui trupurile lui Saul și ale fiilor lui.","c":"31","lat":32.5,"lng":35.5}],"trasee":[{"n":"Chivotul","c":"4–7","i":"Chivotul legământului este luat de filisteni, trece prin trei cetăți filisteene și se întoarce în Israel, unde rămâne douăzeci de ani la Chiriat-Iearim.","s":[{"p":"Silo","t":"Chivotul este adus în tabără","d":"Israelul este bătut de filisteni. Bătrânii trimit la Silo și aduc chivotul legământului, care șade între heruvimi, crezând că el îi va izbăvi. Cu chivotul vin și Hofni și Fineas, fiii lui Eli.","v":"4:3-5","c":4},{"p":"Afec","t":"Chivotul este luat","d":"Filistenii se întăresc și bat din nou pe Israel: treizeci de mii de oameni pedeștri cad. Hofni și Fineas mor, iar chivotul lui Dumnezeu este luat. Când Eli aude vestea, cade de pe scaun și moare.","v":"4:10-18","c":4},{"p":"Asdod","t":"Dagon cade înaintea chivotului","d":"Filistenii pun chivotul în casa zeului lor Dagon. Dimineața, Dagon este găsit întins cu fața la pământ; a doua zi, are capul și mâinile tăiate pe prag. Locuitorii Asdodului sunt loviți cu bube.","v":"5:2-6","c":5},{"p":"Gat","t":"Chivotul este dus la Gat","d":"Asdodenii nu mai vor chivotul și îl duc la Gat. Și acolo mâna Domnului apasă asupra cetății, iar oamenii, de la mic la mare, sunt loviți cu bube.","v":"5:8-9","c":5},{"p":"Ecron","t":"Chivotul este trimis la Ecron","d":"Ecronitenii strigă că chivotul a venit să-i omoare și cer să fie trimis înapoi la locul lui. Țipetele cetății se înalță până la cer.","v":"5:10-12","c":5},{"p":"Bet-Șemeș","t":"Carul tras de două vaci","d":"După șapte luni, filistenii pun chivotul pe un car nou, cu daruri de vină din aur, și îl lasă în seama a două vaci care alăptau, ale căror viței au fost închiși acasă. Vacile merg drept spre Bet-Șemeș, mugind. Filistenii înțeleg că lovitura a venit de la Domnul.","v":"6:1-12","c":6},{"p":"Chiriat-Iearim","t":"Chivotul rămâne douăzeci de ani","d":"Locuitorii din Chiriat-Iearim duc chivotul în casa lui Abinadab, pe deal, și sfințesc pe fiul său Eleazar ca să-l păzească. Trec douăzeci de ani, iar Israelul plânge după Domnul.","v":"7:1-2","c":7}]},{"n":"Fuga lui David","c":"19–27","i":"David fuge de Saul prin ținutul lui Iuda: de la Rama la Nob și Gat, apoi prin peșteri și pustie, până la Țiclag.","s":[{"p":"Rama","t":"David fuge la Samuel","d":"Saul vrea să-l omoare pe David, dar Mical îl coboară pe fereastră. David fuge la Samuel, la Naiot, lângă Rama. Oamenii trimiși de Saul, apoi Saul însuși, încep să prorocească, iar David scapă.","v":"19:11-24","c":19},{"p":"Nob","t":"Pâinea sfințită și sabia lui Goliat","d":"David ajunge la preotul Ahimelec și cere pâine. Preotul îi dă pâinea sfințită și sabia lui Goliat. Doeg Edomitul vede lucrul acesta.","v":"21:1-9","c":21},{"p":"Gat","t":"David se preface nebun","d":"Slujitorii lui Achiș îl recunosc pe David. El se face nebun: zgârie ușile porții și lasă balele să-i curgă pe barbă. Achiș îl alungă.","v":"21:10-15","c":21},{"p":"Adulam","t":"Peștera din Adulam","d":"David scapă în peștera Adulam. Frații lui și toată casa tatălui său vin la el, apoi se strâng în jurul lui oamenii în nevoie, cu datorii sau nemulțumiți, aproape patru sute. David devine căpetenia lor.","v":"22:1-2","c":22},{"p":"Cheila","t":"David scapă Cheila","d":"David întreabă pe Domnul și bate pe filisteni, scăpând Cheila. Domnul îi arată însă că locuitorii l-ar da pe mâna lui Saul, așa că David pleacă împreună cu aproape șase sute de oameni.","v":"23:1-13","c":23},{"p":"Zif","t":"Ionatan întărește pe David","d":"David stă în pustia Zif, în pădure. Ionatan vine la el și îi întărește mâna în Dumnezeu: Saul nu-l va ajunge, iar David va împărăți. Fac din nou legământ înaintea Domnului.","v":"23:14-18","c":23},{"p":"Maon","t":"Saul aproape îl ajunge","d":"Saul și David merg pe părți opuse ale muntelui, iar Saul aproape îl încercuiește. Atunci vine un sol: filistenii au năvălit în țară. Saul pleacă, iar locul se numește Sela-Hamahlecot (Stânca împărțirii).","v":"23:24-28","c":23},{"p":"En-Ghedi","t":"David cruță pe Saul","d":"Saul intră într-o peșteră unde David și oamenii lui stau în fund. David îi taie doar colțul hainei, apoi îi strigă că nu ridică mâna asupra unsului Domnului. Saul plânge și recunoaște că David va fi împărat.","v":"24:1-22","c":24},{"p":"Maon","t":"Nabal și Abigail","d":"Nabal refuză să ajute pe David, iar David pornește cu aproape patru sute de oameni. Abigail, nevasta lui Nabal, iese înaintea lui cu daruri și îl oprește. Nabal moare după zece zile, iar David o ia pe Abigail de nevastă.","v":"25:2-42","c":25},{"p":"Zif","t":"A doua cruțare a lui Saul","d":"Zifiții spun iar lui Saul unde este David. David și Abișai intră noaptea în tabără, unde toți dorm adânc. David ia numai sulița și urciorul cu apă și nu lasă să fie atins unsul Domnului.","v":"26:1-25","c":26},{"p":"Gat","t":"David trece la Achiș","d":"David se gândește că într-o zi va pieri de mâna lui Saul și trece cu cei șase sute de oameni și familiile lor la Achiș, împăratul Gatului. Saul nu-l mai caută.","v":"27:1-4","c":27},{"p":"Țiclag","t":"David primește Țiclagul","d":"Achiș îi dă Țiclagul. David locuiește în țara filistenilor un an și patru luni și de acolo prădează popoarele din sud, dar îl face pe Achiș să creadă că atacă Iuda.","v":"27:5-12","c":27}]},{"n":"Sfârșitul lui Saul","c":"28–31","i":"Înainte de ultima luptă, Saul merge noaptea la En-Dor. A doua zi cade pe muntele Ghilboa, iar locuitorii din Iabes îi iau trupul.","s":[{"p":"Ghilboa","t":"Israelul tăbărăște la Ghilboa","d":"Filistenii se strâng la Sunem, iar Saul adună Israelul la Ghilboa. Când vede tabăra filistenilor, Saul se înspăimântă. Întreabă pe Domnul, dar Domnul nu-i răspunde, nici prin vise, nici prin Urim, nici prin proroci.","v":"28:4-6","c":28},{"p":"En-Dor","t":"Femeia din En-Dor","d":"Samuel murise, iar Saul îndepărtase din țară pe cei ce chemau morții. Acum își schimbă hainele și merge noaptea la o femeie din En-Dor. Samuel îi spune că Domnul S-a depărtat de el și că mâine Saul și fiii lui vor fi cu el.","v":"28:3-19","c":28},{"p":"Ghilboa","t":"Moartea lui Saul","d":"Israelul fuge dinaintea filistenilor. Ionatan, Abinadab și Malchișua cad. Saul este rănit de arcași și cere purtătorului de arme să-l străpungă; acesta refuză, iar Saul se aruncă în sabia lui.","v":"31:1-6","c":31},{"p":"Bet-Șan","t":"Trupurile pe zidurile cetății","d":"Filistenii îi taie capul lui Saul și îi iau armele, pe care le pun în casa astarteelor. Trupul lui și trupurile fiilor sunt atârnate pe zidurile Bet-Șanului.","v":"31:8-10","c":31},{"p":"Iabes","t":"Iabesul îngroapă trupurile","d":"Vitejii din Iabes din Galaad merg toată noaptea, iau trupurile de pe ziduri, le ard și îngroapă oasele sub stejarul din Iabes. Apoi postesc șapte zile. Saul îi scăpase pe cei din Iabes la începutul domniei.","v":"31:11-13","c":31}]},{"n":"Țiclagul","c":"29–30","i":"David este trimis înapoi de filisteni și găsește Țiclagul ars de amaleciți.","s":[{"p":"Afec","t":"Filistenii îl trimit înapoi","d":"David și oamenii lui merg în urma lui Achiș, dar domnitorii filistenilor nu-l vor, de teamă că se va întoarce împotriva lor în luptă. Achiș îl trimite înapoi în pace.","v":"29:1-11","c":29},{"p":"Țiclag","t":"Cetatea arsă","d":"În a treia zi, David găsește Țiclagul ars de amaleciți, iar femeile și copiii luați. Poporul vorbește să-l ucidă cu pietre, dar David se întărește în Domnul. Întreabă pe Domnul, urmărește pe amaleciți și scapă tot ce fusese luat.","v":"30:1-20","c":30}]}]};

  if (!chs || !chs.length) return "";
  if (chs.length === 1 && chs[0] === 0) return "Examen alb";
  if (chs.length === 31) return "Toate capitolele";
  const s = chs.slice().sort((a,b)=>a-b), parts = []; let i = 0;
  while (i < s.length){

    while (j+1 < s.length && s[j+1] === s[j]+1) j++;
    if (j > i + 1) parts.push(`${s[i]}–${s[j]}`);
    else if (j === i + 1) { parts.push(`${s[i]}`); parts.push(`${s[j]}`); }

  }
  let str = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " și " + parts[parts.length - 1];

async function autoLogin(){

  const t0 = Date.now(), hold = lsGet("candela:verse", false) ? 0 : 2500; lsSet("candela:verse", true);
  const shown = () => new Promise(r => setTimeout(r, Math.max(0, hold - (Date.now() - t0))));

/* ---------- quiz engine ---------- */
function buildPool(chs, mode){
  const out = [];
  for (const c of chs){
    const d = QUIZ[c]; if (!d) continue;
    for (const m of (mode==="both" ? ["easy","hard"] : [mode]))
      (d[m]||[]).forEach((q,i) => out.push({...q, ch:c, mode:m, id:`${c}${m[0]}${i}`}));
  }
  return out;
}
function prepare(q){
  const x = {...q};
  if (q.t === "one"){
    const idx = shuffle(q.opts.map((_,i)=>i));
    x.opts = idx.map(i=>q.opts[i]);
    x.a = idx.indexOf(q.a);
  }
  if (q.t === "multi"){
    let idx;
    do { idx = shuffle(q.opts.map((_,i)=>i)); } while (q.opts.length > 1 && idx.every((v, i) => v === i));
    x.opts = idx.map(i=>q.opts[i]);
    x.a = q.a.map(a=>idx.indexOf(a)).sort((a,b)=>a-b);
  }
  if (q.t === "match"){
    const n = q.pairs.length;
    let r;
    do {
      r = shuffle(q.pairs.map((p,i)=>i));
    } while (n > 1 && (r.every((v, i) => v === i) || (n <= 3 ? r.some((v, i) => v === i) : r.filter((v, i) => v === i).length >= 2)));
    x.right = r;
  }
  return x;
}
/* rough time to answer, by question type and level (seconds), including reading the correction; only an estimate shown before starting, there is no timer */
const SECS = { tf:[9,13], one:[13,19], multi:[20,28], fill:[17,25], match:[30,42] };
// once enough tests exist, the real average time per question (by level) replaces the guess, within ×0.5–×2 of it
let PACE = lsGet("candela:pace", null);
function estSecs(list){
  const by = {easy:[0,0], hard:[0,0]};
  for (const q of list){ const b = by[q.mode] || by.easy; b[0] += (SECS[q.t]||[18,24])[q.mode==="hard"?1:0]; b[1]++; }
  return Object.entries(by).reduce((s, [m, [guess, n]]) => s + (PACE?.[m] && n ? Math.min(guess*2, Math.max(guess/2, PACE[m]*n)) : guess), 0);
}
async function loadPace(){
  const r = await store.rpc("pace"); if (!r.ok || !r.data) return;
  PACE = {}; for (const x of r.data) if (x.n >= 15 && x.mode !== "both") PACE[x.mode] = +x.secs;
  lsSet("candela:pace", PACE);
}
function durLabel(secs){
  const m = secs / 60;
  if (m < 1.5) return "cam 1 min";
  if (m < 20) return `cam ${Math.round(m)} min`;
  if (m < 60) return `cam ${Math.round(m/5)*5} min`;
  const h = Math.floor(m/60), r = Math.round((m - h*60)/10)*10;
  return r === 60 ? `cam ${h+1} h` : `cam ${h} h${r ? ` ${r} min` : ""}`;
}

function buildExamPool(mode){
  const allQs = buildPool(Array.from({length:31}, (_,i)=>i+1), mode);
  const tfQs = shuffle(allQs.filter(q => q.t === "tf"));
  const oneQs = shuffle(allQs.filter(q => q.t === "one"));
  const multiQs = shuffle(allQs.filter(q => q.t === "multi"));
  const fillQs = shuffle(allQs.filter(q => q.t === "fill"));

  const pickDiverse = (list, count = 5) => {
    const chosen = [];
    const usedChs = new Set();
    for (const q of list){
      if (!usedChs.has(q.ch)){
        chosen.push(q);
        usedChs.add(q.ch);
        if (chosen.length === count) break;
      }
    }
    if (chosen.length < count){
      for (const q of list){
        if (!chosen.includes(q)){
          chosen.push(q);
          if (chosen.length === count) break;
        }
      }
    }
    return chosen;
  };

  const p1 = pickDiverse(tfQs, 5);
  const p2 = pickDiverse(oneQs, 5);

  const pMatch = pickDiverse(shuffle(allQs.filter(q => q.t === "match")), 1);

  const p3 = pickDiverse(multiQs, 5);
  const p4 = pickDiverse(fillQs, 5);

  return [...p1, ...p2, ...pMatch, ...p3, ...p4];
}

function startExam(mode = "easy"){
  const qs = buildExamPool(mode);
  S.quiz = {
    qs: qs.map(prepare),
    i: 0,
    answers: [],
    start: Date.now(),
    chs: [0],
    mode,
    retry: false,
    exam: true
  };
  viewQuestion(true);
}

function startQuiz(list, o = {}){
  let qs;
  if (list) qs = list;
  else {
    const chs = [...S.sel].sort((a,b)=>a-b);
    qs = shuffle(buildPool(chs, S.mode));
  }
  S.quiz = { qs: qs.map(prepare), i: 0, answers: [], start: Date.now(), chs: [...new Set(qs.map(q=>q.ch))].sort((a,b)=>a-b), mode: o.mode || (list ? S.quiz.mode : S.mode), retry: !!o.retry, exam: !!o.exam };
  viewQuestion(true);
}
/* an unfinished test survives a reload or a closed tab, until it is finished or stopped */

  viewQuestion(true);
}

    <div class="answers" id="ans">${answersHTML(q)}</div><div id="fb"></div>

function fillHTML(q){
  let k = 0;
  return `<p class="qtext fill">${esc(q.q).split("___").map((part,i,arr)=> part + (i<arr.length-1 ? `<input id="fill${k}" data-k="${k++}" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Cuvântul lipsă ${k}">` : "")).join("")}</p>`;
}
function answersHTML(q){
  if (q.t==="tf") return `<div class="tf"><button class="opt" data-v="1"><span>Adevărat</span></button><button class="opt" data-v="0"><span>Fals</span></button></div>`;
  if (q.t==="one") return q.opts.map((o,i)=>`<button class="opt one opt-one" data-i="${i}" aria-pressed="false"><span class="k">${LETTERS[i]}</span><span class="opt-label">${esc(o)}</span></button>`).join("");
  if (q.t==="multi") return q.opts.map((o,i)=>`<button class="opt multi opt-multi" data-i="${i}" aria-pressed="false"><span class="k opt-check-badge">${LETTERS[i]}</span><span class="opt-label">${esc(o)}</span><span class="opt-choice-indicator indicator-check" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span></button>`).join("");
  if (q.t==="match") return `<div class="mx" id="mx"></div>`;
  return "";
}
function bindQuestion(q, card){
  const ui = S.quiz.ui;
  if (q.t==="tf") card.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (ui.checked) return; ui.pick = b.dataset.v==="1"; card.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed", x===b)); renderActions(); if (S.quiz) check(); });
  if (q.t==="one") card.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (ui.checked) return; ui.pick = +b.dataset.i; card.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed", x===b)); renderActions(); });
  if (q.t==="multi") card.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (ui.checked) return; const i = +b.dataset.i; ui.sel.has(i) ? ui.sel.delete(i) : ui.sel.add(i); b.setAttribute("aria-pressed", ui.sel.has(i)); renderActions(); });
  if (q.t==="fill") card.querySelectorAll("input").forEach(inp => { inp.oninput = () => renderActions(); inp.onkeydown = e => { if (e.key==="Enter"){ e.preventDefault(); const nx = card.querySelector(`input[data-k="${+inp.dataset.k+1}"]`); if (nx) nx.focus(); else if (!ui.checked) check(); else next(); } }; });
  if (q.t==="match"){
    // Items on top (the active one is highlighted), all answers always visible below: tap an answer to give it to the active item.
    const box = card.querySelector("#mx");
    const paint = () => {
      const act = ui.checked ? null : ui.active;
      const ownerOf = r => q.pairs.findIndex((_, k) => ui.pairs[k] === r);
      box.innerHTML = `<div class="mrows">${q.pairs.map((p, l) => {
        const v = ui.pairs[l];
        return `<div class="mrow${act === l ? " open" : ""}${v != null ? " filled" : ""}" data-l="${l}">
          <button class="mhead" type="button" data-l="${l}" aria-label="${esc(p[0])}"><span class="mn">${l + 1}</span><span class="mb"><span class="ml">${esc(p[0])}</span>
          <span class="mv">${v != null ? esc(q.pairs[v][1]) : act === l ? "Alege răspunsul de mai jos" : "Alege un răspuns"}</span></span></button></div>`;
      }).join("")}</div>
      <div class="mchoices"><span class="mlabel">Răspunsuri</span>${q.right.map(r => { const o = ownerOf(r); return `<button class="mopt${o >= 0 ? " taken" : ""}" type="button" data-r="${r}"><span class="mtag">${o >= 0 ? o + 1 : ""}</span><span>${esc(q.pairs[r][1])}</span></button>`; }).join("")}</div>`;
      box.querySelectorAll(".mhead").forEach(b => b.onclick = () => { if (ui.checked) return; ui.active = +b.dataset.l; paint(); });
      box.querySelectorAll(".mopt").forEach(b => b.onclick = () => {
        if (ui.checked || ui.active == null) return; const r = +b.dataset.r;
        const other = q.pairs.findIndex((_, k) => k !== ui.active && ui.pairs[k] === r);
        if (other >= 0){ if (ui.pairs[ui.active] != null) ui.pairs[other] = ui.pairs[ui.active]; else delete ui.pairs[other]; }
        ui.pairs[ui.active] = r;
        const nx = q.pairs.findIndex((_, i) => ui.pairs[i] == null);
        ui.active = nx >= 0 ? nx : null; paint();
      });
      renderActions(); fitFixed();
    };
    ui.active = 0; paint();
  }

const RO_NUM_MAP = new Map();
function buildRoNums() {

function canoGod(s) {
  return s
    .replace(/\blui dumnezeu\b/g, "dumnezeului")
    .replace(/\bal domnului?\b/g, "dumnezeului")
    .replace(/\ba domnului?\b/g, "dumnezeului")
    .replace(/\bdomnului?\b/g, "dumnezeului")
    .replace(/\bdomnul? dumnezeu\b/g, "dumnezeu")
    .replace(/\bdomnul?\b/g, "dumnezeu")
    .replace(/\bdomn\b/g, "dumnezeu")
    .replace(/\s+/g, " ")
    .trim();
}

function isRoVariant(a, b) {
  if (!a || !b || a === b) return a === b;
  const [s1, s2] = a.length <= b.length ? [a, b] : [b, a];

  // 1. Direct definite -> genitive/dative suffix addition:
  // e.g. capul + ui = capului, robul + ui = robului, omul + ui = omului
  if (s1.length >= 3 && s1.endsWith("ul") && s1 + "ui" === s2) return true;

  // 2. Base noun -> definite or genitive:
  // e.g. cap + ul = capul, cap + ului = capului
  if ((s1.length >= 3 || s1 === "om") && (s1 + "ul" === s2 || s1 + "ului" === s2)) return true;

  // 3. -e -> -le / -lui (e.g. muntele <-> muntelui, fratele <-> fratelui, regele <-> regelui)
  if (s1.length >= 4 && s1.endsWith("le") && s2.endsWith("lui") && s1.slice(0, -2) === s2.slice(0, -3)) return true;
  if (s1.length >= 3 && (s1 + "le" === s2 || s1 + "lui" === s2)) return true;

  // 4. -l -> -lui / base (e.g. tatal + ui = tatalui, tata + l = tatal, tata + lui = tatalui)
  if (s1.length >= 3 && s1.endsWith("l") && s1 + "ui" === s2) return true;
  if (s1.length >= 3 && (s1 + "l" === s2 || s1 + "lui" === s2)) return true;

  // 5. Plural genitive: oameni + lor = oamenilor, frati + lor = fratilor
  if (s1.length >= 3 && (s1 + "lor" === s2 || (s1.endsWith("i") && s1 + "i" === s2))) return true;
  if (s1.length >= 4 && s1.endsWith("ii") && s2.endsWith("ilor") && s1.slice(0, -2) === s2.slice(0, -4)) return true;
  if (s1.length >= 4 && s1.endsWith("le") && s2.endsWith("lor") && s1.slice(0, -2) === s2.slice(0, -3)) return true;

  // 6. Feminine case/article variations sharing the same root (e.g. inima <-> inimii, viata <-> vietii):
  const normRoot = r => r.replace(/ea/g, "e").replace(/a/g, "e");
  const femEndings = ["a", "ea", "ia", "ii", "ei", "iei"];
  for (const e1 of femEndings) {
    if (s1.endsWith(e1)) {
      const r1 = s1.slice(0, -e1.length);
      if (r1.length >= 3) {
        for (const e2 of femEndings) {
          if (s2.endsWith(e2)) {
            const r2 = s2.slice(0, -e2.length);
            if (r1 === r2 || normRoot(r1) === normRoot(r2)) return true;
          }
        }
      }
    }
  }

  return false;
}

function tolerantMatch(ans, exp) {
  const clean = s => fold(s).replace(/[.,;:'"!?()\[\]{}„”«»]/g, '');
  const cA = clean(ans), cE = clean(exp);
  if (cA === cE) return true;
  const sA = cA.replace(/[\s\-]/g, ''), sE = cE.replace(/[\s\-]/g, '');
  if (sA === sE) return true;

  // Domnul / Dumnezeu equivalence
  const gA = canoGod(cA), gE = canoGod(cE);
  if (gA && gE && gA === gE) return true;
  if (gA && gE && gA.replace(/[\s\-]/g, '') === gE.replace(/[\s\-]/g, '')) return true;

  // Romanian noun declension / article variants (e.g. capul <-> capului <-> cap)
  if (isRoVariant(sA, sE)) return true;
  if (gA && gE && isRoVariant(gA.replace(/[\s\-]/g, ''), gE.replace(/[\s\-]/g, ''))) return true;

  // Number words and digits equivalence
  const numA = parseInt(sA, 10), numE = parseInt(sE, 10);
  for (const [n, words] of RO_NUM_MAP.entries()) {
    const hasA = (!isNaN(numA) && numA.toString() === sA && numA === n) || words.has(sA);
    const hasB = (!isNaN(numE) && numE.toString() === sE && numE === n) || words.has(sE);
    if (hasA && hasB) return true;
  }

  const lDist = (a, b) => {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    const m = Array.from({length: b.length + 1}, (_, i) => [i]);
    for (let j = 0; j <= a.length; j++) m[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        m[i][j] = b[i - 1] === a[j - 1] ? m[i - 1][j - 1] : Math.min(m[i - 1][j - 1], m[i][j - 1], m[i - 1][j]) + 1;
      }
    }
    return m[b.length][a.length];
  };
  const tol = sE.length >= 8 ? 2 : (sE.length >= 4 ? 1 : 0);
  if (tol > 0) {
    if (lDist(cA, cE) <= tol) return true;
    if (lDist(sA, sE) <= tol) return true;
    if (gA && gE && (lDist(gA, gE) <= tol || lDist(gA.replace(/[\s\-]/g, ''), gE.replace(/[\s\-]/g, '')) <= tol)) return true;
  }

}

function mistakeHTML({q, a}){

  if (q.t==="multi"){ yours = skipped ? "—" : (a.given.length ? a.given.map(i=>esc(q.opts[i])).join("; ") : "niciuna"); correct = q.a.length ? q.a.map(i=>esc(q.opts[i])).join("; ") : "niciuna"; }
  if (q.t==="fill"){ yours = skipped ? "—" : a.given.map(esc).join(", "); correct = q.a.map(esc).join(", "); }
  if (q.t==="match"){
    yours = skipped ? "—" : q.pairs.map((p,i)=> a.given[i]===i ? null : `${esc(p[0])} → ${a.given[i]!=null ? esc(q.pairs[a.given[i]][1]) : "—"}`).filter(Boolean).join("<br>");
    correct = q.pairs.map(p=>`${esc(p[0])} → ${esc(p[1])}`).join("<br>");
  }
  const qtext = q.t==="fill" ? esc(q.q).replace(/___/g, "<b>____</b>") : esc(q.q.replace(/\s*\(pot fi mai multe[^)]*\)/i, ""));
  return `<article class="mistake"><div class="qmeta"><div class="qmeta-left"><span class="qtype-badge type-${q.t}">${TYPE_ICON[q.t]||""}<span>${TYPE_LABEL[q.t]}</span></span></div><span class="ref">${refLabel(q.ref)}</span></div>
    <p class="q">${qtext}</p>
    <div class="ans"><div><span class="l">Răspunsul tău</span><span class="${skipped?"":"y"}">${yours}</span></div><div><span class="l">Corect</span><span class="c">${correct}</span></div></div>
    <div class="verse">${verseHTML(q.ref)}</div></article>`;
}

function drawMap(ri){
  const L = window.L, box = $("#map");
  if (!box) return;
  if (_map) { _map.remove(); _map = null; }
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue("--ink").trim(), surf = css.getPropertyValue("--surface").trim();
  const map = _map = L.map(box, {minZoom: 7, maxZoom: 13, zoomSnap: 0.5, zoomDelta: 1, scrollWheelZoom: false, attributionControl: false});
  L.control.attribution({prefix: false}).addTo(map);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}", {attribution: "Esri, USGS, NOAA", maxZoom: 13, keepBuffer: 4}).addTo(map);
  const at = n => CARTE.locuri.find(l => l.n === n);
  const info = $("#mapInfo");
  const lblToggle = () => box.classList.toggle("lbl-off", ri < 0 && map.getZoom() < 9);
  map.on("zoomend", lblToggle);
  if (ri < 0) {
    CARTE.locuri.forEach(l => {
      L.circleMarker([l.lat, l.lng], {radius: 7, color: surf, weight: 2, fillColor: ink, fillOpacity: 1})
        .bindTooltip(esc(l.n), {permanent: true, direction: "right", offset: [8, 0], className: "map-lbl"})
        .on("click", () => {
          info.innerHTML = `<h3>${esc(l.n)}</h3><p>${esc(l.d)}</p><span class="bk-meta">Capitole: ${esc(l.c)}</span>`;
          map.flyTo([l.lat, l.lng], Math.max(map.getZoom(), 10), {duration: .8});
        })
        .addTo(map);
    });
    map.fitBounds(CARTE.locuri.map(l => [l.lat, l.lng]), {padding: [24, 24]});
    info.innerHTML = `<p class="bk-meta">Atinge un loc sau apropie harta ca să vezi numele. Alege un traseu ca să vezi drumul pas cu pas.</p>`;
    lblToggle();
    return;
  }
  const r = CARTE.trasee[ri];
  const seq = r.s.map(x => at(x.p));
  const bounds = seq.map(l => [l.lat, l.lng]);
  const proj = ll => L.CRS.EPSG3857.project(L.latLng(ll));
  const seen = {}, inks = [], arrows = [];
  seq.forEach((a, i) => {
    if (!i) return;
    const b = seq[i - 1];
    const key = [a.n, b.n].sort().join("|");
    const k = seen[key] = (seen[key] || 0) + 1;
    const p1 = proj([b.lat, b.lng]), p2 = proj([a.lat, a.lng]);
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
    const off = (k - 1) * 0.012;
    const mid = [(a.lat + b.lat) / 2 + (dx / len) * off, (a.lng + b.lng) / 2 - (dy / len) * off];
    const m1 = proj(mid);
    L.polyline([[b.lat, b.lng], mid, [a.lat, a.lng]], {color: surf, weight: 8, opacity: .95}).addTo(map);
    inks.push([[b.lat, b.lng], mid, [a.lat, a.lng]]);
    arrows.push([mid, Math.atan2(-(p2.y - m1.y), p2.x - m1.x) * 180 / Math.PI]);
  });
  inks.forEach(pts => L.polyline(pts, {color: ink, weight: 4, opacity: .8}).addTo(map));
  arrows.forEach(([mid, deg]) => L.marker(mid, {interactive: false, icon: L.divIcon({className: "arr", html: `<svg width="16" height="16" viewBox="0 0 10 10" style="transform:rotate(${deg}deg)"><path d="M1 1.5L9 5 1 8.5z" fill="currentColor"/></svg>`, iconSize: [16, 16]})}).addTo(map));
  const pins = {}, nums = {};
  r.s.forEach((x, i) => (nums[x.p] = nums[x.p] || []).push(i + 1));
  Object.keys(nums).forEach(n => {
    const l = at(n);
    pins[n] = L.marker([l.lat, l.lng], {icon: L.divIcon({className: "", html: `<div class="pin">${nums[n].join(", ")}</div>`, iconSize: [0, 0]})})
      .bindTooltip(esc(n), {permanent: true, direction: "right", offset: [18, 0], className: "map-lbl"})
      .addTo(map);
  });
  const overview = () => map.flyToBounds(bounds, {padding: [44, 44], maxZoom: 11, duration: 1});
  const show = step => {
    Object.values(pins).forEach(m => m.getElement().querySelector(".pin").classList.remove("on"));
    info.innerHTML = tourHTML(r, step);
    if (step < 0) {
      overview();
      info.querySelectorAll(".ev").forEach(b => b.onclick = () => show(+b.dataset.i));
      $("#tourGo").onclick = () => show(0);
      return;
    }
    const x = r.s[step], l = at(x.p);
    pins[x.p].getElement().querySelector(".pin").classList.add("on");
    map.flyTo([l.lat, l.lng], 11, {duration: 1.1});
    $("#tourPrev").onclick = () => show(step - 1);
    $("#tourNext").onclick = () => show(step + 1);
    $("#tourAll").onclick = () => show(-1);
    $("#tourRead").onclick = () => openChapter(x.c, () => viewBook("harta"));
  };
  map.fitBounds(bounds, {padding: [44, 44], maxZoom: 11});
  show(-1);
  lblToggle();
}

  mount(`<section class="reader">

/* ---------- admin page: every account, with a temporary password or deletion ---------- */
async function viewAdmin(){
  let users = null, q = "";
  mount(`<section class="adm">
    <div class="reader-h"><button class="icon-btn" id="aBack" type="button" aria-label="Înapoi"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div><span class="eyebrow" id="aCount">Conturi</span><h2>Administrare</h2></div></div>
    <input class="input" id="aQ" type="search" placeholder="Caută după nume sau email" aria-label="Caută" autocomplete="off" spellcheck="false">
    <div class="adm-list" id="aList"><div class="empty">Se încarcă…</div></div>
  </section>`);
  $("#aBack").onclick = () => viewHome();
  const call = async body => { const token = await store.token(); return token ? store.call("admin", body, token) : {ok:false, error:"auth"}; };
  const draw = () => {
    const el = $("#aList"); if (!el || !users) return;
    const f = fold(q), list = users.filter(u => !f || fold(u.name + " " + u.email + " " + u.parent).includes(f));
    $("#aCount").textContent = `${users.length} ${users.length === 1 ? "cont" : "conturi"}`;
    let html = "";
    const dateStr = d => new Date(d).toLocaleDateString("ro-RO", {day:"numeric", month:"short"});
    const role = u => u.me ? "Tu" : (u.is_parent && !u.parent ? "Părinte" : "");
    const drawRow = (u, isChild) => `<div class="adm-card ${isChild ? 'child' : ''}">
      <div class="ac-top">
        <span class="avatar sm">${esc(initials(u.name))}</span>
        <div class="ac-info">
          <b class="${u.hidden ? 'hid' : ''}">${esc(u.name)}</b>
          <span class="ac-sub">${u.email ? esc(u.email) : (u.parent ? `Sub contul lui ${esc(u.parent)}` : "Fără email")}</span>
        </div>
      </div>
      <div class="ac-meta">${role(u) ? role(u) + " · " : ""}${u.points || 0} pct · ${u.tests || 0} teste · ${dateStr(u.last_active)}</div>
      <div class="ac-actions">
        <button class="btn btn-ghost" type="button" data-aedit="${u.id}">Modifică</button>
        ${u.name.trim().split(/\s+/).length === 2 ? `<button class="btn btn-ghost" type="button" data-aswap="${u.id}">Inversează</button>` : ""}
        ${!u.parent && !u.me ? `<button class="btn btn-ghost" type="button" data-apw="${u.id}">Parolă nouă</button>` : ""}
        ${!u.me ? `<button class="btn btn-danger-soft" type="button" data-adel="${u.id}">Șterge</button>` : ""}
      </div>
    </div>`;

    if (!list.length) {
      html = `<div class="empty">Niciun cont găsit.</div>`;
    } else if (f) {
      // flat list for search
      html = list.map(u => drawRow(u, false)).join("");
    } else {
      // group by family
      const byId = {};
      list.forEach(u => { u.children = []; byId[u.id] = u; });
      const tree = [];
      list.forEach(u => {
        if (u.parent_id && byId[u.parent_id]) byId[u.parent_id].children.push(u);
        else tree.push(u);
      });
      html = tree.map(u => drawRow(u, false) + u.children.map(c => drawRow(c, true)).join("")).join("");
    }
    el.innerHTML = html;
    el.querySelectorAll("[data-aedit]").forEach(b => b.onclick = () => {
      const u = users.find(x => x.id === b.dataset.aedit);
      let f = "", l = ""; if (u.name.includes(" ")) { f = u.name.substring(0, u.name.indexOf(" ")); l = u.name.substring(u.name.indexOf(" ") + 1); } else f = u.name;
      const bg = document.createElement("div"); bg.className = "modal-bg";
      bg.innerHTML = `<form class="modal ed-modal" role="dialog" aria-modal="true" aria-labelledby="edH" novalidate><h3 id="edH">Modifică numele</h3><div class="ed-row"><div class="field"><label for="edLast">Nume de Familie</label><input class="input" id="edLast" value="${esc(l)}" required maxlength="30" autocapitalize="words"></div><div class="field"><label for="edFirst">Prenume</label><input class="input" id="edFirst" value="${esc(f)}" required maxlength="30" autocapitalize="words"></div></div><button class="btn btn-ghost ed-swap" type="button" id="edSwap">Inversează</button><p class="form-error" id="edErr" role="alert"></p><div class="modal-btns"><button class="btn btn-ghost" type="button" id="edCancel">Anulează</button><button class="btn btn-primary" type="submit" id="edGo">Salvează</button></div></form>`;
      document.body.appendChild(bg); const close = () => closeModal(bg); bg.querySelector("#edCancel").onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
      const err = bg.querySelector("#edErr"), fIn = bg.querySelector("#edFirst"), lIn = bg.querySelector("#edLast");
      bg.querySelector("#edSwap").onclick = () => { const t = fIn.value; fIn.value = lIn.value; lIn.value = t; err.textContent = ""; };
      bg.querySelector("form").onsubmit = async e => {
        e.preventDefault(); const nf = capName(fIn.value), nl = capName(lIn.value);
        if (!slugOf(nf) || !slugOf(nl)) { err.textContent = "Nume invalid."; return; }
        const btn = bg.querySelector("#edGo"); btn.disabled = true; btn.textContent = "Se salvează…";
        const r = await call({action: "edit_name", id: u.id, first: nf, last: nl});
        if (!r.ok) { btn.disabled = false; btn.textContent = "Salvează"; err.textContent = r.error === "name_taken" ? "Există deja un cont cu acest nume." : "Nu s-a putut salva. Încearcă din nou."; return; }
        u.name = r.name; S.board = null; draw(); close(); toast("Numele a fost modificat.");
      };
    });
    el.querySelectorAll("[data-aswap]").forEach(b => b.onclick = async () => {
      const u = users.find(x => x.id === b.dataset.aswap), [a, c] = u.name.trim().split(/\s+/);
      b.disabled = true;
      const r = await call({action: "edit_name", id: u.id, first: c, last: a});
      if (!r.ok) { b.disabled = false; return toast(r.error === "name_taken" ? "Există deja un cont cu acest nume." : "Nu s-a putut salva."); }
      u.name = r.name; S.board = null; draw(); toast(`Acum: ${r.name}`);
    });
    el.querySelectorAll("[data-adel]").forEach(b => b.onclick = () => {
      const u = users.find(x => x.id === b.dataset.adel), kids = users.filter(x => x.parent === u.name).length;
      confirmBox(`Ștergi contul lui ${u.name}?`, `Rezultatele și locul din clasament se șterg definitiv${kids ? `, împreună cu ${kids === 1 ? "profilul copilului" : `cele ${kids} profiluri de copii`}` : ""}.`, "Șterge", async () => {
        const r = await call({action: "delete", id: u.id});
        if (!r.ok) return toast("Nu s-a putut șterge. Încearcă din nou.");
        users = users.filter(x => x.id !== u.id && x.parent !== u.name); S.board = null; draw(); toast("Contul a fost șters.");
      });
    });
    el.querySelectorAll("[data-apw]").forEach(b => b.onclick = () => {
      const u = users.find(x => x.id === b.dataset.apw);
      confirmBox(`Parolă nouă pentru ${u.name}?`, "Parola veche nu va mai merge. Îi dai parola nouă, iar el o poate schimba din profil.", "Generează", async () => {
        const token = await store.token(), r = token ? await store.call("admin-reset", {id: u.id, who: u.email || u.name}, token) : {ok:false};
        if (!r.ok) return toast("Nu s-a putut genera parola.");
        showTempPassword(r.name, r.password);
      });
    });
  };
  $("#aQ").oninput = e => { q = e.target.value; draw(); };
  const r = await call({action: "list"});
  if (!$("#aList")) return;
  if (!r.ok){ $("#aList").innerHTML = `<div class="empty">${r.error === "forbidden" ? "Doar administratorul are acces aici." : "Lista nu s-a putut încărca."}</div>`; return; }
  users = r.users; draw();
}
function showTempPassword(name, pw){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>Parolă provizorie</h3><p class="muted">Parola nouă pentru <b style="color:var(--ink)">${esc(name)}</b>:</p>
    <p class="temp-pw">${esc(pw)}</p>
    <div class="modal-btns"><button class="btn btn-ghost" id="tpCopy" type="button">Copiază</button><button class="btn btn-primary" id="tpOk" type="button">Gata</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => closeModal(bg);
  bg.querySelector("#tpOk").onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector("#tpCopy").onclick = async () => { try { await navigator.clipboard.writeText(pw); toast("Parola a fost copiată."); } catch { toast(pw, 5000); } };
}

/* ---------- family: a parent and its children on one phone ---------- */
function familyHTML(){
  if (!S.player || S.player.guest || !store.isParent || (store.family || []).length < 2) return "";
  return `<div class="family" role="group" aria-label="Cine face testul"><span class="family-l">Cine face testul?</span>${store.family.map(x =>
    `<button class="fam ${x.id === store.pid ? "on" : ""}" type="button" data-play="${x.id}" aria-pressed="${x.id === store.pid}"><span class="avatar sm">${esc(initials(x.name))}</span>${esc(x.name.split(" ")[0])}</button>`).join("")}</div>`;
}
/* children share the parent's family name, so only first names are asked */
async function addChild(first, last){
  const token = await store.token(), r = token ? await store.call("family", {action: "add", first, last}, token) : {ok:false, error:"auth"};
  if (r.ok){ store.family = [...(store.family || []), {id: r.id, name: r.name, child: true}]; S.board = null; }
  return r;
}
function childError(r){ return ({ name_taken: "Există deja cineva cu acest nume. Adaugă și al doilea prenume.", too_many: "Poți adăuga cel mult 10 copii." })[r.error] || loginError(r); }
function askChildren(last){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<form class="modal kids-modal" role="dialog" aria-modal="true" aria-labelledby="akH" novalidate>
    <h3 id="akH">Copiii tăi</h3>
    <p class="muted">Scrie prenumele fiecărui copil; numele tău de familie este adăugat implicit, dar îl poți modifica.</p>
    <div class="ak-list" id="akList"></div>
    <button class="link" type="button" id="akMore">+ Încă un copil</button>
    <p class="form-error" id="akErr" role="alert"></p>
    <div class="modal-btns"><button class="btn btn-ghost" type="button" id="akLater">Mai târziu</button><button class="btn btn-primary" type="submit" id="akGo">Adaugă</button></div></form>`;
  document.body.appendChild(bg);
  const list = bg.querySelector("#akList"), err = bg.querySelector("#akErr"), close = () => closeModal(bg);
  const row = () => { const d = document.createElement("div"); d.className = "ak-row"; d.innerHTML = `<input class="input" name="first" maxlength="30" autocapitalize="words" placeholder="Prenume" aria-label="Prenumele copilului"><input class="input" name="last" maxlength="30" autocapitalize="words" placeholder="Nume" value="${esc(last)}" aria-label="Numele de familie al copilului">`; list.appendChild(d); };
  row();
  bg.querySelector("#akMore").onclick = () => { if (list.children.length < 10) row(); };
  bg.querySelector("#akLater").onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.oninput = () => { err.textContent = ""; };
  bg.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const rows = [...list.querySelectorAll(".ak-row")];
    const inputs = rows.map(r => r.querySelector("[name=first]"));
    const names = inputs.map(i => capName(i.value)).filter(slugOf);
    if (!names.length){ err.textContent = "Scrie cel puțin un prenume."; inputs[0].focus(); return; }
    const btn = bg.querySelector("#akGo"); btn.disabled = true; btn.textContent = "Se adaugă…";
    for (const r of rows){
      const fIn = r.querySelector("[name=first]"), lIn = r.querySelector("[name=last]");
      const n = capName(fIn.value); if (!slugOf(n)) { r.remove(); continue; }
      const l = capName(lIn.value) || last;
      const res = await addChild(n, l);
      if (!res.ok){ btn.disabled = false; btn.textContent = "Adaugă"; err.textContent = `${n}: ${childError(res)}`; fIn.focus(); return; }
      r.remove();
    }
    closeModal(bg, () => {
      viewHome();
      toast("Gata! Pe pagina principală poți alege oricând cine face testul.", 4000);
    });
  };
}
async function switchPlayer(id){
  if (id === store.pid) return;
  if (S.quiz) S.quiz = null;
  try { S.player = await store.loadPlayer(id); }
  catch { return toast(loginError({error: "network"})); }
  S.board = null; viewHome();
  toast(`Acum face testul ${S.player.name.split(" ")[0]}.`);
}
function confirmBox(title, text, yes, onYes){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="modal-btns"><button class="btn btn-ghost" id="cNo" type="button">Anulează</button><button class="btn btn-primary" id="cYes" type="button">${esc(yes)}</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => closeModal(bg);
  bg.querySelector("#cNo").onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector("#cYes").onclick = () => closeModal(bg, onYes);
}

if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

/* ---------- boot ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    const openBg = document.querySelector(".sheet-bg:not(.closing), .modal-bg:not(.closing)");
    if (openBg){ e.preventDefault(); closeModal(openBg); return; }
  }
  if (!S.quiz || !$(".qcard") || e.target.tagName==="INPUT") return;
  const q = S.quiz.qs[S.quiz.i], ui = S.quiz.ui;
  if (e.key==="Enter"){ e.preventDefault(); if (ui.checked) next(); else if (ready(q) && $("#chk")) check(); }
  if (!ui.checked && (q.t==="one"||q.t==="multi")){ const i = LETTERS.toLowerCase().indexOf(e.key.toLowerCase()); const b = $(`.opt[data-i="${i}"]`); if (i>=0 && b) b.click(); }
  if (!ui.checked && q.t==="tf"){ if (e.key.toLowerCase()==="a") $('.opt[data-v="1"]').click(); if (e.key.toLowerCase()==="f") $('.opt[data-v="0"]').click(); }
});
