  <div class="section-h"><h3>${wrong.length ? "De revăzut" : "Nicio greșeală"}</h3>${wrong.length?`<span class="muted" style="font-size:14px">${wrong.length} întrebări</span>`:""}</div>
  <div class="mistakes">${wrong.length ? wrong.map(mistakeHTML).join("") : `<div class="allgood">Toate răspunsurile sunt corecte.</div>`}</div>
  <div class="startbar" style="display:grid;grid-template-columns:${wrong.length?"1fr 1fr":"1fr"};gap:10px">
    ${wrong.length ? `<button class="btn btn-oil" id="retry">Reia greșelile</button>` : ""}
    <button class="btn btn-primary" id="home">Test nou</button>
  </div>
  ${Z.chs.length === 1 && wrong.length ? `<button class="link read-link" id="readCh" type="button">Citește capitolul ${Z.chs[0]}</button>` : ""}
  <p class="muted" id="saveNote" style="text-align:center;font-size:13px"></p>`);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const C = 2*Math.PI*52; $("#ringArc").setAttribute("stroke-dasharray", `${C*P/100} ${C}`);
    app.querySelectorAll("[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
    const el = $("#pctNum"), t0 = performance.now();
    const tick = t => { const k = Math.min(1,(t-t0)/1300), e = 1-Math.pow(1-k,3); el.textContent = Math.round(P*e) + "%"; if (k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    if (P >= 80 && !matchMedia("(prefers-reduced-motion: reduce)").matches){
      const sp = $("#sparks"); for (let i=0;i<22;i++){ const a = Math.random()*Math.PI*2, d = 90+Math.random()*60; const s = document.createElement("i"); s.className = "spark"; s.style.setProperty("--dx", Math.cos(a)*d+"px"); s.style.setProperty("--dy", Math.sin(a)*d+"px"); s.style.animationDelay = (1+Math.random()*.4)+"s"; s.style.background = i%3 ? "var(--oil)" : "var(--cedar)"; sp.appendChild(s); }
    }
  }));
  if (wrong.length) $("#retry").onclick = () => startQuiz(shuffle(wrong.map(x => { const o = {...x.q}; const src = QUIZ[o.ch][o.mode][+o.id.slice(String(o.ch).length+1)]; return {...src, ch:o.ch, mode:o.mode, id:o.id}; })), 0, {retry: true, mode: Z.mode});
  if ($("#readCh")) $("#readCh").onclick = () => viewRead(Z.chs[0]);
  $("#home").onclick = () => viewHome();
  const res = await saving;

  const note = $("#saveNote"); if (note && res && !res.guest) note.textContent = res.saved ? "" : "Rezultatul nu s-a putut trimite. Se trimite automat la următoarea intrare.";
}
function mistakeHTML({q, a}){
  a = a || {pts:0, given:null, skipped:true};
  const skipped = a.skipped || a.given==null;
  let yours = "", correct = "";
  if (q.t==="tf"){ yours = skipped ? "—" : (a.given?"Adevărat":"Fals"); correct = q.a?"Adevărat":"Fals"; }
  if (q.t==="one"){ yours = skipped ? "—" : esc(q.opts[a.given]); correct = esc(q.opts[q.a]); }
  if (q.t==="multi"){ yours = skipped ? "—" : (a.given.length ? a.given.map(i=>esc(q.opts[i])).join("; ") : "niciuna"); correct = q.a.length ? q.a.map(i=>esc(q.opts[i])).join("; ") : "niciuna"; }
  if (q.t==="fill"){ yours = skipped ? "—" : a.given.map(esc).join(", "); correct = q.a.map(esc).join(", "); }
  if (q.t==="match"){
    yours = skipped ? "—" : q.pairs.map((p,i)=> a.given[i]===i ? null : `${esc(p[0])} → ${a.given[i]!=null ? esc(q.pairs[a.given[i]][1]) : "—"}`).filter(Boolean).join("<br>");
    correct = q.pairs.map(p=>`${esc(p[0])} → ${esc(p[1])}`).join("<br>");
  }
  const qtext = q.t==="fill" ? esc(q.q).replace(/___/g, "<b>____</b>") : esc(q.q.replace(/\s*\(pot fi mai multe[^)]*\)/i, ""));
  return `<article class="mistake"><div class="qmeta"><span class="qtype">${TYPE_LABEL[q.t]}</span><span class="ref">${refLabel(q.ref)}</span></div>
    <p class="q">${qtext}</p>
    <div class="ans"><div><span class="l">Răspunsul tău</span><span class="${skipped?"":"y"}">${yours}</span></div><div><span class="l">Corect</span><span class="c">${correct}</span></div></div>
    <div class="verse">${verseHTML(q.ref)}</div></article>`;
}

/* ---------- reading a chapter before the test ---------- */
/* highlighted verses ("ch:v"): kept on the phone per player, and on the account when signed in */
const hlKey = () => "candela:hl:" + (S.player.guest ? "guest" : store.pid);
const hlGet = () => new Set(lsGet(hlKey(), []));
const hlSave = set => lsSet(hlKey(), [...set]);
async function hlSync(){
  if (S.player.guest) return false;
  const r = await store.rpc("my_highlights", { p_player: store.pid });
  if (r.ok) hlSave(new Set((r.data || []).map(x => `${x.ch}:${x.v}`)));
  return r.ok;
}
async function hlToggle(c, el){
  const k = `${c}:${el.dataset.v}`, set = hlGet(), on = !set.has(k);
  on ? set.add(k) : set.delete(k); hlSave(set); el.classList.toggle("hl", on);
  lsSet("candela:hlhint", true); const hint = $(".hl-hint"); if (hint) hint.remove();
  if (S.player.guest) return;
  const r = await store.rpc("set_highlight", { p_player: store.pid, p_ch: c, p_v: +el.dataset.v, p_on: on });
  if (!r.ok){ const back = hlGet(); on ? back.delete(k) : back.add(k); hlSave(back); el.classList.toggle("hl", !on); toast("Nu s-a putut salva. Verifică internetul."); }
}

/* the whole book can be read, one chapter at a time; the last chapter read is remembered */
function viewRead(c){
  c = Math.min(31, Math.max(1, +c || 1)); lsSet("candela:read", c);
  const vs = TEXT[c] || [], hl = hlGet();
  mount(`<section class="reader">
    <div class="reader-h"><button class="icon-btn" id="rBack" type="button" aria-label="Înapoi"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div><span class="eyebrow">1 Samuel ${c}</span><h2>${esc(TITLES[c-1])}</h2></div></div>
    <label class="r-pick"><span>Capitolul</span><select class="input" id="rPick">${TITLES.map((t, i) => `<option value="${i+1}" ${i+1 === c ? "selected" : ""}>${i+1}. ${esc(t)}</option>`).join("")}</select></label>
    ${lsGet("candela:hlhint", false) ? "" : `<p class="hl-hint">Atinge un verset ca să-l colorezi. Atinge-l din nou ca să-l ștergi.</p>`}
    <div class="reader-text">${vs.map((v, i) => `<p data-v="${i+1}" class="${hl.has(`${c}:${i+1}`) ? "hl" : ""}"><sup>${i+1}</sup>${esc(v)}</p>`).join("")}</div>
    <div class="r-nav">${c > 1 ? `<button class="btn btn-ghost" id="rPrev" type="button">← Capitolul ${c-1}</button>` : "<span></span>"}${c < 31 ? `<button class="btn btn-ghost" id="rNext" type="button">Capitolul ${c+1} →</button>` : ""}</div>
    <div class="startbar"><button class="btn btn-primary btn-block" id="rGo" type="button"><span class="st-main">Fă testul pe capitolul ${c}</span></button></div>
  </section>`);
  document.body.insertAdjacentHTML("beforeend", `${c > 1 ? `<button class="r-side l" id="rSideP" type="button" aria-label="Capitolul ${c-1}" title="Capitolul ${c-1}"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : ""}
  ${c < 31 ? `<button class="r-side r" id="rSideN" type="button" aria-label="Capitolul ${c+1}" title="Capitolul ${c+1}"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : ""}`);
  $("#rBack").onclick = () => viewHome();
  $(".reader-text").onclick = e => { const el = e.target.closest("p[data-v]"); if (el && !String(getSelection())) hlToggle(c, el); };
  hlSync().then(ok => { if (!ok || !$(".reader") || +$("#rPick").value !== c) return; const now = hlGet(); app.querySelectorAll(".reader-text p[data-v]").forEach(p => p.classList.toggle("hl", now.has(`${c}:${p.dataset.v}`))); });
  $("#rPick").onchange = e => viewRead(+e.target.value);
  if ($("#rPrev")) $("#rPrev").onclick = () => viewRead(c - 1);
  if ($("#rNext")) $("#rNext").onclick = () => viewRead(c + 1);
  if ($("#rSideP")) $("#rSideP").onclick = () => viewRead(c - 1);
  if ($("#rSideN")) $("#rSideN").onclick = () => viewRead(c + 1);
  $("#rGo").onclick = () => { S.scope = "one"; S.sel = new Set([c]); persistPrefs(); openOptions([c]); };
}

/* ---------- first-launch tutorial ---------- */
function tutorial(){
  const slides = [
    { art: `<div class="tut-grid">${[1,2,3,4,5,6,7,8].map(c => `<span class="tile" aria-pressed="${c===3}"><span class="n">${c}</span></span>`).join("")}</div>`,
      h: "1. Alege capitolul", p: "Atinge un capitol, apoi „Începe”. Cu „Citește” poți citi capitolul înainte." },
    { art: `<div class="seg"><button aria-pressed="true">Ușor</button><button aria-pressed="false">Greu</button><button aria-pressed="false">Ambele</button></div>`,
      h: "2. Alege nivelul", p: "„Ușor” pentru început. „Greu” când vrei detalii: nume, cifre, locuri." },
    { art: `<div class="feedback ok"><b>Corect</b><div class="verse"><sup>3</sup>${esc((TEXT[3]||[])[2] || "")}</div></div>`,
      h: "3. Răspunde și învață", p: "După fiecare răspuns vezi versetul din Biblie. La final poți relua greșelile." },
  ];
  let i = 0;
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal tut" role="dialog" aria-modal="true" aria-labelledby="tutH"></div>`;
  document.body.appendChild(bg);
  const box = bg.querySelector(".tut");
  const close = () => { lsSet("candela:tutorial", true); bg.remove(); };
  const draw = () => {
    const x = slides[i], last = i === slides.length - 1;
    box.innerHTML = `<div class="tut-art">${x.art}</div><h3 id="tutH">${x.h}</h3><p>${x.p}</p>
      <div class="tut-dots">${slides.map((_, k) => `<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <div class="modal-btns"><button class="btn btn-ghost" id="tSkip" type="button">${i ? "Înapoi" : "Sari peste"}</button><button class="btn btn-primary" id="tNext" type="button">${last ? "Să începem" : "Înainte"}</button></div>`;
    box.querySelector("#tSkip").onclick = () => { if (i){ i--; draw(); } else close(); };
    box.querySelector("#tNext").onclick = () => { if (last) close(); else { i++; draw(); } };
    box.querySelector("#tNext").focus();
  };
  draw();
}

/* ---------- admin page: every account, with a temporary password or deletion ---------- */
async function viewAdmin(){
  let users = null, q = "";
  mount(`<section class="adm">
    <div class="reader-h"><button class="icon-btn" id="aBack" type="button" aria-label="Înapoi"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div><span class="eyebrow" id="aCount">Conturi</span><h2>Administrare</h2></div></div>
    <input class="input" id="aQ" type="search" placeholder="Caută după nume sau email" aria-label="Caută" autocomplete="off" spellcheck="false">
    <div class="adm-list" id="aList"><div class="empty">Se încarcă…</div></div>
  </section>`);
  $("#aBack").onclick = () => viewHome();
  const call = async body => { const token = await store.token(); return token ? store.call("admin", body, token) : {ok:false, error:"auth"}; };
  const draw = () => {
    const el = $("#aList"); if (!el || !users) return;
    const f = fold(q), list = users.filter(u => !f || fold(u.name + " " + u.email + " " + u.parent).includes(f));
    $("#aCount").textContent = `${users.length} ${users.length === 1 ? "cont" : "conturi"}`;
    el.innerHTML = list.length ? list.map(u => `<div class="adm-row">
      <span class="avatar sm">${esc(initials(u.name))}</span>
      <div class="adm-who"><b>${esc(u.name)}${u.me ? " <em>tu</em>" : ""}</b><small>${u.email ? esc(u.email) : u.parent ? `copil · ${esc(u.parent)}` : "fără email"}</small>
        <small>${u.tests} ${u.tests === 1 ? "test" : "teste"} · din ${new Date(u.created).toLocaleDateString("ro-RO", {day:"numeric", month:"short", year:"numeric"})}</small></div>
      <div class="adm-a">${u.parent || u.me ? "" : `<button class="link" type="button" data-apw="${u.id}">Parolă</button>`}${u.me ? "" : `<button class="link danger" type="button" data-adel="${u.id}">Șterge</button>`}</div></div>`).join("")
      : `<div class="empty">Niciun cont găsit.</div>`;
    el.querySelectorAll("[data-adel]").forEach(b => b.onclick = () => {
      const u = users.find(x => x.id === b.dataset.adel), kids = users.filter(x => x.parent === u.name).length;
      confirmBox(`Ștergi contul lui ${u.name}?`, `Rezultatele și locul din clasament se șterg definitiv${kids ? `, împreună cu ${kids === 1 ? "profilul copilului" : `cele ${kids} profiluri de copii`}` : ""}.`, "Șterge", async () => {
        const r = await call({action: "delete", id: u.id});
        if (!r.ok) return toast("Nu s-a putut șterge. Încearcă din nou.");
        users = users.filter(x => x.id !== u.id && x.parent !== u.name); S.board = null; draw(); toast("Contul a fost șters.");
      });
    });
    el.querySelectorAll("[data-apw]").forEach(b => b.onclick = () => {
      const u = users.find(x => x.id === b.dataset.apw);
      confirmBox(`Parolă nouă pentru ${u.name}?`, "Parola veche nu va mai merge. Îi dai parola nouă, iar el o poate schimba din profil.", "Generează", async () => {
        const token = await store.token(), r = token ? await store.call("admin-reset", {who: u.email || u.name}, token) : {ok:false};
        if (!r.ok) return toast("Nu s-a putut genera parola.");
        showTempPassword(r.name, r.password);
      });
    });
  };
  $("#aQ").oninput = e => { q = e.target.value; draw(); };
  const r = await call({action: "list"});
  if (!$("#aList")) return;
  if (!r.ok){ $("#aList").innerHTML = `<div class="empty">${r.error === "forbidden" ? "Doar administratorul are acces aici." : "Lista nu s-a putut încărca."}</div>`; return; }
  users = r.users; draw();
}
function showTempPassword(name, pw){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>Parolă provizorie</h3><p class="muted">Parola nouă pentru <b style="color:var(--ink)">${esc(name)}</b>:</p>
    <p class="temp-pw">${esc(pw)}</p>
    <div class="modal-btns"><button class="btn btn-ghost" id="tpCopy" type="button">Copiază</button><button class="btn btn-primary" id="tpOk" type="button">Gata</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#tpOk").onclick = () => bg.remove();
  bg.querySelector("#tpCopy").onclick = async () => { try { await navigator.clipboard.writeText(pw); toast("Parola a fost copiată."); } catch { toast(pw, 5000); } };
}

/* ---------- family: a parent and its children on one phone ---------- */
function familyHTML(){
  if (!S.player || S.player.guest || !store.isParent || (store.family || []).length < 2) return "";
  return `<div class="family" role="group" aria-label="Cine exersează"><span class="family-l">Cine exersează?</span>${store.family.map(x =>
    `<button class="fam ${x.id === store.pid ? "on" : ""}" type="button" data-play="${x.id}" aria-pressed="${x.id === store.pid}"><span class="avatar sm">${esc(initials(x.name))}</span>${esc(x.name.split(" ")[0])}</button>`).join("")}</div>`;
}
/* children share the parent's family name, so only first names are asked */
async function addChild(first, last){
  const token = await store.token(), r = token ? await store.call("family", {action: "add", first, last}, token) : {ok:false, error:"auth"};
  if (r.ok){ store.family = [...(store.family || []), {id: r.id, name: r.name, child: true}]; S.board = null; }
  return r;
}
function childError(r){ return ({ name_taken: "Există deja cineva cu acest nume. Adaugă și al doilea prenume.", too_many: "Poți adăuga cel mult 10 copii." })[r.error] || loginError(r); }
function askChildren(last){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<form class="modal kids-modal" role="dialog" aria-modal="true" aria-labelledby="akH" novalidate>
    <h3 id="akH">Copiii tăi</h3>
    <p class="muted">Scrie prenumele fiecărui copil. Fiecare va avea rezultatele și locul lui în clasament.</p>
    <div class="ak-list" id="akList"></div>
    <button class="link" type="button" id="akMore">+ Încă un copil</button>
    <p class="form-error" id="akErr" role="alert"></p>
    <div class="modal-btns"><button class="btn btn-ghost" type="button" id="akLater">Mai târziu</button><button class="btn btn-primary" type="submit" id="akGo">Adaugă</button></div></form>`;
  document.body.appendChild(bg);
  const list = bg.querySelector("#akList"), err = bg.querySelector("#akErr"), close = () => bg.remove();
  const row = () => { const d = document.createElement("div"); d.className = "ak-row"; d.innerHTML = `<input class="input" maxlength="30" autocapitalize="words" placeholder="Prenume" aria-label="Prenumele copilului"><span class="ak-last">${esc(last)}</span>`; list.appendChild(d); d.querySelector("input").focus(); };
  row();
  bg.querySelector("#akMore").onclick = () => { if (list.children.length < 10) row(); };
  bg.querySelector("#akLater").onclick = close;
  bg.oninput = () => { err.textContent = ""; };
  bg.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const inputs = [...list.querySelectorAll("input")], names = inputs.map(i => capName(i.value)).filter(slugOf);
    if (!names.length){ err.textContent = "Scrie cel puțin un prenume."; inputs[0].focus(); return; }
    const btn = bg.querySelector("#akGo"); btn.disabled = true; btn.textContent = "Se adaugă…";
    for (const i of inputs){
      const n = capName(i.value); if (!slugOf(n)) { i.closest(".ak-row").remove(); continue; }
      const r = await addChild(n, last);
      if (!r.ok){ btn.disabled = false; btn.textContent = "Adaugă"; err.textContent = `${n}: ${childError(r)}`; i.focus(); return; }
      i.closest(".ak-row").remove();
    }
    close(); viewHome();
    toast("Gata. Alege pe acasă cine exersează.", 4000);
  };
}
async function switchPlayer(id){
  if (id === store.pid) return;
  if (S.quiz) S.quiz = null;
  try { S.player = await store.loadPlayer(id); }
  catch { return toast(loginError({error: "network"})); }
  S.board = null; viewHome();
  toast(`Acum exersează ${S.player.name.split(" ")[0]}.`);
}
function confirmBox(title, text, yes, onYes){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="modal-btns"><button class="btn btn-ghost" id="cNo" type="button">Anulează</button><button class="btn btn-primary" id="cYes" type="button">${esc(yes)}</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector("#cNo").onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector("#cYes").onclick = () => { close(); onYes(); };
}
