<title>Candela 1 Samuel</title>
<meta name="description" content="Pregătire pentru testul biblic din 1 Samuel, după traducerea Cornilescu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column (max 640px) like a pocket study book; a lamp flame is the recurring mark of progress. */
:root{
  --bg:#F8F1E6;          /* warm cream */
  --surface:#FFFBF4;
  --surface-2:#F1E6D5;
  --ink:#3A271B;         /* dark brown */
  --ink-2:#7B6450;
  --line:#E7D8C2;
  --oil:#D97B26;         /* lamp oil / flame orange */
  --oil-soft:#FBE5CC;
  --oil-ink:#8A4510;
  --cedar:#8A5A36;       /* warm brown (easy level, avatars) */
  --cedar-soft:#F2E3D2;
  --ok:#5E8A3A; --ok-soft:#E8F0DA;
  --warn:#D99C26; --warn-soft:#FCF0D2;
  --bad:#B23A2E; --bad-soft:#FBE4DF;
  --p1:#D97B26; --p2:#8A5A36; --p3:#B0644A; --p4:#5E8A3A; --p5:#B4534A;
  --shadow:0 4px 12px rgba(58, 39, 27, 0.05), 0 10px 20px rgba(58, 39, 27, 0.05);
  --f-display:"Outfit", "Georgia", "Times New Roman", serif;
  --f-bible:"Source Serif 4", "Georgia", "Times New Roman", serif;
  --f-body:"Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
  color-scheme:light;
}



*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .35s ease}
body.ans-ok .qcard{border:1.5px solid var(--ok);box-shadow:0 4px 24px -4px rgba(94,138,58,.22)}
body.ans-no .qcard{border:1.5px solid var(--bad);box-shadow:0 4px 24px -4px rgba(178,58,46,.22)}
button,input,select,textarea,summary{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus,button:focus-visible,summary:focus,summary:focus-visible{outline:none!important}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--oil);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;width:100%;box-sizing:border-box;margin:0 auto;padding-inline:16px;padding-block:20px calc(48px + env(safe-area-inset-bottom,0px))}
.view{max-width:640px;width:100%;box-sizing:border-box;margin:0 auto;min-width:0}
.view:has(.home){max-width:1180px}
.wrap:has(.entry){min-height:100dvh;min-height:var(--vvh,100dvh);display:flex;flex-direction:column;padding-inline:16px;padding-block:clamp(10px,2.5vh,28px);box-sizing:border-box}
.view:has(.entry){width:100%;max-width:440px;margin:auto;display:flex;flex-direction:column}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--oil-ink);background:var(--oil-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.muted{color:var(--ink-2)}
.view{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view:has(.qtop){animation:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:16px;padding:14px 22px;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:0.04em;transition:all .15s ease;min-height:50px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0px 0 transparent !important;}
.btn-primary{background:var(--ink);color:var(--bg);box-shadow:0 4px 0 var(--ink-2)}
@media (hover: hover) and (pointer: fine){.btn-primary:hover{filter:brightness(1.1)}}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
@media (hover: hover) and (pointer: fine){
  .btn-ghost:hover{border-color:var(--ink-2)}
}
.btn-oil{background:var(--oil);color:#fff;box-shadow:0 4px 0 var(--oil-ink)}
.btn-block{width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--ink-2);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* Entry */
.entry{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);width:100%;max-width:420px;margin:0 auto}
.entry[data-step="form"]{padding-top:0}
.entry-head{display:grid;justify-items:center;gap:2px;flex:none;text-align:center}
.entry-head .lamp-wrap{position:relative;margin-bottom:-4px}
.entry-head .lamp-wrap svg{width:clamp(68px,10vh,92px);height:auto}
.entry .lamp-glow{position:absolute;inset:-25px 0 auto;height:140px;background:radial-gradient(closest-side,color-mix(in oklab,var(--oil) 45%,transparent),transparent);filter:blur(8px);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
.entry h1{font-family:var(--f-display);font-size:clamp(30px,6vw,38px);line-height:1.05;text-align:center;letter-spacing:-.01em}
.entry h1 span{display:block;font-size:13px;letter-spacing:.04em;color:var(--ink-2);margin-top:2px;font-family:var(--f-body);font-weight:600}
.entry .back{align-self:center;font-size:13.5px;padding:3px 8px;margin-top:1px}
.verse-quote{font-family:var(--f-display);font-size:13px;line-height:1.3;text-align:center;max-width:32ch;margin:2px auto 0;color:var(--ink-2)}
.verse-quote .ref{margin-left:6px;vertical-align:1px;font-size:11px;padding:2px 6px}
.seg.two{grid-template-columns:1fr 1fr}
.entry .seg{padding:3px;margin-bottom:2px}
.entry .seg button{padding:6px 6px;font-size:13.5px}
.name-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entry-form{display:grid;gap:clamp(8px,1.4vh,12px);padding:clamp(16px,2.4vh,20px) clamp(16px,3vw,22px)!important}
.remember{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;margin-top:2px}
.remember input{width:16px;height:16px;accent-color:var(--cedar);margin:0}
.board.scroll{position:relative;align-content:start}
.entry .board.scroll{flex:1;min-height:0}
.lamp-wrap{display:flex;justify-content:center;position:relative}
.lamp-glow{position:absolute;inset:-40px 0 auto;height:220px;background:radial-gradient(closest-side,color-mix(in oklab,var(--oil) 40%,transparent),transparent);filter:blur(6px);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
.flame{transform-origin:50% 90%;animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scaleY(1) skewX(0)}25%{transform:scaleY(1.06) skewX(-2deg)}50%{transform:scaleY(.96) skewX(1.5deg)}75%{transform:scaleY(1.04) skewX(-1deg)}}
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--ink)}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9.5px 12px;font-size:15px;min-height:40px;transition:border-color .2s, background .2s}
.entry #go{min-height:46px;padding:12px 20px;font-size:15.5px;margin-top:2px}
.input:focus{outline:none;border-color:var(--oil);background:var(--surface)}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;transition:all .15s}
@media (hover: hover) and (pointer: fine){
  .chip:hover{border-color:var(--ink-2);color:var(--ink)}
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:not-allowed;border-style:dashed}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-size:25px;line-height:1;border:0;background:transparent;padding:0;color:inherit;cursor:pointer;text-align:left}
.brand.static{cursor:default}
.brand svg{margin:-8px -4px -3px -10px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-width:0;border:0;background:transparent;padding:4px;border-radius:999px}
.prof{justify-items:center;text-align:center;position:relative;padding-top:28px}
.prof .prof-x{position:absolute;top:14px;right:14px}
.prof h3{font-size:28px}
.avatar.lg{width:72px;height:72px;font-size:30px}
.badge-rank{font-size:13px;font-weight:600;color:var(--oil-ink);background:var(--oil-soft);padding:4px 12px;border-radius:999px}
.prof .kv{width:100%}
.prof-mail{color:var(--ink-2);font-size:14px;margin-top:-10px;word-break:break-all}
.prof-mail.warn{color:var(--oil-ink);word-break:normal;max-width:32ch}
.prof-btns{width:100%;display:grid;gap:8px}
.prof{max-height:min(94dvh,calc(100dvh - env(safe-area-inset-top,0px) - 16px));overflow-y:auto}
.pf-head{display:grid;justify-items:center;gap:10px}
.pf-head .prof-mail{margin:0}
.pf-card{width:100%;background:var(--surface);border-radius:16px;padding:16px 18px;display:grid;gap:12px;box-shadow:var(--shadow);text-align:left}
.pf-rules{margin-top:4px;padding-top:14px;border-top:1px solid var(--border);display:grid;gap:8px}
.pf-rule{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.r-icon{color:var(--oil);font-weight:600;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;text-align:center;font-size:14px;flex:none}
.pf-rule b{color:var(--ink);font-weight:600}
.pf-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--ink-2)}
.pf-row b{color:var(--ink);font-weight:600;text-align:right}
#pubBody{display:grid;gap:12px;width:100%;justify-self:stretch}
.pf-bar{display:grid;gap:6px}
.pf-bar-h{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.pf-bar-h b{color:var(--ink);font-weight:600;font-family:var(--f-mono);font-size:13px}
.pf-bar-h span:first-child{color:var(--ink);font-weight:600}
.bar.two{position:relative;height:8px}
.bar.two i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar.two i.seen{opacity:.3}
.pf-bar-f{margin:0;font-size:13.5px;color:var(--ink-2)}
.pf-bar-f b{color:var(--ink)}

.btn-danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in oklab,var(--bad) 35%,transparent)}
.prof .kv{margin:0}
.prof-form{width:100%;display:grid;gap:14px;text-align:left}
.resume-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px 9px 14px;margin-bottom:18px;box-shadow:0 1px 3px rgb(58 39 27 / .04)}
.resume-info{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
.resume-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--oil)}
.resume-title{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none}
.resume-sep{color:var(--line);font-size:12px;flex:none}
.resume-ch{font-size:13.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume-actions{display:flex;align-items:center;gap:6px;flex:none}
.resume-btn{padding:6px 14px;font-size:13px;font-weight:600;min-height:32px;border-radius:999px;background:var(--ink);color:var(--bg);border:none;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
@media(hover:hover) and (pointer:fine){.resume-btn:hover{opacity:.9}}
.resume-btn:active{transform:scale(.96)}
.resume-close{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:transparent;border:none;color:var(--ink-2);cursor:pointer;transition:all .15s ease;padding:0}
@media(hover:hover) and (pointer:fine){.resume-close:hover{color:var(--bad);background:var(--bad-soft)}}
.h-verse{display:none}
.keys{display:none;font-size:12.5px;color:var(--ink-2);font-family:var(--f-mono);margin:0}
.who b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--cedar);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.top .avatar{width:40px;height:40px;font-size:16px}

/* Dashboard */
.hello{display:grid;gap:6px;margin-bottom:20px}
.hello h2{font-size:clamp(30px,8vw,40px);line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--ink-2)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-h h3{font-size:22px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px 6px;font-weight:600;font-size:15px;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.more summary{font-family:var(--f-body);font-size:13.5px;font-weight:600;color:var(--oil-ink);cursor:pointer;margin-top:6px}
.more[open] summary{margin-bottom:6px}
.seg-note{font-size:13px;color:var(--ink-2)}
.who.acct{border:0;padding:4px}
.who.acct .avatar{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.guest-line{font-size:14px;color:var(--ink-2);margin-top:6px}
.guest-line .link{padding:0;color:var(--ink);font-size:inherit}
.guest-cta{display:grid;gap:8px;border-color:var(--oil-soft);background:linear-gradient(180deg,var(--surface),var(--bg))}
.guest-cta b{font-size:17px}
.guest-cta p{color:var(--ink);font-size:15px;font-weight:500;margin:0}
.guest-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.guest-btns .btn{white-space:nowrap;padding-inline:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;display:grid;place-items:center;padding:0;transition:transform .15s, border-color .2s, background .2s}
.tile:active{transform:scale(.94)}
.tile svg{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px)}
.tile-sc{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11.5px;font-weight:600;color:var(--oil-ink);font-family:var(--f-mono);letter-spacing:0.02em}
.tile-sc.full{color:var(--ok)}
.tile .n{font-family:var(--f-display);font-size:22px;line-height:1;position:relative}
.tile:has(.tile-sc) .n{transform:translateY(-6px)}
.tile.t-full{background:var(--ok-soft)}
.tile.t-half{background:var(--warn-soft)}
.tile.t-low{background:var(--bad-soft)}
.tile[aria-pressed="true"]{background:var(--oil-soft);border-color:var(--oil);color:var(--oil-ink);box-shadow:0 0 0 3px color-mix(in oklab,var(--oil) 18%,transparent)}
.tile[aria-pressed="true"] .trk{stroke:color-mix(in oklab,var(--oil) 20%,transparent)}
#start,#rGo,#shGo{display:grid;gap:2px;justify-items:center;padding-block:12px;min-height:60px;line-height:1.2}
#start .st-main,#rGo .st-main,#shGo .st-main{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#start .st-sub,#rGo .st-sub,#shGo .st-sub{font-size:13px;font-weight:500;opacity:.78;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{stroke:var(--surface-2)}
.opts-row{display:grid;gap:4px;background:var(--surface);border-radius:20px;padding:6px 18px;box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--ink-2);font-size:13px}
.counts{display:flex;gap:6px;flex-wrap:wrap}
html.scroll-locked,body.scroll-locked{overflow:hidden!important;overscroll-behavior:none!important}
html:has(.sheet-bg),html:has(.modal-bg),body:has(.sheet-bg),body:has(.modal-bg){overflow:hidden}
.sheet,.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgb(58 39 27 / .45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:modalBgIn .28s cubic-bezier(.16,1,.3,1) both;touch-action:none;overscroll-behavior:contain;box-sizing:border-box}
.sheet-bg.closing{animation:modalBgOut .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.sheet{position:relative;width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px) + var(--kbd-h,0px));display:grid;gap:16px;animation:sheetUp .32s cubic-bezier(.16,1,.3,1) both;will-change:transform,opacity;touch-action:pan-y;overscroll-behavior:contain;max-height:min(94dvh,calc(100dvh - env(safe-area-inset-top,0px) - 16px));overflow-y:auto;box-sizing:border-box}
.sheet-bg.closing .sheet{animation:sheetDown .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h3{font-size:24px}
.dur{font-size:13px;color:var(--ink-2);margin-top:-6px}
.cnt-h{display:flex;justify-content:space-between;align-items:baseline}
.cnt-h b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.cnt-h span small{color:var(--ink-2);font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .icon-btn{font-size:20px;line-height:1;color:var(--ink)}
.stepper .input{width:84px;text-align:center;padding:8px 6px;font-family:var(--f-display);font-size:24px;-moz-appearance:textfield}
.stepper .input::-webkit-outer-spin-button,.stepper .input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@keyframes fadeIn{from{opacity:0}}
@keyframes modalBgIn{from{opacity:0}to{opacity:1}}
@keyframes modalBgOut{from{opacity:1}to{opacity:0}}
@keyframes modalUp{from{opacity:0;transform:translateY(60px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes modalDown{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(60px) scale(.95)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(100%)}}
@media (min-width:960px){.sheet-bg{align-items:center}.sheet{border-radius:24px;padding:24px;animation:modalUp .32s cubic-bezier(.16,1,.3,1) both}.sheet-bg.closing .sheet{animation:modalDown .22s cubic-bezier(.4,0,1,1) forwards}}
@media (prefers-reduced-motion:reduce){.modal-bg,.sheet-bg,.modal-bg.closing,.sheet-bg.closing,.modal,.sheet,.modal-bg.closing .modal,.sheet-bg.closing .sheet{animation:none!important;transform:none!important}}
.tile-exam{grid-column:span 4;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s;box-shadow:var(--shadow);text-decoration:none;-webkit-tap-highlight-color:transparent;min-height:0;box-sizing:border-box}
.tile-exam svg{color:var(--oil);flex:none}
@media (hover: hover) and (pointer: fine){
  .tile-exam:hover{border-color:var(--ink-2);background:var(--surface)}
}
.tile-exam:active{transform:scale(.97);background:var(--surface)}
.tile-exam:focus,.tile-exam:focus-visible{outline:none!important;border-color:var(--line)!important;background:var(--surface)}
@media (max-width:600px){
  .tile-exam{border-radius:12px;font-size:14.5px;gap:7px;padding:0 10px}
}
.startbar{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:18px;z-index:5}
.history{display:grid;gap:6px}
.hrow{width:100%;border:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:9px 12px;outline:none;-webkit-tap-highlight-color:transparent}
.hrow:focus,.hrow:focus-visible,.hrow:active{outline:none!important}
.hrow .chev,.brow-l .chev{color:var(--ink-2);opacity:.6}
.hist-page{display:grid;gap:18px}
.hgroup{display:grid;gap:8px}
.hg-h{display:grid;gap:1px}
.hg-h b{font-size:15px;font-weight:600;line-height:1.3}
.hg-h .muted{font-size:12.5px}
.sh-hist{max-height:172px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-hist .hrow{background:var(--surface-2)}
.hrow .pct{font-family:var(--f-display);font-weight:700;font-size:17.5px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.hrow .hrow-info{display:grid;gap:1px;min-width:0}
.hrow .hrow-info b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hrow-info small{display:block;color:var(--ink-2);font-size:11.5px;white-space:nowrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.badge.easy{background:var(--cedar-soft);color:var(--cedar)}
.badge.hard{background:var(--oil-soft);color:var(--oil-ink)}
.badge.both{background:var(--surface-2);color:var(--ink-2)}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink-2);font-size:14px;text-align:center}

/* Quiz */
.view:has(.qtop){display:flex;flex-direction:column;min-height:calc(100dvh - 36px);min-height:calc(var(--vvh,100dvh) - 36px);max-width:640px;margin:0 auto}
.qtop{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--oil);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.qcount{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#qslot{flex:1;display:flex;flex-direction:column;align-items:stretch;min-height:0}
body.quiz-fixed #qslot{justify-content:center}
body:not(.quiz-fixed) #qslot{justify-content:flex-start}
.qcard{background:var(--surface);border-radius:24px;border:2px solid var(--line);padding:20px 16px;box-shadow:var(--shadow);display:grid;gap:14px}
body.quiz-fixed .qcard{max-height:calc(100dvh - 120px);max-height:calc(var(--vvh,100dvh) - 120px);overflow-y:auto;-webkit-overflow-scrolling:touch}
body:not(.quiz-fixed) .qcard{max-height:none;overflow:visible}
.qcard.enter{animation:qIn .42s cubic-bezier(.2,.8,.2,1) both}
.qcard.leave{animation:qOut .22s ease-in both}
@keyframes qIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes qOut{to{opacity:0;transform:translateX(-28px)}}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qmeta-left{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.qfoot .ref{margin-left:auto}
.fb-verdict{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;font-family:var(--f-body);animation:fbIn .3s ease}
.fb-verdict.ok{background:var(--ok-soft);border:1.5px solid var(--ok);color:var(--ok)}
.fb-verdict.no{background:var(--bad-soft);border:1.5px solid var(--bad);color:var(--bad)}
.fb-verdict .fb-v-icon{display:flex;align-items:center;justify-content:center;flex:none}
.fb-verdict .fb-v-text{font-size:16px;font-weight:700;line-height:1.2;letter-spacing:-.01em}

.fb-ans-card{background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--bad);border-radius:14px;padding:14px 16px;display:grid;gap:8px;box-shadow:0 2px 10px -2px rgba(58,39,27,0.06);animation:fbIn .35s ease}
.fb-ans-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--bad)}
.fb-ans-val{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.45}
.fb-ans-val b{color:var(--bad);font-weight:700}
.fb-ans-list{display:grid;gap:8px}
.fb-ans-item{display:flex;align-items:flex-start;gap:10px;font-size:15px;font-weight:600;color:var(--ink);line-height:1.4}
.fb-ans-check{flex:none;width:20px;height:20px;border-radius:6px;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.qtype-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);line-height:1.2}
.qtype-badge svg{flex:none}
.qtype-badge.type-multi{background:var(--oil-soft);color:var(--oil-ink);border:1.5px solid rgba(217,123,38,.45);font-weight:750;box-shadow:0 1px 3px rgba(217,123,38,.12)}
.qtype-badge.type-one{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.qtype-badge.type-tf{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.qtype-badge.type-match{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.qtype-badge.type-fill{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.qmode-tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:transparent;color:var(--ink-2);border:1px solid var(--line);line-height:1.2}
.qmode-tag.hard{color:var(--cedar);border-color:rgba(138,90,54,.35)}
.qtype{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cedar)}
.qtext{font-size:18.5px;line-height:1.35;font-weight:500}
.qhint{font-size:13px;color:var(--ink-2);margin-top:-8px}
.qhint.ans{justify-self:start;background:var(--cedar-soft);color:var(--cedar);font-weight:600;border-radius:10px;padding:5px 12px;font-size:13.5px;line-height:1.3}
.qhint.multi-hint{color:var(--ink-2);font-size:13px;line-height:1.35;margin-top:-8px}
.answers{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:var(--r);padding:11px 12px;font-size:15px;line-height:1.3;font-weight:600;transition:all .15s}
@media (hover: hover) and (pointer: fine){
  .opt:hover:not(:disabled){border-color:var(--ink-2)}
}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-top:2px;margin-bottom:-2px}
.opt:focus,.opt:focus-visible{outline:none!important}
.opt:not([aria-pressed="true"]):not(.correct):not(.wrong):focus,
.opt:not([aria-pressed="true"]):not(.correct):not(.wrong):focus-visible{border-color:var(--line)!important}
.opt .opt-label{flex:1}
.opt .k{flex:none;width:26px;height:26px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);transition:all .15s}
.opt.opt-one[aria-pressed="true"]{border-color:var(--oil);background:var(--oil-soft);color:var(--oil-ink)}
.opt.opt-one[aria-pressed="true"] .k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.opt-multi .k{border-radius:6px}
.opt-choice-indicator.indicator-check{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;transition:all .15s ease}
.opt.opt-multi[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.opt.opt-multi[aria-pressed="true"] .k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.opt-multi[aria-pressed="true"] .indicator-check{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.correct{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.opt.correct .k{background:var(--ok)!important;border-color:var(--ok)!important;color:var(--bg)!important}
.opt.correct .indicator-check{border-color:var(--ok)!important;background:var(--ok)!important;color:#fff!important}
.opt.wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.opt.wrong .k{background:var(--bad)!important;border-color:var(--bad)!important;color:var(--bg)!important}
.opt.wrong .indicator-check{border-color:var(--bad)!important;background:var(--bad)!important;color:#fff!important}
.opt:disabled{cursor:default}
body.ans-ok .qcard .opt:not(.correct):not(.wrong),
body.ans-no .qcard .opt:not(.correct):not(.wrong){background:var(--surface)!important;border-color:var(--line)!important;opacity:.65}
body.ans-ok .qcard .opt:not(.correct):not(.wrong) .k,
body.ans-no .qcard .opt:not(.correct):not(.wrong) .k{background:transparent!important;border-color:var(--line)!important;color:var(--ink-2)!important}
body.ans-ok .qcard .opt:not(.correct):not(.wrong) .indicator-check,
body.ans-no .qcard .opt:not(.correct):not(.wrong) .indicator-check{background:transparent!important;border-color:var(--line)!important;color:transparent!important}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600;font-size:16px;padding:16px 10px}
.mx{display:grid;gap:8px}
.mrow{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;overflow:hidden;transition:border-color .15s,background .15s}
.mrow.open{border-color:var(--oil);background:var(--surface);box-shadow:var(--shadow)}
.mrows{display:grid;gap:8px}
.mhead{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 14px;color:var(--ink)}
.mn{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500}
.mrow.open .mn{background:var(--oil);color:var(--bg)}
.mrow.filled:not(.open) .mn{background:var(--cedar);color:var(--bg)}
.mb{display:grid;gap:3px;min-width:0}
.mhead .ml{font-weight:700;font-size:15px;line-height:1.3}
.mhead .mv{font-size:14px;line-height:1.35;color:var(--ink-2);overflow-wrap:anywhere}
.mrow:not(.filled) .mv{color:var(--ink-2);font-style:italic}
.mrow.open:not(.filled) .mv{color:var(--oil-ink);font-weight:600;font-style:normal}
.mrow.filled .mv{color:var(--ink);font-style:normal;font-weight:500}
.mchoices{display:grid;gap:6px;margin-top:14px}
.mlabel{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.mopt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.35;min-height:44px;color:var(--ink);overflow-wrap:anywhere}
@media(hover:hover) and (pointer:fine){.mopt:hover{border-color:var(--ink-2)}}
.mopt.taken{background:var(--surface-2);color:var(--ink-2)}
.mtag{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;background:transparent;color:var(--bg)}
.mopt.taken .mtag{background:var(--cedar)}
.mrow.ok{background:var(--ok-soft);border-color:transparent}
.mrow.no{background:var(--bad-soft);border-color:transparent}
.mrow.ok .mv,.mrow.no .mv{border-left:0;padding-left:0}
.mrow .mfix{padding:0 14px 11px 52px;margin-top:-4px}
.mfix{display:block;font-size:12.5px;color:var(--ok);margin-top:4px;font-weight:600}
.fill{font-family:var(--f-body);font-size:20px;line-height:1.5;font-weight:500;color:var(--ink)}
.fill input{font-family:var(--f-body);font-size:18px;font-weight:500;width:8.5em;max-width:100%;border:0;border-bottom:2px solid var(--oil);background:var(--oil-soft);border-radius:8px 8px 2px 2px;padding:2px 8px;margin:0 2px;color:var(--ink);transition:background .2s,border-color .2s;vertical-align:baseline}
.fill input:focus{outline:none;background:var(--surface-2)}
.fill input.ok{border-color:var(--ok);background:var(--ok-soft)}
.fill input.no{border-color:var(--bad);background:var(--bad-soft)}
#fb:empty{display:none}
.fb-clean{display:grid;gap:8px;font-size:15px;animation:fbIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb-ans{background:var(--bad-soft);border:1px solid color-mix(in oklab,var(--bad) 25%,transparent);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink);line-height:1.4}
.fb-ans b{color:var(--bad);font-weight:700}
.verse{font-family:var(--f-bible);font-weight:400;font-size:16.5px;line-height:1.6;color:var(--ink);text-wrap:pretty}
.verse:not(:has(.verse-container)){border-left:3px solid var(--oil);padding-left:12px}
.verse sup,.reader-text sup,.verse-ctx-body sup,.verse-target-text sup{font-family:var(--f-body);font-weight:700;font-size:.65em;line-height:1;color:var(--oil-ink);margin-right:.35em;vertical-align:.5em;letter-spacing:.02em}
.verse-container{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.verse-expander{border:1px dashed var(--line);border-radius:12px;background:transparent;overflow:hidden}
.verse-expander[open]{border-style:solid;border-color:var(--line)}
.verse-expander-btn{list-style:none;cursor:pointer;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-2);background:transparent;user-select:none;outline:none;-webkit-tap-highlight-color:transparent}
.verse-expander-btn::-webkit-details-marker{display:none}
@media(hover:hover) and (pointer:fine){.verse-expander-btn:hover{background:transparent!important;outline:none!important;color:var(--ink)}} .verse-expander-btn:active{color:var(--ink)}
.verse-expander .exp-icon{flex:none;transition:transform .2s ease}
.verse-expander:not([open]) .exp-text-open{display:none}
.verse-expander[open] .exp-text-closed{display:none}
.verse-expander[open] .exp-icon{transform:rotate(180deg)}
.verse-ctx-body{padding:12px 14px;font-family:var(--f-bible);font-size:15.5px;line-height:1.65;color:var(--ink-2);border-top:1px solid var(--line);max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.verse-ctx-body::-webkit-scrollbar{width:5px}
.verse-ctx-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.verse-target-core{background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--oil);border-radius:12px;padding:12px 14px;display:grid;gap:6px;box-shadow:0 2px 8px -2px rgba(58,39,27,0.05)}
.verse-target-badge{display:flex;align-items:center;gap:6px}
.vt-pill{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--oil-ink);background:var(--oil-soft);padding:2px 8px;border-radius:999px;text-transform:uppercase}
.verse-target-text{font-family:var(--f-bible);font-size:16.5px;line-height:1.6;color:var(--ink);font-weight:500}
.qactions{display:flex;gap:10px;margin-top:16px;width:100%;box-sizing:border-box}
.qactions .btn{flex:1;min-height:46px;font-size:14.5px;box-sizing:border-box}
@media (max-width:959px){
  .wrap:has(.qtop){padding-block:14px calc(80px + env(safe-area-inset-bottom,0px))}
  .view:has(.qtop){min-height:calc(100dvh - 28px);min-height:calc(var(--vvh,100dvh) - 28px);padding-bottom:0}
  .qactions{position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0 auto;max-width:640px;width:100%;box-sizing:border-box;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);}
  .qactions:empty{display:none}
  #qslot{padding-bottom:12px}
}
html:has(body.quiz-fixed),body.quiz-fixed{overflow:hidden!important;overscroll-behavior:none!important}
body.quiz-fixed .wrap{overflow:hidden!important;overscroll-behavior:none!important}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.shake{animation:shake .4s ease}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* Results */
.report-head{display:grid;justify-items:center;gap:14px;text-align:center;padding:10px 0 6px}
.ring{position:relative;width:200px;height:200px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .val b{font-family:var(--f-display);font-weight:400;font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
.ring .val small{color:var(--ink-2);font-size:14px}
.verdict-tip{color:var(--ink-2);font-size:15px;margin:6px auto 0;max-width:34ch;text-align:center}
.verdict{font-family:var(--f-display);font-size:30px;line-height:1.1}
.sparks{position:absolute;inset:0;pointer-events:none;overflow:visible}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--oil);opacity:0;animation:spark 1.4s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4)}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.kv.two{grid-template-columns:1fr 1fr}
.kv.four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
@media (max-width:480px){.kv.four{grid-template-columns:repeat(2,1fr)}}
.rep-levels{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:12px 0 16px;flex-wrap:wrap}
.rep-lvl-item{display:flex;align-items:center;gap:7px}
.rep-lvl-score{font-family:var(--f-mono);font-size:13.5px;color:var(--ink)}
.rep-lvl-score b{font-size:14.5px;font-weight:700}
.rep-lvl-pct{font-size:12px;color:var(--ink-2);font-weight:500}
.rep-lvl-sep{width:1px;height:16px;background:var(--line);flex:none}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:9.5em 1fr 3.2em;align-items:center;gap:10px;font-size:14px}
.brow .bar{height:8px}
.brow .bar i{background:var(--cedar)}
.brow span:last-child{text-align:right;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mistake{background:var(--surface);border-radius:18px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.mistake .q{font-weight:500}
.ans{display:grid;gap:6px;font-size:14.5px}
.ans div{display:grid;grid-template-columns:7.2em 1fr;gap:8px}
.ans dt,.ans .l{color:var(--ink-2)}
.ans .y{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.ans .c{color:var(--ok);font-weight:600}
.mistakes{display:grid;gap:12px}
.allgood{text-align:center;padding:24px;background:var(--ok-soft);border-radius:18px;color:var(--ok);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}

<script>

const TEXT = /*__TEXT__*/{};

};

/* ---------- utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- modal scroll lock & visual viewport ---------- */
const _modalObserver = new MutationObserver(() => {
  const hasOverlay = !!document.querySelector(".sheet-bg, .modal-bg");
  if (hasOverlay) {
    if (!document.body.classList.contains("scroll-locked")) {
      document.body.classList.add("scroll-locked");
      document.documentElement.classList.add("scroll-locked");
    }
  } else {
    if (document.body.classList.contains("scroll-locked")) {
      document.body.classList.remove("scroll-locked");
      document.documentElement.classList.remove("scroll-locked");
    }
  }
});
_modalObserver.observe(document.body, { childList: true });

if (window.visualViewport) {
  const syncVv = () => {
    const vv = window.visualViewport;
    const vvh = Math.round(vv.height);
    const kbdH = Math.max(0, Math.round(window.innerHeight - vv.height));
    document.documentElement.style.setProperty("--vvh", `${vvh}px`);
    document.documentElement.style.setProperty("--kbd-h", `${kbdH > 60 ? kbdH : 0}px`);
  };
  window.visualViewport.addEventListener("resize", syncVv);
  window.visualViewport.addEventListener("scroll", syncVv);
  syncVv();
}
document.addEventListener("touchmove", e => {
  if (document.body.classList.contains("scroll-locked")) {
    const scrollable = e.target.closest(".sheet, .modal, .prof");
    if (!scrollable) {
      e.preventDefault();
    }
  } else if (document.body.classList.contains("quiz-fixed")) {
    const scrollable = e.target.closest(".qcard");
    if (!scrollable || scrollable.scrollHeight <= scrollable.clientHeight) {
      e.preventDefault();
    }
  }
}, { passive: false });
window.addEventListener("scroll", () => {
  if (document.body.classList.contains("scroll-locked") || document.body.classList.contains("quiz-fixed")) {
    if (window.scrollY !== 0 || window.scrollX !== 0) {
      window.scrollTo(0, 0);
    }
  }
}, { passive: true });
document.addEventListener("focusin", e => {
  const inp = e.target;
  if (inp && (inp.tagName === "INPUT" || inp.tagName === "TEXTAREA")) {
    const container = inp.closest(".sheet, .modal");
    if (container) {
      window.scrollTo(0, 0);
      setTimeout(() => {
        window.scrollTo(0, 0);
        const cRect = container.getBoundingClientRect();
        const iRect = inp.getBoundingClientRect();
        const kbdH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--kbd-h")) || 0;
        const visibleBottom = cRect.bottom - kbdH;
        if (iRect.bottom > visibleBottom) {
          container.scrollBy({ top: iRect.bottom - visibleBottom + 24, behavior: "smooth" });
        } else if (iRect.top < cRect.top + 20) {
          container.scrollBy({ top: iRect.top - cRect.top - 20, behavior: "smooth" });
        }
      }, 150);
    }
  }
});
document.addEventListener("focusout", e => {
  const inp = e.target;
  if (inp && (inp.tagName === "INPUT" || inp.tagName === "TEXTAREA")) {
    if (document.body.classList.contains("scroll-locked")) {
      setTimeout(() => { window.scrollTo(0, 0); }, 100);
    }
  }
});
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fold = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const slugOf = name => fold(name).replace(/ /g,"-").slice(0,60);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const refLabel = r => {
  if (!r) return "";
  let clean = String(r).replace(/^1\s*Sam(?:\.|uel)?\s*/i, "").trim();
  return "1 Samuel " + clean;
};
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function toast(msg, ms = 2400){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), ms); }
/* the quiz screen is fixed (question centred) as long as it fits; a tall question (matching) lets the page scroll instead of being cut */
function fitFixed(){
  const card = $(".qcard"); if (!card || (S.quiz && S.quiz.ui && S.quiz.ui.checked)) return;
  const q = S.quiz && S.quiz.qs && S.quiz.qs[S.quiz.i];
}
function resetScroll(){ window.scrollTo({ top: 0, behavior: "instant" }); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }
/* The question bank was rebuilt (fewer questions, 3 choices): ids from the old bank no longer match, so progress kept on this device starts again. */
const BANK_V = "2";
try {
  if (localStorage.getItem("candela:bank") !== BANK_V){
    Object.keys(localStorage).filter(k => /^candela:(p:|pending:|reports:|quiz$|guest$|guestEntries$)/.test(k)).forEach(k => localStorage.removeItem(k));
    localStorage.setItem("candela:bank", BANK_V);
  }
} catch {}
function closeModal(bg, onDone){
  if (!bg || bg._closing) return;
  bg._closing = true;
  bg.classList.add("closing");
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    const cb = onDone;
    bg.remove();
    if (cb) cb();
  };
  const content = bg.querySelector(".modal, .sheet");
  if (content && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    content.addEventListener("animationend", finish, { once: true });
    setTimeout(finish, 260);
  } else {
    finish();
  }
}
function verseHTML(ref){
  const m = /^(\d+):(\d+)(?:-(\d+))?$/.exec(ref); if (!m) return "";
  const c = +m[1], a = +m[2], b = +(m[3]||m[2]); const vs = TEXT[c] || [];
  if (!vs.length) return "";
  
  let out = `<div class="verse-container"><div class="verse-ctx-body full-chapter" style="max-height: 280px; overflow-y: auto; text-wrap: pretty; padding: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; margin-top: 12px; border-top: 2px solid var(--line);">`;
  out += `<div style="font-family:var(--f-mono); font-size:12px; font-weight:700; color:var(--ink-2); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.04em;">1 Samuel Capitolul ${c}</div>`;
  out += `<div style="font-family:var(--f-bible); font-size:17px; line-height:1.65; color:var(--ink-2);">`;

  for (let v = 1; v <= vs.length; v++) {
    const isTarget = v >= a && v <= b;
    if (isTarget) {
      out += `<span class="verse-target-highlight" style="background:var(--oil-soft); color:var(--ink); font-weight:700; border-radius:6px; padding:2px 4px;"><sup>${v}</sup>${esc(vs[v-1])}</span> `;
    } else {
      out += `<sup>${v}</sup>${esc(vs[v-1])} `;
    }
  }
  out += `</div></div></div>`;
  
  return out;
}
function dateLabel(ts){ const d = new Date(ts); return d.toLocaleDateString("ro-RO",{day:"numeric",month:"short"}) + ", " + d.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"}); }
function chaptersLabel(chs){
  if (!chs || !chs.length) return "";
  if (chs.length === 1 && chs[0] === 0) return "Examen alb";
  if (chs.length === 31) return "Toate capitolele";
  const s = chs.slice().sort((a,b)=>a-b), parts = []; let i = 0;
  while (i < s.length){
    let j = i;
    while (j+1 < s.length && s[j+1] === s[j]+1) j++;
    if (j > i + 1) parts.push(`${s[i]}–${s[j]}`);
    else if (j === i + 1) { parts.push(`${s[i]}`); parts.push(`${s[j]}`); }
    else parts.push(`${s[i]}`);
    i = j+1;
  }
  let str = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " și " + parts[parts.length - 1];
  return (s.length === 1 ? "Capitolul " : "Capitolele ") + str;
}

/* ---------- storage ----------
   Supabase: accounts are email + password (Supabase Auth) with a unique first + last name, progress in Postgres behind row-level security.
   A finished test is one call to save_result(); the leaderboard is the public leaderboard() function.
   Results that could not be sent wait in localStorage and go out at the next sign-in.
   Without an account the visitor plays as a guest: results stay in this browser and move to the account at sign-up or sign-in. */
const SB = /*__SB__*/null;
const HOSTED = true;
const authStorage = {   // "Rămâi conectat" off → the session lives only until the browser is closed
  getItem(k){ try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  setItem(k, v){ try { const keep = lsGet("candela:remember", true); (keep ? localStorage : sessionStorage).setItem(k, v); (keep ? sessionStorage : localStorage).removeItem(k); } catch {} },
  removeItem(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} },
};
let sbc = null;
function sb(){
  if (!sbc && SB && window.supabase) sbc = window.supabase.createClient(SB.url, SB.key, { auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  return sbc;
}
const isNetErr = e => !e || /fetch|network|failed to|load failed/i.test(String(e.message || e));
const store = {
  uid: null,
  blank(name){ return { name, history: [], chap: {}, ok: [], seen: [], tests: 0, exams: 0 }; },
  norm(p, name){ p = p ? JSON.parse(JSON.stringify(p)) : this.blank(name); p.name = p.name || name; p.history = p.history || []; p.chap = p.chap || {}; p.ok = p.ok || []; p.seen = [...new Set([...(p.seen || []), ...p.ok])]; p.tests = p.tests ?? p.history.length; p.exams = p.exams ?? p.history.filter(h => h.exam || (h.chs && h.chs.length === 1 && h.chs[0] === 0)).length; return p; },
  pending(){ return lsGet("candela:pending:" + this.uid, []); },
  applyEntry(p, x){
    const isExam = !!x.exam || (x.chs && x.chs.length === 1 && x.chs[0] === 0);
    if (!p.history.some(h => h.at === x.at)){ p.history.push({at:x.at, chs:x.chs, mode:x.mode, score:x.score, total:x.total, pct:x.pct, secs:x.secs, exam: isExam}); p.tests++; if (isExam) p.exams = (p.exams || 0) + 1; }
    if (!isExam){
      for (const [k, v] of Object.entries(x.chap)){ const cur = p.chap[k] || {best:0, n:0}; p.chap[k] = {best: Math.max(cur.best||0, v), last: v, n: (cur.n||0)+1}; }
      p.ok = [...new Set([...p.ok, ...x.ok])];
      p.seen = [...new Set([...(p.seen || []), ...(x.seen || []), ...x.ok])];
    }
  },
  async send(x){
    const { error } = await sb().rpc("save_play", { p_player: x.player || this.uid, p_at: new Date(x.at).toISOString(), p_chs: x.chs, p_mode: x.mode, p_score: x.score, p_total: x.total, p_pct: x.pct, p_secs: x.secs, p_chap: x.chap, p_ok: x.ok, ...(x.seen ? { p_seen: x.seen } : {}) });
    if (error) throw error;
    if (x.wrong) await sb().rpc("set_result_wrong", { p_player: x.player || this.uid, p_at: new Date(x.at).toISOString(), p_wrong: x.wrong }).then(() => {}, () => {});
  },
  async flush(){
    const left = [];
    for (const x of this.pending()){ try { await this.send(x); } catch (e) { if (isNetErr(e)) left.push(x); } }
    lsSet("candela:pending:" + this.uid, left);
  },
  guest(){ const p = this.norm(lsGet("candela:guest", null), "Invitat"); p.name = "Invitat"; p.guest = true; return p; },
  async load(user){
    this.uid = user.id; this.email = user.email || "";
    const moved = lsGet("candela:guestEntries", []);   // tests played as a guest join the account
    if (moved.length){ lsSet("candela:pending:" + this.uid, [...this.pending(), ...moved]); lsSet("candela:guestEntries", []); lsSet("candela:guest", null); }
    this.moved = moved.length;
    await this.flush();
    return this.loadPlayer(lsGet("candela:player:" + this.uid, this.uid));
  },
  /* a parent plays as itself or as one of its children, on the same phone; pid is who plays now */
  async loadPlayer(pid){
    const { data, error } = await sb().rpc("player_progress", { p_player: pid });
    if (error) throw error;
    if (!data && pid !== this.uid) return this.loadPlayer(this.uid);   // that child was removed
    this.pid = pid; lsSet("candela:player:" + this.uid, pid);
    const p = this.norm({ name: data.name || "?", history: data.history, chap: data.chap, ok: data.ok, seen: data.seen, tests: data.tests });
    p.child = pid !== this.uid; p.hidden = !!data.hidden;
    if (!p.child) this.isParent = !!data.is_parent;
    for (const x of this.pending()) if ((x.player || this.uid) === pid) this.applyEntry(p, x);
    lsSet("candela:p:" + pid, p);
    this.family = this.isParent ? await this.rpc("my_family").then(r => r.ok ? r.data : this.family || []) : [];
    return p;
  },
  /* returns {ok, profile} or {ok:false, error} */
  // The login is the email. Accounts made before emails existed have an internal address built from the name,
  // so "Prenume Nume" typed in the email field still signs them in.
  authEmail(id){ id = id.trim(); return id.includes("@") ? id.toLowerCase() : slugOf(id) + "@candela.invalid"; },
  hasEmail(){ return !!this.email && !this.email.endsWith("@candela.invalid"); },
  async login(id, password){
    if (!sb()) return {ok:false, error:"network"};
    try {
      const { data, error } = await sb().auth.signInWithPassword({ email: this.authEmail(id), password });
      if (error) return {ok:false, error: isNetErr(error) ? "network" : /confirm/i.test(error.message) ? "unconfirmed" : "cred"};
      return {ok:true, profile: await this.load(data.user)};
    } catch (e) { return {ok:false, error: isNetErr(e) ? "network" : "server"}; }
  },
  async call(fn, body, token){
    let r;
    try { r = await fetch(SB.url + "/functions/v1/" + fn, {method:"POST", headers:{"content-type":"application/json", apikey: SB.key, ...(token ? {authorization: "Bearer " + token} : {})}, body: JSON.stringify(body)}); }
    catch { return {ok:false, error:"network"}; }
    let d = {}; try { d = await r.json(); } catch {}
    return r.ok ? {ok:true, ...d} : {ok:false, error: d.error || "server"};
  },
  async signup(first, last, email, password){
    if (!sb()) return {ok:false, error:"network"};
    const r = await this.call("signup", {first, last, email, password});
    if (!r.ok) return r;
    const l = await this.login(email, password);
    return l.ok ? {...l, created:true} : l;
  },
  /* changes the signed-in player's name and email */
  async updateAccount(first, last, email){
    if (!sb()) return {ok:false, error:"network"};
    let token = null;
    try { token = (await sb().auth.getSession()).data.session?.access_token; } catch {}
    if (!token) return {ok:false, error:"auth"};
    const r = await this.call("account", {first, last, email}, token);
    if (!r.ok) return r;
    try { await sb().auth.refreshSession(); } catch {}
    this.email = r.email;
    const p = this.local(this.uid); if (p){ p.name = r.name; lsSet("candela:p:" + this.uid, p); }
    return r;
  },
  async resume(){
    if (!sb()) return null;
    const { data } = await sb().auth.getSession();
    return data.session ? data.session.user : null;
  },
  local(uid){ return lsGet("candela:p:" + uid, null); },
  /* saves one finished test; returns whether it reached the server */
  async save(p, x){
    this.applyEntry(p, x);
    if (p.guest){ lsSet("candela:guest", p); lsSet("candela:guestEntries", [...lsGet("candela:guestEntries", []), x]); return {guest:true}; }
    x.player = this.pid || this.uid;
    lsSet("candela:p:" + x.player, p);
    try { await this.send(x); return {saved:true}; }
    catch (e) {
      if (isNetErr(e)){ lsSet("candela:pending:" + this.uid, [...this.pending(), x]); }
      return {saved:false};
    }
  },
  async board(){
    if (!sb()) return null;
    try {
      const { data, error } = await sb().rpc("board2", { p_player: S.player && !S.player.guest ? this.pid : null });
      if (error) return null;
      const total = totalCount("both");
      return data.map(x => ({ id: x.id, name: x.name, ok: x.ok, seen: Math.max(x.seen ?? 0, x.ok), tests: x.tests, me: !!x.me, mastery: Math.round(x.ok / total * 1000) / 10 }));
    } catch { return null; }
  },
  /* returns {ok, data} or {ok:false, error} */
  async rpc(fn, args){
    if (!sb()) return {ok:false, error:"network"};
    try { const { data, error } = await sb().rpc(fn, args); return error ? {ok:false, error: isNetErr(error) ? "network" : String(error.message || "server")} : {ok:true, data}; }
    catch (e) { return {ok:false, error: isNetErr(e) ? "network" : "server"}; }
  },
  async token(){ try { return (await sb().auth.getSession()).data.session?.access_token || null; } catch { return null; } },
  async logout(){ try { await sb()?.auth.signOut(); } catch {} this.uid = this.pid = null; this.email = ""; this.isParent = false; this.family = []; }
};

/* ---------- state ---------- */
try { localStorage.removeItem("candela:sel"); } catch {}
const S = {
  player: null,
  sel: new Set(),
  mode: lsGet("candela:mode", "easy"),
  count: lsGet("candela:count", 20),
  quiz: null,
  board: null,
  admin: null,                                    // may give temporary passwords
  reportBack: null,
  reportCh: null,
  homeScroll: 0,                                  // scroll position to restore when going back home
};
function persistPrefs(){ lsSet("candela:mode",S.mode); lsSet("candela:count",S.count); }

function lampSVG(size=64){

function getSuggestedReadChapter(){
  if (S.reportBack && S.reportCh) return S.reportCh;
  if ($("#grid") && S.sel && S.sel.size === 1) return [...S.sel][0];
  const h = S.player && S.player.history ? S.player.history : [];
  const lastTest = [...h].reverse().find(x => x.chs && x.chs.some(c => c >= 1 && c <= 31));
  if (lastTest) {
    const validChs = lastTest.chs.filter(c => c >= 1 && c <= 31);
    if (validChs.length) return Math.min(31, Math.max(...validChs) + 1);
  }
  if (S.player && S.player.chap) {
    const tried = Object.keys(S.player.chap).map(k => parseInt(k, 10)).filter(c => c >= 1 && c <= 31);
    if (tried.length) return Math.min(31, Math.max(...tried) + 1);
  }
  if (S.player && S.player.ok && S.player.ok.length) {
    const tried = S.player.ok.map(id => parseInt(id, 10)).filter(c => c >= 1 && c <= 31);
    if (tried.length) return Math.min(31, Math.max(...tried) + 1);
  }
  return lsGet("candela:read", 1);
}

/* ---------- quiz engine ---------- */
function buildPool(chs, mode){
  const out = [];
  for (const c of chs){
    const d = QUIZ[c]; if (!d) continue;
    for (const m of (mode==="both" ? ["easy","hard"] : [mode]))
      (d[m]||[]).forEach((q,i) => out.push({...q, ch:c, mode:m, id:`${c}${m[0]}${i}`}));
  }
  return out;
}
function prepare(q){
  const x = {...q};
  if (q.t === "one"){ const idx = shuffle(q.opts.map((_,i)=>i)); x.opts = idx.map(i=>q.opts[i]); x.a = idx.indexOf(q.a); }
  if (q.t === "multi"){ const idx = shuffle(q.opts.map((_,i)=>i)); x.opts = idx.map(i=>q.opts[i]); x.a = q.a.map(a=>idx.indexOf(a)).sort((a,b)=>a-b); }
  if (q.t === "match"){ x.right = shuffle(q.pairs.map((p,i)=>i)); }
  return x;
}
/* rough time to answer, by question type and level (seconds), including reading the correction; only an estimate shown before starting, there is no timer */
const SECS = { tf:[9,13], one:[13,19], multi:[20,28], fill:[17,25], match:[30,42] };
// once enough tests exist, the real average time per question (by level) replaces the guess, within ×0.5–×2 of it
let PACE = lsGet("candela:pace", null);
function estSecs(list){
  const by = {easy:[0,0], hard:[0,0]};
  for (const q of list){ const b = by[q.mode] || by.easy; b[0] += (SECS[q.t]||[18,24])[q.mode==="hard"?1:0]; b[1]++; }
  return Object.entries(by).reduce((s, [m, [guess, n]]) => s + (PACE?.[m] && n ? Math.min(guess*2, Math.max(guess/2, PACE[m]*n)) : guess), 0);
}
async function loadPace(){
  const r = await store.rpc("pace"); if (!r.ok || !r.data) return;
  PACE = {}; for (const x of r.data) if (x.n >= 15 && x.mode !== "both") PACE[x.mode] = +x.secs;
  lsSet("candela:pace", PACE);
}
function durLabel(secs){
  const m = secs / 60;
  if (m < 1.5) return "cam 1 min";

function buildExamPool(mode){
  const allQs = buildPool(Array.from({length:31}, (_,i)=>i+1), mode);
  const tfQs = shuffle(allQs.filter(q => q.t === "tf"));
  const oneQs = shuffle(allQs.filter(q => q.t === "one"));
  const multiQs = shuffle(allQs.filter(q => q.t === "multi"));
  const fillQs = shuffle(allQs.filter(q => q.t === "fill"));

  const pickDiverse = (list, count = 5) => {
    const chosen = [];
    const usedChs = new Set();
    for (const q of list){
      if (!usedChs.has(q.ch)){
        chosen.push(q);
        usedChs.add(q.ch);
        if (chosen.length === count) break;
      }
    }
    if (chosen.length < count){
      for (const q of list){
        if (!chosen.includes(q)){
          chosen.push(q);
          if (chosen.length === count) break;
        }
      }
    }
    return chosen;
  };

  const p1 = pickDiverse(tfQs, 5);
  const p2 = pickDiverse(oneQs, 5);

  let matchCandidates;
  if (mode === "easy") {
    matchCandidates = EXAM_MATCH_QUESTIONS.filter(q => q.mode === "easy");
  } else if (mode === "hard") {
    matchCandidates = EXAM_MATCH_QUESTIONS.filter(q => q.mode === "hard");
  } else {
    matchCandidates = EXAM_MATCH_QUESTIONS;
  }
  const pMatch = shuffle(matchCandidates).slice(0, 1);

  const p3 = pickDiverse(multiQs, 5);
  const p4 = pickDiverse(fillQs, 5);

  return [...p1, ...p2, ...pMatch, ...p3, ...p4];
}

function startExam(mode = "easy"){
  const qs = buildExamPool(mode);
  S.quiz = {

    chs: [0],
    mode,
    retry: false,

}

          <span class="mv">${v != null ? esc(q.pairs[v][1]) : act === l ? "Alege răspunsul de mai jos" : "Alege un răspuns"}</span></span></button></div>`;
      }).join("")}</div>
      <div class="mchoices"><span class="mlabel">Răspunsuri</span>${q.right.map(r => { const o = ownerOf(r); return `<button class="mopt${o >= 0 ? " taken" : ""}" type="button" data-r="${r}"><span class="mtag">${o >= 0 ? o + 1 : ""}</span><span>${esc(q.pairs[r][1])}</span></button>`; }).join("")}</div>`;

        const nx = q.pairs.findIndex((_, i) => ui.pairs[i] == null);
        ui.active = nx >= 0 ? nx : null; paint();
      });
      renderActions(); fitFixed();
    };
    ui.active = 0; paint();
  }
}

const RO_NUM_MAP = new Map();
function buildRoNums() {
  const units = ["zero", "unu", "doi", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const femUnits = ["zero", "una", "două", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const oUnits = ["zero", "o", "două", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const teens = ["zece", "unsprezece", "doisprezece", "treisprezece", "paisprezece", "cincisprezece", "șaisprezece", "șaptesprezece", "optsprezece", "nouăsprezece"];
  const femTeens = [...teens]; femTeens[2] = "douăsprezece";
  const tens = ["", "", "douăzeci", "treizeci", "patruzeci", "cincizeci", "șaizeci", "șaptezeci", "optzeci", "nouăzeci"];
  const add = (n, words) => {
    if (!RO_NUM_MAP.has(n)) RO_NUM_MAP.set(n, new Set());
    words.forEach(w => RO_NUM_MAP.get(n).add(fold(w).replace(/[\s\-]/g, '')));
  };
  for (let i=0; i<10; i++) add(i, [units[i], femUnits[i], oUnits[i]]);
  for (let i=10; i<20; i++) add(i, [teens[i-10], femTeens[i-10]]);
  for (let i=20; i<100; i++) {

function tolerantMatch(ans, exp) {
  const clean = s => fold(s).replace(/[.,;:'"!?()\[\]{}„”«»]/g, '');
  const cA = clean(ans), cE = clean(exp);
  if (cA === cE) return true;
  const sA = cA.replace(/[\s\-]/g, ''), sE = cE.replace(/[\s\-]/g, '');
  if (sA === sE) return true;
  const numA = parseInt(sA, 10), numE = parseInt(sE, 10);
  if (!isNaN(numA) && numA.toString() === sA && RO_NUM_MAP.has(numA) && RO_NUM_MAP.get(numA).has(sE)) return true;
  if (!isNaN(numE) && numE.toString() === sE && RO_NUM_MAP.has(numE) && RO_NUM_MAP.get(numE).has(sA)) return true;
  const lDist = (a, b) => {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    const m = Array.from({length: b.length + 1}, (_, i) => [i]);
    for (let j = 0; j <= a.length; j++) m[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        m[i][j] = b[i - 1] === a[j - 1] ? m[i - 1][j - 1] : Math.min(m[i - 1][j - 1], m[i][j - 1], m[i - 1][j]) + 1;
      }
    }
    return m[b.length][a.length];
  };
  const tol = sE.length >= 8 ? 2 : (sE.length >= 4 ? 1 : 0);
  if (tol > 0) {
    if (lDist(cA, cE) <= tol) return true;
    if (lDist(sA, sE) <= tol) return true;
  }
  return false;
}

async function finish(again){

  const Z = S.quiz, n = Z.qs.length; S.lastReport = Z;
  const score = Z.answers.reduce((s,a)=>s+(a?a.pts:0),0);
  const sc = Math.round(score), P = pct(score, n);
  const secs = Math.round((Date.now()-Z.start)/1000);
  // per chapter, per type & per mode
  const byCh = {}, byType = {}, byMode = { easy: { s: 0, n: 0 }, hard: { s: 0, n: 0 } };
  Z.qs.forEach((q,i) => { const a = Z.answers[i]||{pts:0};
    (byCh[q.ch] ??= {s:0,n:0}); byCh[q.ch].s += a.pts; byCh[q.ch].n++;
    const key = q.ch + q.mode[0]; ((byCh._m ??= {})[key] ??= {s:0,n:0}); byCh._m[key].s += a.pts; byCh._m[key].n++;
    (byType[q.t] ??= {s:0,n:0}); byType[q.t].s += a.pts; byType[q.t].n++;
    const m = q.mode === "hard" ? "hard" : "easy";
    byMode[m].s += a.pts; byMode[m].n++; });

    const ok = Z.exam ? [] : Z.qs.filter((q,i) => (Z.answers[i]||{}).pts >= 1).map(q => q.id);
    const seen = Z.exam ? [] : Z.qs.filter((q,i) => Z.answers[i] && !Z.answers[i].skipped).map(q => q.id);
    const wrongIds = Z.qs.map((q,i) => ({q, a: Z.answers[i]})).filter(x => !x.a || x.a.pts < 1).map(packWrong);
    saving = store.save(p, { at, chs: Z.chs, mode: Z.mode, score: sc, total: n, pct: P, secs, chap, ok, seen, wrong: wrongIds, exam: !!Z.exam });
  }
  S.board = null;
  const wrong = Z.qs.map((q,i)=>({q, a: Z.answers[i]})).filter(x => !x.a || x.a.pts < 1);
  const rep = { at, chs: Z.chs, mode: Z.mode, retry: !!Z.retry, exam: !!Z.exam, n, sc, P, wrong, secs, byMode,
    byCh: Object.fromEntries(Object.entries(byCh).filter(([k]) => k !== "_m").map(([c,v]) => [c, pct(v.s, v.n)])) };

}

function mistakeHTML({q, a}){
  a = a || {pts:0, given:null, skipped:true};
  const skipped = a.skipped || a.given==null;
  let yours = "", correct = "";
  if (q.t==="tf"){ yours = skipped ? "—" : (a.given?"Adevărat":"Fals"); correct = q.a?"Adevărat":"Fals"; }
  if (q.t==="one"){ yours = skipped ? "—" : esc(q.opts[a.given]); correct = esc(q.opts[q.a]); }
  if (q.t==="multi"){ yours = skipped ? "—" : (a.given.length ? a.given.map(i=>esc(q.opts[i])).join("; ") : "niciuna"); correct = q.a.length ? q.a.map(i=>esc(q.opts[i])).join("; ") : "niciuna"; }
  if (q.t==="fill"){ yours = skipped ? "—" : a.given.map(esc).join(", "); correct = q.a.map(esc).join(", "); }
  if (q.t==="match"){
    yours = skipped ? "—" : q.pairs.map((p,i)=> a.given[i]===i ? null : `${esc(p[0])} → ${a.given[i]!=null ? esc(q.pairs[a.given[i]][1]) : "—"}`).filter(Boolean).join("<br>");
    correct = q.pairs.map(p=>`${esc(p[0])} → ${esc(p[1])}`).join("<br>");
  }
  const qtext = q.t==="fill" ? esc(q.q).replace(/___/g, "<b>____</b>") : esc(q.q.replace(/\s*\(pot fi mai multe[^)]*\)/i, ""));
  return `<article class="mistake"><div class="qmeta"><div class="qmeta-left"><span class="qtype-badge type-${q.t}">${TYPE_ICON[q.t]||""}<span>${TYPE_LABEL[q.t]}</span></span></div><span class="ref">${refLabel(q.ref)}</span></div>
    <p class="q">${qtext}</p>
    <div class="ans"><div><span class="l">Răspunsul tău</span><span class="${skipped?"":"y"}">${yours}</span></div><div><span class="l">Corect</span><span class="c">${correct}</span></div></div>
    <div class="verse">${verseHTML(q.ref)}</div></article>`;
}

const _entityTerms = [];
for (const [cat, list] of Object.entries(ENTITIES_DATA)) {
  for (const term of list) {
    _entityTerms.push({ cat, term, len: term.length });
  }
}
_entityTerms.sort((a, b) => b.len - a.len);

const _termMap = new Map();
_entityTerms.forEach(t => {
  const k = t.term.toLowerCase();
  if (!_termMap.has(k)) _termMap.set(k, t);
});

const _escRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const _entityPattern = new RegExp(
  "(?:^|(?<=[^a-zăîâșțA-ZĂÎÂȘȚ0-9]))(" + _entityTerms.map(t => _escRegex(t.term)).join("|") + ")(?=[^a-zăîâșțA-ZĂÎÂȘȚ0-9]|$)",
  "gi"
);

function highlightVerseEntities(text) {
  return text.replace(_entityPattern, (match, p1, offset) => {
    if (match.toLowerCase() === "abia" && offset === 0) return match;
    const info = _termMap.get(match.toLowerCase());
    const cat = info ? info.cat : "object";
    return `<mark class="hl-entity hl-${cat}">${esc(match)}</mark>`;
  });
}

  }
  let left = rect.left + window.scrollX + (rect.width / 2) - (popRect.width / 2);
  left = Math.max(10, Math.min(left, window.innerWidth - popRect.width - 10));

  pop.style.top = `${top}px`;
  pop.style.left = `${left}px`;

  const closePop = () => {
    if (_popTimer) { clearTimeout(_popTimer); _popTimer = null; }
    pop.style.transition = "opacity .15s, transform .15s";
    pop.style.opacity = "0";
    pop.style.transform = "translateY(4px) scale(.95)";
    setTimeout(() => { if (pop.parentNode) pop.remove(); }, 160);
  };

  pop.querySelector(".pop-close").onclick = e => {
    e.stopPropagation();
    closePop();
  };

  _popTimer = setTimeout(closePop, 2500);
}

function viewRead(c){
  c = Math.min(31, Math.max(1, +c || 1)); lsSet("candela:read", c);
  const vs = TEXT[c] || [];
  let colorsOn = lsGet("candela:rc", true);

  mount(`<section class="reader">
    <div class="reader-h">${BACK_BTN("rBack")}
      <div><span class="eyebrow">1 Samuel ${c}</span><h2>${esc(TITLES[c-1])}</h2></div></div>
    <label class="r-pick"><span>Capitolul</span><select class="input" id="rPick">${TITLES.map((t, i) => `<option value="${i+1}" ${i+1 === c ? "selected" : ""}>${i+1}. ${esc(t)}</option>`).join("")}</select></label>

    <div class="reader-toolbar">
      <div class="reader-legend ${colorsOn ? '' : 'is-dimmed'}" id="readerLegend">
        <span class="leg-badge c-person">Nume</span>
        <span class="leg-badge c-place">Locuri</span>
        <span class="leg-badge c-number">Cifre & Măsuri</span>
        <span class="leg-badge c-object">Obiecte</span>
        <span class="leg-badge c-animal">Animale</span>
      </div>
      <button type="button" class="reader-toggle-btn" id="btnColorToggle" aria-pressed="${colorsOn}" title="${colorsOn ? 'Dezactivează culorile' : 'Activează culorile'}">
        <span class="r-icon" id="btnColorIcon">${colorsOn ? TOGGLE_ICONS.off : TOGGLE_ICONS.on}</span>
        <span id="btnColorLabel">${colorsOn ? "Fără culori" : "Cu culori"}</span>
      </button>
    </div>

    <div class="reader-text ${colorsOn ? 'show-colors' : ''}" id="readerText">
      ${vs.map((v, i) => `<p data-v="${i+1}"><sup>${i+1}</sup>${highlightVerseEntities(v)}</p>`).join("")}
    </div>

    <div class="startbar"><button class="btn btn-primary btn-block" id="rGo" type="button"><span class="st-main">Fă testul pe capitolul ${c}</span></button></div>
  </section>`);

  document.body.insertAdjacentHTML("beforeend", `${c > 1 ? `<button class="r-side l" id="rSideP" type="button" aria-label="Capitolul ${c-1}" title="Capitolul ${c-1}"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : ""}
  ${c < 31 ? `<button class="r-side r" id="rSideN" type="button" aria-label="Capitolul ${c+1}" title="Capitolul ${c+1}"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : ""}`);

  const btnToggle = $("#btnColorToggle");
  if (btnToggle) {
    btnToggle.onclick = () => {
      colorsOn = !colorsOn;
      lsSet("candela:rc", colorsOn);
      btnToggle.setAttribute("aria-pressed", colorsOn);
      btnToggle.setAttribute("title", colorsOn ? "Dezactivează culorile" : "Activează culorile");
      const icon = $("#btnColorIcon");
      if (icon) icon.innerHTML = colorsOn ? TOGGLE_ICONS.off : TOGGLE_ICONS.on;
      const lbl = $("#btnColorLabel");
      if (lbl) lbl.textContent = colorsOn ? "Fără culori" : "Cu culori";
      const rLeg = $("#readerLegend");
      if (rLeg) rLeg.classList.toggle("is-dimmed", !colorsOn);
      const rText = $("#readerText");
      if (rText) rText.classList.toggle("show-colors", colorsOn);
      if (!colorsOn) {
        const pop = document.getElementById("entityPopover");
        if (pop) pop.remove();
      }
    };
  }

  const rText = $("#readerText");
  if (rText) {
    rText.onclick = e => {
      const mark = e.target.closest(".hl-entity");
      if (mark && colorsOn) {
        showEntityPopover(mark);
      }
    };
  }

  $("#rBack").onclick = () => {
    if (S.reportBack) {
      const back = S.reportBack;
      S.reportBack = null;
      S.reportCh = null;
      back();
    } else {
      viewHome();
    }
  };
  $("#rPick").onchange = e => viewRead(+e.target.value);
  if ($("#rSideP")) $("#rSideP").onclick = () => viewRead(c - 1);
  if ($("#rSideN")) $("#rSideN").onclick = () => viewRead(c + 1);
  $("#rGo").onclick = () => { S.reportBack = null; S.reportCh = null; S.sel = new Set([c]); persistPrefs(); openOptions([c]); };
}
