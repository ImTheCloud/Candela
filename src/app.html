<title>Candela 1 Samuel</title>
<meta name="description" content="Pregătire pentru testul biblic din 1 Samuel, după traducerea Cornilescu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column (max 640px) like a pocket study book; a lamp flame is the recurring mark of progress. */
:root{
  --bg:#F8F1E6;          /* warm cream */
  --surface:#FFFBF4;
  --surface-2:#F1E6D5;
  --ink:#3A271B;         /* dark brown */
  --ink-2:#7B6450;
  --line:#E7D8C2;
  --oil:#D97B26;         /* lamp oil / flame orange */
  --oil-soft:#FBE5CC;
  --oil-ink:#8A4510;
  --cedar:#8A5A36;       /* warm brown (easy level, avatars) */
  --cedar-soft:#F2E3D2;
  --ok:#5E8A3A; --ok-soft:#E8F0DA;
  --bad:#B23A2E; --bad-soft:#FBE4DF;
  --p1:#D97B26; --p2:#8A5A36; --p3:#B0644A; --p4:#5E8A3A; --p5:#B4534A;
  --shadow:0 1px 2px rgb(58 39 27 / .05), 0 10px 30px -18px rgb(58 39 27 / .28);
  --f-display:"Gloock", "Georgia", "Times New Roman", serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oil);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.view{max-width:640px;margin:0 auto}
.view:has(.home), .view:has(.entry){max-width:1180px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--oil-ink);background:var(--oil-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.muted{color:var(--ink-2)}
.view{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:16px;transition:transform .15s ease, background .2s, box-shadow .2s;min-height:50px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{box-shadow:0 6px 18px -8px var(--ink)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-oil{background:var(--oil);color:#2a1505}
.btn-block{width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--ink-2);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* Entry */
.entry{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.entry[data-step="form"]{padding-top:6vh}
.entry-head{display:grid;justify-items:center;gap:4px;flex:none}
.entry .back{align-self:center}
.verse-quote{font-family:var(--f-display);font-size:17px;line-height:1.35;text-align:center;max-width:30ch;margin:6px auto 0;color:var(--ink-2)}
.verse-quote .ref{margin-left:6px;vertical-align:2px}
.seg.two{grid-template-columns:1fr 1fr}
.name-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.remember{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none}
.remember input{width:20px;height:20px;accent-color:var(--cedar);margin:0}
.board.scroll{position:relative;overflow-y:auto;overscroll-behavior:contain;align-content:start}
.entry .board.scroll{flex:1;min-height:0}
.h-board .board.scroll{max-height:420px}
.lamp-wrap{display:flex;justify-content:center;position:relative}
.lamp-glow{position:absolute;inset:-40px 0 auto;height:220px;background:radial-gradient(closest-side,color-mix(in oklab,var(--oil) 40%,transparent),transparent);filter:blur(6px);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
.flame{transform-origin:50% 90%;animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scaleY(1) skewX(0)}25%{transform:scaleY(1.06) skewX(-2deg)}50%{transform:scaleY(.96) skewX(1.5deg)}75%{transform:scaleY(1.04) skewX(-1deg)}}
.entry h1{font-size:clamp(40px,11vw,56px);line-height:.95;text-align:center}
.entry h1 span{display:block;font-size:.4em;letter-spacing:.02em;color:var(--ink-2);margin-top:8px}
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.field{display:grid;gap:8px}
.field label{font-weight:600}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:18px;transition:border-color .2s, background .2s}
.input:focus{outline:none;border-color:var(--oil);background:var(--surface)}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;transition:all .15s}
.chip:hover{border-color:var(--oil);color:var(--oil-ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:not-allowed;border-style:dashed}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:28px;line-height:1}
.brand svg{margin:-10px -6px -4px -12px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-width:0;border:0;background:transparent;padding:4px 4px 4px 12px;border-radius:999px;transition:background .2s}
.who:hover{background:var(--surface-2)}
.prof{justify-items:center;text-align:center;position:relative;padding-top:28px}
.prof .prof-x{position:absolute;top:14px;right:14px}
.prof h3{font-size:28px}
.avatar.lg{width:72px;height:72px;font-size:30px}
.badge-rank{font-size:13px;font-weight:600;color:var(--oil-ink);background:var(--oil-soft);padding:4px 12px;border-radius:999px}
.prof .kv{width:100%}
.prof-mail{color:var(--ink-2);font-size:14px;margin-top:-10px;word-break:break-all}
.prof-mail.warn{color:var(--oil-ink);word-break:normal;max-width:32ch}
.prof-btns{width:100%;display:grid;gap:8px}
.prof{max-height:92dvh;overflow:auto}
.pf-head{display:grid;justify-items:center;gap:10px}
.pf-head .prof-mail{margin:0}
.pf-card{width:100%;background:var(--surface);border-radius:16px;padding:16px 18px;display:grid;gap:12px;box-shadow:var(--shadow);text-align:left}
.pf-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--ink-2)}
.pf-row b{color:var(--ink);font-weight:600;text-align:right}
.pf-bar{display:grid;gap:6px}
.pf-bar-h{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.pf-bar-h b{color:var(--ink);font-weight:600;font-family:var(--f-mono);font-size:13px}
.btn-danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in oklab,var(--bad) 35%,transparent)}
.btn-danger:hover{background:var(--bad-soft)}
.prof .kv{margin:0}
.prof-form{width:100%;display:grid;gap:14px;text-align:left}
.resume{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:14px 14px 14px 18px;margin-bottom:22px;border:1.5px solid var(--oil-soft)}
.resume b{display:block;font-weight:600}.resume small{color:var(--ink-2);font-size:13px}
.resume .btn{padding-inline:18px}
.h-verse{display:none}
.keys{display:none;font-size:12.5px;color:var(--ink-2);font-family:var(--f-mono);margin:-4px 0 0}
.who b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--cedar);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.dot.on{background:var(--ok)}

/* Dashboard */
.hello{display:grid;gap:6px;margin-bottom:20px}
.hello h2{font-size:clamp(30px,8vw,40px);line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--ink-2)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-h h3{font-size:22px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px 6px;font-weight:600;font-size:15px;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.more summary{font-family:var(--f-body);font-size:13.5px;font-weight:600;color:var(--oil-ink);cursor:pointer;margin-top:6px}
.more[open] summary{margin-bottom:6px}
.seg-note{font-size:13px;color:var(--ink-2);margin-top:8px}
.who.acct{border:1px solid var(--line);padding-left:14px}
.who.acct .avatar{background:var(--surface-2);color:var(--ink)}
.guest-line{font-size:14px;color:var(--ink-2);margin-top:6px}
.guest-line .link{padding:0;color:var(--ink);font-size:inherit}
.guest-cta{display:grid;gap:8px;border-color:var(--oil-soft);background:linear-gradient(180deg,var(--surface),var(--bg))}
.guest-cta b{font-size:17px}
.guest-cta p{color:var(--ink-2);font-size:14px;margin:0}
.guest-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.guest-btns .btn{white-space:nowrap;padding-inline:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;display:grid;place-items:center;padding:0;transition:transform .15s, border-color .2s, background .2s}
.tile:active{transform:scale(.94)}
.tile svg{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px)}
.tile .n{font-family:var(--f-display);font-size:22px;line-height:1;position:relative}
.tile[aria-pressed="true"]{background:var(--oil-soft);border-color:var(--oil);color:var(--oil-ink);box-shadow:0 0 0 3px color-mix(in oklab,var(--oil) 18%,transparent)}
.tile[aria-pressed="true"] .trk{stroke:color-mix(in oklab,var(--oil) 20%,transparent)}
#start{display:grid;gap:2px;justify-items:center;padding-block:12px;min-height:60px;line-height:1.2}
#start .st-main{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#start .st-sub{font-size:13px;font-weight:500;opacity:.78;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{stroke:var(--surface-2)}
.chap-list{margin-top:12px;font-size:14px;color:var(--ink-2);min-height:21px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.opts-row{display:grid;gap:4px;background:var(--surface);border-radius:20px;padding:6px 18px;box-shadow:var(--shadow)}
.entry-hero{display:grid;gap:24px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--ink-2);font-size:13px}
.switch{position:relative;width:48px;height:28px;flex:none;border:0;border-radius:999px;background:var(--surface-2);transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--cedar)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.counts{display:flex;gap:6px;flex-wrap:wrap}
html:has(.sheet-bg),html:has(.modal-bg),body:has(.sheet-bg),body:has(.modal-bg){overflow:hidden}
.sheet,.modal{overscroll-behavior:contain}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgb(58 39 27 / .35);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease both}
.sheet{width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1) both}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h3{font-size:24px}
.dur{font-size:13px;color:var(--ink-2);margin-top:-6px}
.cnt-h{display:flex;justify-content:space-between;align-items:baseline}
.cnt-h b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.sheet input[type=range]{width:100%;accent-color:var(--oil)}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
@media (min-width:960px){.sheet-bg{align-items:center}.sheet{border-radius:24px;padding:24px}}
.startbar{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:18px;z-index:5}
.history{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px}
.hrow .pct{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.hrow small{display:block;color:var(--ink-2);font-size:13px}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.badge.easy{background:var(--cedar-soft);color:var(--cedar)}
.badge.hard{background:var(--oil-soft);color:var(--oil-ink)}
.badge.both{background:var(--surface-2);color:var(--ink-2)}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink-2);font-size:14px;text-align:center}

/* Quiz */
.qtop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:18px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--oil);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.qcount{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);display:grid;gap:18px}
.qcard.enter{animation:qIn .42s cubic-bezier(.2,.8,.2,1) both}
.qcard.leave{animation:qOut .22s ease-in both}
@keyframes qIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes qOut{to{opacity:0;transform:translateX(-28px)}}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtype{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cedar)}
.qtext{font-size:20px;line-height:1.4;font-weight:500}
.qhint{font-size:13px;color:var(--ink-2);margin-top:-8px}
.answers{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px;font-size:16px;line-height:1.35;transition:border-color .15s, background .15s, transform .15s}
.opt:hover:not(:disabled){border-color:var(--ink-2)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);transition:all .15s}
.opt.multi .k{border-radius:7px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.opt[aria-pressed="true"] .k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600;font-size:17px;padding:20px 10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start;min-width:0}
.mitem{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px 11px 14px;font-size:14.5px;line-height:1.3;min-height:48px;transition:border-color .15s, background .15s, transform .15s;overflow-wrap:anywhere}
.mitem.sel{border-color:var(--ink);background:var(--surface);transform:translateY(-1px);box-shadow:var(--shadow)}
.mitem[data-pair]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--pc)}
.mitem[data-pair]{border-color:var(--pc)}
.mitem .tag{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--pc);color:var(--surface);font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px}
.mitem.ok{background:var(--ok-soft)}
.mitem.no{background:var(--bad-soft)}
.mfix{display:block;font-size:12.5px;color:var(--ok);margin-top:4px;font-weight:600}
.fill{font-family:var(--f-display);font-size:21px;line-height:1.75}
.fill input{font-family:var(--f-body);font-size:17px;width:8.5em;max-width:100%;border:0;border-bottom:2px solid var(--oil);background:var(--oil-soft);border-radius:8px 8px 2px 2px;padding:2px 8px;margin:0 2px;color:var(--ink);transition:background .2s,border-color .2s}
.fill input:focus{outline:none;background:var(--surface-2)}
.fill input.ok{border-color:var(--ok);background:var(--ok-soft)}
.fill input.no{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:14px;padding:14px 16px;display:grid;gap:6px;font-size:15px;animation:fbIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{font-weight:700}
.feedback.ok b{color:var(--ok)}
.feedback.no b{color:var(--bad)}
.verse{font-family:var(--f-display);font-size:16px;line-height:1.5;color:var(--ink);border-left:3px solid var(--oil);padding-left:12px}
.verse sup{font-family:var(--f-mono);font-size:10px;color:var(--oil-ink);margin-right:3px}
.qactions{display:flex;gap:10px;margin-top:16px}
.qactions .btn{flex:1}
@media (max-width:959px){
  .qactions{position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0 auto;max-width:640px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,transparent)}
  .qactions:empty{display:none}
  #qslot{padding-top:min(7vh,56px);padding-bottom:110px}
  .view:has(.qtop){padding-bottom:96px}
}

<script>
const QUIZ = /*__QUIZ__*/{};
const TEXT = /*__TEXT__*/{};
const TITLES = ["Nașterea lui Samuel","Cântarea Anei. Fiii lui Eli","Chemarea lui Samuel","Chivotul luat de filisteni","Chivotul în Asdod","Chivotul se întoarce","Biruința de la Mițpa","Israel cere un împărat","Saul și măgărițele","Saul uns împărat","Biruința asupra lui Nahaș","Cuvântarea lui Samuel","Jertfa lui Saul la Ghilgal","Isprava lui Ionatan","Saul lepădat de Domnul","David uns de Samuel","David și Goliat","Ionatan și David","Saul îl urmărește pe David","Legământul cu Ionatan","David la Nob și la Gat","Peștera Adulam","David la Cheila și în pustie","David îl cruță pe Saul","Nabal și Abigail","A doua cruțare a lui Saul","David la Achiș","Saul la En-Dor","David trimis înapoi","Țiclagul ars","Moartea lui Saul"];
const TYPE_LABEL = {tf:"Adevărat / Fals", one:"Variantă corectă", multi:"Alegere multiplă", match:"Asociere", fill:"Completează versetul"};
const MODE_LABEL = {easy:"Ușor", hard:"Greu", both:"Ambele"};
const LETTERS = "ABCDEF";

/* ---------- utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fold = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const slugOf = name => fold(name).replace(/ /g,"-").slice(0,60);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const refLabel = r => "1 Sam. " + r;
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2400); }
function verseHTML(ref){
  const m = /^(\d+):(\d+)(?:-(\d+))?$/.exec(ref); if (!m) return "";
  const c = +m[1], a = +m[2], b = +(m[3]||m[2]); const vs = TEXT[c] || [];
  const one = v => `<sup>${v}</sup>${esc(vs[v-1])} `;
  let out = ""; const end = Math.min(b, vs.length);
  if (end - a < 4){ for (let v=a; v<=end; v++) out += one(v); return out.trim(); }
  for (let v=a; v<a+2; v++) out += one(v);
  let rest = ""; for (let v=a+2; v<=end; v++) rest += one(v);
  return `${out}<details class="more"><summary>Citește versetele ${a+2}–${end}</summary>${rest.trim()}</details>`;
}
function dateLabel(ts){ const d = new Date(ts); return d.toLocaleDateString("ro-RO",{day:"numeric",month:"short"}) + ", " + d.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"}); }
function chaptersLabel(chs){
  if (chs.length === 31) return "Toate capitolele";
  const s = chs.slice().sort((a,b)=>a-b), parts = []; let i = 0;
  while (i < s.length){ let j = i; while (j+1 < s.length && s[j+1] === s[j]+1) j++; parts.push(j>i+1 ? `${s[i]}–${s[j]}` : j===i+1 ? `${s[i]}, ${s[j]}` : `${s[i]}`); i = j+1; }
  return (s.length === 1 ? "Capitolul " : "Capitolele ") + parts.join(", ");
}

/* ---------- storage ----------
   Supabase: accounts are email + password (Supabase Auth) with a unique first + last name, progress in Postgres behind row-level security.
   A finished test is one call to save_result(); the leaderboard is the public leaderboard() function.
   Results that could not be sent wait in localStorage and go out at the next sign-in.
   Without an account the visitor plays as a guest: results stay in this browser and move to the account at sign-up or sign-in. */
const SB = /*__SB__*/null;
const HOSTED = true;
const authStorage = {   // "Rămâi conectat" off → the session lives only until the browser is closed
  getItem(k){ try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  setItem(k, v){ try { const keep = lsGet("candela:remember", true); (keep ? localStorage : sessionStorage).setItem(k, v); (keep ? sessionStorage : localStorage).removeItem(k); } catch {} },
  removeItem(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} },
};
let sbc = null;
function sb(){
  if (!sbc && SB && window.supabase) sbc = window.supabase.createClient(SB.url, SB.key, { auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  return sbc;
}
const isNetErr = e => !e || /fetch|network|failed to|load failed/i.test(String(e.message || e));
const store = {
  uid: null,
  blank(name){ return { name, history: [], chap: {}, ok: [], tests: 0 }; },
  norm(p, name){ p = p ? JSON.parse(JSON.stringify(p)) : this.blank(name); p.name = p.name || name; p.history = p.history || []; p.chap = p.chap || {}; p.ok = p.ok || []; p.tests = p.tests ?? p.history.length; return p; },
  pending(){ return lsGet("candela:pending:" + this.uid, []); },
  applyEntry(p, x){
    if (!p.history.some(h => h.at === x.at)){ p.history.push({at:x.at, chs:x.chs, mode:x.mode, score:x.score, total:x.total, pct:x.pct, secs:x.secs}); p.tests++; }
    for (const [k, v] of Object.entries(x.chap)){ const cur = p.chap[k] || {best:0, n:0}; p.chap[k] = {best: Math.max(cur.best||0, v), last: v, n: (cur.n||0)+1}; }
    p.ok = [...new Set([...p.ok, ...x.ok])];
  },
  async send(x){
    const { error } = await sb().rpc("save_result", { p_at: new Date(x.at).toISOString(), p_chs: x.chs, p_mode: x.mode, p_score: x.score, p_total: x.total, p_pct: x.pct, p_secs: x.secs, p_chap: x.chap, p_ok: x.ok });
    if (error) throw error;
  },
  async flush(){
    const left = [];
    for (const x of this.pending()){ try { await this.send(x); } catch (e) { if (isNetErr(e)) left.push(x); } }
    lsSet("candela:pending:" + this.uid, left);
  },
  guest(){ const p = this.norm(lsGet("candela:guest", null), "Invitat"); p.name = "Invitat"; p.guest = true; return p; },
  async load(user){
    this.uid = user.id; this.email = user.email || "";
    const moved = lsGet("candela:guestEntries", []);   // tests played as a guest join the account
    if (moved.length){ lsSet("candela:pending:" + this.uid, [...this.pending(), ...moved]); lsSet("candela:guestEntries", []); lsSet("candela:guest", null); }
    this.moved = moved.length;
    await this.flush();
    const { data, error } = await sb().rpc("my_progress");
    if (error) throw error;
    const p = this.norm({ name: data.name || user.user_metadata?.name || "?", history: data.history, chap: data.chap, ok: data.ok, tests: data.tests });
    for (const x of this.pending()) this.applyEntry(p, x);
    lsSet("candela:p:" + this.uid, p);
    return p;
  },
  /* returns {ok, profile} or {ok:false, error} */
  // The login is the email. Accounts made before emails existed have an internal address built from the name,
  // so "Prenume Nume" typed in the email field still signs them in.
  authEmail(id){ id = id.trim(); return id.includes("@") ? id.toLowerCase() : slugOf(id) + "@candela.invalid"; },
  hasEmail(){ return !!this.email && !this.email.endsWith("@candela.invalid"); },
  async login(id, password){
    if (!sb()) return {ok:false, error:"network"};
    try {
      const { data, error } = await sb().auth.signInWithPassword({ email: this.authEmail(id), password });
      if (error) return {ok:false, error: isNetErr(error) ? "network" : /confirm/i.test(error.message) ? "unconfirmed" : "cred"};
      return {ok:true, profile: await this.load(data.user)};
    } catch (e) { return {ok:false, error: isNetErr(e) ? "network" : "server"}; }
  },
  async call(fn, body, token){
    let r;
    try { r = await fetch(SB.url + "/functions/v1/" + fn, {method:"POST", headers:{"content-type":"application/json", apikey: SB.key, ...(token ? {authorization: "Bearer " + token} : {})}, body: JSON.stringify(body)}); }
    catch { return {ok:false, error:"network"}; }
    let d = {}; try { d = await r.json(); } catch {}
    return r.ok ? {ok:true, ...d} : {ok:false, error: d.error || "server"};
  },
  async signup(first, last, email, password){
    if (!sb()) return {ok:false, error:"network"};
    const r = await this.call("signup", {first, last, email, password});
    if (!r.ok) return r;
    const l = await this.login(email, password);
    return l.ok ? {...l, created:true} : l;
  },
  /* changes the signed-in player's name and email */
  async updateAccount(first, last, email){
    if (!sb()) return {ok:false, error:"network"};
    let token = null;
    try { token = (await sb().auth.getSession()).data.session?.access_token; } catch {}
    if (!token) return {ok:false, error:"auth"};
    const r = await this.call("account", {first, last, email}, token);
    if (!r.ok) return r;
    try { await sb().auth.refreshSession(); } catch {}
    this.email = r.email;
    const p = this.local(this.uid); if (p){ p.name = r.name; lsSet("candela:p:" + this.uid, p); }
    return r;
  },
  async resume(){
    if (!sb()) return null;
    const { data } = await sb().auth.getSession();
    return data.session ? data.session.user : null;
  },
  local(uid){ return lsGet("candela:p:" + uid, null); },
  /* saves one finished test; returns whether it reached the server */
  async save(p, x){
    this.applyEntry(p, x);
    if (p.guest){ lsSet("candela:guest", p); lsSet("candela:guestEntries", [...lsGet("candela:guestEntries", []), x]); return {guest:true}; }
    lsSet("candela:p:" + this.uid, p);
    try { await this.send(x); return {saved:true}; }
    catch (e) {
      if (isNetErr(e)){ lsSet("candela:pending:" + this.uid, [...this.pending(), x]); }
      return {saved:false};
    }
  },
  async board(){
    if (!sb()) return null;
    try {
      const { data, error } = await sb().rpc("leaderboard");
      if (error) return null;
      const total = totalCount("both");
      return data.map(x => ({ name: x.name, ok: x.ok, tests: x.tests, mastery: Math.round(x.ok / total * 1000) / 10 }));
    } catch { return null; }
  },
  async logout(){ try { await sb()?.auth.signOut(); } catch {} this.uid = null; this.email = ""; }
};

/* ---------- state ---------- */
const S = {
  player: null,
  scope: lsGet("candela:scope", "one"),          // one | many | all
  sel: new Set(lsGet("candela:sel", [1])),
  mode: lsGet("candela:mode", "easy"),
  count: lsGet("candela:count", 20),
  shuffle: true,   // questions are always mixed and corrected right away
  instant: true,
  quiz: null,
  board: null,

if (!S.sel.size) S.sel.add(1);
if (S.scope === "one" && S.sel.size > 1) S.sel = new Set([[...S.sel][0]]);
function persistPrefs(){ lsSet("candela:scope",S.scope); lsSet("candela:sel",[...S.sel]); lsSet("candela:mode",S.mode); lsSet("candela:count",S.count); }

}

function totalCount(mode){ let n=0; for (const c in QUIZ){ if (mode!=="hard") n += (QUIZ[c].easy||[]).length; if (mode!=="easy") n += (QUIZ[c].hard||[]).length; } return n; }

function viewEntry(msg, tab){
  tab = tab || (lsGet("candela:hasAccount", false) ? "in" : "new");
  const head = `<div class="entry-head"><div class="lamp-wrap"><div class="lamp-glow"></div>${lampSVG(56)}</div><h1>Candela<span>1 Samuel</span></h1><p class="verse-quote">„Candela lui Dumnezeu nu se stinsese încă.”<span class="ref">1 Sam. 3:3</span></p></div>`;
  const isNew = tab === "new";
  mount(`<section class="entry" data-step="form">${head}
    <form class="card entry-form" id="enter" novalidate>
      <div class="seg two" role="tablist"><button type="button" role="tab" data-tab="in" aria-pressed="${!isNew}">Intră</button><button type="button" role="tab" data-tab="new" aria-pressed="${isNew}">Cont nou</button></div>
      ${isNew ? `<div class="name-row">
        <div class="field"><label for="last">Nume de familie</label><input class="input" id="last" maxlength="30" autocomplete="family-name" autocapitalize="words" required></div>
        <div class="field"><label for="first">Prenume</label><input class="input" id="first" maxlength="30" autocomplete="given-name" autocapitalize="words" required></div>
      </div>` : ""}
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="${isNew ? "email" : "text"}" inputmode="email" maxlength="254" autocomplete="${isNew ? "email" : "username"}" autocapitalize="none" spellcheck="false" required value="${isNew ? "" : esc(lsGet("candela:email", ""))}"></div>
      <div class="field"><label for="pw">Parolă</label><input class="input" id="pw" type="password" autocomplete="${isNew ? "new-password" : "current-password"}" minlength="6" required></div>
      <label class="remember"><input type="checkbox" id="remember" ${lsGet("candela:remember", true) ? "checked" : ""}> Rămâi conectat</label>
      <p class="form-error" id="err" role="alert">${msg ? esc(msg) : ""}</p>
      <button class="btn btn-primary btn-block" id="go" type="submit">${isNew ? "Creează contul" : "Intră"}</button>
    </form>
    <button class="link back" id="back" type="button">Înapoi la teste</button>
  </section>`);
  const f = $("#enter"), err = $("#err"), first = $("#first"), last = $("#last"), email = $("#email"), pw = $("#pw");
  $("#back").onclick = () => S.player ? viewHome() : enterGuest();
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => viewEntry("", b.dataset.tab));
  (isNew ? last : !email.value ? email : pw).focus();
  f.addEventListener("input", () => { err.textContent = ""; });
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const fn = isNew ? capName(first.value) : "", ln = isNew ? capName(last.value) : "", em = email.value.trim();
    if (isNew && !slugOf(ln)) { err.textContent = "Scrie numele de familie."; last.focus(); return; }
    if (isNew && !slugOf(fn)) { err.textContent = "Scrie prenumele."; first.focus(); return; }
    if (isNew ? !EMAIL_RE.test(em) : !em) { err.textContent = isNew ? "Scrie o adresă de email validă." : "Scrie emailul."; email.focus(); return; }
    if (pw.value.length < (isNew ? 6 : 1)) { err.textContent = isNew ? "Parola trebuie să aibă cel puțin 6 caractere." : "Scrie parola."; pw.focus(); return; }
    lsSet("candela:remember", $("#remember").checked);
    const btn = $("#go"), label = btn.textContent; btn.disabled = true; btn.textContent = isNew ? "Se creează…" : "Se verifică…";
    const r = isNew ? await store.signup(fn, ln, em, pw.value) : await store.login(em, pw.value);
    if (!r.ok){
      btn.disabled = false; btn.textContent = label;
      err.textContent = loginError(r);
      if (r.error === "cred"){ pw.value = ""; pw.focus(); }
      f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      return;
    }
    lsSet("candela:email", em.includes("@") ? em.toLowerCase() : em); lsSet("candela:hasAccount", true);
    enter(r.profile, r.created);
  });
}
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
// "ana-maria pop" → "Ana-Maria Pop": names are shown on the leaderboard
const capName = n => n.trim().replace(/\s+/g," ").replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
function loginError(r){
  return ({
    cred: "Email sau parolă greșită.",
    name_taken: "Există deja un cont cu acest nume. Dacă e al tău, alege „Intră”.",
    email_taken: "Există deja un cont cu acest email. Dacă e al tău, alege „Intră”.",
    email: "Scrie o adresă de email validă.",
    password: "Parola trebuie să aibă între 6 și 72 de caractere.",
    name: "Scrie prenumele și numele de familie.",
    network: "Nu există conexiune. Verifică internetul și încearcă din nou.",
  })[r.error] || "Nu am putut intra acum. Încearcă din nou peste câteva clipe.";
}
function enter(profile, created){
  S.player = profile;
  if (created) toast(store.moved ? "Cont creat. Rezultatele tale au fost salvate." : "Cont creat. Bine ai venit!");
  else if (store.moved) toast("Rezultatele de invitat au fost adăugate în cont.");
  store.moved = 0;
  viewHome();
}
function enterGuest(){ S.player = store.guest(); viewHome(); }
async function autoLogin(){
  mount(`<div class="boot"><div class="lamp-wrap"><div class="lamp-glow"></div>${lampSVG(100)}</div><h1>Candela</h1><div class="boot-bar"><i></i></div></div>`);
  let user = null;
  try { user = await store.resume(); } catch {}
  if (!user) return enterGuest();
  try { return enter(await store.load(user)); }
  catch (e) {
    const local = store.local(user.id);
    if (isNetErr(e) && local){ store.uid = user.id; store.email = user.email || ""; S.player = store.norm(local); return viewHome(); }
    await store.logout(); S.player = store.guest(); viewEntry("Intră din nou în cont.", "in");
  }
}
function logout(){ store.logout(); enterGuest(); }

function chapStat(c, m){ return (S.player.chap[c+m[0]]||{}).best ?? null; }
function arc(p, r, color){
  if (p == null) return "";
  const C = 2*Math.PI*r, L = C*Math.max(p,2)/100;
  return `<circle cx="27" cy="27" r="${r}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${L} ${C}" transform="rotate(-90 27 27)"/>`;
}
function tileSVG(c){
  const e = chapStat(c,"easy"), h = chapStat(c,"hard");
  return `<svg viewBox="0 0 54 54" aria-hidden="true"><circle class="trk" cx="27" cy="27" r="24" fill="none" stroke-width="2.6"/><circle class="trk" cx="27" cy="27" r="19.5" fill="none" stroke-width="2.6"/>${arc(e,24,"var(--cedar)")}${arc(h,19.5,"var(--oil)")}</svg>`;
}

function initials(n){ const w = n.trim().split(/\s+/); return ((w[0]||"?")[0] + (w.length > 1 ? w[w.length-1][0] : "")).toUpperCase(); }
function whoHTML(){ const n = S.player.name; return `<button class="who" id="who" type="button" aria-label="Profilul meu"><b>${esc(n)}</b><span class="avatar">${esc(initials(n))}</span></button>`; }

  const show = () => {
    const h = p.history, tests = h.length, avg = tests ? Math.round(h.reduce((s,x)=>s+x.pct,0)/tests) : 0;
    const best = tests ? Math.max(...h.map(x=>x.pct)) : 0, secs = h.reduce((s,x)=>s+(x.secs||0),0);
    const rank = S.board ? S.board.findIndex(x => slugOf(x.name) === slugOf(p.name)) : -1;

    const totE = totalCount("easy"), totH = totalCount("hard");
    const chs = new Set(Object.keys(p.chap).map(k=>parseInt(k))).size;
    const time = secs >= 3600 ? `${Math.floor(secs/3600)} h ${Math.round(secs%3600/60)} min` : `${Math.round(secs/60)} min`;
    const last = h.length ? h[h.length-1] : null;
    const pbar = (label, n, tot, color) => `<div class="pf-bar"><div class="pf-bar-h"><span>${label}</span><b>${n} / ${tot}</b></div><div class="bar"><i style="width:${Math.max(n/tot*100, n?2:0)}%;background:${color}"></i></div></div>`;
    sheet.innerHTML = `${X}
      <div class="pf-head">
        <span class="avatar lg">${esc(initials(p.name))}</span>
        <h3>${esc(p.name)}</h3>
        ${store.hasEmail() ? `<p class="prof-mail">${esc(store.email)}</p>` : `<p class="prof-mail warn">Adaugă un email: cu el intri în cont de acum înainte.</p>`}
        ${rank >= 0 ? `<span class="badge-rank">Locul ${rank+1} din ${S.board.length} în clasament</span>` : ""}
      </div>
      <div class="kv">
        <div class="stat"><b>${tests}</b><small>${tests===1?"test":"teste"}</small></div>
        <div class="stat"><b>${tests ? avg+"%" : "–"}</b><small>media</small></div>
        <div class="stat"><b>${tests ? best+"%" : "–"}</b><small>cel mai bun</small></div>
      </div>
      <div class="pf-card">
        <div class="pf-row"><span>Din carte stăpânit</span><b>${String(mastery(p)).replace(".",",")}%</b></div>
        ${pbar("Întrebări ușoare", okE, totE, "var(--cedar)")}
        ${pbar("Întrebări grele", okH, totH, "var(--oil)")}
        <div class="pf-row"><span>Capitole exersate</span><b>${chs} / 31</b></div>
        <div class="pf-row"><span>Timp de studiu</span><b>${tests ? time : "–"}</b></div>
        ${last ? `<div class="pf-row"><span>Ultimul test</span><b>${esc(chaptersLabel(last.chs))} · ${last.pct}%</b></div>` : ""}
      </div>
      <div class="prof-btns"><button class="btn ${store.hasEmail() ? "btn-ghost" : "btn-primary"} btn-block" id="pfEdit">${store.hasEmail() ? "Modifică profilul" : "Adaugă emailul"}</button>
      <button class="btn btn-danger btn-block" id="pfOut">Ieși din cont</button></div>`;
    sheet.querySelector("#pfX").onclick = close;
    sheet.querySelector("#pfEdit").onclick = edit;
    sheet.querySelector("#pfOut").onclick = () => { close(); logout(); };
  };
  const edit = () => {
    const parts = p.name.trim().split(" "), fn = parts[0], ln = parts.slice(1).join(" ");
    sheet.innerHTML = `${X}<h3>Profilul meu</h3>
      <form class="prof-form" id="pfForm" novalidate>
        <div class="name-row">
          <div class="field"><label for="pfLast">Nume de familie</label><input class="input" id="pfLast" maxlength="30" autocomplete="family-name" autocapitalize="words" value="${esc(ln)}"></div>
          <div class="field"><label for="pfFirst">Prenume</label><input class="input" id="pfFirst" maxlength="30" autocomplete="given-name" autocapitalize="words" value="${esc(fn)}"></div>
        </div>
        <div class="field"><label for="pfMail">Email</label><input class="input" id="pfMail" type="email" inputmode="email" maxlength="254" autocomplete="email" autocapitalize="none" spellcheck="false" value="${store.hasEmail() ? esc(store.email) : ""}"></div>

      </form>`;
    sheet.querySelector("#pfX").onclick = close;
    sheet.querySelector("#pfCancel").onclick = show;

      const btn = sheet.querySelector("#pfSave"); btn.disabled = true; btn.textContent = "Se salvează…";
      const r = await store.updateAccount(f1, l1, em);
      if (!r.ok){

        err.textContent = ({ name_taken: "Acest nume e deja folosit de alt cont.", email_taken: "Acest email e deja folosit de alt cont.", auth: "Intră din nou în cont și încearcă iar." })[r.error] || loginError(r);
        return;
      }
      p.name = r.name; lsSet("candela:email", r.email); S.board = null;
      const who = $("#who"); if (who) who.outerHTML = whoHTML();
      if ($("#board")) loadBoard();
      toast("Profil actualizat.");
      show();
    });
  };
  show();
}
document.addEventListener("click", e => {
  if (!e.target.closest) return;
  if (e.target.closest("#who")) openProfile();
  if (e.target.closest("#acct, #gNew")) viewEntry("", e.target.closest("#gNew") ? "new" : undefined);
  if (e.target.closest("#gIn")) viewEntry("", "in");
});
function mastery(p){ return Math.round((p.ok||[]).length / totalCount("both") * 1000) / 10; }

const MODE_NOTE = { easy: "Întrebări generale despre poveste: cine, ce și de ce.", hard: "Detalii precise: nume, cifre, locuri și cuvinte exacte.", both: "Întrebări ușoare și grele, amestecate." };
function viewHome(){
  const p = S.player, h = p.history;
  const tests = h.length, avg = tests ? Math.round(h.reduce((s,x)=>s+x.pct,0)/tests) : 0;
  const touched = new Set(Object.keys(p.chap).map(k=>parseInt(k))).size;
  const first = p.name.split(" ")[0];
  mount(`${headerHTML()}
  <div class="home">
  <section class="h-intro">
    <div class="hello">${tests ? `<span class="eyebrow">Bine ai revenit</span>` : ""}
      <h2>${p.guest ? (tests ? "Continuăm?" : "Bun venit!") : tests ? `Continuăm, ${esc(first)}?` : `Bun venit, ${esc(first)}.`}</h2>

    ${tests ? `<div class="stats">
      <div class="stat"><b>${tests}</b><small>teste făcute</small></div>
      <div class="stat"><b>${avg}%</b><small>media</small></div>
      <div class="stat"><b>${String(mastery(p)).replace(".",",")}%</b><small>stăpânit</small></div>

  </section>
  <section class="h-verse"><div class="lamp-wrap"><div class="lamp-glow"></div>${lampSVG(46)}</div><p class="verse-quote">„Candela lui Dumnezeu nu se stinsese încă.”<span class="ref">1 Sam. 3:3</span></p></section>

  <aside class="h-config">
    <div class="panel">
      <div class="section-h first"><h3>Nivel</h3></div>
      <div class="seg" role="group" aria-label="Nivel">
        ${["easy","hard","both"].map(m=>`<button data-mode="${m}" aria-pressed="${S.mode===m}">${MODE_LABEL[m]}</button>`).join("")}
      </div>
      <p class="seg-note" id="modeNote"></p>
      

      <div class="section-h"><h3>Câte capitole vrei să exersezi?</h3></div>
      <div class="seg scope" role="group" aria-label="Câte capitole">
        <button data-scope="one">Un capitol</button><button data-scope="many">Mai multe</button><button data-scope="all">Toată cartea</button>
      </div>
      
      <div class="grid" id="grid">${Array.from({length:31},(_,i)=>i+1).map(c=>`<button class="tile" data-c="${c}" aria-pressed="false" title="${c}. ${esc(TITLES[c-1])}" aria-label="Capitolul ${c}: ${esc(TITLES[c-1])}">${tileSVG(c)}<span class="n">${c}</span><i class="check" aria-hidden="true"></i></button>`).join("")}</div>
      <div class="legend"><span><i style="background:var(--cedar)"></i>scor maxim ușor</span><span><i style="background:var(--oil)"></i>scor maxim greu</span></div>

      <div class="startbar"><button class="btn btn-primary btn-block" id="start"></button></div>
    </div>
  </aside>

  ${HOSTED ? `<section class="h-board"><div class="section-h"><h3>Clasament</h3></div><div id="board" class="board scroll"><div class="empty">Se încarcă clasamentul…</div></div></section>` : ""}

  <section class="h-hist">
    <div class="section-h"><h3>Istoric</h3></div>
    <div class="history">${h.length ? h.slice(-6).reverse().map(x=>`
      <div class="hrow"><span class="badge ${x.mode}">${MODE_LABEL[x.mode]}</span><div style="min-width:0"><b style="font-weight:600">${esc(chaptersLabel(x.chs))}</b><small>${dateLabel(x.at)} · ${x.score}/${x.total} puncte</small></div><span class="pct">${x.pct}%</span></div>`).join("")
      : `<div class="empty">Niciun test încă.</div>`}</div>
  </section>
  </div>`);

  const update = () => {
    if (S.scope === "all"){ S.sel = new Set(Array.from({length:31},(_,i)=>i+1)); }
    const chs = [...S.sel].sort((a,b)=>a-b);
    app.querySelectorAll(".tile").forEach(t => t.setAttribute("aria-pressed", S.sel.has(+t.dataset.c)));
    $("#grid").dataset.scope = S.scope;
    app.querySelectorAll("[data-scope]").forEach(b => b.setAttribute("aria-pressed", S.scope===b.dataset.scope));
    app.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", S.mode===b.dataset.mode));
    const list = buildPool(chs, S.mode), pool = list.length, dur = pool ? ` · ${durLabel(estSecs(list))}` : "";

  app.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => {
    const prev = S.scope; S.scope = b.dataset.scope;
    if (S.scope === "one") S.sel = new Set([[...S.sel].sort((a,b)=>a-b)[0] || 1]);
    if (S.scope === "many" && prev === "all") S.sel = new Set();
    update();
  });
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { S.mode = b.dataset.mode; update(); });
  $("#start").onclick = () => S.sel.size > 1 ? openOptions() : startQuiz();
  if ($("#resume")){ $("#resume").onclick = resumeQuiz; $("#resumeX").onclick = () => { dropQuiz(); $(".resume").remove(); }; }
  update();
  if (HOSTED) loadBoard();
}

async function loadBoard(){
  const el = $("#board"); if (!el) return;
  if (S.board) renderBoard(S.board);
  const list = await store.board();
  if (list) { S.board = list; renderBoard(list); }
  else if (!S.board && $("#board")) $("#board").innerHTML = `<div class="empty">Clasament indisponibil.</div>`;
}
function renderBoard(list){
  const el = $("#board"); if (!el) return;
  const me = S.player && !S.player.guest ? slugOf(S.player.name) : null;
  if (!list.length){ el.innerHTML = `<div class="empty">Încă nimeni.</div>`; return; }
  const idx = list.findIndex(x => slugOf(x.name) === me);
  const top = el.classList.contains("scroll") ? list : list.slice(0, 10);
  const row = (x, i) => { const mine = slugOf(x.name)===me, ok = x.ok ?? 0; return `<div class="brow-l ${mine?"me":""}">
    <span class="rank ${i<3 && ok ? "r"+(i+1) : ""}">${i+1}</span>
    <span class="avatar sm">${esc(initials(x.name))}</span>
    <div class="who-l"><b class="nm"><span>${esc(x.name)}</span>${mine?"<em>tu</em>":""}</b>
      <div class="bar"><i style="width:${ok ? Math.max(x.mastery,1.5) : 0}%"></i></div>
      <small>${String(x.mastery).replace(".",",")}% din carte · ${x.tests} ${x.tests===1?"test":"teste"}</small></div>
    <div class="pts"><b>${ok}</b><small>${ok===1?"întrebare":"întrebări"}</small></div></div>`; };
  el.innerHTML = top.map(row).join("") + (idx >= top.length ? `<div class="gap">···</div>${row(list[idx], idx)}` : "");

/* ---------- quiz engine ---------- */
function buildPool(chs, mode){
  const out = [];
  for (const c of chs){
    const d = QUIZ[c]; if (!d) continue;
    for (const m of (mode==="both" ? ["easy","hard"] : [mode]))
      (d[m]||[]).forEach((q,i) => out.push({...q, ch:c, mode:m, id:`${c}${m[0]}${i}`}));
  }
  return out;
}
function prepare(q){
  const x = {...q};
  if (q.t === "one"){ const idx = shuffle(q.opts.map((_,i)=>i)); x.opts = idx.map(i=>q.opts[i]); x.a = idx.indexOf(q.a); }
  if (q.t === "multi"){ const idx = shuffle(q.opts.map((_,i)=>i)); x.opts = idx.map(i=>q.opts[i]); x.a = q.a.map(a=>idx.indexOf(a)).sort((a,b)=>a-b); }
  if (q.t === "match"){ x.right = shuffle(q.pairs.map((p,i)=>i)); }
  return x;
}
/* rough time to answer, by question type and level (seconds), including reading the correction; only an estimate shown before starting, there is no timer */
const SECS = { tf:[10,14], one:[14,20], multi:[22,30], fill:[18,26], match:[32,45] };
function estSecs(list){ return list.reduce((s,q) => s + (SECS[q.t]||[18,24])[q.mode==="hard"?1:0], 0); }
function durLabel(secs){
  const m = secs / 60;
  if (m < 1.5) return "cam 1 min";
  if (m < 20) return `cam ${Math.round(m)} min`;
  if (m < 60) return `cam ${Math.round(m/5)*5} min`;
  const h = Math.floor(m/60), r = Math.round((m - h*60)/10)*10;
  return r === 60 ? `cam ${h+1} h` : `cam ${h} h${r ? ` ${r} min` : ""}`;
}
function openOptions(){

        <div class="counts">${[10,20,30,50].filter(v=>v<pool).map(v=>`<button class="chip" data-n="${v}">${v}</button>`).join("")}<button class="chip" data-n="${pool}">Toate</button></div></div>

  const set = v => { n = Math.max(1, Math.min(pool, v)); bg.querySelector("#shR").value = n; bg.querySelector("#shN").textContent = n;

function startQuiz(list, count = 0){
  let qs;
  if (list) qs = list;
  else {
    const chs = [...S.sel].sort((a,b)=>a-b);
    let pool = buildPool(chs, S.mode);
    if (S.shuffle) pool = shuffle(pool);
    if (count && count < pool.length){
      // keep a fair spread across chapters, then restore order if not shuffling
      pool = shuffle(pool).slice(0, count);
      if (!S.shuffle) pool.sort((a,b)=> a.ch-b.ch || refStart(a)-refStart(b));
    }
    qs = pool;
  }
  S.quiz = { qs: qs.map(prepare), i: 0, answers: [], start: Date.now(), chs: [...new Set(qs.map(q=>q.ch))].sort((a,b)=>a-b), mode: list ? S.quiz.mode : S.mode, retry: !!list };

}

function fillHTML(q){

function grade(q, skipped){

  </div>
  <div class="section-h"><h3>${wrong.length ? "De revăzut" : "Nicio greșeală"}</h3>${wrong.length?`<span class="muted" style="font-size:14px">${wrong.length} întrebări</span>`:""}</div>
  <div class="mistakes">${wrong.length ? wrong.map(mistakeHTML).join("") : `<div class="allgood">Toate răspunsurile sunt corecte.</div>`}</div>
  <div class="startbar" style="display:grid;grid-template-columns:${wrong.length?"1fr 1fr":"1fr"};gap:10px">
    ${wrong.length ? `<button class="btn btn-oil" id="retry">Reia greșelile</button>` : ""}
    <button class="btn btn-primary" id="home">Test nou</button>
  </div>
  <p class="muted" id="saveNote" style="text-align:center;font-size:13px"></p>`);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const C = 2*Math.PI*52; $("#ringArc").setAttribute("stroke-dasharray", `${C*P/100} ${C}`);
    app.querySelectorAll("[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
    const el = $("#pctNum"), t0 = performance.now();
    const tick = t => { const k = Math.min(1,(t-t0)/1300), e = 1-Math.pow(1-k,3); el.textContent = Math.round(P*e) + "%"; if (k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    if (P >= 80 && !matchMedia("(prefers-reduced-motion: reduce)").matches){
      const sp = $("#sparks"); for (let i=0;i<22;i++){ const a = Math.random()*Math.PI*2, d = 90+Math.random()*60; const s = document.createElement("i"); s.className = "spark"; s.style.setProperty("--dx", Math.cos(a)*d+"px"); s.style.setProperty("--dy", Math.sin(a)*d+"px"); s.style.animationDelay = (1+Math.random()*.4)+"s"; s.style.background = i%3 ? "var(--oil)" : "var(--cedar)"; sp.appendChild(s); }
    }
  }));
  if (wrong.length) $("#retry").onclick = () => startQuiz(shuffle(wrong.map(x => { const o = {...x.q}; const src = QUIZ[o.ch][o.mode][+o.id.slice(String(o.ch).length+1)]; return {...src, ch:o.ch, mode:o.mode, id:o.id}; })));
  $("#home").onclick = () => viewHome();
  const res = await saving;

  const note = $("#saveNote"); if (note && res && !res.guest) note.textContent = res.saved ? "" : "Rezultatul nu s-a putut trimite. Se trimite automat la următoarea intrare.";
}
function mistakeHTML({q, a}){
  a = a || {pts:0, given:null, skipped:true};
  const skipped = a.skipped || a.given==null;
  let yours = "", correct = "";
  if (q.t==="tf"){ yours = skipped ? "—" : (a.given?"Adevărat":"Fals"); correct = q.a?"Adevărat":"Fals"; }
  if (q.t==="one"){ yours = skipped ? "—" : esc(q.opts[a.given]); correct = esc(q.opts[q.a]); }
  if (q.t==="multi"){ yours = skipped ? "—" : (a.given.length ? a.given.map(i=>esc(q.opts[i])).join("; ") : "niciuna"); correct = q.a.length ? q.a.map(i=>esc(q.opts[i])).join("; ") : "niciuna"; }
  if (q.t==="fill"){ yours = skipped ? "—" : a.given.map(esc).join(", "); correct = q.a.map(esc).join(", "); }
  if (q.t==="match"){
    yours = skipped ? "—" : q.pairs.map((p,i)=> a.given[i]===i ? null : `${esc(p[0])} → ${a.given[i]!=null ? esc(q.pairs[a.given[i]][1]) : "—"}`).filter(Boolean).join("<br>");
    correct = q.pairs.map(p=>`${esc(p[0])} → ${esc(p[1])}`).join("<br>");
  }
  const qtext = q.t==="fill" ? esc(q.q).replace(/___/g, "<b>____</b>") : esc(q.q);
  return `<article class="mistake"><div class="qmeta"><span class="qtype">${TYPE_LABEL[q.t]}</span><span class="ref">${refLabel(q.ref)}</span></div>
    <p class="q">${qtext}</p>
    <div class="ans"><div><span class="l">Răspunsul tău</span><span class="${skipped?"":"y"}">${yours}</span></div><div><span class="l">Corect</span><span class="c">${correct}</span></div></div>
    <div class="verse">${verseHTML(q.ref)}</div></article>`;
}

/* ---------- boot ---------- */
document.addEventListener("keydown", e => {
  if (!S.quiz || !$(".qcard") || e.target.tagName==="INPUT") return;
  const q = S.quiz.qs[S.quiz.i], ui = S.quiz.ui;
  if (e.key==="Enter"){ e.preventDefault(); if (ui.checked) next(); else if (ready(q) && $("#chk")) check(); }
  if (!ui.checked && (q.t==="one"||q.t==="multi")){ const i = LETTERS.toLowerCase().indexOf(e.key.toLowerCase()); const b = $(`.opt[data-i="${i}"]`); if (i>=0 && b) b.click(); }
  if (!ui.checked && q.t==="tf"){ if (e.key.toLowerCase()==="a") $('.opt[data-v="1"]').click(); if (e.key.toLowerCase()==="f") $('.opt[data-v="0"]').click(); }
});
