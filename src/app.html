<title>Candela 1 Samuel</title>
<meta name="description" content="Pregătire pentru testul biblic din 1 Samuel, după traducerea Cornilescu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column (max 640px) like a pocket study book; a lamp flame is the recurring mark of progress. */
:root{
  --bg:#F8F1E6;          /* warm cream */
  --surface:#FFFBF4;
  --surface-2:#F1E6D5;
  --ink:#3A271B;         /* dark brown */
  --ink-2:#7B6450;
  --line:#E7D8C2;
  --oil:#D97B26;         /* lamp oil / flame orange */
  --oil-soft:#FBE5CC;
  --oil-ink:#8A4510;
  --cedar:#8A5A36;       /* warm brown (easy level, avatars) */
  --cedar-soft:#F2E3D2;
  --ok:#5E8A3A; --ok-soft:#E8F0DA;
  --bad:#B23A2E; --bad-soft:#FBE4DF;
  --p1:#D97B26; --p2:#8A5A36; --p3:#B0644A; --p4:#5E8A3A; --p5:#B4534A;
  --shadow:0 1px 2px rgb(58 39 27 / .05), 0 10px 30px -18px rgb(58 39 27 / .28);
  --f-display:"Gloock", "Georgia", "Times New Roman", serif;
  --f-bible:"Source Serif 4", "Georgia", "Times New Roman", serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oil);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px calc(48px + env(safe-area-inset-bottom,0px))}
.view{max-width:640px;margin:0 auto}
.view:has(.home), .view:has(.entry){max-width:1180px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--oil-ink);background:var(--oil-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.muted{color:var(--ink-2)}
.view{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:16px;transition:transform .15s ease, background .2s, box-shadow .2s;min-height:50px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{box-shadow:0 6px 18px -8px var(--ink)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-oil{background:var(--oil);color:#2a1505}
.btn-block{width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--ink-2);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* Entry */
.entry{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.entry[data-step="form"]{padding-top:6vh}
.entry-head{display:grid;justify-items:center;gap:4px;flex:none}
.entry .back{align-self:center}
.verse-quote{font-family:var(--f-display);font-size:17px;line-height:1.35;text-align:center;max-width:30ch;margin:6px auto 0;color:var(--ink-2)}
.verse-quote .ref{margin-left:6px;vertical-align:2px}
.seg.two{grid-template-columns:1fr 1fr}
.name-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.remember{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none}
.remember input{width:20px;height:20px;accent-color:var(--cedar);margin:0}
.board.scroll{position:relative;align-content:start}
.entry .board.scroll{flex:1;min-height:0}
.lamp-wrap{display:flex;justify-content:center;position:relative}
.lamp-glow{position:absolute;inset:-40px 0 auto;height:220px;background:radial-gradient(closest-side,color-mix(in oklab,var(--oil) 40%,transparent),transparent);filter:blur(6px);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
.flame{transform-origin:50% 90%;animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scaleY(1) skewX(0)}25%{transform:scaleY(1.06) skewX(-2deg)}50%{transform:scaleY(.96) skewX(1.5deg)}75%{transform:scaleY(1.04) skewX(-1deg)}}
.entry h1{font-size:clamp(40px,11vw,56px);line-height:.95;text-align:center}
.entry h1 span{display:block;font-size:.4em;letter-spacing:.02em;color:var(--ink-2);margin-top:8px}
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.field{display:grid;gap:8px}
.field label{font-weight:600}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:18px;transition:border-color .2s, background .2s}
.input:focus{outline:none;border-color:var(--oil);background:var(--surface)}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;transition:all .15s}
.chip:hover{border-color:var(--oil);color:var(--oil-ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:not-allowed;border-style:dashed}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:30px;line-height:1;border:0;background:transparent;padding:0;color:inherit;cursor:pointer;text-align:left}
.brand.static{cursor:default}
.brand svg{margin:-10px -6px -4px -12px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-width:0;border:0;background:transparent;padding:4px;border-radius:999px}
.prof{justify-items:center;text-align:center;position:relative;padding-top:28px}
.prof .prof-x{position:absolute;top:14px;right:14px}
.prof h3{font-size:28px}
.avatar.lg{width:72px;height:72px;font-size:30px}
.badge-rank{font-size:13px;font-weight:600;color:var(--oil-ink);background:var(--oil-soft);padding:4px 12px;border-radius:999px}
.prof .kv{width:100%}
.prof-mail{color:var(--ink-2);font-size:14px;margin-top:-10px;word-break:break-all}
.prof-mail.warn{color:var(--oil-ink);word-break:normal;max-width:32ch}
.prof-btns{width:100%;display:grid;gap:8px}
.prof{max-height:min(94dvh,calc(100dvh - env(safe-area-inset-top,0px) - 16px));overflow-y:auto}
.pf-head{display:grid;justify-items:center;gap:10px}
.pf-head .prof-mail{margin:0}
.pf-card{width:100%;background:var(--surface);border-radius:16px;padding:16px 18px;display:grid;gap:12px;box-shadow:var(--shadow);text-align:left}
.pf-rules{margin-top:4px;padding-top:14px;border-top:1px solid var(--border);display:grid;gap:8px}
.pf-rule{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.pf-rule .r-icon{color:var(--oil);font-weight:600;width:14px;text-align:center;font-size:14px}
.pf-rule b{color:var(--ink);font-weight:600}
.pf-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--ink-2)}
.pf-row b{color:var(--ink);font-weight:600;text-align:right}
#pubBody{display:grid;gap:12px;width:100%;justify-self:stretch}
.pf-bar{display:grid;gap:6px}
.pf-bar-h{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.pf-bar-h b{color:var(--ink);font-weight:600;font-family:var(--f-mono);font-size:13px}
.pf-bar-h span:first-child{color:var(--ink);font-weight:600}
.bar.two{position:relative;height:8px}
.bar.two i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar.two i.seen{opacity:.3}
.pf-bar-f{margin:0;font-size:13.5px;color:var(--ink-2)}
.pf-bar-f b{color:var(--ink)}

.btn-danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in oklab,var(--bad) 35%,transparent)}
.prof .kv{margin:0}
.prof-form{width:100%;display:grid;gap:14px;text-align:left}
.resume{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:14px 14px 14px 18px;margin-bottom:22px;border:1.5px solid var(--oil-soft)}
.resume b{display:block;font-weight:600}.resume small{color:var(--ink-2);font-size:13px}
.resume .btn{padding-inline:18px}
.h-verse{display:none}
.keys{display:none;font-size:12.5px;color:var(--ink-2);font-family:var(--f-mono);margin:-4px 0 0}
.who b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--cedar);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.top .avatar{width:40px;height:40px;font-size:16px}

/* Dashboard */
.hello{display:grid;gap:6px;margin-bottom:20px}
.hello h2{font-size:clamp(30px,8vw,40px);line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--ink-2)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-h h3{font-size:22px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px 6px;font-weight:600;font-size:15px;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.more summary{font-family:var(--f-body);font-size:13.5px;font-weight:600;color:var(--oil-ink);cursor:pointer;margin-top:6px}
.more[open] summary{margin-bottom:6px}
.seg-note{font-size:13px;color:var(--ink-2)}
.who.acct{border:0;padding:4px}
.who.acct .avatar{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.guest-line{font-size:14px;color:var(--ink-2);margin-top:6px}
.guest-line .link{padding:0;color:var(--ink);font-size:inherit}
.guest-cta{display:grid;gap:8px;border-color:var(--oil-soft);background:linear-gradient(180deg,var(--surface),var(--bg))}
.guest-cta b{font-size:17px}
.guest-cta p{color:var(--ink);font-size:15px;font-weight:500;margin:0}
.guest-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.guest-btns .btn{white-space:nowrap;padding-inline:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;display:grid;place-items:center;padding:0;transition:transform .15s, border-color .2s, background .2s}
.tile:active{transform:scale(.94)}
.tile svg{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px)}
.tile .done-mark{position:absolute;bottom:4px;right:4px;width:17px;height:17px;border-radius:50%;background:var(--cedar);color:#fff;display:grid;place-items:center}
.done-mark svg{position:static;width:11px;height:11px;margin:0}
.prog{display:flex;gap:2px;width:26px;height:5px}
.prog i{flex:1;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--cedar)}
.tile .prog{position:absolute;left:50%;bottom:6px;transform:translateX(-50%)}
.tile .n{font-family:var(--f-display);font-size:22px;line-height:1;position:relative}
.tile[aria-pressed="true"]{background:var(--oil-soft);border-color:var(--oil);color:var(--oil-ink);box-shadow:0 0 0 3px color-mix(in oklab,var(--oil) 18%,transparent)}
.tile[aria-pressed="true"] .trk{stroke:color-mix(in oklab,var(--oil) 20%,transparent)}
#start,#rGo,#shGo{display:grid;gap:2px;justify-items:center;padding-block:12px;min-height:60px;line-height:1.2}
#start .st-main,#rGo .st-main,#shGo .st-main{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#start .st-sub,#rGo .st-sub,#shGo .st-sub{font-size:13px;font-weight:500;opacity:.78;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{stroke:var(--surface-2)}
.opts-row{display:grid;gap:4px;background:var(--surface);border-radius:20px;padding:6px 18px;box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--ink-2);font-size:13px}
.counts{display:flex;gap:6px;flex-wrap:wrap}
html.scroll-locked,body.scroll-locked{overflow:hidden!important;overscroll-behavior:none!important}
html:has(.sheet-bg),html:has(.modal-bg),body:has(.sheet-bg),body:has(.modal-bg){overflow:hidden}
.sheet,.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgb(58 39 27 / .45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:modalBgIn .28s cubic-bezier(.16,1,.3,1) both;touch-action:none;overscroll-behavior:contain;box-sizing:border-box}
.sheet-bg.closing{animation:modalBgOut .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.sheet{position:relative;width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px) + var(--kbd-h,0px));display:grid;gap:16px;animation:sheetUp .32s cubic-bezier(.16,1,.3,1) both;will-change:transform,opacity;touch-action:pan-y;overscroll-behavior:contain;max-height:min(94dvh,calc(100dvh - env(safe-area-inset-top,0px) - 16px));overflow-y:auto;box-sizing:border-box}
.sheet-bg.closing .sheet{animation:sheetDown .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h3{font-size:24px}
.dur{font-size:13px;color:var(--ink-2);margin-top:-6px}
.cnt-h{display:flex;justify-content:space-between;align-items:baseline}
.cnt-h b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.cnt-h span small{color:var(--ink-2);font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .icon-btn{font-size:20px;line-height:1;color:var(--ink)}
.stepper .input{width:84px;text-align:center;padding:8px 6px;font-family:var(--f-display);font-size:24px;-moz-appearance:textfield}
.stepper .input::-webkit-outer-spin-button,.stepper .input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@keyframes fadeIn{from{opacity:0}}
@keyframes modalBgIn{from{opacity:0}to{opacity:1}}
@keyframes modalBgOut{from{opacity:1}to{opacity:0}}
@keyframes modalUp{from{opacity:0;transform:translateY(60px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes modalDown{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(60px) scale(.95)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(100%)}}
@media (min-width:960px){.sheet-bg{align-items:center}.sheet{border-radius:24px;padding:24px;animation:modalUp .32s cubic-bezier(.16,1,.3,1) both}.sheet-bg.closing .sheet{animation:modalDown .22s cubic-bezier(.4,0,1,1) forwards}}
@media (prefers-reduced-motion:reduce){.modal-bg,.sheet-bg,.modal-bg.closing,.sheet-bg.closing,.modal,.sheet,.modal-bg.closing .modal,.sheet-bg.closing .sheet{animation:none!important;transform:none!important}}
.startbar{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:18px;z-index:5}
.history{display:grid;gap:6px}
.hrow{width:100%;border:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:9px 12px}
.hrow .chev,.brow-l .chev{color:var(--ink-2);opacity:.6}
.hist-page{display:grid;gap:18px}
.hgroup{display:grid;gap:8px}
.hg-h{display:grid;gap:1px}
.hg-h b{font-size:15px;font-weight:600;line-height:1.3}
.hg-h .muted{font-size:12.5px}
.sh-hist{max-height:172px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-hist .hrow{background:var(--surface-2)}
.hrow .pct{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.hrow .hrow-info{display:grid;gap:1px;min-width:0}
.hrow .hrow-info b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hrow-info small{display:block;color:var(--ink-2);font-size:11.5px;white-space:nowrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.badge.easy{background:var(--cedar-soft);color:var(--cedar)}
.badge.hard{background:var(--oil-soft);color:var(--oil-ink)}
.badge.both{background:var(--surface-2);color:var(--ink-2)}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink-2);font-size:14px;text-align:center}

/* Quiz */
.view:has(.qtop){display:flex;flex-direction:column;min-height:calc(100dvh - 36px);min-height:calc(var(--vvh,100dvh) - 36px);max-width:640px;margin:0 auto}
.qtop{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--oil);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.qcount{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#qslot{flex:1;display:flex;flex-direction:column;align-items:stretch;min-height:0}
body.quiz-fixed #qslot{justify-content:center}
body:not(.quiz-fixed) #qslot{justify-content:flex-start}
.qcard{background:var(--surface);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);display:grid;gap:18px}
body.quiz-fixed .qcard{max-height:calc(100dvh - 120px);max-height:calc(var(--vvh,100dvh) - 120px);overflow-y:auto;-webkit-overflow-scrolling:touch}
body:not(.quiz-fixed) .qcard{max-height:none;overflow:visible}
.qcard.enter{animation:qIn .42s cubic-bezier(.2,.8,.2,1) both}
.qcard.leave{animation:qOut .22s ease-in both}
@keyframes qIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes qOut{to{opacity:0;transform:translateX(-28px)}}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtype{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cedar)}
.qtext{font-size:20px;line-height:1.4;font-weight:500}
.qhint{font-size:13px;color:var(--ink-2);margin-top:-8px}
.qhint.ans{justify-self:start;background:var(--cedar-soft);color:var(--cedar);font-weight:600;border-radius:10px;padding:5px 12px;font-size:13.5px;line-height:1.3}
.answers{display:grid;gap:10px}

<div id="app" class="wrap"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const QUIZ = /*__QUIZ__*/{};
const TEXT = /*__TEXT__*/{};
const TITLES = ["Nașterea lui Samuel","Cântarea Anei / Fiii lui Eli","Chemarea lui Samuel","Chivotul luat de filisteni","Chivotul în Asdod","Chivotul se întoarce","Biruința de la Mițpa","Israel cere un împărat","Saul și măgărițele","Saul uns împărat","Biruința asupra lui Nahaș","Cuvântarea lui Samuel","Jertfa lui Saul la Ghilgal","Isprava lui Ionatan","Saul lepădat de Domnul","David uns de Samuel","David și Goliat","Ionatan și David","Saul îl urmărește pe David","Legământul cu Ionatan","David la Nob și la Gat","Peștera Adulam","David la Cheila și în pustie","David îl cruță pe Saul","Nabal și Abigail","A doua cruțare a lui Saul","David la Achiș","Saul la En-Dor","David trimis înapoi","Țiclagul ars","Moartea lui Saul"];
const TYPE_LABEL = {tf:"Adevărat / Fals", one:"Variantă corectă", multi:"Alegere multiplă", match:"Asociere", fill:"Completează versetul"};
const MODE_LABEL = {easy:"Ușor", hard:"Greu", both:"Ambele"};
const LETTERS = "ABCDEF";

/* ---------- utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- modal scroll lock & visual viewport ---------- */
const _modalObserver = new MutationObserver(() => {
  const hasOverlay = !!document.querySelector(".sheet-bg, .modal-bg");
  if (hasOverlay) {
    if (!document.body.classList.contains("scroll-locked")) {
      document.body.classList.add("scroll-locked");
      document.documentElement.classList.add("scroll-locked");
    }
  } else {
    if (document.body.classList.contains("scroll-locked")) {
      document.body.classList.remove("scroll-locked");
      document.documentElement.classList.remove("scroll-locked");
    }
  }
});
_modalObserver.observe(document.body, { childList: true });

if (window.visualViewport) {
  const syncVv = () => {
    const vv = window.visualViewport;
    const vvh = Math.round(vv.height);
    const kbdH = Math.max(0, Math.round(window.innerHeight - vv.height));
    document.documentElement.style.setProperty("--vvh", `${vvh}px`);
    document.documentElement.style.setProperty("--kbd-h", `${kbdH > 60 ? kbdH : 0}px`);
  };
  window.visualViewport.addEventListener("resize", syncVv);
  window.visualViewport.addEventListener("scroll", syncVv);
  syncVv();
}
document.addEventListener("touchmove", e => {
  if (document.body.classList.contains("scroll-locked")) {
    const scrollable = e.target.closest(".sheet, .modal, .prof");
    if (!scrollable) {
      e.preventDefault();
    }
  } else if (document.body.classList.contains("quiz-fixed")) {
    const scrollable = e.target.closest(".qcard");
    if (!scrollable || scrollable.scrollHeight <= scrollable.clientHeight) {
      e.preventDefault();
    }
  }
}, { passive: false });
window.addEventListener("scroll", () => {
  if (document.body.classList.contains("scroll-locked") || document.body.classList.contains("quiz-fixed")) {
    if (window.scrollY !== 0 || window.scrollX !== 0) {
      window.scrollTo(0, 0);
    }
  }
}, { passive: true });
document.addEventListener("focusin", e => {
  const inp = e.target;
  if (inp && (inp.tagName === "INPUT" || inp.tagName === "TEXTAREA")) {
    const container = inp.closest(".sheet, .modal");
    if (container) {
      window.scrollTo(0, 0);
      setTimeout(() => {
        window.scrollTo(0, 0);
        const cRect = container.getBoundingClientRect();
        const iRect = inp.getBoundingClientRect();
        const kbdH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--kbd-h")) || 0;
        const visibleBottom = cRect.bottom - kbdH;
        if (iRect.bottom > visibleBottom) {
          container.scrollBy({ top: iRect.bottom - visibleBottom + 24, behavior: "smooth" });
        } else if (iRect.top < cRect.top + 20) {
          container.scrollBy({ top: iRect.top - cRect.top - 20, behavior: "smooth" });
        }
      }, 150);
    }
  }
});
document.addEventListener("focusout", e => {
  const inp = e.target;
  if (inp && (inp.tagName === "INPUT" || inp.tagName === "TEXTAREA")) {
    if (document.body.classList.contains("scroll-locked")) {
      setTimeout(() => { window.scrollTo(0, 0); }, 100);
    }
  }
});
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fold = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const slugOf = name => fold(name).replace(/ /g,"-").slice(0,60);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const refLabel = r => "1 Sam. " + r;
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function toast(msg, ms = 2400){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), ms); }
/* the quiz screen is fixed (question centred) as long as it fits; a tall question (matching) lets the page scroll instead of being cut */
function fitFixed(){
  const card = $(".qcard"); if (!card || (S.quiz && S.quiz.ui && S.quiz.ui.checked)) return;
  document.body.classList.add("quiz-fixed");
  if (card.scrollHeight > card.clientHeight + 1) document.body.classList.remove("quiz-fixed");
}
function resetScroll(){ window.scrollTo({ top: 0, behavior: "instant" }); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }
/* The question bank was rebuilt (fewer questions, 3 choices): ids from the old bank no longer match, so progress kept on this device starts again. */
const BANK_V = "2";
try {
  if (localStorage.getItem("candela:bank") !== BANK_V){
    Object.keys(localStorage).filter(k => /^candela:(p:|pending:|reports:|quiz$|guest$|guestEntries$)/.test(k)).forEach(k => localStorage.removeItem(k));
    localStorage.setItem("candela:bank", BANK_V);
  }
} catch {}
function closeModal(bg, onDone){
  if (!bg || bg._closing) return;
  bg._closing = true;
  bg.classList.add("closing");
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    const cb = onDone;
    bg.remove();
    if (cb) cb();
  };
  const content = bg.querySelector(".modal, .sheet");
  if (content && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    content.addEventListener("animationend", finish, { once: true });
    setTimeout(finish, 260);
  } else {
    finish();
  }
}
function verseHTML(ref){
  const m = /^(\d+):(\d+)(?:-(\d+))?$/.exec(ref); if (!m) return "";
  const c = +m[1], a = +m[2], b = +(m[3]||m[2]); const vs = TEXT[c] || [];
  const one = v => `<sup>${v}</sup>${esc(vs[v-1])} `;
  let out = ""; const end = Math.min(b, vs.length);
  if (end - a < 4){ for (let v=a; v<=end; v++) out += one(v); return out.trim(); }
  for (let v=a; v<a+2; v++) out += one(v);
  let rest = ""; for (let v=a+2; v<=end; v++) rest += one(v);
  return `${out}<details class="more"><summary>Citește versetele ${a+2}–${end}</summary>${rest.trim()}</details>`;
}
function dateLabel(ts){ const d = new Date(ts); return d.toLocaleDateString("ro-RO",{day:"numeric",month:"short"}) + ", " + d.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"}); }
function chaptersLabel(chs){
  if (chs.length === 31) return "Toate capitolele";
  const s = chs.slice().sort((a,b)=>a-b), parts = []; let i = 0;
  while (i < s.length){ let j = i; while (j+1 < s.length && s[j+1] === s[j]+1) j++; parts.push(j>i+1 ? `${s[i]}–${s[j]}` : j===i+1 ? `${s[i]}, ${s[j]}` : `${s[i]}`); i = j+1; }
  return (s.length === 1 ? "Capitolul " : "Capitolele ") + parts.join(", ");
}

/* ---------- storage ----------
   Supabase: accounts are email + password (Supabase Auth) with a unique first + last name, progress in Postgres behind row-level security.
   A finished test is one call to save_result(); the leaderboard is the public leaderboard() function.
   Results that could not be sent wait in localStorage and go out at the next sign-in.
   Without an account the visitor plays as a guest: results stay in this browser and move to the account at sign-up or sign-in. */
const SB = /*__SB__*/null;
const HOSTED = true;
const authStorage = {   // "Rămâi conectat" off → the session lives only until the browser is closed
  getItem(k){ try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  setItem(k, v){ try { const keep = lsGet("candela:remember", true); (keep ? localStorage : sessionStorage).setItem(k, v); (keep ? sessionStorage : localStorage).removeItem(k); } catch {} },
  removeItem(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} },
};
let sbc = null;
function sb(){
  if (!sbc && SB && window.supabase) sbc = window.supabase.createClient(SB.url, SB.key, { auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  return sbc;
}
const isNetErr = e => !e || /fetch|network|failed to|load failed/i.test(String(e.message || e));
const store = {
  uid: null,
  blank(name){ return { name, history: [], chap: {}, ok: [], seen: [], tests: 0 }; },
  norm(p, name){ p = p ? JSON.parse(JSON.stringify(p)) : this.blank(name); p.name = p.name || name; p.history = p.history || []; p.chap = p.chap || {}; p.ok = p.ok || []; p.seen = [...new Set([...(p.seen || []), ...p.ok])]; p.tests = p.tests ?? p.history.length; return p; },
  pending(){ return lsGet("candela:pending:" + this.uid, []); },
  applyEntry(p, x){
    if (!p.history.some(h => h.at === x.at)){ p.history.push({at:x.at, chs:x.chs, mode:x.mode, score:x.score, total:x.total, pct:x.pct, secs:x.secs}); p.tests++; }
    for (const [k, v] of Object.entries(x.chap)){ const cur = p.chap[k] || {best:0, n:0}; p.chap[k] = {best: Math.max(cur.best||0, v), last: v, n: (cur.n||0)+1}; }
    p.ok = [...new Set([...p.ok, ...x.ok])];
    p.seen = [...new Set([...(p.seen || []), ...(x.seen || []), ...x.ok])];
  },
  async send(x){
    const { error } = await sb().rpc("save_play", { p_player: x.player || this.uid, p_at: new Date(x.at).toISOString(), p_chs: x.chs, p_mode: x.mode, p_score: x.score, p_total: x.total, p_pct: x.pct, p_secs: x.secs, p_chap: x.chap, p_ok: x.ok, ...(x.seen ? { p_seen: x.seen } : {}) });
    if (error) throw error;
    if (x.wrong) await sb().rpc("set_result_wrong", { p_player: x.player || this.uid, p_at: new Date(x.at).toISOString(), p_wrong: x.wrong }).then(() => {}, () => {});
  },
  async flush(){
    const left = [];
    for (const x of this.pending()){ try { await this.send(x); } catch (e) { if (isNetErr(e)) left.push(x); } }
    lsSet("candela:pending:" + this.uid, left);
  },
  guest(){ const p = this.norm(lsGet("candela:guest", null), "Invitat"); p.name = "Invitat"; p.guest = true; return p; },
  async load(user){
    this.uid = user.id; this.email = user.email || "";
    const moved = lsGet("candela:guestEntries", []);   // tests played as a guest join the account
    if (moved.length){ lsSet("candela:pending:" + this.uid, [...this.pending(), ...moved]); lsSet("candela:guestEntries", []); lsSet("candela:guest", null); }
    this.moved = moved.length;
    await this.flush();
    return this.loadPlayer(lsGet("candela:player:" + this.uid, this.uid));
  },
  /* a parent plays as itself or as one of its children, on the same phone; pid is who plays now */
  async loadPlayer(pid){
    const { data, error } = await sb().rpc("player_progress", { p_player: pid });
    if (error) throw error;
    if (!data && pid !== this.uid) return this.loadPlayer(this.uid);   // that child was removed
    this.pid = pid; lsSet("candela:player:" + this.uid, pid);
    const p = this.norm({ name: data.name || "?", history: data.history, chap: data.chap, ok: data.ok, seen: data.seen, tests: data.tests });
    p.child = pid !== this.uid; p.hidden = !!data.hidden;
    if (!p.child) this.isParent = !!data.is_parent;
    for (const x of this.pending()) if ((x.player || this.uid) === pid) this.applyEntry(p, x);
    lsSet("candela:p:" + pid, p);
    this.family = this.isParent ? await this.rpc("my_family").then(r => r.ok ? r.data : this.family || []) : [];
    return p;
  },
  /* returns {ok, profile} or {ok:false, error} */
  // The login is the email. Accounts made before emails existed have an internal address built from the name,
  // so "Prenume Nume" typed in the email field still signs them in.
  authEmail(id){ id = id.trim(); return id.includes("@") ? id.toLowerCase() : slugOf(id) + "@candela.invalid"; },
  hasEmail(){ return !!this.email && !this.email.endsWith("@candela.invalid"); },
  async login(id, password){
    if (!sb()) return {ok:false, error:"network"};
    try {
      const { data, error } = await sb().auth.signInWithPassword({ email: this.authEmail(id), password });
      if (error) return {ok:false, error: isNetErr(error) ? "network" : /confirm/i.test(error.message) ? "unconfirmed" : "cred"};
      return {ok:true, profile: await this.load(data.user)};
    } catch (e) { return {ok:false, error: isNetErr(e) ? "network" : "server"}; }
  },
  async call(fn, body, token){
    let r;
    try { r = await fetch(SB.url + "/functions/v1/" + fn, {method:"POST", headers:{"content-type":"application/json", apikey: SB.key, ...(token ? {authorization: "Bearer " + token} : {})}, body: JSON.stringify(body)}); }
    catch { return {ok:false, error:"network"}; }
    let d = {}; try { d = await r.json(); } catch {}
    return r.ok ? {ok:true, ...d} : {ok:false, error: d.error || "server"};
  },
  async signup(first, last, email, password){
    if (!sb()) return {ok:false, error:"network"};
    const r = await this.call("signup", {first, last, email, password});
    if (!r.ok) return r;
    const l = await this.login(email, password);
    return l.ok ? {...l, created:true} : l;
  },
  /* changes the signed-in player's name and email */
  async updateAccount(first, last, email){
    if (!sb()) return {ok:false, error:"network"};
    let token = null;
    try { token = (await sb().auth.getSession()).data.session?.access_token; } catch {}
    if (!token) return {ok:false, error:"auth"};
    const r = await this.call("account", {first, last, email}, token);
    if (!r.ok) return r;
    try { await sb().auth.refreshSession(); } catch {}
    this.email = r.email;
    const p = this.local(this.uid); if (p){ p.name = r.name; lsSet("candela:p:" + this.uid, p); }
    return r;
  },
  async resume(){
    if (!sb()) return null;
    const { data } = await sb().auth.getSession();
    return data.session ? data.session.user : null;
  },
  local(uid){ return lsGet("candela:p:" + uid, null); },
  /* saves one finished test; returns whether it reached the server */
  async save(p, x){
    this.applyEntry(p, x);
    if (p.guest){ lsSet("candela:guest", p); lsSet("candela:guestEntries", [...lsGet("candela:guestEntries", []), x]); return {guest:true}; }
    x.player = this.pid || this.uid;
    lsSet("candela:p:" + x.player, p);
    try { await this.send(x); return {saved:true}; }
    catch (e) {
      if (isNetErr(e)){ lsSet("candela:pending:" + this.uid, [...this.pending(), x]); }
      return {saved:false};
    }
  },
  async board(){
    if (!sb()) return null;
    try {
      const { data, error } = await sb().rpc("board2", { p_player: S.player && !S.player.guest ? this.pid : null });
      if (error) return null;
      const total = totalCount("both");
      return data.map(x => ({ id: x.id, name: x.name, ok: x.ok, seen: Math.max(x.seen ?? 0, x.ok), tests: x.tests, me: !!x.me, mastery: Math.round(x.ok / total * 1000) / 10 }));
    } catch { return null; }
  },
  /* returns {ok, data} or {ok:false, error} */
  async rpc(fn, args){
    if (!sb()) return {ok:false, error:"network"};
    try { const { data, error } = await sb().rpc(fn, args); return error ? {ok:false, error: isNetErr(error) ? "network" : String(error.message || "server")} : {ok:true, data}; }
    catch (e) { return {ok:false, error: isNetErr(e) ? "network" : "server"}; }
  },
  async token(){ try { return (await sb().auth.getSession()).data.session?.access_token || null; } catch { return null; } },
  async logout(){ try { await sb()?.auth.signOut(); } catch {} this.uid = this.pid = null; this.email = ""; this.isParent = false; this.family = []; }

  if (!user){ await shown(); return enterGuest(); }

/* ---------- quiz engine ---------- */
function buildPool(chs, mode){
  const out = [];
  for (const c of chs){
    const d = QUIZ[c]; if (!d) continue;
    for (const m of (mode==="both" ? ["easy","hard"] : [mode]))
      (d[m]||[]).forEach((q,i) => out.push({...q, ch:c, mode:m, id:`${c}${m[0]}${i}`}));
  }
  return out;
}
function prepare(q){
  const x = {...q};
  if (q.t === "one"){ const idx = shuffle(q.opts.map((_,i)=>i)); x.opts = idx.map(i=>q.opts[i]); x.a = idx.indexOf(q.a); }
  if (q.t === "multi"){ const idx = shuffle(q.opts.map((_,i)=>i)); x.opts = idx.map(i=>q.opts[i]); x.a = q.a.map(a=>idx.indexOf(a)).sort((a,b)=>a-b); }
  if (q.t === "match"){ x.right = shuffle(q.pairs.map((p,i)=>i)); }
  return x;
}
/* rough time to answer, by question type and level (seconds), including reading the correction; only an estimate shown before starting, there is no timer */
const SECS = { tf:[10,14], one:[14,20], multi:[22,30], fill:[18,26], match:[32,45] };
// once enough tests exist, the real average time per question (by level) replaces the guess, within ×0.5–×2 of it
let PACE = lsGet("candela:pace", null);
function estSecs(list){
  const by = {easy:[0,0], hard:[0,0]};
  for (const q of list){ const b = by[q.mode] || by.easy; b[0] += (SECS[q.t]||[18,24])[q.mode==="hard"?1:0]; b[1]++; }
  return Object.entries(by).reduce((s, [m, [guess, n]]) => s + (PACE?.[m] && n ? Math.min(guess*2, Math.max(guess/2, PACE[m]*n)) : guess), 0);
}
async function loadPace(){
  const r = await store.rpc("pace"); if (!r.ok || !r.data) return;
  PACE = {}; for (const x of r.data) if (x.n >= 15 && x.mode !== "both") PACE[x.mode] = +x.secs;
  lsSet("candela:pace", PACE);
}
function durLabel(secs){
  const m = secs / 60;
  if (m < 1.5) return "cam 1 min";
  if (m < 20) return `cam ${Math.round(m)} min`;
  if (m < 60) return `cam ${Math.round(m/5)*5} min`;
  const h = Math.floor(m/60), r = Math.round((m - h*60)/10)*10;
  return r === 60 ? `cam ${h+1} h` : `cam ${h} h${r ? ` ${r} min` : ""}`;
}
/* the start sheet: level (easy by default), number of questions, then start. Same sheet from home and from reading. */

const CHEV = `<svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHECK = `<svg class="done-ic" width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// a level is done when every chosen chapter already had 100% at it
const levelDone = (chs, m) => chs.every(c => (m === "both" ? ["easy","hard"] : [m]).every(k => chapStat(c, k) != null));
const levelBest = (c, m) => m === "both" ? null : chapStat(c, m);
const levelLast = (c, m) => {
  if (m === "both") {
    const h = [...S.player.history].reverse().find(x => x.mode === "both" && x.chs.length === 1 && x.chs[0] === c);
    return h ? h.pct : null;
  }
  return chapLast(c, m);
};
function openOptions(chs = [...S.sel].sort((a,b)=>a-b)){

  const mEasy = Math.round(secsEasy / 60);
  const mHard = Math.round(secsHard / 60);

  const ICONS = {
    easy: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`,

    both: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`
  };

  const lvlButtons = ["easy", "hard", "both"].map(m => {
    let done = levelDone(chs, m);
    let note = "";
    if (m === "both") {
      done = false;
      note = esc(MODE_NOTE[m]);
    } else {
      const lastSc = levelLast(c, m);
      note = done ? `Făcut deja${lastSc != null ? ` · scor: ${lastSc}%` : ""}` : esc(MODE_NOTE[m]);
    }

    let durStr = "";
    if (m === "easy") durStr = durLabel(secsEasy);
    else if (m === "hard") durStr = durLabel(secsHard);
    else durStr = durLabel((mEasy + mHard) * 60);

const RO_NUM_MAP = new Map();
function buildRoNums() {
  const units = ["zero", "unu", "doi", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const femUnits = ["zero", "una", "două", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const oUnits = ["zero", "o", "două", "trei", "patru", "cinci", "șase", "șapte", "opt", "nouă"];
  const teens = ["zece", "unsprezece", "doisprezece", "treisprezece", "paisprezece", "cincisprezece", "șaisprezece", "șaptesprezece", "optsprezece", "nouăsprezece"];
  const femTeens = [...teens]; femTeens[2] = "douăsprezece";
  const tens = ["", "", "douăzeci", "treizeci", "patruzeci", "cincizeci", "șaizeci", "șaptezeci", "optzeci", "nouăzeci"];
  const add = (n, words) => {
    if (!RO_NUM_MAP.has(n)) RO_NUM_MAP.set(n, new Set());
    words.forEach(w => RO_NUM_MAP.get(n).add(fold(w).replace(/[\s\-]/g, '')));
  };
  for (let i=0; i<10; i++) add(i, [units[i], femUnits[i], oUnits[i]]);
  for (let i=10; i<20; i++) add(i, [teens[i-10], femTeens[i-10]]);
  for (let i=20; i<100; i++) {
    const t = Math.floor(i/10), u = i%10;
    if (u === 0) add(i, [tens[t]]);
    else add(i, [tens[t] + " și " + units[u], tens[t] + " și " + femUnits[u], tens[t] + " și " + oUnits[u]]);
  }
  add(100, ["sută", "o sută"]);
  add(1000, ["mie", "o mie"]);
}

function tolerantMatch(ans, exp) {
  const clean = s => fold(s).replace(/[.,;:'"!?()\[\]{}„”«»]/g, '');
  const cA = clean(ans), cE = clean(exp);
  if (cA === cE) return true;
  const sA = cA.replace(/[\s\-]/g, ''), sE = cE.replace(/[\s\-]/g, '');
  if (sA === sE) return true;
  const numA = parseInt(sA, 10), numE = parseInt(sE, 10);
  if (!isNaN(numA) && numA.toString() === sA && RO_NUM_MAP.has(numA) && RO_NUM_MAP.get(numA).has(sE)) return true;
  if (!isNaN(numE) && numE.toString() === sE && RO_NUM_MAP.has(numE) && RO_NUM_MAP.get(numE).has(sA)) return true;
  const lDist = (a, b) => {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    const m = Array.from({length: b.length + 1}, (_, i) => [i]);
    for (let j = 0; j <= a.length; j++) m[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        m[i][j] = b[i - 1] === a[j - 1] ? m[i - 1][j - 1] : Math.min(m[i - 1][j - 1], m[i][j - 1], m[i - 1][j]) + 1;
      }
    }
    return m[b.length][a.length];
  };
  const tol = sE.length >= 8 ? 2 : (sE.length >= 4 ? 1 : 0);
  if (tol > 0) {
    if (lDist(cA, cE) <= tol) return true;
    if (lDist(sA, sE) <= tol) return true;
  }
  return false;
}

  if (q.t==="one") return { pts: ui.pick===q.a ? 1 : 0, max:1, given: ui.pick };
  if (q.t==="multi"){ const g = [...ui.sel].sort((a,b)=>a-b); return { pts: JSON.stringify(g)===JSON.stringify(q.a) ? 1 : 0, max:1, given: g }; }

  }
  S.board = null;
  const wrong = Z.qs.map((q,i)=>({q, a: Z.answers[i]})).filter(x => !x.a || x.a.pts < 1);
  const rep = { at, chs: Z.chs, mode: Z.mode, retry: !!Z.retry, n, sc, P, wrong,

/* a mistake kept with the account: the question id and the answer given, in the question's own option order */
function packWrong({q, a}){
  const src = srcOf(q.id);
  let g = a && !a.skipped ? a.given : null;
  if (g != null && src && (q.t === "one" || q.t === "multi")){ const canon = i => src.opts.indexOf(q.opts[i]); g = q.t === "one" ? canon(g) : g.map(canon).sort((x,y)=>x-y); }

}
function srcOf(id){ const m = /^(\d+)([eh])(\d+)$/.exec(id); if (!m) return null; const q = (QUIZ[+m[1]] || {})[m[2] === "e" ? "easy" : "hard"]; return q && q[+m[3]] ? {...q[+m[3]], ch: +m[1], mode: m[2] === "e" ? "easy" : "hard", id} : null; }
function unpackWrong(list){ return (list || []).map(w => { const q = srcOf(w.id); return q ? { q, a: { pts: w.p || 0, given: w.g, skipped: w.g == null } } : null; }).filter(Boolean); }

  const keys = [...groups.keys()].sort((a, b) => (a || 99) - (b || 99));

/* the last reports stay on this phone so a test from the history can be opened again, mistakes included */
const repKey = () => "candela:reports:" + (S.player && !S.player.guest ? store.pid : "guest");
function keepReport(r){
  const list = lsGet(repKey(), []).filter(x => x.at !== r.at);

}
function findReport(at){

// a test from the history: the saved report, or just its score when it was played on another phone
async function openPastReport(at, o = {}){

function mistakeHTML({q, a}){
  a = a || {pts:0, given:null, skipped:true};

  if (q.t==="one"){ yours = skipped ? "—" : esc(q.opts[a.given]); correct = esc(q.opts[q.a]); }
  if (q.t==="multi"){ yours = skipped ? "—" : (a.given.length ? a.given.map(i=>esc(q.opts[i])).join("; ") : "niciuna"); correct = q.a.length ? q.a.map(i=>esc(q.opts[i])).join("; ") : "niciuna"; }
  if (q.t==="fill"){ yours = skipped ? "—" : a.given.map(esc).join(", "); correct = q.a.map(esc).join(", "); }
  if (q.t==="match"){
    yours = skipped ? "—" : q.pairs.map((p,i)=> a.given[i]===i ? null : `${esc(p[0])} → ${a.given[i]!=null ? esc(q.pairs[a.given[i]][1]) : "—"}`).filter(Boolean).join("<br>");
    correct = q.pairs.map(p=>`${esc(p[0])} → ${esc(p[1])}`).join("<br>");
  }
  const qtext = q.t==="fill" ? esc(q.q).replace(/___/g, "<b>____</b>") : esc(q.q.replace(/\s*\(pot fi mai multe[^)]*\)/i, ""));
  return `<article class="mistake"><div class="qmeta"><span class="qtype">${TYPE_LABEL[q.t]}</span><span class="ref">${refLabel(q.ref)}</span></div>
    <p class="q">${qtext}</p>
    <div class="ans"><div><span class="l">Răspunsul tău</span><span class="${skipped?"":"y"}">${yours}</span></div><div><span class="l">Corect</span><span class="c">${correct}</span></div></div>
    <div class="verse">${verseHTML(q.ref)}</div></article>`;
}

      });
    });
    el.querySelectorAll("[data-apw]").forEach(b => b.onclick = () => {
      const u = users.find(x => x.id === b.dataset.apw);
      confirmBox(`Parolă nouă pentru ${u.name}?`, "Parola veche nu va mai merge. Îi dai parola nouă, iar el o poate schimba din profil.", "Generează", async () => {
        const token = await store.token(), r = token ? await store.call("admin-reset", {who: u.email || u.name}, token) : {ok:false};
        if (!r.ok) return toast("Nu s-a putut genera parola.");
        showTempPassword(r.name, r.password);
      });
    });
  };
  $("#aQ").oninput = e => { q = e.target.value; draw(); };
  const r = await call({action: "list"});
  if (!$("#aList")) return;
  if (!r.ok){ $("#aList").innerHTML = `<div class="empty">${r.error === "forbidden" ? "Doar administratorul are acces aici." : "Lista nu s-a putut încărca."}</div>`; return; }
  users = r.users; draw();
}
function showTempPassword(name, pw){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>Parolă provizorie</h3><p class="muted">Parola nouă pentru <b style="color:var(--ink)">${esc(name)}</b>:</p>
    <p class="temp-pw">${esc(pw)}</p>
    <div class="modal-btns"><button class="btn btn-ghost" id="tpCopy" type="button">Copiază</button><button class="btn btn-primary" id="tpOk" type="button">Gata</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => closeModal(bg);
  bg.querySelector("#tpOk").onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector("#tpCopy").onclick = async () => { try { await navigator.clipboard.writeText(pw); toast("Parola a fost copiată."); } catch { toast(pw, 5000); } };
}

/* ---------- family: a parent and its children on one phone ---------- */
function familyHTML(){
  if (!S.player || S.player.guest || !store.isParent || (store.family || []).length < 2) return "";
  return `<div class="family" role="group" aria-label="Cine face testul"><span class="family-l">Cine face testul?</span>${store.family.map(x =>
    `<button class="fam ${x.id === store.pid ? "on" : ""}" type="button" data-play="${x.id}" aria-pressed="${x.id === store.pid}"><span class="avatar sm">${esc(initials(x.name))}</span>${esc(x.name.split(" ")[0])}</button>`).join("")}</div>`;
}
/* children share the parent's family name, so only first names are asked */
async function addChild(first, last){
  const token = await store.token(), r = token ? await store.call("family", {action: "add", first, last}, token) : {ok:false, error:"auth"};
  if (r.ok){ store.family = [...(store.family || []), {id: r.id, name: r.name, child: true}]; S.board = null; }
  return r;
}
function childError(r){ return ({ name_taken: "Există deja cineva cu acest nume. Adaugă și al doilea prenume.", too_many: "Poți adăuga cel mult 10 copii." })[r.error] || loginError(r); }
function askChildren(last){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<form class="modal kids-modal" role="dialog" aria-modal="true" aria-labelledby="akH" novalidate>
    <h3 id="akH">Copiii tăi</h3>
    <p class="muted">Scrie doar prenumele fiecărui copil; numele de familie se adaugă singur. Fiecare va avea rezultatele și locul lui în clasament.</p>
    <div class="ak-list" id="akList"></div>
    <button class="link" type="button" id="akMore">+ Încă un copil</button>
    <p class="form-error" id="akErr" role="alert"></p>
    <div class="modal-btns"><button class="btn btn-ghost" type="button" id="akLater">Mai târziu</button><button class="btn btn-primary" type="submit" id="akGo">Adaugă</button></div></form>`;
  document.body.appendChild(bg);
  const list = bg.querySelector("#akList"), err = bg.querySelector("#akErr"), close = () => closeModal(bg);
  const row = () => { const d = document.createElement("div"); d.className = "ak-row"; d.innerHTML = `<input class="input" maxlength="30" autocapitalize="words" placeholder="Prenume" aria-label="Prenumele copilului"><span class="ak-last">${esc(last)}</span>`; list.appendChild(d); };
  row();
  bg.querySelector("#akMore").onclick = () => { if (list.children.length < 10) row(); };
  bg.querySelector("#akLater").onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.oninput = () => { err.textContent = ""; };
  bg.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const inputs = [...list.querySelectorAll("input")], names = inputs.map(i => capName(i.value)).filter(slugOf);
    if (!names.length){ err.textContent = "Scrie cel puțin un prenume."; inputs[0].focus(); return; }
    const btn = bg.querySelector("#akGo"); btn.disabled = true; btn.textContent = "Se adaugă…";
    for (const i of inputs){
      const n = capName(i.value); if (!slugOf(n)) { i.closest(".ak-row").remove(); continue; }
      const r = await addChild(n, last);
      if (!r.ok){ btn.disabled = false; btn.textContent = "Adaugă"; err.textContent = `${n}: ${childError(r)}`; i.focus(); return; }
      i.closest(".ak-row").remove();
    }
    closeModal(bg, () => {
      viewHome();
      toast("Gata! Pe pagina principală poți alege oricând cine face testul.", 4000);
    });
  };
}
async function switchPlayer(id){
  if (id === store.pid) return;
  if (S.quiz) S.quiz = null;
  try { S.player = await store.loadPlayer(id); }
  catch { return toast(loginError({error: "network"})); }
  S.board = null; viewHome();
  toast(`Acum face testul ${S.player.name.split(" ")[0]}.`);
}
function confirmBox(title, text, yes, onYes){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="modal-btns"><button class="btn btn-ghost" id="cNo" type="button">Anulează</button><button class="btn btn-primary" id="cYes" type="button">${esc(yes)}</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => closeModal(bg);
  bg.querySelector("#cNo").onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector("#cYes").onclick = () => closeModal(bg, onYes);
}

/* ---------- works offline once opened ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

/* ---------- boot ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    const openBg = document.querySelector(".sheet-bg:not(.closing), .modal-bg:not(.closing)");
    if (openBg){ e.preventDefault(); closeModal(openBg); return; }
  }
  if (!S.quiz || !$(".qcard") || e.target.tagName==="INPUT") return;
  const q = S.quiz.qs[S.quiz.i], ui = S.quiz.ui;
  if (e.key==="Enter"){ e.preventDefault(); if (ui.checked) next(); else if (ready(q) && $("#chk")) check(); }
  if (!ui.checked && (q.t==="one"||q.t==="multi")){ const i = LETTERS.toLowerCase().indexOf(e.key.toLowerCase()); const b = $(`.opt[data-i="${i}"]`); if (i>=0 && b) b.click(); }
  if (!ui.checked && q.t==="tf"){ if (e.key.toLowerCase()==="a") $('.opt[data-v="1"]').click(); if (e.key.toLowerCase()==="f") $('.opt[data-v="0"]').click(); }
});
autoLogin();
loadPace();
</script>
