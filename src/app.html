/* ---------- admin page: every account, with a temporary password or deletion ---------- */
async function viewAdmin(){
  let users = null, q = "";
  mount(`<section class="adm">
    <div class="reader-h"><button class="icon-btn" id="aBack" type="button" aria-label="Înapoi"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div><span class="eyebrow" id="aCount">Conturi</span><h2>Administrare</h2></div></div>
    <input class="input" id="aQ" type="search" placeholder="Caută după nume sau email" aria-label="Caută" autocomplete="off" spellcheck="false">
    <div class="adm-list" id="aList"><div class="empty">Se încarcă…</div></div>
  </section>`);
  $("#aBack").onclick = () => viewHome();
  const call = async body => { const token = await store.token(); return token ? store.call("admin", body, token) : {ok:false, error:"auth"}; };
  const draw = () => {
    const el = $("#aList"); if (!el || !users) return;
    const f = fold(q), list = users.filter(u => !f || fold(u.name + " " + u.email + " " + u.parent).includes(f));
    $("#aCount").textContent = `${users.length} ${users.length === 1 ? "cont" : "conturi"}`;
    el.innerHTML = list.length ? list.map(u => `<div class="adm-row">
      <span class="avatar sm">${esc(initials(u.name))}</span>
      <div class="adm-who"><b>${esc(u.name)}${u.me ? " <em>tu</em>" : ""}</b><small>${u.email ? esc(u.email) : u.parent ? `copil · ${esc(u.parent)}` : "fără email"}</small>
        <small>${u.tests} ${u.tests === 1 ? "test" : "teste"} · din ${new Date(u.created).toLocaleDateString("ro-RO", {day:"numeric", month:"short", year:"numeric"})}</small></div>
      <div class="adm-a">${u.parent || u.me ? "" : `<button class="link" type="button" data-apw="${u.id}">Parolă</button>`}${u.me ? "" : `<button class="link danger" type="button" data-adel="${u.id}">Șterge</button>`}</div></div>`).join("")
      : `<div class="empty">Niciun cont găsit.</div>`;
    el.querySelectorAll("[data-adel]").forEach(b => b.onclick = () => {
      const u = users.find(x => x.id === b.dataset.adel), kids = users.filter(x => x.parent === u.name).length;
      confirmBox(`Ștergi contul lui ${u.name}?`, `Rezultatele și locul din clasament se șterg definitiv${kids ? `, împreună cu ${kids === 1 ? "profilul copilului" : `cele ${kids} profiluri de copii`}` : ""}.`, "Șterge", async () => {
        const r = await call({action: "delete", id: u.id});
        if (!r.ok) return toast("Nu s-a putut șterge. Încearcă din nou.");
        users = users.filter(x => x.id !== u.id && x.parent !== u.name); S.board = null; draw(); toast("Contul a fost șters.");
      });
    });
    el.querySelectorAll("[data-apw]").forEach(b => b.onclick = () => {
      const u = users.find(x => x.id === b.dataset.apw);
      confirmBox(`Parolă nouă pentru ${u.name}?`, "Parola veche nu va mai merge. Îi dai parola nouă, iar el o poate schimba din profil.", "Generează", async () => {
        const token = await store.token(), r = token ? await store.call("admin-reset", {who: u.email || u.name}, token) : {ok:false};
        if (!r.ok) return toast("Nu s-a putut genera parola.");
        showTempPassword(r.name, r.password);
      });
    });
  };
  $("#aQ").oninput = e => { q = e.target.value; draw(); };
  const r = await call({action: "list"});
  if (!$("#aList")) return;
  if (!r.ok){ $("#aList").innerHTML = `<div class="empty">${r.error === "forbidden" ? "Doar administratorul are acces aici." : "Lista nu s-a putut încărca."}</div>`; return; }
  users = r.users; draw();
}
function showTempPassword(name, pw){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>Parolă provizorie</h3><p class="muted">Parola nouă pentru <b style="color:var(--ink)">${esc(name)}</b>:</p>
    <p class="temp-pw">${esc(pw)}</p>
    <div class="modal-btns"><button class="btn btn-ghost" id="tpCopy" type="button">Copiază</button><button class="btn btn-primary" id="tpOk" type="button">Gata</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => closeModal(bg);
  bg.querySelector("#tpOk").onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector("#tpCopy").onclick = async () => { try { await navigator.clipboard.writeText(pw); toast("Parola a fost copiată."); } catch { toast(pw, 5000); } };
}

/* ---------- family: a parent and its children on one phone ---------- */
function familyHTML(){
  if (!S.player || S.player.guest || !store.isParent || (store.family || []).length < 2) return "";
  return `<div class="family" role="group" aria-label="Cine face testul"><span class="family-l">Cine face testul?</span>${store.family.map(x =>
    `<button class="fam ${x.id === store.pid ? "on" : ""}" type="button" data-play="${x.id}" aria-pressed="${x.id === store.pid}"><span class="avatar sm">${esc(initials(x.name))}</span>${esc(x.name.split(" ")[0])}</button>`).join("")}</div>`;
}
/* children share the parent's family name, so only first names are asked */
async function addChild(first, last){
  const token = await store.token(), r = token ? await store.call("family", {action: "add", first, last}, token) : {ok:false, error:"auth"};
  if (r.ok){ store.family = [...(store.family || []), {id: r.id, name: r.name, child: true}]; S.board = null; }
  return r;
}
function childError(r){ return ({ name_taken: "Există deja cineva cu acest nume. Adaugă și al doilea prenume.", too_many: "Poți adăuga cel mult 10 copii." })[r.error] || loginError(r); }
function askChildren(last){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<form class="modal kids-modal" role="dialog" aria-modal="true" aria-labelledby="akH" novalidate>
    <h3 id="akH">Copiii tăi</h3>
    <p class="muted">Scrie doar prenumele fiecărui copil; numele de familie se adaugă singur. Fiecare va avea rezultatele și locul lui în clasament.</p>
    <div class="ak-list" id="akList"></div>
    <button class="link" type="button" id="akMore">+ Încă un copil</button>
    <p class="form-error" id="akErr" role="alert"></p>
    <div class="modal-btns"><button class="btn btn-ghost" type="button" id="akLater">Mai târziu</button><button class="btn btn-primary" type="submit" id="akGo">Adaugă</button></div></form>`;
  document.body.appendChild(bg);
  const list = bg.querySelector("#akList"), err = bg.querySelector("#akErr"), close = () => closeModal(bg);
  const row = () => { const d = document.createElement("div"); d.className = "ak-row"; d.innerHTML = `<input class="input" maxlength="30" autocapitalize="words" placeholder="Prenume" aria-label="Prenumele copilului"><span class="ak-last">${esc(last)}</span>`; list.appendChild(d); };
  row();
  bg.querySelector("#akMore").onclick = () => { if (list.children.length < 10) row(); };
  bg.querySelector("#akLater").onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.oninput = () => { err.textContent = ""; };
  bg.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const inputs = [...list.querySelectorAll("input")], names = inputs.map(i => capName(i.value)).filter(slugOf);
    if (!names.length){ err.textContent = "Scrie cel puțin un prenume."; inputs[0].focus(); return; }
    const btn = bg.querySelector("#akGo"); btn.disabled = true; btn.textContent = "Se adaugă…";
    for (const i of inputs){
      const n = capName(i.value); if (!slugOf(n)) { i.closest(".ak-row").remove(); continue; }
      const r = await addChild(n, last);
      if (!r.ok){ btn.disabled = false; btn.textContent = "Adaugă"; err.textContent = `${n}: ${childError(r)}`; i.focus(); return; }
      i.closest(".ak-row").remove();
    }
    closeModal(bg, () => {
      viewHome();
      toast("Gata! Pe pagina principală poți alege oricând cine face testul.", 4000);
    });
  };
}
async function switchPlayer(id){
  if (id === store.pid) return;
  if (S.quiz) S.quiz = null;
  try { S.player = await store.loadPlayer(id); }
  catch { return toast(loginError({error: "network"})); }
  S.board = null; viewHome();
  toast(`Acum face testul ${S.player.name.split(" ")[0]}.`);
}
function confirmBox(title, text, yes, onYes){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="modal-btns"><button class="btn btn-ghost" id="cNo" type="button">Anulează</button><button class="btn btn-primary" id="cYes" type="button">${esc(yes)}</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => closeModal(bg);
  bg.querySelector("#cNo").onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector("#cYes").onclick = () => closeModal(bg, onYes);
}

/* ---------- boot ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    const openBg = document.querySelector(".sheet-bg:not(.closing), .modal-bg:not(.closing)");
    if (openBg){ e.preventDefault(); closeModal(openBg); return; }
  }
  if (!S.quiz || !$(".qcard") || e.target.tagName==="INPUT") return;
  const q = S.quiz.qs[S.quiz.i], ui = S.quiz.ui;
  if (e.key==="Enter"){ e.preventDefault(); if (ui.checked) next(); else if (ready(q) && $("#chk")) check(); }
  if (!ui.checked && (q.t==="one"||q.t==="multi")){ const i = LETTERS.toLowerCase().indexOf(e.key.toLowerCase()); const b = $(`.opt[data-i="${i}"]`); if (i>=0 && b) b.click(); }
  if (!ui.checked && q.t==="tf"){ if (e.key.toLowerCase()==="a") $('.opt[data-v="1"]').click(); if (e.key.toLowerCase()==="f") $('.opt[data-v="0"]').click(); }
});
